# Deploy na Netlify (PLANO-DEV §5.6). Site estático: o Astro gera dist/ e a Netlify só serve.
# Rotas com barra final (trailingSlash: 'always'): a Netlify já redireciona /privacidade -> /privacidade/ (301)
# quando existe privacidade/index.html, e serve dist/404.html como página 404.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.21.0"

# Domínio canônico: o host padrão da Netlify redireciona para tornostudio.com (301, forçado mesmo com arquivo).
# Só casa o host exato; deploy previews (deploy-preview-N--tornostudio.netlify.app) não são afetados.
# www -> apex é configurado no painel de domínios da Netlify.
[[redirects]]
  from = "https://tornostudio.netlify.app/*"
  to = "https://tornostudio.com/:splat"
  status = 301
  force = true

# Headers de segurança em todas as rotas. Terceiros só os que carregam DEPOIS do consentimento
# (docs/consent/SPEC.md §5): Google Ads conforme https://developers.google.com/tag-platform/security/guides/csp
# (seção Google Ads; www.google.<TLD> limitado a .com e .com.br) e o popup do Calendly (SPEC §9, só com Medição).
# 'unsafe-inline' cobre o default do Consent Mode, o script de tema e o CSS que o Astro embute no HTML.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.googleadservices.com https://www.google.com https://assets.calendly.com; style-src 'self' 'unsafe-inline' https://assets.calendly.com; img-src 'self' data: https://assets.calendly.com https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://*.doubleclick.net https://pagead2.googlesyndication.com https://www.google.com https://www.google.com.br; connect-src 'self' https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://*.doubleclick.net https://pagead2.googlesyndication.com https://www.google.com https://www.google.com.br https://calendly.com; frame-src https://www.googletagmanager.com https://td.doubleclick.net https://calendly.com; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

# Assets com hash no nome: cache imutável.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Alias único da política existente; preserve canonical e âncoras como #cookies.
[[redirects]]
  from = "/privacy"
  to = "/privacidade/"
  status = 301
[[redirects]]
  from = "/privacy/"
  to = "/privacidade/"
  status = 301

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "noindex"
    Link = '</llms.txt>; rel="describedby"'
