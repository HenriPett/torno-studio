<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1330" viewBox="0 0 720 1330" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Remessa e retorno de dois títulos fictícios</title><desc id="d1">Exemplo fictício. Dois trilhos verticais: à esquerda o sistema da Indústria Exemplo de Embalagens Ltda., à direita o Banco Exemplo; setas de ida (remessa) e volta (retorno). Título T-8805, Cliente Épsilon, R$ 980,00, vencimento 04/12/2026: 01/12 REM-0124 entrada; 02/12 retorno 02 entrada confirmada, PDF vai ao cliente; 03/12 cliente paga por transferência; 03/12 REM-0126 pedido de baixa 02, título em baixa solicitada; 04/12 retorno 09 baixa confirmada, pago por transferência; 07/12 retorno 17 liquidação após baixa R$ 980,00, sem segunda baixa, crédito do cliente R$ 980,00, tarefa devolver ou compensar. Faixa do T-8804, Cliente Delta, R$ 1.275,40: 02/12 retorno 03 entrada rejeitada por CEP do pagador inválido, boleto retido; CEP corrigido e REM-0125 com o mesmo nosso número 1044-8; 03/12 retorno 02, boleto liberado.</desc><defs><marker id="ab" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L16,7 L0,14 z" fill="#1f4e79"/></marker><marker id="ag" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L16,7 L0,14 z" fill="#2e7d32"/></marker><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L16,7 L0,14 z" fill="#b3261e"/></marker><marker id="ak" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L16,7 L0,14 z" fill="#1d1d1b"/></marker></defs><rect x="0" y="0" width="720" height="1330" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14" y="14" width="692" height="1302" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30" y="58" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Ida e volta entre sistema e banco</text><text x="30" y="90" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">Título T-8805 · Cliente Épsilon · R$ 980,00 · venc. 04/12/2026</text><rect x="90" y="140" width="220" height="44" rx="6" fill="#1f4e79" stroke="#1f4e79" stroke-width="1"/><text x="200" y="169" font-size="20" text-anchor="middle" font-weight="bold" fill="#ffffff">SISTEMA</text><rect x="450" y="140" width="220" height="44" rx="6" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1"/><text x="560" y="169" font-size="20" text-anchor="middle" font-weight="bold" fill="#ffffff">BANCO EXEMPLO</text><line x1="200" y1="190" x2="200" y2="920" stroke="#1f4e79" stroke-width="6"/><line x1="560" y1="190" x2="560" y2="920" stroke="#1d1d1b" stroke-width="6"/><text x="30" y="256" font-size="18" text-anchor="start" font-weight="bold" fill="#6b6b66">01/12</text><circle cx="200" cy="250" r="9" fill="#1f4e79" stroke="#ffffff" stroke-width="2"/><line x1="212" y1="250" x2="546" y2="250" stroke="#1f4e79" stroke-width="3" marker-end="url(#ab)"/><text x="380.0" y="238" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f4e79">REM-0124: entrada</text><rect x="90" y="266" width="280" height="30" rx="5" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/><text x="100" y="287" font-size="16" text-anchor="start" font-weight="bold" fill="#1f4e79">título enviado ao banco</text><text x="30" y="376" font-size="18" text-anchor="start" font-weight="bold" fill="#6b6b66">02/12</text><circle cx="560" cy="370" r="9" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/><line x1="548" y1="370" x2="214" y2="370" stroke="#2e7d32" stroke-width="3" marker-end="url(#ag)"/><text x="380.0" y="358" font-size="18" text-anchor="middle" font-weight="bold" fill="#2e7d32">Retorno 02: entrada confirmada</text><rect x="90" y="386" width="280" height="30" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/><text x="100" y="407" font-size="16" text-anchor="start" font-weight="bold" fill="#2e7d32">registrado · PDF vai ao cliente</text><text x="30" y="496" font-size="18" text-anchor="start" font-weight="bold" fill="#6b6b66">03/12</text><circle cx="200" cy="490" r="9" fill="#1d1d1b" stroke="#ffffff" stroke-width="2"/><text x="220" y="478" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">Pago por transferência (fora do boleto)</text><text x="30" y="566" font-size="18" text-anchor="start" font-weight="bold" fill="#6b6b66">03/12</text><circle cx="200" cy="560" r="9" fill="#1f4e79" stroke="#ffffff" stroke-width="2"/><line x1="212" y1="560" x2="546" y2="560" stroke="#1f4e79" stroke-width="3" marker-end="url(#ab)"/><text x="380.0" y="548" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f4e79">REM-0126: pedido de baixa 02</text><rect x="90" y="576" width="280" height="30" rx="5" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/><text x="100" y="597" font-size="16" text-anchor="start" font-weight="bold" fill="#1f4e79">baixa solicitada (não baixado)</text><text x="30" y="686" font-size="18" text-anchor="start" font-weight="bold" fill="#6b6b66">04/12</text><circle cx="560" cy="680" r="9" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/><line x1="548" y1="680" x2="214" y2="680" stroke="#2e7d32" stroke-width="3" marker-end="url(#ag)"/><text x="380.0" y="668" font-size="18" text-anchor="middle" font-weight="bold" fill="#2e7d32">Retorno 09: baixa confirmada</text><rect x="90" y="696" width="280" height="30" rx="5" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/><text x="100" y="717" font-size="16" text-anchor="start" font-weight="bold" fill="#2e7d32">pago por transferência</text><text x="30" y="806" font-size="18" text-anchor="start" font-weight="bold" fill="#6b6b66">07/12</text><circle cx="560" cy="800" r="9" fill="#b3261e" stroke="#ffffff" stroke-width="2"/><line x1="548" y1="800" x2="214" y2="800" stroke="#b3261e" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#ar)"/><text x="380.0" y="764" font-size="18" text-anchor="middle" font-weight="bold" fill="#b3261e">Retorno 17: liquidação após</text><text x="380.0" y="788" font-size="18" text-anchor="middle" font-weight="bold" fill="#b3261e">baixa, R$ 980,00</text><rect x="90" y="816" width="300" height="56" rx="5" fill="#fbe9e7" stroke="#b3261e" stroke-width="2"/><text x="100" y="837" font-size="16" text-anchor="start" font-weight="bold" fill="#b3261e">sem 2ª baixa · crédito R$ 980,00</text><text x="100" y="862" font-size="16" text-anchor="start" font-weight="normal" fill="#b3261e">tarefa: devolver ou compensar</text><line x1="30" y1="950" x2="690" y2="950" stroke="#d9d5cc" stroke-width="2"/><text x="30" y="986" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">T-8804 · Cliente Delta · R$ 1.275,40</text><text x="30" y="1026" font-size="18" text-anchor="start" font-weight="bold" fill="#6b6b66">02/12</text><rect x="110" y="1002" width="580" height="62" rx="6" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="124" y="1026" font-size="18" text-anchor="start" font-weight="bold" fill="#b3261e">Retorno 03: entrada rejeitada</text><text x="124" y="1052" font-size="16" text-anchor="start" font-weight="normal" fill="#1d1d1b">motivo: CEP do pagador inválido · boleto retido</text><text x="30" y="1106" font-size="18" text-anchor="start" font-weight="bold" fill="#6b6b66">02/12</text><rect x="110" y="1082" width="580" height="62" rx="6" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/><text x="124" y="1106" font-size="18" text-anchor="start" font-weight="bold" fill="#1f4e79">CEP corrigido · REM-0125</text><text x="124" y="1132" font-size="16" text-anchor="start" font-weight="normal" fill="#1d1d1b">mesmo nosso número 1044-8</text><text x="30" y="1186" font-size="18" text-anchor="start" font-weight="bold" fill="#6b6b66">03/12</text><rect x="110" y="1162" width="580" height="62" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/><text x="124" y="1186" font-size="18" te