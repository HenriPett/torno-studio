<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1330" viewBox="0 0 720 1330" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Um relógio de garantia por serviço</title><desc id="d1">Exemplo fictício. Dois relógios de garantia da Exemplo Refrigeração e Climatização Ltda., cada um uma volta de 180 dias: metade azul, garantia legal de 90 dias; metade verde, garantia contratual de mais 90 dias, que começa quando a legal termina, conforme o termo escrito da empresa. Relógio de cima, OS-2026-0417: começa no término do serviço, sexta 04/12/2026; legal até quinta 04/03/2027; contratual até quarta 02/06/2027. Marcador aos 45 dias, segunda 18/01/2027: cliente reclama que voltou a não gelar; a reclamação é registrada com data e hora. Relógio de baixo, retorno OS-2026-0417-R1: a conexão refeita sem custo na terça 19/01/2027 ganha prazo próprio, por decisão da empresa com o advogado; legal até segunda 19/04/2027; contratual até domingo 18/07/2027. Marcador aos 142 dias, quinta 10/06/2027: novo chamado sobre a mesma conexão; fora do relógio da OS original, que acabou em 02/06, mas dentro do relógio do retorno. Rodapé: o sistema guarda um relógio por serviço prestado, não um por cliente.</desc><rect x="0" y="0" width="720" height="1330" fill="#f6f3ec"/><rect x="14" y="14" width="692" height="1302" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="530" y="30" width="160" height="34" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="610" y="53" font-size="15" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="62" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Um relógio de garantia por serviço</text><text x="30" y="96" font-size="18" text-anchor="start" fill="#6b6b66">Azul: garantia legal, 90 dias · verde: contratual, + 90 dias</text><text x="30" y="122" font-size="18" text-anchor="start" fill="#6b6b66">Prazo legal classificado com o advogado; contratual no termo.</text><text x="320" y="197" font-size="20" text-anchor="middle" font-weight="bold" fill="#1d1d1b">OS-2026-0417 · conserto do split</text><path d="M320.00,255.00 A165,165 0 0 1 320.00,585.00" fill="none" stroke="#1f4e79" stroke-width="30"/><path d="M320.00,585.00 A165,165 0 0 1 319.71,255.00" fill="none" stroke="#2e7d32" stroke-width="30"/><line x1="320.00" y1="277.00" x2="320.00" y2="285.00" stroke="#6b6b66" stroke-width="2"/><line x1="391.50" y1="296.16" x2="387.50" y2="303.09" stroke="#6b6b66" stroke-width="2"/><line x1="443.84" y1="348.50" x2="436.91" y2="352.50" stroke="#6b6b66" stroke-width="2"/><line x1="463.00" y1="420.00" x2="455.00" y2="420.00" stroke="#6b6b66" stroke-width="2"/><line x1="443.84" y1="491.50" x2="436.91" y2="487.50" stroke="#6b6b66" stroke-width="2"/><line x1="391.50" y1="543.84" x2="387.50" y2="536.91" stroke="#6b6b66" stroke-width="2"/><line x1="320.00" y1="563.00" x2="320.00" y2="555.00" stroke="#6b6b66" stroke-width="2"/><line x1="248.50" y1="543.84" x2="252.50" y2="536.91" stroke="#6b6b66" stroke-width="2"/><line x1="196.16" y1="491.50" x2="203.09" y2="487.50" stroke="#6b6b66" stroke-width="2"/><line x1="177.00" y1="420.00" x2="185.00" y2="420.00" stroke="#6b6b66" stroke-width="2"/><line x1="196.16" y1="348.50" x2="203.09" y2="352.50" stroke="#6b6b66" stroke-width="2"/><line x1="248.50" y1="296.16" x2="252.50" y2="303.09" stroke="#6b6b66" stroke-width="2"/><line x1="320.00" y1="277.00" x2="320.00" y2="285.00" stroke="#6b6b66" stroke-width="2"/><text x="320" y="390" font-size="22" text-anchor="middle" font-weight="bold" fill="#1d1d1b">180 dias</text><text x="320" y="418" font-size="16" text-anchor="middle" fill="#6b6b66">legal 90 + contratual 90</text><text x="320" y="446" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f4e79">início 04/12/2026</text><text x="320" y="470" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f4e79">legal até 04/03/2027</text><text x="320" y="494" font-size="17" text-anchor="middle" font-weight="bold" fill="#2e7d32">fim 02/06/2027</text><line x1="503.00" y1="420.00" x2="467.00" y2="420.00" stroke="#b3261e" stroke-width="5"/><text x="515.00" y="426.00" font-size="16" text-anchor="start" font-weight="bold" fill="#b3261e">18/01/2027</text><text x="515.00" y="446.00" font-size="16" text-anchor="start" fill="#b3261e">dia 45</text><text x="515.00" y="466.00" font-size="16" text-anchor="start" fill="#b3261e">reclamação</text><text x="515.00" y="486.00" font-size="16" text-anchor="start" fill="#b3261e">registrada</text><text x="320" y="707" font-size="20" text-anchor="middle" font-weight="bold" fill="#1d1d1b">OS-2026-0417-R1 · retorno refeito</text><path d="M320.00,765.00 A165,165 0 0 1 320.00,1095.00" fill="none" stroke="#1f4e79" stroke-width="30"/><path d="M320.00,1095.00 A165,165 0 0 1 319.71,765.00" fill="none" stroke="#2e7d32" stroke-width="30"/><line x1="320.00" y1="787.00" x2="320.00" y2="795.00" stroke="#6b6b66" stroke-width="2"/><line x1="391.50" y1="806.16" x2="387.50" y2="813.09" stroke="#6b6b66" stroke-width="2"/><line x1="443.84" y1="858.50" x2="436.91" y2="862.50" stroke="#6b6b66" stroke-width="2"/><line x1="463.00" y1="930.00" x2="455.00" y2="930.00" stroke="#6b6b66" stroke-width="2"/><line x1="443.84" y1="1001.50" x2="436.91" y2="997.50" stroke="#6b6b66" stroke-width="2"/><line x1="391.50" y1="1053.84" x2="387.50" y2="1046.91" stroke="#6b6b66" stroke-width="2"/><line x1="320.00" y1="1073.00" x2="320.00" y2="1065.00" stroke="#6b6b66" stroke-width="2"/><line x1="248.50" y1="1053.84" x2="252.50" y2="1046.91" stroke="#6b6b66" stroke-width="2"/><line x1="196.16" y1="1001.50" x2="203.09" y2="997.50" stroke="#6b6b66" stroke-width="2"/><line x1="177.00" y1="930.00" x2="185.00" y2="930.00" stroke="#6b6b66" stroke-width="2"/><line x1="196.16" y1="858.50" x2="203.09" y2="862.50" stroke="#6b6b66" stroke-width="2"/><line x1="248.50" y1="806.16" x2="252.50" y2="813.09" stroke="#6b6b66" stroke-width="2"/><line x1="320.00" y1="787.00" x2="320.00" y2="795.00" stroke="#6b6b66" stroke-width="2"/><text x="320" y="900" font-size="22" text-anchor="middle" font-weight="bold" fill="#1d1d1b">180 dias</text><text x="320" y="928" font-size="16" text-anchor="middle" fill="#6b6b66">legal 90 + contratual 90</text><text x="320" y="956" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f4e79">início 19/01/2027</text><text x="320" y="980" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f4e79">legal até 19/04/2027</text><text x="320" y="1004" font-size="17" text-anchor="middle" font-weight="bold" fill="#2e7d32">fim 18/07/2027</text><line x1="142.44" y1="885.73" x2="177.37" y2="894.44" stroke="#b3261e" stroke-width="5"/><text x="130.79" y="888.83" font-size="16" text-anchor="end" font-weight="bold" fill="#b3261e">10/06/2027</text><text x="130.79" y="908.83" font-size="16" text-anchor="end" fill="#b3261e">dia 142</text><text x="130.79" y="928.83" font-size="16" text-anchor="end" fill="#b3261e">coberto</text><rect x="40" y="1166" width="640" height="96" rx="4" fill="#fbe9e7" stroke="#b3261e" stroke-width="2"/><text x="360" y="1200" font-size="18" text-anchor="middle" font-weight="bold" fill="#b3261e">10/06/2027: fora do relógio da OS original (02/06),</text><text x="360" y="1228" font-size="18" text-anchor="middle" font-weight="bold" fill="#b3261e">dentro do relógio do retorno (18/07).</text><text x="360" y="1252" font-size="16" text-anchor="middle" fill="#b3261e">Um relógio por serviço prestado, não um por cliente.</text><text x="30" y="1296" font-size="15" text-anchor="start" fill="#6b6b66">Exemplo fictício: empresa, cliente, valores e datas inventados.</text><text x="690" y="1296" font-size="15" text-anchor="end" fill="#6b6b66">Ilustração · Torno 2026</text></svg>