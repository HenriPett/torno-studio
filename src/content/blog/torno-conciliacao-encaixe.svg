<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc"><title id="title">Banco (extrato e retorno) e sistema: o que encaixa</title><desc id="desc">Duas colunas. À esquerda, o banco: extrato e retorno; à direita, o sistema com pedidos e títulos. Peças de encaixe ligam os pares. Pix de R$ 1.250,00 com txid T-0042 encaixa por inteiro no Pedido P-0042 do Cliente C-01 de R$ 1.250,00, chave txid. Crédito de cobrança de R$ 978,50 com nosso número NN-0007, informado no retorno CNAB, encaixa no Título NN-0007 do Cliente C-02 de R$ 1.000,00, chave nosso número, tarifa R$ 21,50. Pix de R$ 430,00 sem txid encaixa de forma frouxa, tracejada, no Pedido P-0051 do Cliente C-03 de R$ 430,00: só valor, data e pagador, sugestão, confirmar. Crédito de R$ 215,90 sem identificação é uma peça solta, sem par. Identificadores encurtados para leitura. Exemplo fictício.</desc><rect width="720" height="1040" rx="24" fill="#f4f2eb"/><text x="32" y="54" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#1e2837">Banco e sistema: o que encaixa</text><rect x="32" y="74" width="232" height="42" rx="21" fill="#fffdf8" stroke="#536270" stroke-width="2.5"/><text x="148" y="103" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#536270" text-anchor="middle">Exemplo fictício</text><text x="32" y="160" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#426d6b">Banco:</text><text x="32" y="192" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#426d6b">extrato e retorno</text><text x="420" y="160" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#426d6b">Sistema:</text><text x="420" y="192" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#426d6b">pedidos e títulos</text><path d="M404 220V258.2A24 24 0 0 0 404 301.8V340H704V220Z" fill="#fffdf8" stroke="#426d6b" stroke-width="3.5"/><path d="M16 220H316V271H376A20 20 0 1 1 376 289H316V340H16Z" fill="#fffdf8" stroke="#426d6b" stroke-width="3.5"/><text x="32" y="258" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Pix R$ 1.250,00</text><text x="32" y="289" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#1e2837">txid T-0042</text><text x="420" y="258" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Pedido P-0042</text><text x="420" y="289" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#1e2837">Cliente C-01</text><text x="420" y="320" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#1e2837">R$ 1.250,00</text><rect x="32" y="352" width="200" height="40" rx="20" fill="#fffdf8" stroke="#426d6b" stroke-width="2.5"/><text x="132.0" y="380" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e2837" text-anchor="middle">chave: txid</text><path d="M404 416V454.2A24 24 0 0 0 404 497.8V536H704V416Z" fill="#fffdf8" stroke="#426d6b" stroke-width="3.5"/><path d="M16 416H316V467H376A20 20 0 1 1 376 485H316V536H16Z" fill="#fffdf8" stroke="#426d6b" stroke-width="3.5"/><text x="32" y="454" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Retorno CNAB</text><text x="32" y="485" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#1e2837">R$ 978,50</text><text x="32" y="516" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#1e2837">nosso número NN-0007</text><text x="420" y="454" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Título NN-0007</text><text x="420" y="485" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#1e2837">Cliente C-02</text><text x="420" y="516" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#1e2837">R$ 1.000,00</text><rect x="32" y="548" width="290" height="40" rx="20" fill="#fffdf8" stroke="#426d6b" stroke-width="2.5"/><text x="177.0" y="576" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e2837" text-anchor="middle">chave: nosso número</text><rect x="342" y="548" width="230" height="40" rx="20" fill="#f6e3cc" stroke="#c8782f" stroke-width="2.5"/><text x="457.0" y="576" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#6b3f10" text-anchor="middle">tarifa R$ 21,50</text><path d="M404 612V650.2A24 24 0 0 0 404 693.8V732H704V612Z" fill="#fffdf8" stroke="#c8782f" stroke-width="3" stroke-dasharray="9 7"/><path d="M16 612H316V663H364A20 20 0 1 1 364 681H316V732H16Z" fill="#fffdf8" stroke="#c8782f" stroke-width="3" stroke-dasharray="9 7"/><text x="32" y="650" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Pix R$ 430,00</text><text x="32" y="681" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#1e2837">sem txid</text><text x="420" y="650" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Pedido P-0051</text><text x="420" y="681" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#1e2837">Cliente C-03</text><text x="420" y="712" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#1e2837">R$ 430,00</text><rect x="32" y="744" width="656" height="40" rx="20" fill="#f6e3cc" stroke="#c8782f" stroke-width="2.5"/><text x="360.0" y="772" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#6b3f10" text-anchor="middle">só valor + data + pagador — sugestão, confirmar</text><g transform="rotate(-1.5 160 858)"><path d="M16 808H316V849H356A20 20 0 1 1 356 867H316V908H16Z" fill="#fffdf8" stroke="#536270" stroke-width="3"/><text x="32" y="846" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Crédito R$ 215,90</text><text x="32" y="877" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#1e2837">sem identificação</text></g><path d="M404 808H704V908H404Z" fill="none" stroke="#536270" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/><rect x="484" y="838" width="140" height="40" rx="20" fill="#fffdf8" stroke="#536270" stroke-width="2.5"/><text x="554.0" y="866" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#536270" text-anchor="middle">sem par</text><text x="32" y="962" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Chave forte encaixa; valor e data só sugerem.</text><text x="32" y="1014" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">Ilustração original Torno Studio, 2026</text></svg>