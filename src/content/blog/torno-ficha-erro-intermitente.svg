<svg xmlns="http://www.w3.org/2000/svg" width="720" height="832" viewBox="0 0 720 832" role="img" aria-label="Ficha para um erro que nem sempre aparece."><rect x="0" y="0" width="720" height="832" rx="0" fill="#f7f6f2" stroke="none" stroke-width="2"/><text x="36" y="55" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">TORNO · GUIA VISUAL</text><text x="36" y="116" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="700">Relato que ajuda a investigar</text><text x="36" y="162" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Ficha para um erro que nem sempre aparece.</text><rect x="32" y="200" width="656" height="138" rx="14" fill="#ffffff" stroke="#b4c6bd" stroke-width="2"/><rect x="48" y="230" width="58" height="58" rx="12" fill="#e2ede8" stroke="none" stroke-width="2"/><text x="64" y="269" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">1</text><text x="125" y="246" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Esperado e observado</text><text x="125" y="285" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">O que deveria ocorrer? O que</text><text x="125" y="318" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">ocorreu desta vez?</text><path d="M358 343 v15 m-8 -8 8 8 8 -8" fill="none" stroke="#1c5a49" stroke-width="3"/><rect x="32" y="362" width="656" height="138" rx="14" fill="#ffffff" stroke="#b4c6bd" stroke-width="2"/><rect x="48" y="392" width="58" height="58" rx="12" fill="#e2ede8" stroke="none" stroke-width="2"/><text x="64" y="431" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">2</text><text x="125" y="408" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Contexto</text><text x="125" y="447" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Tela, ação, horário, ambiente</text><text x="125" y="480" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">e versão, quando conhecidos.</text><path d="M358 505 v15 m-8 -8 8 8 8 -8" fill="none" stroke="#1c5a49" stroke-width="3"/><rect x="32" y="524" width="656" height="138" rx="14" fill="#ffffff" stroke="#b4c6bd" stroke-width="2"/><rect x="48" y="554" width="58" height="58" rx="12" fill="#e2ede8" stroke="none" stroke-width="2"/><text x="64" y="593" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">3</text><text x="125" y="570" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Evidências</text><text x="125" y="609" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Mensagem, registro e passos</text><text x="125" y="642" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">sem expor dados sensíveis.</text><text x="36" y="769" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="600">Distinguir fato observado de hipótese.</text></svg>