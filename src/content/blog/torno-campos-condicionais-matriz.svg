<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc"><title id="title">Matriz de regras para um campo condicional</title><desc id="desc">Exemplo fictício: com fornecedor escolhido, pedir nome; sem fornecedor, definir o destino do nome anterior.</desc><rect width="720" height="460" rx="24" fill="#f4f2eb"/><text x="32" y="56" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#1e2837">Fornecedor escolhido?</text><text x="32" y="87" font-family="Arial,sans-serif" font-size="16" fill="#536270">Uma resposta muda campo, exigência e dado salvo.</text><rect x="32" y="125" width="312" height="278" rx="18" fill="#e0edf0"/><rect x="376" y="125" width="312" height="278" rx="18" fill="#ede7dc"/><g font-family="Arial,sans-serif" fill="#1e2837"><text x="52" y="171" font-size="26" font-weight="700">SIM</text><text x="396" y="171" font-size="26" font-weight="700">NÃO</text><text x="52" y="218" font-size="18">Mostrar “Fornecedor”</text><text x="396" y="218" font-size="18">Ocultar “Fornecedor”</text><text x="52" y="262" font-size="18">Exigir nome?</text><text x="396" y="262" font-size="18">Limpar ou guardar?</text><text x="52" y="306" font-size="18">Validar no envio</text><text x="396" y="306" font-size="18">Conferir o registro</text><text x="52" y="366" font-size="15" fill="#536270">Regra a combinar</text><text x="396" y="366" font-size="15" fill="#536270">Regra a combinar</text></g><text x="32" y="434" font-family="Arial,sans-serif" font-size="14" fill="#536270">Exemplo editorial fictício · Torno Studio</text></svg>
