<svg xmlns="http://www.w3.org/2000/svg" width="720" height="800" viewBox="0 0 720 800" role="img" aria-labelledby="title desc"><title id="title">Três estados do cronômetro do prazo</title><desc id="desc">Ilustração de três cronômetros lado a lado. Contando: o ponteiro avança durante o expediente, com chamado aberto. Pausado: o ponteiro está parado e há um ícone de pausa, porque o chamado aguarda o cliente. Parado: o chamado foi resolvido e o cronômetro tem um ícone de conferido. Abaixo, uma pergunta destacada: reaberto continua de onde parou ou começa de novo? Decisão de negócio, por escrito.</desc><rect width="720" height="800" rx="24" fill="#f4f2eb"/><text x="32" y="52" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1e2837">Os três estados do cronômetro</text><rect x="32" y="68" width="160" height="40" rx="20" fill="#fffdf8" stroke="#536270" stroke-width="2.5"/><text x="112" y="96" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#536270">Ilustração</text><rect x="24" y="128" width="208" height="400" rx="16" fill="#fffdf8" stroke="#1c5a49" stroke-width="3"/><text x="128" y="438" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1c5a49">Contando</text><text x="128" y="470" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle" fill="#1e2837">Expediente,</text><rect x="256" y="128" width="208" height="400" rx="16" fill="#fffdf8" stroke="#b5651d" stroke-width="3"/><text x="360" y="438" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#b5651d">Pausado</text><text x="360" y="470" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle" fill="#1e2837">Aguardando</text><rect x="488" y="128" width="208" height="400" rx="16" fill="#fffdf8" stroke="#536270" stroke-width="3"/><text x="592" y="438" font-family="Arial,Helvetica,sans-serif" font-size