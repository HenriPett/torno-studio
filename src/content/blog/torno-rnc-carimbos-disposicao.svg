<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1500" viewBox="0 0 720 1500" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Quatro carimbos de disposição e a conta do lote</title><desc id="d1">Exemplo fictício. Lote L2611-07 com 1.200 suportes SP-210. Uma barra proporcional divide o lote em 840 conformes, 316 retrabalhadas e aprovadas, 10 sob concessão e 34 refugadas. Quatro carimbos. Conforme, 840 peças: triagem 100%, 560 na fábrica e 280 no cliente. Retrabalhar, 320 peças: 200 da fábrica e 120 devolvidas; na reinspeção, 316 aprovadas e 4 não. Concessão, 10 peças: furo de 7,98 a 7,99 mm, autorizado por escrito pelo cliente só para o lote L2611-07. Refugar, 34 peças: 30 com furo deslocado e 4 reprovadas depois do retrabalho. Conta: 840 + 316 + 10 + 34 = 1.200. Carimbo tracejado: eficácia ainda não verificada; ação corretiva implantada em 16/11; verificar em 15/01/2027 com 6 lotes seguintes sem o defeito D-07; a RNC não encerra antes disso.</desc><rect x="0" y="0" width="720" height="1500" fill="#f4efe6"/><text x="40" y="58" font-size="28" fill="#1d1d1b" font-weight="bold" text-anchor="start">Quatro carimbos, uma conta</text><rect x="450" y="30" width="230" height="38" rx="6" fill="#1d1d1b"/><text x="565" y="57" font-size="22" fill="#f4efe6" font-weight="bold" text-anchor="middle">EXEMPLO FICTÍCIO</text><text x="40" y="104" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Lote L2611-07 · 1.200 suportes SP-210</text><rect x="40.0" y="130" width="448.0" height="44" fill="#7d8f6a" stroke="#1d1d1b" stroke-width="2"/><rect x="488.0" y="130" width="168.5" height="44" fill="#c9a86a" stroke="#1d1d1b" stroke-width="2"/><rect x="656.5" y="130" width="5.3" height="44" fill="#3f5f8a" stroke="#1d1d1b" stroke-width="2"/><rect x="661.9" y="130" width="18.1" height="44" fill="#a33a2a" stroke="#1d1d1b" stroke-width="2"/><text x="40" y="206" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">840</text><text x="488" y="206" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">316</text><text x="680" y="206" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="end">10 + 34</text><g transform="rotate(-3 195 410)"><rect x="40" y="240" width="310" height="330" rx="14" fill="#fffdf7" stroke="#5f7350" stroke-width="6"/><rect x="50" y="250" width="290" height="310" rx="10" fill="none" stroke="#5f7350" stroke-width="2"/><text x="195" y="298" font-size="28" fill="#5f7350" font-weight="bold" text-anchor="middle">CONFORME</text><path d="M70 316 L320 316" stroke="#5f7350" stroke-width="3"/><text x="195" y="400" font-size="72" fill="#5f7350" font-weight="bold" text-anchor="middle">840</text><text x="195" y="430" font-size="22" fill="#5f7350" font-weight="normal" text-anchor="middle">peças</text><text x="195" y="476" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">triagem 100%:</text><text x="195" y="506" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">560 na fábrica</text><text x="195" y="536" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">+ 280 no cliente</text></g><g transform="rotate(2 525 410)"><rect x="370" y="240" width="310" height="330" rx="14" fill="#fffdf7" stroke="#8a6a3e" stroke-width="6"/><rect x="380" y="250" width="290" height="310" rx="10" fill="none" stroke="#8a6a3e" stroke-width="2"/><text x="525" y="298" font-size="28" fill="#8a6a3e" font-weight="bold" text-anchor="middle">RETRABALHAR</text><path d="M400 316 L650 316" stroke="#8a6a3e" stroke-width="3"/><text x="525" y="400" font-size="72" fill="#8a6a3e" font-weight="bold" text-anchor="middle">320</text><text x="525" y="430" font-size="22" fill="#8a6a3e" font-weight="normal" text-anchor="middle">peças</text><text x="525" y="476" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">200 da fábrica</text><text x="525" y="506" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">+ 120 devolvidas</text><text x="525" y="536" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">316 aprovadas, 4 não</text></g><g transform="rotate(3 195 770)"><rect x="40" y="600" width="310" height="330" rx="14" fill="#fffdf7" stroke="#3f5f8a" stroke-width="6"/><rect x="50" y="610" width="290" height="310" rx="10" fill="none" stroke="#3f5f8a" stroke-width="2"/><text x="195" y="658" font-size="28" fill="#3f5f8a" font-weight="bold" text-anchor="middle">CONCESSÃO</text><path d="M70 676 L320 676" stroke="#3f5f8a" stroke-width="3"/><text x="195" y="760" font-size="72" fill="#3f5f8a" font-weight="bold" text-anchor="middle">10</text><text x="195" y="790" font-size="22" fill="#3f5f8a" font-weight="normal" text-anchor="middle">peças</text><text x="195" y="836" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">furo 7,98 a 7,99 mm</text><text x="195" y="866" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">autorizado por escrito</text><text x="195" y="896" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">pelo cliente, só L2611-07</text></g><g transform="rotate(-2 525 770)"><rect x="370" y="600" width="310" height="330" rx="14" fill="#fffdf7" stroke="#a33a2a" stroke-width="6"/><rect x="380" y="610" width="290" height="310" rx="10" fill="none" stroke="#a33a2a" stroke-width="2"/><text x="525" y="658" font-size="28" fill="#a33a2a" font-weight="bold" text-anchor="middle">REFUGAR</text><path d="M400 676 L650 676" stroke="#a33a2a" stroke-width="3"/><text x="525" y="760" font-size="72" fill="#a33a2a" font-weight="bold" text-anchor="middle">34</text><text x="525" y="790" font-size="22" fill="#a33a2a" font-weight="normal" text-anchor="middle">peças</text><text x="525" y="836" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">30 furo deslocado</text><text x="525" y="866" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">+ 4 reprovadas</text><text x="525" y="896" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">depois do retrabalho</text></g><rect x="40" y="975" width="640" height="74" rx="8" fill="#fffdf7" stroke="#1d1d1b" stroke-width="3"/><text x="360" y="1024" font-size="32" fill="#1d1d1b" font-weight="bold" text-anchor="middle">840 + 316 + 10 + 34 = 1.200</text><g transform="rotate(-2 360 1200)"><rect x="60" y="1090" width="600" height="230" rx="14" fill="none" stroke="#5c564c" stroke-width="5" stroke-dasharray="14 8"/><text x="360" y="1140" font-size="28" fill="#5c564c" font-weight="bold" text-anchor="middle">EFICÁCIA: AINDA NÃO</text><text x="360" y="1186" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">ação corretiva implantada em 16/11</text><text x="360" y="1220" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">verificar em 15/01/2027:</text><text x="360" y="1254" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">6 lotes seguintes sem D-07</text><text x="360" y="1290" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">a RNC não encerra antes disso</text></g><text x="40" y="1380" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Retrabalho: 320 peças entram; 316 voltam</text><text x="40" y="1412" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">conformes e 4 vão para o refugo.</text><text x="40" y="1470" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Ilustração · Torno 2026</text></svg>
