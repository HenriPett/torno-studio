<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1600" viewBox="0 0 720 1600" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Fita métrica de revisões da estrutura e ordens de produção</title><desc id="d1">Exemplo fictício. Uma fita métrica vertical marca as revisões da estrutura do carrinho CP-300 da Indústria Exemplo Ltda. Revisão B, vigente de 02/03/2026 a 26/10/2026, com roda fixa RF-100. Revisão C, de 27/10 a 04/11, com roda fixa RF-125, pela mudança de engenharia ECO-2026-031, aberta em 05/10 e aprovada em 14/10; as 30 RF-100 que sobrarem vão para peças de reposição. Revisão D, desde 05/11, pela ECO-2026-036, tinta de 0,40 para 0,38 quilo. Etiquetas de ordens de produção presas à fita: OP 5098, 40 carrinhos, início em 21/10, congela a revisão B e consome 80 rodas RF-100. OP 5120, 50 carrinhos, criada em 19/10, início em 29/10, usa a revisão vigente na data de início, C, e a congela ao ser liberada em 23/10; continua em C depois de 05/11. OP 5131, criada em 06/11, usa a revisão D. Custo padrão de material por carrinho: revisão B, R$ 396,92, com 2 rodas RF-100 a R$ 24,00; revisão C, R$ 406,92, com 2 rodas RF-125 a R$ 29,00; diferença de R$ 10,00.</desc><rect x="0" y="0" width="720" height="1600" fill="#f4efe6"/><text x="40" y="58" font-size="28" fill="#1d1d1b" font-weight="bold" text-anchor="start">Qual revisão a OP congela</text><rect x="450" y="30" width="230" height="38" rx="6" fill="#1d1d1b"/><text x="565" y="57" font-size="22" fill="#f4efe6" font-weight="bold" text-anchor="middle">EXEMPLO FICTÍCIO</text><text x="40" y="104" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Carrinho CP-300 · data de referência: início da OP</text><rect x="40" y="140" width="100" height="920" rx="6" fill="#e2b84a" stroke="#1d1d1b" stroke-width="3"/><path d="M40 150 L74 150" stroke="#1d1d1b" stroke-width="2" fill="none"/><path d="M40 170 L58 170" stroke="#1d1d1b" stroke-width="2" fill="none"/><path d=