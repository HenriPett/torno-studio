<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Matriz de impacto e reversibilidade</title><desc id="desc">Quatro quadrantes mostram como impacto e facilidade de reversão orientam a aprovação de ações.</desc><rect width="1200" height="650" fill="#f5f4ef"/><text x="68" y="72" font-family="Arial" font-weight="700" font-size="38" fill="#14383e">Antes de liberar uma ação</text><g font-family="Arial" fill="#14383e"><text x="72" y="133" font-size="22">IMPACTO DO ERRO</text><text x="474" y="625" font-size="22">FACILIDADE DE REVERTER</text></g><rect x="160" y="165" width="435" height="190" rx="18" fill="#e7d5ca"/><rect x="610" y="165" width="435" height="190" rx="18" fill="#f2e0b5"/><rect x="160" y="370" width="435" height="190" rx="18" fill="#d8e6e2"/><rect x="610" y="370" width="435" height="190" rx="18" fill="#c8e8d8"/><g font-family="Arial" fill="#17383c"><text x="192" y="220" font-size="25" font-weight="700">Alto impacto · difícil desfazer</text><text x="192" y="270" font-size="21">Não automatizar sem política</text><text x="192" y="307" font-size="21">e aprovação específicas.</text><text x="642" y="220" font-size="25" font-weight="700">Alto impacto · reversível</text><text x="642" y="270" font-size="21">Aprovação e conferência</text><text x="642" y="307" font-size="21">antes de executar.</text><text x="192" y="425" font-size="25" font-weight="700">Baixo impacto · difícil desfazer</text><text x="192" y="475" font-size="21">Revisar permissão e forma</text><text x="192" y="512" font-size="21">de recuperar o estado.</text><text x="642" y="425" font-size="25" font-weight="700">Baixo impacto · reversível</text><text x="642" y="475" font-size="21">Candidato a piloto limitado,</text><text x="642" y="512" font-size="21">com registro e testes.</text></g></svg>