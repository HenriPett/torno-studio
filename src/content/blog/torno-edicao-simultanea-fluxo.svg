<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1200" viewBox="0 0 720 1200" role="img" aria-labelledby="title desc"><title id="title">Duas sessões, uma versão inicial</title><desc id="desc">Fluxo editorial de duas sessões que leem a mesma versão e tentam salvar mudanças distintas. O resultado depende da regra combinada.</desc><rect width="720" height="1200" fill="#f7f6f2"/>
<text x="36" y="55" fill="#1c5a49" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">TORNO · EDIÇÃO SIMULTÂNEA</text>
<text x="36" y="118" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700">O que acontece ao salvar?</text>
<text x="36" y="164" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Combine a regra e confira o estado final.</text>
<rect x="32" y="210" width="656" height="120" rx="12" fill="#eeece6" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="254" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Mesmo registro, mesma versão inicial</text>
<text x="54" y="299" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">As duas sessões começam com a mesma leitura.</text>
<path d="M360 330 L360 374" stroke="#1c5a49" stroke-width="3" fill="none"/>
<path d="M180 374 L540 374" stroke="#1c5a49" stroke-width="3" fill="none"/>
<path d="M180 374 L180 414" stroke="#1c5a49" stroke-width="3" fill="none"/>
<path d="M540 374 L540 414" stroke="#1c5a49" stroke-width="3" fill="none"/>
<rect x="32" y="414" width="312" height="224" rx="12" fill="#fff" stroke="#dcd9d1" stroke-width="2"/>
<text x="52" y="457" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Sessão A</text>
<text x="52" y="506" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Lê a versão inicial.</text>
<text x="52" y="552" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Altera um campo.</text>
<text x="52" y="598" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Tenta salvar.</text>
<rect x="376" y="414" width="312" height="224" rx="12" fill="#fff" stroke="#dcd9d1" stroke-width="2"/>
<text x="396" y="457" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Sessão B</text>
<text x="396" y="506" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Lê a versão inicial.</text>
<text x="396" y="552" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Altera outro campo.</text>
<text x="396" y="598" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Tenta salvar.</text>
<path d="M180 638 L180 682" stroke="#1c5a49" stroke-width="3" fill="none"/>
<path d="M540 638 L540 682" stroke="#1c5a49" stroke-width="3" fill="none"/>
<path d="M180 682 L540 682" stroke="#1c5a49" stroke-width="3" fill="none"/>
<path d="M360 682 L360 726" stroke="#1c5a49" stroke-width="3" fill="none"/>
<rect x="32" y="726" width="656" height="180" rx="12" fill="#e2ede8" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="770" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">A ordem e a regra mudam o resultado</text>
<text x="54" y="813" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Defina o que acontece quando uma gravação</text>
<text x="54" y="849" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">parte de uma versão que ficou desatualizada.</text>
<rect x="32" y="944" width="656" height="146" rx="12" fill="#fff" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="986" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Confira o que realmente ficou salvo</text>
<text x="54" y="1026" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">O aviso na tela e o estado final precisam</text>
<text x="54" y="1062" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">corresponder ao comportamento acordado.</text>
<text x="36" y="1160" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Cenário editorial, sem caso ou teste real.</text>
</svg>
