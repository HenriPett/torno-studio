<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" viewBox="0 0 720 1120" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Balanças da barra SAE 1045: recebido × faturado e tolerância de 0,5%</title><desc id="d1">Exemplo fictício. Metalúrgica Exemplo Ltda., barra SAE 1045 da NF-e 45.210. Cada balança tem o recebido no prato da esquerda e o faturado no da direita, e um mostrador com faixa verde de tolerância de 0,5% para mais. Em 09/11/2026: recebido 610 kg, faturado 615 kg, diferença 5 kg, 0,82%; limite 3,05 kg; ponteiro na zona vermelha: bloqueado. Em 10/11/2026, depois da repesagem com motivo tara do palete descontada em dobro: recebido 612 kg, faturado 615 kg, diferença 3 kg, 0,49%; limite 3,06 kg; ponteiro na faixa verde: dentro da tolerância, sem liberação manual. Recebimento de 610 kg continua no histórico. Acumulado do item no PC 7712: recebido 1.202 kg em duas entregas (612 + 590), faturado 1.205 kg em duas notas (615 + 590), diferença 3 kg, 0,25%, limite 6,01 kg: dentro; item encerrado com 1.202 contra 1.200 pedidos, 0,17%, dentro de 1%.</desc><rect x="0.0" y="0.0" width="720.0" height="1120.0" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14.0" y="14.0" width="692.0" height="1092.0" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30.0" y="58.0" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Recebido × faturado</text><text x="30.0" y="92.0" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">barra SAE 1045 · tolerância: até 0,5% a mais</text><rect x="470.0" y="108.0" width="222.0" height="40.0" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581.0" y="136.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><text x="690.0" y="1090.0" font-size="18" text-anchor="end" font-weight="normal" fill="#4a4f55">Ilustração · Torno 2026</text><line x1="200.0" y1="220.0" x2="200.0