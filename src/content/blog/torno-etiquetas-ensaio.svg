<text x="93" y="284" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#1d4a40">LEITURA NORMAL</text>
<path d="M93 328h28m18 0h15m18 0h34m17 0h12m16 0h25" stroke="#758d81" stroke-width="7" stroke-linecap="round"/>
</g>
