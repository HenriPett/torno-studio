<text x="504" y="300" font-family="Arial,sans-serif" font-size="25" fill="#745332">Pedir conferência</text>
</g>
<g transform="rotate(-4 971 324)">
<path d="M843 213h302v210H843z" fill="#fffdf2" stroke="#8ba397" stroke-width="5"/>
<path d="M843 213h302v35H843z" fill="#e9c7b5"/>
<path d="m864 275 28 25-20 29 37 18-18 36" fill="none" stroke="#b87052" stroke-width="8" stroke-linecap="round"/>
<text x="922" y="313" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#754d3c">AMASSADA</text>
<text x="922" y="352" font-family="Arial,sans-serif" font-size="24" fill="#754d3c">Não presumir dado</text>
</g>
