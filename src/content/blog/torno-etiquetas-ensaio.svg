<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Amostras conceituais para ensaiar leitura de etiquetas</title>
<desc id="desc">Quatro adesivos ilustrativos espalhados sobre uma superfície: leitura normal, código desconhecido, etiqueta amassada e repetição. Os traços são decorativos e não codificam dados válidos.</desc>
