<text x="701" y="529" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#234a40">Registre o resultado observado</text>
<text x="59" y="613" font-family="Arial,sans-serif" font-size="22" fill="#3a5650">Amostras inventadas · traços decorativos, sem código de barras válido.</text>
