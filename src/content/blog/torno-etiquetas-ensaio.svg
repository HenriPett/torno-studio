<text x="58" y="69" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#f7f4e9">Quatro amostras antes de comprar o leitor</text>
<path d="M0 115h1200M0 650h1200" stroke="#94aaa0" stroke-width="4"/>
<path d="M20 160h1160M20 272h1160M20 384h1160M20 496h1160" stroke="#d1dbd1" stroke-width="2"/>
