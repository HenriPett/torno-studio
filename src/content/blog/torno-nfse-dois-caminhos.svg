<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1560" viewBox="0 0 720 1560" role="img" aria-labelledby="title desc"><title id="title">Dois caminhos da NFS-e até o ADN, conforme a escolha do município</title><desc id="desc">Vista aérea de uma estrada que sai de um prédio rotulado "Sistema da empresa" e chega a um entroncamento com uma placa: "Qual caminho o município escolheu?". A estrada da esquerda, rotulada "Município A: usa o Emissor Nacional", passa por "DPS enviada à Sefin Nacional (portal ou API)" e chega a "NFS-e de padrão nacional: documento único". A estrada da direita, rotulada "Município B: emissor próprio", passa por "Nota emitida no sistema da prefeitura (regras do município)" e por "Município compartilha a nota com o ADN no padrão nacional", com a marcação "dois documentos para a mesma operação". As duas estradas terminam numa praça rotulada "ADN – Ambiente de Dados Nacional". Rodapé: "Desde 01/01/2026 (LC 214/2025, art. 62): o município autoriza o emissor nacional ou compartilha com o ADN."</desc><rect width="720" height="1560" rx="24" fill="#f4f2eb"/><text x="32" y="52" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1e2837">Dois caminhos até o mesmo destino</text><rect x="32" y="68" width="150" height="40" rx="20" fill="#fffdf8" stroke="#536270" stroke-width="2.5"/><text x="107" y="96" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#536270">Ilustração</text><rect x="250" y="590" width="220" height="90" rx="10" fill="#e6e3d8"/><rect x="250" y="720" width="220" height="60" rx="10" fill="#e6e3d8"/><rect x="250" y="820" width="220" height="130" rx="10" fill="#e6e3d8"/><rect x="250" y="980" width="220" height="70" rx="10" fill="#e6e3d8"/><rect x="26" y="1000" width="20" height="20" rx="10" fill="#cfd9c6"/><rect x="674" y="1000" width="20" height="20" rx="10" fill="#cfd9c6"/><circle cx="262" cy="1075" r="12" fill="#cfd9c6"/><circle cx="458" cy="1075" r="12" fill="#cfd9c6"/><circle cx="262" cy="560" r="12" fill="#cfd9c6"/><circle cx="458" cy="560" r="12" fill="#cfd9c6"/><path d="M360 250 L360 420" fill="none" stroke="#3d4650" stroke-width="64" stroke-linejoin="round"/><path d="M360 250 L360 420" fill="none" stroke="#6b7580" stroke-width="56" stroke-linejoin="round"/><path d="M360 250 L360 420" fill="none" stroke="#f4f2eb" stroke-width="3" stroke-dasharray="14 12" stroke-linejoin="round"/><path d="M360 420 C360 500 170 490 170 570 L170 1090 C170 1150 300 1150 322 1196" fill="none" stroke="#3d4650" stroke-width="64" stroke-linejoin="round"/><path d="M360 420 C360 500 170 490 170 570 L170 1090 C170 1150 300 1150 322 1196" fill="none" stroke="#6b7580" stroke-width="56" stroke-linejoin="round"/><path d="M360 420 C360 500 170 490 170 570 L170 1090 C170 1150 300 1150 322 1196" fill="none" stroke="#f4f2eb" stroke-width="3" stroke-dasharray="14 12" stroke-linejoin="round"/><path d="M360 420 C360 500 550 490 550 570 L550 1090 C550 1150 420 1150 398 1196" fill="none" stroke="#3d4650" stroke-width="64" stroke-linejoin="round"/><path d="M360 420 C360 500 550 490 550 570 L550 1090 C550 1150 420 1150 398 1196" fill="none" stroke="#6b7580" stroke-width="56" stroke-linejoin="round"/><path d="M360 420 C360 500 550 490 550 570 L550 1090 C550 1150 420 1150 398 1196" fill="none" stroke="#f4f2eb" stroke-width="3" stroke-dasharray="14 12" stroke-linejoin="round"/><rect x="190" y="130" width="340" height="124" rx="12" fill="#3d4650"/><rect x="198" y="138" width="324" height="100" rx="8" fill="#8892a0"/><rect x="198" y="138" width="324" height="14" fill="#a2abb7"/><rect x="198" y="170" width="324" height="3" fill="#6f7a88"/><rect x="198" y="202" width="324" height="3" fill="#6f7a88"/><rect x="326" y="238" width="68" height="16" fill="#1e2837"/><rect x="226" y="164" width="268" height="48" rx="8" fill="#fffdf8" stroke="#1e2837" stroke-width="2.5"/><text x="360" y="198" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1e2837">Sistema da empresa</text><rect x="120" y="294" width="14" height="70" fill="#536270"/><rect x="586" y="294" width="14" height="70" fill="#536270"/><rect x="112" y="276" width="496" height="64" rx="10" fill="#2f5f55" stroke="#fffdf8" stroke-width="4"/><rect x="112" y="276" width="496" height="64" rx="10" fill="none" stroke="#1e2837" stroke-width="2"/><text x="360" y="317" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#ffffff">Qual caminho o município escolheu?</text><rect x="26" y="585" width="296" height="84" rx="12" fill="#1e2837" opacity=".18"/><rect x="22" y="580" width="296" height="84" rx="12" fill="#e3eee9" stroke="#2f5f55" stroke-width="4"/><text x="170" y="614" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1e2837">Município A:</text><text x="170" y="642" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1e2837">usa o Emissor Nacional</text><path d="M158 672 L170 686 L182 672 Z" fill="#f4f2eb"/><rect x="26" y="705" width="296" height="84" rx="12" fill="#1e2837" opacity=".18"/><rect x="22" y="700" width="296" height="84" rx="12" fill="#fffdf8" stroke="#2f5f55" stroke-width="4"/><text x="170" y="734" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle" fill="#1e2837">DPS enviada à Sefin</text><text x="170" y="762" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle" fill="#1e2837">Nacional (portal ou API)</text><path d="M158 804 L170 818 L182 804 Z" fill="#f4f2eb"/><rect x="26" y="837" width="296" height="84" rx="12" fill="#1e2837" opacity=".18"/><rect x="22" y="832" width="296" height="84" rx="12" fill="#fffdf8" stroke="#2f5f55" stroke-width="4"/><text x="170" y="866" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle" fill="#1e2837">NFS-e de padrão nacional:</text><text x="170" y="894" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle" fill="#1e2837">documento único</text><g transform="translate(153 934)"><path d="M0 0 H24 L34 10 V44 H0 Z" fill="#fffdf8" stroke="#2f5f55" stroke-width="3"/><path d="M24 0 V10 H34" fill="none" stroke="#2f5f55" stroke-width="3"/><path d="M6 20 H28 M6 28 H28 M6 36 H20" stroke="#2f5f55" stroke-width="3"/></g><rect x="406" y="585" width="296" height="84" rx="12" fill="#1e2837" opacity=".18"/><rect x="402" y="580" width="296" height="84" rx="12" fill="#f3e6d6" stroke="#9b5a1c" stroke-width="4"/><text x="550" y="614" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1e2837">Município B:</text><text x="550" y="642" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1e2837">emissor próprio</text><path d="M538 672 L550 686 L562 672 Z" fill="#f4f2eb"/><rect x="406" y="705" width="296" height="112" rx="12" fill="#1e2837" opacity=".18"/><rect x="402" y="700" width="296" height="112" rx="12" fill="#fffdf8" stroke="#9b5a1c" stroke-width="4"/><text x="550" y="734" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle" fill="#1e2837">Nota emitida no sistema</text><text x="550" y="762" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle" fill="#1e2837">da prefeitura (regras</text><text x="550" y="790" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle" fill="#1e2837">do município)</text><path d="M538 822 L550 836 L562 822 Z" fill="#f4f2eb"/><rect x="406" y="857" width="296" height="112" rx="12" fill="#1e2837" opacity=".18"/><rect x="402" y="852" width="296" height="112" rx="12" fill="#fffdf8" stroke="#9b5a1c" stroke-width="4"/><text x="550" y="886" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle" fill="#1e2837">Município compartilha</text><text x="550" y="914" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle" fill="#1e2837">a nota com o ADN no</text><text x="550" y="942" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle" fill="#1e2837">padrão nacional</text><g transform="translate(500 982)"><path d="M0 0 H24 L34 10 V44 H0 Z" fill="#fffdf8" stroke="#9b5a1c" stroke-width="3"/><path d="M24 0 V10 H34" fill="none" stroke="#9b5a1c" stroke-width="3"/><path d="M6 20 H28 M6 28 H28 M6 36 H20" stroke="#9b5a1c" stroke-width="3"/></g><g transform="translate(566 982)"><path d="M0 0 H24 L34 10 V44 H0 Z" fill="#fffdf8" stroke="#9b5a1c" stroke-width="3"/><path d="M24 0 V10 H34" fill="none" stroke="#9b5a1c" stroke-width="3"/><path d="M6 20 H28 M6 28 H28 M6 36 H20" stroke="#9b5a1c" stroke-width="3"/></g><path d="M541 1004 H559" stroke="#9b5a1c" stroke-width="4"/><rect x="402" y="1040" width="296" height="76" rx="12" fill="#9b5a1c"/><text x="550" y="1071" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">dois documentos para</text><text x="550" y="1099" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">a mesma operação</text><rect x="96" y="1200" width="528" height="130" rx="22" fill="#d7ddcf" stroke="#1e2837" stroke-width="4"/><rect x="108" y="1212" width="504" height="106" rx="14" fill="none" stroke="#9aa58f" stroke-width="2.5" stroke-dasharray="8 8"/><circle cx="132" cy="1236" r="13" fill="#7f9a78"/><circle cx="588" cy="1236" r="13" fill="#7f9a78"/><circle cx="132" cy="1294" r="13" fill="#7f9a78"/><circle cx="588" cy="1294" r="13" fill="#7f9a78"/><rect x="170" y="1226" width="380" height="78" rx="12" fill="#1e2837"/><text x="360" y="1258" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#fff">ADN – Ambiente de</text><text x="360" y="1288" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#fff">Dados Nacional</text><line x1="32" y1="1374" x2="688" y2="1374" stroke="#b9b6aa" stroke-width="2"/><text x="32" y="1414" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e2837">Desde 01/01/2026 (LC 214/2025, art. 62):</text><text x="32" y="1442" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e2837">o município autoriza o emissor nacional</text><text x="32" y="1470" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e2837">ou compartilha com o ADN.</text><text x="32" y="1520" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">Ilustração original Torno Studio, 2026</text></svg>