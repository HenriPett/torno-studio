<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="t d"><title id="t">Ficha de escopo da substituição</title><desc id="d">Ficha ilustrativa com titular, substituto, prazo, limite e testes de um fluxo de aprovação.</desc><rect width="720" height="520" rx="26" fill="#eee9e0"/><rect x="42" y="32" width="636" height="454" rx="22" fill="#fffdf8" stroke="#b6afa4" stroke-width="2"/><text x="72" y="84" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#202633">Ficha de substituição</text><path d="M72 104 H648" stroke="#d3cec4" stroke-width="2"/><g font-family="Arial,sans-serif" font-size="22" fill="#28303c"><text x="72" y="148">Titular: gestora da unidade</text><text x="72" y="190">Substituto: pessoa designada</text><text x="72" y="232">Período: início e fim combinados</text><text x="72" y="274">Escopo: tipo de pedido e limite</text></g><path d="M72 297 H648" stroke="#d3cec4" stroke-width="2"/><text x="72" y="340" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#202633">Três ensaios de aceite</text><g font-family="Arial,sans-serif" font-size="21" fill="#28303c"><text x="88" y="383">1  Pedido permitido</text><text x="88" y="419">2  Pedido fora do limite</text><text x="88" y="455">3  Decisão após o fim</text></g><path d="M566 345 l33 20 43 -55" fill="none" stroke="#426d6b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
