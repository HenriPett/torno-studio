<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1290" viewBox="0 0 720 1290" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Certificado do micrômetro MIC-014: erro e incerteza de cinco pontos contra o erro máximo admissível</title><desc id="d1">Exemplo fictício. Micrômetro externo MIC-014, 25 a 50 mm, resolução 0,001 mm, calibrado em 11/11/2026, certificado CC-2026-1093. Regra da empresa: |erro| + U ≤ EMA de 0,004 mm, U com k = 2 de 0,0015 mm. 25 mm: +0,001, soma 0,0025, conforme. 30 mm: +0,002, soma 0,0035, conforme. 35 mm: +0,003, soma 0,0045, não conforme. 40 mm: +0,006, soma 0,0075, não conforme. 50 mm: +0,004, soma 0,0055, não conforme. Reprovado em 16/11/2026 e bloqueado para medição.</desc><rect x="0" y="0" width="720" height="1290" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14" y="14" width="692" height="1262" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30" y="58" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">MIC-014 · certificado CC-2026-1093</text><text x="30" y="92" font-size="22" text-anchor="start" font-weight="normal" fill="#1d1d1b">micrômetro externo 25–50 mm · resolução 0,001 mm</text><rect x="470" y="108" width="222" height="40" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581" y="136" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><text x="30" y="136" font-size="22" text-anchor="start" font-weight="normal" fill="#4a4f55">calibrado em 11/11/2026</text><rect x="30" y="166" width="660" height="92" rx="6" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.5"/><text x="46" y="200" font-size="22" text-anchor="start" font-weight="bold" fill="#1d1d1b">Regra escolhida pela empresa:</text><text x="46" y="236" font-size="22" text-anchor="start" font-weight="normal" fill="#1d1d1b">|erro| + U ≤ EMA = 0,004 mm  (U com k = 2)</text><text x="260.0" y="314" font-size="22" text-anchor="middle" font-weight="normal" fill="#2e6b30">−0,004</text><text x="350.0" y="314" font-size="22" text-anchor="middle" font-weight="normal" fill="#1d1d1b">0</text><text x="440.0" y="314" font-size="22" text-anchor="middle" font-weight="normal" fill="#2e6b30">+0,004</text><text x="30" y="314" font-size="22" text-anchor="start" font-weight="bold" fill="#1d1d1b">ponto</text><text x="690" y="314" font-size="22" text-anchor="end" font-weight="bold" fill="#1d1d1b">|erro| + U</text><rect x="170" y="348" width="360" height="60" rx="0" fill="#fbe3df" stroke="none" stroke-width="0"/><rect x="260.0" y="348" width="180.0" height="60" rx="0" fill="#dcefd8" stroke="none" stroke-width="0"/><path d="M260.0 344 L260.0 412" stroke="#2e6b30" stroke-width="2" fill="none"/><path d="M440.0 344 L440.0 412" stroke="#2e6b30" stroke-width="2" fill="none"/><path d="M350.0 354 L350.0 402" stroke="#7a7a76" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/><path d="M338.75 378 L406.25 378" stroke="#1f5fa8" stroke-width="5" fill="none"/><path d="M338.75 366 L338.75 390" stroke="#1f5fa8" stroke-width="3" fill="none"/><path d="M406.25 366 L406.25 390" stroke="#1f5fa8" stroke-width="3" fill="none"/><circle cx="372.5" cy="378" r="9" fill="#1f5fa8" stroke="#ffffff" stroke-width="2"/><text x="30" y="386" font-size="24" text-anchor="start" font-weight="bold" fill="#1d1d1b">25 mm</text><text x="690" y="374" font-size="24" text-anchor="end" font-weight="bold" fill="#1f5fa8">0,0025</text><text x="690" y="402" font-size="22" text-anchor="end" font-weight="normal" fill="#1f5fa8">conforme</text><rect x="170" y="452" width="360" height="60" rx="0" fill="#fbe3df" stroke="none" stroke-width="0"/><rect x="260.0" y="452" width="180.0" height="60" rx="0" fill="#dcefd8" stroke="none" stroke-width="0"/><path d="M260.0 448 L260.0 516" stroke="#2e6b30" stroke-width="2" fill="none"/><path d="M440.0 448 L440.0 516" stroke="#2e6b30" stroke-width="2" fill="none"/><path d="M350.0 458 L350.0 506" stroke="#7a7a76" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/><path d="M361.25 482 L428.75 482" stroke="#1f5fa8" stroke-width="5" fill="none"/><path d="M361.25 470 L361.25 494" stroke="#1f5fa8" stroke-width="3" fill="none"/><path d="M428.75 470 L428.75 494" stroke="#1f5fa8" stroke-width="3" fill="none"/><circle cx="395.0" cy="482" r="9" fill="#1f5fa8" stroke="#ffffff" stroke-width="2"/><text x="30" y="490" font-size="24" text-anchor="start" font-weight="bold" fill="#1d1d1b">30 mm</text><text x="690" y="478" font-size="24" text-anchor="end" font-weight="bold" fill="#1f5fa8">0,0035</text><text x="690" y="506" font-size="22" text-anchor="end" font-weight="normal" fill="#1f5fa8">conforme</text><rect x="170" y="556" width="360" height="60" rx="0" fill="#fbe3df" stroke="none" stroke-width="0"/><rect x="260.0" y="556" width="180.0" height="60" rx="0" fill="#dcefd8" stroke="none" stroke-width="0"/><path d="M260.0 552 L260.0 620" stroke="#2e6b30" stroke-width="2" fill="none"/><path d="M440.0 552 L440.0 620" stroke="#2e6b30" stroke-width="2" fill="none"/><path d="M350.0 562 L350.0 610" stroke="#7a7a76" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/><path d="M383.75 586 L451.25 586" stroke="#b03a2e" stroke-width="5" fill="none"/><path d="M383.75 574 L383.75 598" stroke="#b03a2e" stroke-width="3" fill="none"/><path d="M451.25 574 L451.25 598" stroke="#b03a2e" stroke-width="3" fill="none"/><circle cx="417.5" cy="586" r="9" fill="#b03a2e" stroke="#ffffff" stroke-width="2"/><text x="30" y="594" font-size="24" text-anchor="start" font-weight="bold" fill="#1d1d1b">35 mm</text><text x="690" y="582" font-size="24" text-anchor="end" font-weight="bold" fill="#b03a2e">0,0045</text><text x="690" y="610" font-size="22" text-anchor="end" font-weight="normal" fill="#b03a2e">não conforme</text><rect x="170" y="660" width="360" height="60" rx="0" fill="#fbe3df" stroke="none" stroke-width="0"/><rect x="260.0" y="660" width="180.0" height="60" rx="0" fill="#dcefd8" stroke="none" stroke-width="0"/><path d="M260.0 656 L260.0 724" stroke="#2e6b30" stroke-width="2" fill="none"/><path d="M440.0 656 L440.0 724" stroke="#2e6b30" stroke-width="2" fill="none"/><path d="M350.0 666 L350.0 714" stroke="#7a7a76" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/><path d="M451.25 690 L518.75 690" stroke="#b03a2e" stroke-width="5" fill="none"/><path d="M451.25 678 L451.25 702" stroke="#b03a2e" stroke-width="3" fill="none"/><path d="M518.75 678 L518.75 702" stroke="#b03a2e" stroke-width="3" fill="none"/><circle cx="485.0" cy="690" r="9" fill="#b03a2e" stroke="#ffffff" stroke-width="2"/><text x="30" y="698" font-size="24" text-anchor="start" font-weight="bold" fill="#1d1d1b">40 mm</text><text x="690" y="686" font-size="24" text-anchor="end" font-weight="bold" fill="#b03a2e">0,0075</text><text x="690" y="714" font-size="22" text-anchor="end" font-weight="normal" fill="#b03a2e">não conforme</text><rect x="170" y="764" width="360" height="60" rx="0" fill="#fbe3df" stroke="none" stroke-width="0"/><rect x="260.0" y="764" width="180.0" height="60" rx="0" fill="#dcefd8" stroke="none" stroke-width="0"/><path d="M260.0 760 L260.0 828" stroke="#2e6b30" stroke-width="2" fill="none"/><path d="M440.0 760 L440.0 828" stroke="#2e6b30" stroke-width="2" fill="none"/><path d="M350.0 770 L350.0 818" stroke="#7a7a76" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/><path d="M406.25 794 L473.75 794" stroke="#b03a2e" stroke-width="5" fill="none"/><path d="M406.25 782 L406.25 806" stroke="#b03a2e" stroke-width="3" fill="none"/><path d="M473.75 782 L473.75 806" stroke="#b03a2e" stroke-width="3" fill="none"/><circle cx="440.0" cy="794" r="9" fill="#b03a2e" stroke="#ffffff" stroke-width="2"/><text x="30" y="802" font-size="24" text-anchor="start" font-weight="bold" fill="#1d1d1b">50 mm</text><text x="690" y="790" font-size="24" text-anchor="end" font-weight="bold" fill="#b03a2e">0,0055</text><text x="690" y="818" font-size="22" text-anchor="end" font-weight="normal" fill="#b03a2e">não conforme</text><text x="30" y="884" font-size="22" text-anchor="start" font-weight="normal" fill="#4a4f55">Ponto: erro (indicação − referência). Barra: ± U.</text><text x="30" y="914" font-size="22" text-anchor="start" font-weight="normal" fill="#4a4f55">Faixa verde: erro máximo admissível (EMA).</text><rect x="30" y="938" width="660" height="118" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/><text x="46" y="972" font-size="22" text-anchor="start" font-weight="bold" fill="#7a5600">35 mm: erro +0,003 está dentro do EMA,</text><text x="46" y="1004" font-size="22" text-anchor="start" font-weight="normal" fill="#7a5600">mas 0,003 + 0,0015 = 0,0045 passa de 0,004.</text><text x="46" y="1036" font-size="22" text-anchor="start" font-weight="normal" fill="#7a5600">Pela regra da empresa, não conforme.</text><rect x="30" y="1076" width="660" height="118" rx="6" fill="#b03a2e" stroke="none" stroke-width="0"/><text x="360" y="1114" font-size="26" text-anchor="middle" font-weight="bold" fill="#ffffff">REPROVADO · 3 de 5 pontos fora</text><text x="360" y="1148" font-size="22" text-anchor="middle" font-weight="normal" fill="#ffffff">registrado em 16/11/2026: bloqueado</text><text x="360" y="1178" font-size="22" text-anchor="middle" font-weight="normal" fill="#ffffff">para medição e com impacto a avaliar</text><text x="30" y="1256" font-size="22" text-anchor="start" font-weight="normal" fill="#4a4f55">Ilustração · Torno 2026</text><text x="690" y="1256" font-size="22" text-anchor="end" font-weight="normal" fill="#4a4f55">valores em mm</text></svg>