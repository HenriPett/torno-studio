">A-03-1 · CB-25 cabo 2,5 mm · 6 rolos</text><text x="72" y="840" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">lidos um a um · sem divergência</text><circle cx="46" cy="877" r="15" fill="#b3261e" stroke="none" stroke-width="0"/><text x="46" y="884" font-size="18" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text><text x="72" y="884" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">B-07-2 · DJ-32 · sistema 18 · encontrado 15</text><text x="72" y="912" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">falta de 3 · endereço vai para contagem</text><text x="72" y="938" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">PV 5103 (não aceita parcial) recebe 6</text><text x="72" y="964" font-size="18" text-anchor="start" font-weight="normal" fill="#b3261e">PV 5101 recebe 9 de 12: corte de R$ 115,50 = 6,56%</text><text x="72" y="990" font-size="18" text-anchor="start" font-weight="normal" fill="#b3261e">abaixo do limite de 10% → segue com aviso ao comercial</text><circle cx="46" cy="1027" r="15" fill="#2e7d32" stroke="none" stroke-width="0"/><text x="46" y="1034" font-size="18" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text><text x="72" y="1034" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">C-01-1 · FT-20 fita · 6 pacotes de 10</text><text x="72" y="1062" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">cada pacote lido pelo código · sem divergência</text><circle cx="46" cy="1099" r="15" fill="#b8860b" stroke="none" stroke-width="0"/><text x="46" y="1106" font-size="18" text-anchor="middle" font-weight="bold" fill="#ffffff">4</text><text x="72" y="1106" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">C-04-3 · TM-10 · 1ª caixa lida, digitado 5</text><text x="72" y="1134" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">a quinta caixa pode vir do nível de cima, C-04-4 (TM-20)</text><rect x="30" y="1164" width="660" height="84" rx="6" fill="#ffffff" stroke="#1d1d1b" stroke-width="2"/><text x="50" y="1194" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">Por pedido: 7 paradas (uma por linha de pedido)</text><text x="50" y="1224" font-size="18" text-anchor="start" font-weight="bold" fill="#1d1d1b">Em lote: 4 paradas + divisão por pedido na bancada</text><text x="30" y="1282" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">134 unidades pedidas · 131 separadas</text></svg>