<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1350" viewBox="0 0 720 1350" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Rota da separação em lote da onda O-1202-1</title><desc id="d1">Exemplo fictício. Planta baixa vista de cima do armazém da Distribuidora Exemplo de Materiais Elétricos Ltda., com as ruas A, B e C, a bancada de conferência e as docas 1 e 2. Rota da separação em lote da onda O-1202-1, liberada às 10h40 de 02/12/2026, em ordem de endereço, com quatro paradas: 1, A-03-1, 6 rolos de cabo CB-25, sem divergência; 2, B-07-2, disjuntor DJ-32, sistema 18, encontrado 15, falta de 3: endereço para contagem; o PV 5103, que não aceita parcial, recebe 6, e o PV 5101 recebe 9 de 12, corte de R$ 115,50, 6,56% do pedido, abaixo do limite de 10%; 3, C-01-1, 60 fitas FT-20 em 6 pacotes de 10, sem divergência; 4, C-04-3, tomada TM-10, primeira caixa lida e quantidade 5 digitada; ao lado, no C-04-4, fica a TM-20, de caixa igual: risco de item errado. Por pedido seriam 7 paradas, uma por linha; em lote são 4, e a divisão por pedido acontece na bancada. 134 unidades pedidas, 131 separadas.</desc><rect x="0" y="0" width="720" height="1350" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14" y="14" width="692" height="1322" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30" y="58" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Rota da separação em lote</text><text x="30" y="92" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">onda O-1202-1 · liberada às 10h40 de 02/12/2026</text><rect x="470" y="108" width="222" height="40" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581" y="136" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><text x="690" y="1320" font-size="18" text-anchor="end" font-weight="normal" fill="#4a4f55">Ilustração · Torno 2026</text><rect x="40" y="170" width=