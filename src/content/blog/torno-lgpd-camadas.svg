<svg xmlns="http://www.w3.org/2000/svg" width="720" height="940" viewBox="0 0 720 940" role="img" aria-labelledby="title desc"><title id="title">Um pedido, cinco camadas e uma raiz</title><desc id="desc">Corte de solo em estratos. Na superfície, o pedido do Titular T-01, fictício. Abaixo: Cadastro, corrigir ou eliminar; Anexos, eliminar ou manter se houver obrigação; Histórico e log, decidir o que manter do atendimento; Mensagens enviadas, localizar o que saiu; Backup, regra de restauração definida. Uma raiz lateral leva ao Sistema integrado, comunicar quem recebeu. Nota: decisões por camada ficam com o controlador ou jurídico.</desc><rect width="720" height="940" rx="24" fill="#f4f2eb"/><text x="32" y="54" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#1e2837">Um pedido, cinco camadas e uma raiz</text><rect x="32" y="74" width="232" height="42" rx="21" fill="#fffdf8" stroke="#536270" stroke-width="2.5"/><text x="148" y="103" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#536270" text-anchor="middle">Exemplo fictício</text><rect x="32" y="136" width="528" height="64" rx="12" fill="#fffdf8" stroke="#c8782f" stroke-width="3"/><text x="52" y="178" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1e2837">Pedido do Titular T-01</text><path d="M32 210H560" stroke="#426d6b" stroke-width="6" stroke-linecap="round"/><rect x="32" y="218" width="528" height="84" fill="#e0edf0"/><text x="52" y="252" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1e2837">Cadastro</text><text x="52" y="284" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#1e2837">corrigir ou eliminar</text><rect x="32" y="302" width="528" height="84" fill="#d3e6e6"/><path d="M32 302H560" stroke="#6f9694" stroke-width="2" stroke-dasharray="8 6"/><text x="52" y="336" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1e2837">Anexos</text><text x="52" y="368" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#1e2837">eliminar ou manter se houver obrigação</text><rect x="32" y="386" width="528" height="84" fill="#c6dedd"/><path d="M32 386H560" stroke="#6f9694" stroke-width="2" stroke-dasharray="8 6"/><text x="52" y="420" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1e2837">Histórico e log</text><text x="52" y="452" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#1e2837">decidir o que manter do atendimento</text><rect x="32" y="470" width="528" height="84" fill="#b9d6d4"/><path d="M32 470H560" stroke="#6f9694" stroke-width="2" stroke-dasharray="8 6"/><text x="52" y="504" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1e2837">Mensagens enviadas</text><text x="52" y="536" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#1e2837">localizar o que saiu</text><rect x="32" y="554" width="528" height="84" fill="#a9c9c6"/><path d="M32 554H560" stroke="#6f9694" stroke-width="2" stroke-dasharray="8 6"/><text x="52" y="588" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1e2837">Backup</text><text x="52" y="620" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#1e2837">regra de restauração definida</text><rect x="32" y="218" width="528" height="420" fill="none" stroke="#426d6b" stroke-width="3"/><path d="M560 252C640 252 640 330 624 400V694" fill="none" stroke="#8a5a2b" stroke-width="7" stroke-linecap="round"/><path d="M624 470C600 478 586 490 578 504M624 560C648 568 660 580 668 594" fill="none" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/><rect x="32" y="694" width="656" height="104" rx="16" fill="#fffdf8" stroke="#c8782f" stroke-width="3.5"/><text x="56" y="742" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#1e2837">Sistema integrado</text><text x="56" y="780" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#1e2837">comunicar quem recebeu</text><text x="32" y="846" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Decisões por camada ficam com o</text><text x="32" y="876" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">controlador/jurídico.</text><text x="32" y="918" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">Ilustração original Torno Studio, 2026</text></svg>