<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" viewBox="0 0 720 1120" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Título em corte: principal, multa e juros, e o pagamento parcial</title><desc id="d1">Exemplo fictício. Dois títulos em corte, como blocos empilhados, com as regras do contrato da Distribuidora Exemplo Ltda.: multa de 2% uma única vez e juros de 1% ao mês, proporcionais aos dias, em mês de 30 dias, sobre o principal em aberto. Primeiro bloco, T-4512, Restaurante Exemplo Ltda.: principal R$ 4.800,00; multa 2% = R$ 96,00; juros de 10 dias, de 03/11 a 13/11, 4.800 × 1% × 10/30 = R$ 16,00; total R$ 4.912,00. Ao lado, duas contas erradas: contar o atraso desde 02/11, o feriado, daria 11 dias e R$ 17,60 de juros, total R$ 4.913,60; e cobrar multa de quem pagou em 03/11, que deve R$ 4.800,00 sem encargos. Segundo bloco, T-4521, Oficina Exemplo Ltda., R$ 1.200,00: em 10/11, com 7 dias de atraso, devia multa R$ 24,00 e juros R$ 2,80, total R$ 1.226,80; pagou R$ 1.000,00; pela regra do contrato do exemplo, o pagamento quita primeiro os encargos, R$ 26,80, e R$ 973,20 vão ao principal, que fica em R$ 226,80. Em 17/11, 7 dias depois, juros de 226,80 × 1% × 7/30 = 0,5292, arredondado para R$ 0,53, sem nova multa; quitação de R$ 227,33.</desc><rect x="0.0" y="0.0" width="720.0" height="1120.0" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14.0" y="14.0" width="692.0" height="1092.0" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30.0" y="58.0" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Título em corte</text><text x="30.0" y="92.0" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">multa 2% uma vez · juros 1% a.m. pro rata (30 dias)</text><rect x="470.0" y="108.0" width="222.0" height="40.0" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581.0" y="136.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><text x="30.0" y="136.0" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55" font-style="italic">regras do contrato fictício, não recomendação</text><text x="30.0" y="186.0" font-size="21" text-anchor="start" font-weight="bold" fill="#1d1d1b">T-4512 · Restaurante Exemplo · pago 13/11</text><rect x="40.0" y="304.0" width="250.0" height="336.0" rx="0" fill="#5a6b7d" stroke="#1d1d1b" stroke-width="1.5"/><text x="165.0" y="472.0" font-size="21" text-anchor="middle" font-weight="bold" fill="#ffffff">principal</text><text x="165.0" y="500.0" font-size="21" text-anchor="middle" font-weight="normal" fill="#ffffff">R$ 4.800,00</text><rect x="40.0" y="270.0" width="250.0" height="34.0" rx="0" fill="#c98a7f" stroke="#1d1d1b" stroke-width="1.5"/><text x="165.0" y="294.0" font-size="19" text-anchor="middle" font-weight="bold" fill="#1d1d1b">multa 2% · R$ 96,00</text><rect x="40.0" y="244.0" width="250.0" height="26.0" rx="0" fill="#e6c9a8" stroke="#1d1d1b" stroke-width="1.5"/><text x="165.0" y="263.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#1d1d1b">juros 10 dias · R$ 16,00</text><text x="165.0" y="232.0" font-size="21" text-anchor="middle" font-weight="bold" fill="#1d1d1b">total R$ 4.912,00</text><text x="40.0" y="670.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">4.800 × 1% × 10/30 = 16,00</text><text x="40.0" y="696.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">atraso: 03/11 → 13/11 = 10 dias</text><text x="40.0" y="722.0" font-size="17" text-anchor="start" font-weight="normal" fill="#4a4f55" font-style="italic">camadas fora de escala</text><rect x="320.0" y="200.0" width="370.0" height="150.0" rx="6" fill="#fbe3e0" stroke="#c0392b" stroke-width="2"/><text x="336.0" y="230.0" font-size="20" text-anchor="start" font-weight="bold" fill="#9b2a1f">Erro 1: contar desde 02/11</text><text x="336.0" y="260.0" font-size="18" text-anchor="start" font-weight="normal" fill="#9b2a1f">02/11 era feriado; o vencimento</text><text x="336.0" y="284.0" font-size="18" text-anchor="start" font-weight="normal" fill="#9b2a1f">efetivo é 03/11. 11 dias → juros</text><text x="336.0" y="308.0" font-size="18" text-anchor="start" font-weight="normal" fill="#9b2a1f">17,60 e total R$ 4.913,60</text><text x="336.0" y="332.0" font-size="18" text-anchor="start" font-weight="normal" fill="#9b2a1f">(R$ 1,60 a mais)</text><rect x="320.0" y="366.0" width="370.0" height="126.0" rx="6" fill="#fbe3e0" stroke="#c0392b" stroke-width="2"/><text x="336.0" y="396.0" font-size="20" text-anchor="start" font-weight="bold" fill="#9b2a1f">Erro 2: encargos em 03/11</text><text x="336.0" y="426.0" font-size="18" text-anchor="start" font-weight="normal" fill="#9b2a1f">quem pagou no dia útil seguinte</text><text x="336.0" y="450.0" font-size="18" text-anchor="start" font-weight="normal" fill="#9b2a1f">ao feriado deve R$ 4.800,00,</text><text x="336.0" y="474.0" font-size="18" text-anchor="start" font-weight="normal" fill="#9b2a1f">sem multa e sem juros</text><rect x="320.0" y="508.0" width="370.0" height="132.0" rx="6" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.5"/><text x="336.0" y="538.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">Segunda via em 12/11</text><text x="336.0" y="566.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">para pagar em 13/11: R$ 4.912,00;</text><text x="336.0" y="590.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">o valor muda com a data de</text><text x="336.0" y="614.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">pagamento pretendida</text><line x1="30.0" y1="730.0" x2="690.0" y2="730.0" stroke="#d8d2c4" stroke-width="1.5"/><text x="30.0" y="770.0" font-size="21" text-anchor="start" font-weight="bold" fill="#1d1d1b">T-4521 · Oficina Exemplo · pagamento parcial</text><text x="30.0" y="822.0" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">10/11</text><rect x="110.0" y="800.0" width="300.0" height="40.0" rx="0" fill="#5a6b7d" stroke="#1d1d1b" stroke-width="1.5"/><text x="260.0" y="827.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#ffffff">principal 1.200,00</text><rect x="410.0" y="800.0" width="60.0" height="40.0" rx="0" fill="#c98a7f" stroke="#1d1d1b" stroke-width="1.5"/><text x="440.0" y="827.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#1d1d1b">24,00</text><rect x="470.0" y="800.0" width="50.0" height="40.0" rx="0" fill="#e6c9a8" stroke="#1d1d1b" stroke-width="1.5"/><text x="495.0" y="827.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#1d1d1b">2,80</text><text x="530.0" y="827.0" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">= 1.226,80</text><text x="30.0" y="892.0" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">pagou</text><rect x="110.0" y="870.0" width="410.0" height="40.0" rx="0" fill="none" stroke="#2e6b2d" stroke-width="2" stroke-dasharray="6 4"/><rect x="270.0" y="870.0" width="250.0" height="40.0" rx="0" fill="#e3efe0" stroke="#2e6b2d" stroke-width="2"/><text x="395.0" y="897.0" font-size="19" text-anchor="middle" font-weight="bold" fill="#2e6b2d">R$ 1.000,00</text><text x="114.0" y="897.0" font-size="18" text-anchor="start" font-weight="bold" fill="#1d1d1b">saldo 226,80</text><text x="30.0" y="946.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">1º encargos 26,80 · 2º principal 973,20 → saldo 226,80</text><text x="30.0" y="974.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">17/11: juros 226,80 × 1% × 7/30 = 0,5292 → R$ 0,53</text><text x="30.0" y="1002.0" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">sem nova multa · quitação R$ 227,33</text><text x="30.0" y="1036.0" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55" font-style="italic">a ordem de quitação vem do contrato; confira com o advogado</text><text x="690.0" y="1090.0" font-size="18" text-anchor="end" font-weight="normal" fill="#4a4f55">Ilustração · Torno 2026</text></svg>