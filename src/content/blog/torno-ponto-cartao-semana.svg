<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1650" viewBox="0 0 720 1650" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Uma semana de ponto, conta por conta</title><desc id="d1">Exemplo fictício. Cartão de ponto semanal de Paula R., auxiliar administrativa, horário contratual 08:00 às 12:00 e 13:00 às 17:00, semana de 09/11 a 13/11/2026. Segunda: 07:57, 12:00, 13:00, 17:04 offline gravada às 17:31; trabalhou 8h07; variação 7 min, dentro da tolerância; apurado 8h00; banco 0. Terça: 08:00, 12:00, 12:35, 17:00; trabalhou 8h25; intervalo de 35 min, 25 suprimidos para o RH; apurado 8h25; banco +25. Quarta: 08:02, 12:00, 13:00 incluída, 17:01; trabalhou 7h59; apurado 8h00; banco 0. Quinta: 07:59, 12:00, 13:01, 19:00, uma 12:00 desconsiderada; trabalhou 10h00; apurado 10h00; banco +120. Sexta: 08:00, 12:00, 13:00, 16:00, compensação aprovada; trabalhou 7h00; apurado 7h00; banco -60. Totais: 41h25 apuradas contra 40h; saldo do banco +85 min = 25 + 120 - 60. Crédito de 10/11/2026 vence em 10/05/2027 pelo acordo individual escrito do exemplo.</desc><rect x="0" y="0" width="720" height="1650" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="10" y="10" width="700" height="1630" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="450" y="24" width="246" height="46" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="573" y="56" font-size="22" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="118" font-size="32" text-anchor="start" font-weight="bold" fill="#1d1d1b">Uma semana de ponto,</text><text x="30" y="158" font-size="32" text-anchor="start" font-weight="bold" fill="#1d1d1b">conta por conta</text><text x="30" y="198" font-size="22" text-anchor="start" fill="#5a5a55">Paula R. · contrato 08:00–12:00 e 13:00–17:00 (8h)</text><text x="30" y="228" font-size="22" text-anchor="start" fill="#5a5a55">Tolerância: 5 min por marcação, 10 min por dia</text><rect x="40" y="278" width="640" height="1135" rx="8" fill="#fffdf7" stroke="#1d1d1b" stroke-width="3"/><circle cx="360" cy="306" r="12" fill="#f6f3ec" stroke="#1d1d1b" stroke-width="2"/><text x="70" y="348" font-size="22" text-anchor="start" font-weight="bold" fill="#1d1d1b">CARTÃO DE PONTO · 09 a 13/11/2026</text><line x1="60" y1="366" x2="660" y2="366" stroke="#1d1d1b" stroke-width="2"/><text x="70" y="412" font-size="22" text-anchor="start" font-weight="bold" fill="#1f4e79">SEG 09/11</text><text x="70" y="446" font-size="24" text-anchor="start" font-weight="bold" fill="#1d1d1b">07:57 · 12:00 · 13:00 · 17:04*</text><text x="70" y="478" font-size="20" text-anchor="start" fill="#5a5a55">trab. 8h07 · variação 7 min ≤ 10</text><text x="70" y="508" font-size="19" text-anchor="start" fill="#5a5a55">* offline: marcada 17:04, gravada 17:31</text><rect x="530" y="390" width="120" height="58" rx="6" fill="#e8e4da" stroke="#5a5a55" stroke-width="2"/><text x="590" y="430" font-size="28" text-anchor="middle" font-weight="bold" fill="#5a5a55">0</text><text x="590" y="478" font-size="22" text-anchor="middle" font-weight="bold" fill="#1d1d1b">8h00</text><text x="590" y="502" font-size="16" text-anchor="middle" fill="#5a5a55">apurado</text><line x1="60" y1="528" x2="660" y2="528" stroke="#cfc9bb" stroke-width="2"/><text x="70" y="582" font-size="22" text-anchor="start" font-weight="bold" fill="#1f4e79">TER 10/11</text><text x="70" y="616" font-size="24" text-anchor="start" font-weight="bold" fill="#1d1d1b">08:00 · 12:00 · 12:35 · 17:00</text><text x="70" y="648" font-size="20" text-anchor="start" fill="#5a5a55">trab. 8h25 · acima da tolerância</text><text x="70" y="678" font-size="19" text-anchor="start" fill="#b3261e">alerta: intervalo 35 min, 25 suprimidos → RH</text><rect x="530" y="560" width="120" height="58" rx="6" fill="#e3efe3" stroke="#2e6b3a" stroke-width="2"/><text x="590" y="600" font-size="28" text-anchor="middle" font-weight="bold" fill="#2e6b3a">+25</text><text x="590" y="648" font-size="22" text-anchor="middle" font-weight="bold" fill="#1d1d1b">8h25</text><text x="590" y="672" font-size="16" text-anchor="middle" fill="#5a5a55">apurado</text><line x1="60" y1="698" x2="660" y2="698" stroke="#cfc9bb" stroke-width="2"/><text x="70" y="752" font-size="22" text-anchor="start" font-weight="bold" fill="#1f4e79">QUA 11/11</text><text x="70" y="786" font-size="24" text-anchor="start" font-weight="bold" fill="#1d1d1b">08:02 · 12:00 · 13:00(I) · 17:01</text><text x="70" y="818" font-size="20" text-anchor="start" fill="#5a5a55">trab. 7h59 · variação 3 min</text><text x="70" y="848" font-size="19" text-anchor="start" fill="#5a5a55">13:00 incluída: esquecimento, aprovada</text><rect x="530" y="730" width="120" height="58" rx="6" fill="#e8e4da" stroke="#5a5a55" stroke-width="2"/><text x="590" y="770" font-size="28" text-anchor="middle" font-weight="bold" fill="#5a5a55">0</text><text x="590" y="818" font-size="22" text-anchor="middle" font-weight="bold" fill="#1d1d1b">8h00</text><text x="590" y="842" font-size="16" text-anchor="middle" fill="#5a5a55">apurado</text><line x1="60" y1="868" x2="660" y2="868" stroke="#cfc9bb" stroke-width="2"/><text x="70" y="922" font-size="22" text-anchor="start" font-weight="bold" fill="#1f4e79">QUI 12/11</text><text x="70" y="956" font-size="24" text-anchor="start" font-weight="bold" fill="#1d1d1b">07:59 · 12:00 · 13:01 · 19:00</text><text x="70" y="988" font-size="20" text-anchor="start" fill="#5a5a55">trab. 10h00 · 2h além da jornada</text><text x="70" y="1018" font-size="19" text-anchor="start" fill="#5a5a55">12:00:40 desconsiderada (duplicidade)</text><rect x="530" y="900" width="120" height="58" rx="6" fill="#e3efe3" stroke="#2e6b3a" stroke-width="2"/><text x="590" y="940" font-size="28" text-anchor="middle" font-weight="bold" fill="#2e6b3a">+120</text><text x="590" y="988" font-size="22" text-anchor="middle" font-weight="bold" fill="#1d1d1b">10h00</text><text x="590" y="1012" font-size="16" text-anchor="middle" fill="#5a5a55">apurado</text><line x1="60" y1="1038" x2="660" y2="1038" stroke="#cfc9bb" stroke-width="2"/><text x="70" y="1092" font-size="22" text-anchor="start" font-weight="bold" fill="#1f4e79">SEX 13/11</text><text x="70" y="1126" font-size="24" text-anchor="start" font-weight="bold" fill="#1d1d1b">08:00 · 12:00 · 13:00 · 16:00</text><text x="70" y="1158" font-size="20" text-anchor="start" fill="#5a5a55">trab. 7h00 · compensação aprovada</text><text x="70" y="1188" font-size="19" text-anchor="start" fill="#5a5a55">saída real 16:00 mantida no registro</text><rect x="530" y="1070" width="120" height="58" rx="6" fill="#f8e1df" stroke="#b3261e" stroke-width="2"/><text x="590" y="1110" font-size="28" text-anchor="middle" font-weight="bold" fill="#b3261e">−60</text><text x="590" y="1158" font-size="22" text-anchor="middle" font-weight="bold" fill="#1d1d1b">7h00</text><text x="590" y="1182" font-size="16" text-anchor="middle" fill="#5a5a55">apurado</text><line x1="60" y1="1208" x2="660" y2="1208" stroke="#cfc9bb" stroke-width="2"/><text x="70" y="1258" font-size="24" text-anchor="start" font-weight="bold" fill="#1d1d1b">Semana: 41h25 apuradas − 40h contrato</text><text x="70" y="1296" font-size="26" text-anchor="start" font-weight="bold" fill="#2e6b3a">Banco: +25 +120 −60 = +85 min</text><rect x="60" y="1318" width="600" height="70" rx="6" fill="#fbe9c0" stroke="#8a5a00" stroke-width="2"/><text x="360" y="1348" font-size="21" text-anchor="middle" font-weight="bold" fill="#8a5a00">Crédito de 10/11/2026 vence em 10/05/2027</text><text x="360" y="1375" font-size="18" text-anchor="middle" fill="#8a5a00">(acordo individual escrito do exemplo, 6 meses)</text><text x="40" y="1463" font-size="21" text-anchor="start" font-weight="bold" fill="#1d1d1b">Cada saldo é uma lista de movimentos com data:</text><text x="40" y="1495" font-size="21" text-anchor="start" fill="#5a5a55">o vencimento é de cada crédito, não do total.</text><text x="360" y="1580" font-size="19" text-anchor="middle" fill="#5a5a55">Excedente vai ao banco só porque há acordo vigente;</text><text x="360" y="1610" font-size="19" text-anchor="middle" fill="#5a5a55">sem acordo, vai para pagamento. Regras do exemplo.</text><text x="696" y="1628" font-size="16" text-anchor="end" fill="#5a5a55">Ilustração · Torno 2026</text></svg>