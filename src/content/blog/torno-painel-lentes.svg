<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">A mesma pilha de pedidos vista por duas lentes</title>
  <desc id="desc">À esquerda, uma lente inclui todos os pedidos criados; à direita, outra destaca apenas os concluídos. É um exemplo fictício de filtros diferentes sobre a mesma fonte.</desc>
