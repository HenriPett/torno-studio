<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1240" viewBox="0 0 720 1240" role="img" aria-labelledby="title desc"><title id="title">Estados e decisões de aprovação</title><desc id="desc">Modelo editorial de solicitação, análise e decisão por ator autorizado, com devolução, aprovação ou rejeição conforme regra. Não representa uma arquitetura real.</desc><rect width="720" height="1240" fill="#f7f6f2"/>
<text x="36" y="55" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">TORNO · ESTADOS DA APROVAÇÃO</text>
<text x="36" y="118" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="700">Quem pode decidir e o que muda?</text>
<text x="36" y="164" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Combine estados, atores e transições permitidas.</text>
<rect x="32" y="210" width="656" height="140" rx="12" fill="#fff" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="254" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Solicitação</text>
<text x="54" y="298" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Quais dados e condições iniciam a análise?</text>
<text x="54" y="332" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Quem pode apresentar ou alterar o pedido?</text>
<path d="M360 350 L360 390" stroke="#1c5a49" stroke-width="3" fill="none"/>
<rect x="32" y="390" width="656" height="145" rx="12" fill="#eeece6" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="434" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Análise por ator autorizado</text>
<text x="54" y="479" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Qual papel pode decidir neste contexto?</text>
<text x="54" y="515" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">O que precisa estar disponível para conferir?</text>
<path d="M360 535 L360 582" stroke="#1c5a49" stroke-width="3" fill="none"/>
<path d="M132 582 L588 582" stroke="#1c5a49" stroke-width="3" fill="none"/>
<path d="M132 582 L132 626" stroke="#1c5a49" stroke-width="3" fill="none"/>
<rect x="32" y="626" width="200" height="174" rx="12" fill="#fff" stroke="#dcd9d1" stroke-width="2"/>
<text x="50" y="672" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700">Devolver</text>
<text x="50" y="722" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Qual destino</text>
<text x="50" y="758" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">e mensagem?</text>
<path d="M360 582 L360 626" stroke="#1c5a49" stroke-width="3" fill="none"/>
<rect x="260" y="626" width="200" height="174" rx="12" fill="#fff" stroke="#dcd9d1" stroke-width="2"/>
<text x="278" y="672" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700">Aprovar</text>
<text x="278" y="722" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Qual destino</text>
<text x="278" y="758" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">e mensagem?</text>
<path d="M588 582 L588 626" stroke="#1c5a49" stroke-width="3" fill="none"/>
<rect x="488" y="626" width="200" height="174" rx="12" fill="#fff" stroke="#dcd9d1" stroke-width="2"/>
<text x="506" y="672" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700">Rejeitar</text>
<text x="506" y="722" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Qual destino</text>
<text x="506" y="758" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">e mensagem?</text>
<rect x="32" y="864" width="656" height="180" rx="12" fill="#e2ede8" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="909" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">E se os dados mudarem?</text>
<text x="54" y="954" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Defina quando a alteração exige nova análise</text>
<text x="54" y="990" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">e o que acontece com a decisão anterior.</text>
<text x="36" y="1132" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">Cada caminho precisa de regra e evidência.</text>
<text x="36" y="1198" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Proposta editorial · adapte ao processo.</text>
</svg>
