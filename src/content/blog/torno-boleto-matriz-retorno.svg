<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1330" viewBox="0 0 720 1330" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Ocorrências do retorno e ação do sistema</title><desc id="d1">Exemplo fictício. Matriz de ocorrências do arquivo de retorno por ação do sistema da Indústria Exemplo de Embalagens Ltda. Colunas: boleto ao cliente, baixa no contas a receber, fila do financeiro, aviso. 02 entrada confirmada: registrado, libera o boleto. 03 entrada rejeitada: rejeitado para correção, boleto retido, fila e aviso. 06 liquidação com valor igual: pago, baixa. 06 com valor diferente: pago com diferença, baixa e fila. 09 baixa pedida: baixa confirmada. 09 baixa por decurso: vencido sem boleto, proibido baixar como pago, aviso à cobrança. 17 liquidação após baixa: crédito a decidir, proibida segunda baixa, fila e aviso. 26 instrução rejeitada: alteração desfeita, aviso. 28 tarifa: título não muda. Ocorrência desconhecida: fila e aviso. Arquivo já importado: nada muda, proibido baixar de novo. Destaque: baixa não é pagamento; liquidação repetida nunca vira segunda baixa.</desc><defs><marker id="ab" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L16,7 L0,14 z" fill="#1f4e79"/></marker><marker id="ag" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L16,7 L0,14 z" fill="#2e7d32"/></marker><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L16,7 L0,14 z" fill="#b3261e"/></marker><marker id="ak" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L16,7 L0,14 z" fill="#1d1d1b"/></marker></defs><rect x="0" y="0" width="720" height="1330" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14" y="14" width="692" height="1302" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30" y="58" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Ocorrência do retorno × ação do sistema</text><text x="30" y="90" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">Indústria Exemplo de Embalagens · códigos como os de manuais públicos</text><text x="476" y="278" font-size="16" fill="#1d1d1b" font-weight="bold" transform="rotate(-60 476 278)">Boleto ao cliente</text><text x="536" y="278" font-size="16" fill="#1d1d1b" font-weight="bold" transform="rotate(-60 536 278)">Baixa no contas a receber</text><text x="596" y="278" font-size="16" fill="#1d1d1b" font-weight="bold" transform="rotate(-60 596 278)">Fila do financeiro</text><text x="656" y="278" font-size="16" fill="#1d1d1b" font-weight="bold" transform="rotate(-60 656 278)">Aviso</text><rect x="30" y="308" width="660" height="74" rx="0" fill="#ffffff" stroke="#d9d5cc" stroke-width="1"/><rect x="40" y="325" width="56" height="40" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/><text x="68.0" y="351.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#2e7d32">02</text><text x="108" y="339" font-size="18" text-anchor="start" font-weight="bold" fill="#1d1d1b">Entrada confirmada</text><text x="108" y="365" font-size="17" text-anchor="start" font-weight="normal" fill="#6b6b66">→ registrado</text><circle cx="484" cy="345.0" r="13" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><path d="M478,345.0 l4,5 l8,-10" stroke="#ffffff" stroke-width="3" fill="none"/><line x1="537" y1="345.0" x2="551" y2="345.0" stroke="#6b6b66" stroke-width="2"/><line x1="597" y1="345.0" x2="611" y2="345.0" stroke="#6b6b66" stroke-width="2"/><line x1="657" y1="345.0" x2="671" y2="345.0" stroke="#6b6b66" stroke-width="2"/><rect x="30" y="382" width="660" height="74" rx="0" fill="#efebe2" stroke="#d9d5cc" stroke-width="1"/><rect x="40" y="399" width="56" height="40" rx="6" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="68.0" y="425.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#b3261e">03</text><text x="108" y="413" font-size="18" text-anchor="start" font-weight="bold" fill="#1d1d1b">Entrada rejeitada</text><text x="108" y="439" font-size="17" text-anchor="start" font-weight="normal" fill="#6b6b66">→ rejeitado, para correção</text><circle cx="484" cy="419.0" r="13" fill="#ffffff" stroke="#b3261e" stroke-width="3"/><line x1="476" y1="427.0" x2="492" y2="411.0" stroke="#b3261e" stroke-width="3"/><line x1="537" y1="419.0" x2="551" y2="419.0" stroke="#6b6b66" stroke-width="2"/><circle cx="604" cy="419.0" r="13" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><path d="M598,419.0 l4,5 l8,-10" stroke="#ffffff" stroke-width="3" fill="none"/><circle cx="664" cy="419.0" r="13" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><path d="M658,419.0 l4,5 l8,-10" stroke="#ffffff" stroke-width="3" fill="none"/><rect x="30" y="456" width="660" height="74" rx="0" fill="#ffffff" stroke="#d9d5cc" stroke-width="1"/><rect x="40" y="473" width="56" height="40" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/><text x="68.0" y="499.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#2e7d32">06</text><text x="108" y="487" font-size="18" text-anchor="start" font-weight="bold" fill="#1d1d1b">Liquidação, valor igual</text><text x="108" y="513" font-size="17" text-anchor="start" font-weight="normal" fill="#6b6b66">→ pago</text><line x1="477" y1="493.0" x2="491" y2="493.0" stroke="#6b6b66" stroke-width="2"/><circle cx="544" cy="493.0" r="13" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><path d="M538,493.0 l4,5 l8,-10" stroke="#ffffff" stroke-width="3" fill="none"/><line x1="597" y1="493.0" x2="611" y2="493.0" stroke="#6b6b66" stroke-width="2"/><line x1="657" y1="493.0" x2="671" y2="493.0" stroke="#6b6b66" stroke-width="2"/><rect x="30" y="530" width="660" height="74" rx="0" fill="#efebe2" stroke="#d9d5cc" stroke-width="1"/><rect x="40" y="547" width="56" height="40" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/><text x="68.0" y="573.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#2e7d32">06</text><text x="108" y="561" font-size="18" text-anchor="start" font-weight="bold" fill="#1d1d1b">Liquidação, valor diferente</text><text x="108" y="587" font-size="17" text-anchor="start" font-weight="normal" fill="#6b6b66">→ pago com diferença</text><line x1="477" y1="567.0" x2="491" y2="567.0" stroke="#6b6b66" stroke-width="2"/><circle cx="544" cy="567.0" r="13" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><path d="M538,567.0 l4,5 l8,-10" stroke="#ffffff" stroke-width="3" fill="none"/><circle cx="604" cy="567.0" r="13" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><path d="M598,567.0 l4,5 l8,-10" stroke="#ffffff" stroke-width="3" fill="none"/><line x1="657" y1="567.0" x2="671" y2="567.0" stroke="#6b6b66" stroke-width="2"/><rect x="30" y="604" width="660" height="74" rx="0" fill="#ffffff" stroke="#d9d5cc" stroke-width="1"/><rect x="40" y="621" width="56" height="40" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="2"/><text x="68.0" y="647.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#b8860b">09</text><text x="108" y="635" font-size="18" text-anchor="start" font-weight="bold" fill="#1d1d1b">Baixa pedida pela empresa</text><text x="108" y="661" font-size="17" text-anchor="start" font-weight="normal" fill="#6b6b66">→ baixa confirmada</text><line x1="477" y1="641.0" x2="491" y2="641.0" stroke="#6b6b66" stroke-width="2"/><line x1="537" y1="641.0" x2="551" y2="641.0" stroke="#6b6b66" stroke-width="2"/><line x1="597" y1="641.0" x2="611" y2="641.0" stroke="#6b6b66" stroke-width="2"/><line x1="657" y1="641.0" x2="671" y2="641.0" stroke="#6b6b66" stroke-width="2"/><rect x="30" y="678" width="660" height="74" rx="0" fill="#efebe2" stroke="#d9d5cc" stroke-width="1"/><rect x="40" y="695" width="56" height="40" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="2"/><text x="68.0" y="721.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#b8860b">09</text><text x="108" y="709" font-size="18" text-anchor="start" font-weight="bold" fill="#1d1d1b">Baixa por decurso</text><text x="108" y="735" font-size="17" text-anchor="start" font-weight="normal" fill="#6b6b66">→ vencido, sem boleto</text><line x1="477" y1="715.0" x2="491" y2="715.0" stroke="#6b6b66" stroke-width="2"/><circle cx="544" cy="715.0" r="13" fill="#ffffff" stroke="#b3261e" stroke-width="3"/><line x1="536" y1="723.0" x2="552" y2="707.0" stroke="#b3261e" stroke-width="3"/><line x1="597" y1="715.0" x2="611" y2="715.0" stroke="#6b6b66" stroke-width="2"/><circle cx="664" cy="715.0" r="13" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><path d="M658,715.0 l4,5 l8,-10" stroke="#ffffff" stroke-width="3" fill="none"/><rect x="30" y="752" width="660" height="74" rx="0" fill="#ffffff" stroke="#d9d5cc" stroke-width="1"/><rect x="40" y="769" width="56" height="40" rx="6" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="68.0" y="795.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#b3261e">17</text><text x="108" y="783" font-size="18" text-anchor="start" font-weight="bold" fill="#1d1d1b">Liquidação após baixa</text><text x="108" y="809" font-size="17" text-anchor="start" font-weight="normal" fill="#6b6b66">→ crédito a decidir</text><line x1="477" y1="789.0" x2="491" y2="789.0" stroke="#6b6b66" stroke-width="2"/><circle cx="544" cy="789.0" r="13" fill="#ffffff" stroke="#b3261e" stroke-width="3"/><line x1="536" y1="797.0" x2="552" y2="781.0" stroke="#b3261e" stroke-width="3"/><circle cx="604" cy="789.0" r="13" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><path d="M598,789.0 l4,5 l8,-10" stroke="#ffffff" stroke-width="3" fill="none"/><circle cx="664" cy="789.0" r="13" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><path d="M658,789.0 l4,5 l8,-10" stroke="#ffffff" stroke-width="3" fill="none"/><rect x="30" y="826" width="660" height="74" rx="0" fill="#efebe2" stroke="#d9d5cc" stroke-width="1"/><rect x="40" y="843" width="56" height="40" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="2"/><text x="68.0" y="869.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#b8860b">26</text><text x="108" y="857" font-size="18" text-anchor="start" font-weight="bold" fill="#1d1d1b">Instrução rejeitada</text><text x="108" y="883" font-size="17" text-anchor="start" font-weight="normal" fill="#6b6b66">→ alteração desfeita</text><line x1="477" y1="863.0" x2="491" y2="863.0" stroke="#6b6b66" stroke-width="2"/><line x1="537" y1="863.0" x2="551" y2="863.0" stroke="#6b6b66" stroke-width="2"/><line x1="597" y1="863.0" x2="611" y2="863.0" stroke="#6b6b66" stroke-width="2"/><circle cx="664" cy="863.0" r="13" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><path d="M658,863.0 l4,5 l8,-10" stroke="#ffffff" stroke-width="3" fill="none"/><rect x="30" y="900" width="660" height="74" rx="0" fill="#ffffff" stroke="#d9d5cc" stroke-width="1"/><rect x="40" y="917" width="56" height="40" rx="6" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/><text x="68.0" y="943.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#1f4e79">28</text><text x="108" y="931" font-size="18" text-anchor="start" font-weight="bold" fill="#1d1d1b">Tarifa</text><text x="108" y="957" font-size="17" text-anchor="start" font-weight="normal" fill="#6b6b66">→ título não muda</text><line x1="477" y1="937.0" x2="491" y2="937.0" stroke="#6b6b66" stroke-width="2"/><line x1="537" y1="937.0" x2="551" y2="937.0" stroke="#6b6b66" stroke-width="2"/><line x1="597" y1="937.0" x2="611" y2="937.0" stroke="#6b6b66" stroke-width="2"/><line x1="657" y1="937.0" x2="671" y2="937.0" stroke="#6b6b66" stroke-width="2"/><rect x="30" y="974" width="660" height="74" rx="0" fill="#efebe2" stroke="#d9d5cc" stroke-width="1"/><rect x="40" y="991" width="56" height="40" rx="6" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="68.0" y="1017.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#b3261e">??</text><text x="108" y="1005" font-size="18" text-anchor="start" font-weight="bold" fill="#1d1d1b">Ocorrência desconhecida</text><text x="108" y="1031" font-size="17" text-anchor="start" font-weight="normal" fill="#6b6b66">→ sem mudança</text><line x1="477" y1="1011.0" x2="491" y2="1011.0" stroke="#6b6b66" stroke-width="2"/><line x1="537" y1="1011.0" x2="551" y2="1011.0" stroke="#6b6b66" stroke-width="2"/><circle cx="604" cy="1011.0" r="13" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><path d="M598,1011.0 l4,5 l8,-10" stroke="#ffffff" stroke-width="3" fill="none"/><circle cx="664" cy="1011.0" r="13" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><path d="M658,1011.0 l4,5 l8,-10" stroke="#ffffff" stroke-width="3" fill="none"/><rect x="30" y="1048" width="660" height="74" rx="0" fill="#ffffff" stroke="#d9d5cc" stroke-width="1"/><rect x="40" y="1065" width="56" height="40" rx="6" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/><text x="68.0" y="1091.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#1f4e79">==</text><text x="108" y="1079" font-size="18" text-anchor="start" font-weight="bold" fill="#1d1d1b">Arquivo já importado</text><text x="108" y="1105" font-size="17" text-anchor="start" font-weight="normal" fill="#6b6b66">→ nada muda; registrado</text><line x1="477" y1="1085.0" x2="491" y2="1085.0" stroke="#6b6b66" stroke-width="2"/><circle cx="544" cy="1085.0" r="13" fill="#ffffff" stroke="#b3261e" stroke-width="3"/><line x1="536" y1="1093.0" x2="552" y2="1077.0" stroke="#b3261e" stroke-width="3"/><line x1="597" y1="1085.0" x2="611" y2="1085.0" stroke="#6b6b66" stroke-width="2"/><line x1="657" y1="1085.0" x2="671" y2="1085.0" stroke="#6b6b66" stroke-width="2"/><circle cx="44" cy="1146" r="11" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><path d="M38,1146 l4,5 l8,-10" stroke="#ffffff" stroke-width="3" fill="none"/><text x="64" y="1152" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">faz</text><circle cx="124" cy="1146" r="11" fill="#ffffff" stroke="#b3261e" stroke-width="3"/><line x1="117" y1="1153" x2="131" y2="1139" stroke="#b3261e" stroke-width="3"/><text x="144" y="1152" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">proibido fazer</text><line x1="282" y1="1146" x2="296" y2="1146" stroke="#6b6b66" stroke-width="2"/><text x="306" y="1152" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">não se aplica</text><rect x="30" y="1182" width="660" height="64" rx="6" fill="#fbe9e7" stroke="#b3261e" stroke-width="2"/><text x="360" y="1210" font-size="20" text-anchor="middle" font-weight="bold" fill="#b3261e">Baixa não é pagamento.</text><text x="360" y="1234" font-size="18" text-anchor="middle" font-weight="normal" fill="#b3261e">Liquidação repetida nunca vira segunda baixa.</text><text x="30" y="1300" font-size="16" text-anchor="start" font-weight="normal" fill="#6b6b66">Ilustração · Torno 2026</text><text x="690" y="1300" font-size="16" text-anchor="end" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text></svg>