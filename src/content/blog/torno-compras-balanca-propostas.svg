<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1864" viewBox="0 0 720 1864" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Mesma cotação, três balanças</title><desc id="d1">Exemplo fictício. Três balanças de pratos comparam duas propostas da cotação COT-0088 da Exemplo Caldeiraria Ltda. para 48 chapas de aço de 2 mm, com 31,40 kg por chapa no cadastro; o prato mais baixo é o mais caro. Balança 1, preço como veio: Aços Alfa, R$ 7,05 por kg; Beta Metais, R$ 219,00 por chapa; travada, unidades diferentes, não compara. Balança 2, mesma base e frete: Alfa R$ 10.625,76, frete CIF incluso; Beta R$ 10.752,00, com R$ 240,00 de frete FOB; Beta mais cara por R$ 126,24. Balança 3, prazo de pagamento a 1,5% ao mês: Alfa, 28 dias, R$ 10.479,13; Beta, 63 dias, R$ 10.424,87; a Beta passa a ser a referência, R$ 54,26 a menos. Fora da balança, Gama Distribuidora, R$ 10.324,32, entrega em 22/12, depois da necessidade de 14/12. Abaixo de cerca de 1,04% ao mês, a Alfa volta a ser a referência; a taxa é parâmetro do financeiro.</desc><rect x="0" y="0" width="720" height="1864" fill="#f6f3ec"/><rect x="10" y="10" width="700" height="1844" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="450" y="24" width="246" height="46" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="573" y="56" font-size="22" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="118" font-size="32" text-anchor="start" font-weight="bold" fill="#1d1d1b">Mesma cotação,</text><text x="30" y="158" font-size="32" text-anchor="start" font-weight="bold" fill="#1d1d1b">três balanças</text><text x="30" y="202" font-size="24" text-anchor="start" fill="#5a5a55">COT-0088 · 48 chapas · 31,40 kg/chapa</text><text x="30" y="234" font-size="24" text-anchor="start" fill="#5a5a55">Prato mais baixo = mais caro</text><rect x="30" y="276" width="660" height="400" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="2"/><text x="50" y="318" font-size="26" text-anchor="start" font-weight="bold" fill="#1d1d1b">1. Preço como veio</text><line x1="360.0" y1="386.0" x2="360.0" y2="538.0" stroke="#5a5a55" stroke-width="6"/><path d="M310,548 L410,548 L360,512 Z" fill="#5a5a55" stroke="#5a5a55" stroke-width="2"/><line x1="160.0" y1="386.0" x2="560.0" y2="386.0" stroke="#1d1d1b" stroke-width="7"/><circle cx="360" cy="386" r="9" fill="#1d1d1b"/><line x1="160.0" y1="386.0" x2="90.0" y2="450.0" stroke="#5a5a55" stroke-width="2"/><line x1="160.0" y1="386.0" x2="230.0" y2="450.0" stroke="#5a5a55" stroke-width="2"/><path d="M75.0,450.0 Q160.0,494.0 245.0,450.0 Z" fill="#1f4e79" stroke="#1f4e79" stroke-width="2"/><text x="160" y="526" font-size="24" text-anchor="middle" font-weight="bold" fill="#1f4e79">Aços Alfa</text><text x="160" y="558" font-size="26" text-anchor="middle" font-weight="bold" fill="#1d1d1b">R$ 7,05/kg</text><line x1="560.0" y1="386.0" x2="490.0" y2="450.0" stroke="#5a5a55" stroke-width="2"/><line x1="560.0" y1="386.0" x2="630.0" y2="450.0" stroke="#5a5a55" stroke-width="2"/><path d="M475.0,450.0 Q560.0,494.0 645.0,450.0 Z" fill="#8a5a00" stroke="#8a5a00" stroke-width="2"/><text x="560" y="526" font-size="24" text-anchor="middle" font-weight="bold" fill="#8a5a00">Beta Metais</text><text x="560" y="558" font-size="26" text-anchor="middle" font-weight="bold" fill="#1d1d1b">R$ 219,00/chapa</text><rect x="340" y="328" width="40" height="32" rx="4" fill="#b3261e" stroke="#b3261e" stroke-width="2"/><path d="M348,328 L348,316 A12,12 0 0 1 372,316 L372,328" fill="none" stroke="#b3261e" stroke-width="4"/><text x="360" y="654" font-size="26" text-anchor="middle" font-weight="bold" fill="#b3261e">Unidades diferentes: não compara</text><rect x="30" y="696" width="660" height="400" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="2"/><text x="50" y="738" font-size="26" text-anchor="start" font-weight="bold" fill="#1d1d1b">2. Mesma base + frete</text><line x1="360.0" y1="806.0" x2="360.0" y2="958.0" stroke="#5a5a55" stroke-width="6"/><path d="M310,968 L410,968 L360,932 Z" fill="#5a5a55" stroke="#5a5a55" stroke-width="2"/><line x1="160.0" y1="772.0" x2="560.0" y2="840.0" stroke="#1d1d1b" stroke-width="7"/><circle cx="360" cy="806" r="9" fill="#1d1d1b"/><line x1="160.0" y1="772.0" x2="90.0" y2="836.0" stroke="#5a5a55" stroke-width="2"/><line x1="160.0" y1="772.0" x2="230.0" y2="836.0" stroke="#5a5a55" stroke-width="2"/><path d="M75.0,836.0 Q160.0,880.0 245.0,836.0 Z" fill="#1f4e79" stroke="#1f4e79" stroke-width="2"/><text x="160" y="912" font-size="24" text-anchor="middle" font-weight="bold" fill="#1f4e79">Alfa · CIF</text><text x="160" y="944" font-size="26" text-anchor="middle" font-weight="bold" fill="#1d1d1b">R$ 10.625,76</text><line x1="560.0" y1="840.0" x2="490.0" y2="904.0" stroke="#5a5a55" stroke-width="2"/><line x1="560.0" y1="840.0" x2="630.0" y2="904.0" stroke="#5a5a55" stroke-width="2"/><path d="M475.0,904.0 Q560.0,948.0 645.0,904.0 Z" fill="#8a5a00" stroke="#8a5a00" stroke-width="2"/><text x="560" y="980" font-size="24" text-anchor="middle" font-weight="bold" fill="#8a5a00">Beta · FOB + R$ 240</text><text x="560" y="1012" font-size="26" text-anchor="middle" font-weight="bold" fill="#1d1d1b">R$ 10.752,00</text><text x="360" y="1074" font-size="26" text-anchor="middle" font-weight="bold" fill="#1d1d1b">Beta mais cara: + R$ 126,24</text><rect x="30" y="1116" width="660" height="400" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="2"/><text x="50" y="1158" font-size="26" text-anchor="start" font-weight="bold" fill="#1d1d1b">3. + prazo de pagamento (1,5% a.m.)</text><line x1="360.0" y1="1226.0" x2="360.0" y2="1378.0" stroke="#5a5a55" stroke-width="6"/><path d="M310,1388 L410,1388 L360,1352 Z" fill="#5a5a55" stroke="#5a5a55" stroke-width="2"/><line x1="160.0" y1="1260.0" x2="560.0" y2="1192.0" stroke="#1d1d1b" stroke-width="7"/><circle cx="360" cy="1226" r="9" fill="#1d1d1b"/><line x1="160.0" y1="1260.0" x2="90.0" y2="1324.0" stroke="#5a5a55" stroke-width="2"/><line x1="160.0" y1="1260.0" x2="230.0" y2="1324.0" stroke="#5a5a55" stroke-width="2"/><path d="M75.0,1324.0 Q160.0,1368.0 245.0,1324.0 Z" fill="#1f4e79" stroke="#1f4e79" stroke-width="2"/><text x="160" y="1400" font-size="24" text-anchor="middle" font-weight="bold" fill="#1f4e79">Alfa · 28 dias</text><text x="160" y="1432" font-size="26" text-anchor="middle" font-weight="bold" fill="#1d1d1b">R$ 10.479,13</text><line x1="560.0" y1="1192.0" x2="490.0" y2="1256.0" stroke="#5a5a55" stroke-width="2"/><line x1="560.0" y1="1192.0" x2="630.0" y2="1256.0" stroke="#5a5a55" stroke-width="2"/><path d="M475.0,1256.0 Q560.0,1300.0 645.0,1256.0 Z" fill="#8a5a00" stroke="#8a5a00" stroke-width="2"/><text x="560" y="1332" font-size="24" text-anchor="middle" font-weight="bold" fill="#8a5a00">Beta · 63 dias</text><text x="560" y="1364" font-size="26" text-anchor="middle" font-weight="bold" fill="#1d1d1b">R$ 10.424,87</text><text x="360" y="1494" font-size="26" text-anchor="middle" font-weight="bold" fill="#2e7d32">Referência: Beta, − R$ 54,26</text><rect x="30" y="1536" width="660" height="104" rx="4" fill="#fbe9e7" stroke="#b3261e" stroke-width="2"/><text x="50" y="1576" font-size="24" text-anchor="start" font-weight="bold" fill="#b3261e">Gama · R$ 10.324,32 · fora da balança:</text><text x="50" y="1612" font-size="24" text-anchor="start" fill="#b3261e">entrega 22/12, necessidade 14/12</text><rect x="30" y="1660" width="660" height="104" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/><text x="50" y="1700" font-size="24" text-anchor="start" font-weight="bold" fill="#1f4e79">Abaixo de ~1,04% a.m., Alfa vira a referência.</text><text x="50" y="1736" font-size="24" text-anchor="start" fill="#1f4e79">A taxa é parâmetro do financeiro.</text><text x="30" y="1800" font-size="24" text-anchor="start" fill="#5a5a55">Exemplo fictício: dados inventados.</text><text x="690" y="1834" font-size="24" text-anchor="end" fill="#5a5a55">Ilustração · Torno 2026</text></svg>
