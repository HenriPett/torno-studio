<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1720" viewBox="0 0 720 1720" role="img" aria-labelledby="t2 d2" font-family="Arial, Helvetica, sans-serif"><title id="t2">Linha do tempo de um mês: o mesmo histórico, dois MTBF e dois MTTR</title><desc id="d2">Exemplo fictício. Injetora IJ-04 da Indústria Exemplo Ltda., novembro de 2026, 20 dias de produção de 16 h, 320 horas programadas, em quatro faixas de 5 dias de produção. Dias 1 a 5: F1, vazamento hidráulico, 6,0 h. Dias 6 a 10: preventiva de 4 h e ordem da lâmpada do painel sem parada. Dias 11 a 15: falta de material de 6 h e F2, resistência queimada, 3,0 h. Dias 16 a 20: F3, sensor de porta, 1,0 h. F1 em detalhe: espera do técnico 0,5, diagnóstico 0,5, espera da peça 3,0, troca 1,5, teste 0,5; reparo ativo 2,5 h e espera 3,5 h. Horas de operação: 320 menos 4, menos 6, menos 10, igual a 300. Regra A: falha é perda de função com máquina parada; 3 falhas; MTBF 300 ÷ 3 = 100 h; MTTR até restabelecer 10 ÷ 3 = 3 h 20 min; reparo ativo médio 5 ÷ 3 = 1 h 40 min. Regra B: toda ordem corretiva conta; 4 ordens; MTBF 720 ÷ 4 = 180 h; MTTR da abertura ao encerramento da ordem 26 ÷ 4 = 6,5 h. Mesmo mês e mesmas ordens; muda só a regra.</desc><rect x="0" y="0" width="720" height="1720" rx="0" fill="#f4efe6"/><text x="40" y="58" font-size="32" fill="#1d1d1b" font-weight="bold" text-anchor="start">Um mês, duas contas</text><rect x="450" y="30" width="230" height="38" rx="6" fill="#1d1d1b"/><text x="565" y="57" font-size="22" fill="#f4efe6" font-weight="bold" text-anchor="middle">EXEMPLO FICTÍCIO</text><text x="40" y="104" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Indústria Exemplo Ltda. · injetora IJ-04</text><text x="40" y="138" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Novembro: 20 dias de produção × 16 h = 320 h</text><text x="40" y="248" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Dias 1–5</text><rect x="175" y="210" width="505" height="56" rx="4" fill="#dfc79c" stroke="#1d1d1b" stroke-width="2"/><rect x="288.625" y="210" width="37.875" height="56" rx="2" fill="#a33a2a" stroke="#1d1d1b" stroke-width="2"/><text x="307.5625" y="198" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">F1 · 6,0 h</text><text x="40" y="366" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Dias 6–10</text><rect x="175" y="328" width="505" height="56" rx="4" fill="#dfc79c" stroke="#1d1d1b" stroke-width="2"/><rect x="238.125" y="328" width="25.25" height="56" rx="2" fill="#3d5a80" stroke="#1d1d1b" stroke-width="2"/><text x="250.75" y="316" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">preventiva 4 h</text><path d="M503.25 340 L519.25 356 L503.25 372 L487.25 356 Z" fill="#ffffff" stroke="#1d1d1b" stroke-width="3"/><text x="503.25" y="316" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">◆ lâmpada, sem parada</text><text x="40" y="484" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Dias 11–15</text><rect x="175" y="446" width="505" height="56" rx="4" fill="#dfc79c" stroke="#1d1d1b" stroke-width="2"/><rect x="263.375" y="446" width="37.875" height="56" rx="2" fill="#9a9284" stroke="#1d1d1b" stroke-width="2"/><text x="282.3125" y="434" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">material 6 h</text><rect x="541.125" y="446" width="18.9375" height="56" rx="2" fill="#a33a2a" stroke="#1d1d1b" stroke-width="2"/><text x="550.59375" y="434" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">F2 · 3,0 h</text><text x="40" y="602" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Dias 16–20</text><rect x="175" y="564" width="505" height="56" rx="4" fill="#dfc79c" stroke="#1d1d1b" stroke-width="2"/><rect x="427.5" y="564" width="7" height="56" rx="2" fill="#a33a2a" stroke="#1d1d1b" stroke-width="2"/><text x="430.65625" y="552" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">F3 · 1,0 h</text><rect x="40" y="658" width="26" height="26" rx="3" fill="#dfc79c" stroke="#1d1d1b" stroke-width="2"/><text x="78" y="679" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">operando</text><rect x="370" y="658" width="26" height="26" rx="3" fill="#a33a2a" stroke="#1d1d1b" stroke-width="2"/><text x="408" y="679" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">falha, máquina parada</text><rect x="40" y="698" width="26" height="26" rx="3" fill="#3d5a80" stroke="#1d1d1b" stroke-width="2"/><text x="78" y="719" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">preventiva</text><rect x="370" y="698" width="26" height="26" rx="3" fill="#9a9284" stroke="#1d1d1b" stroke-width="2"/><text x="408" y="719" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">falta de material</text><text x="40" y="782" font-size="24" fill="#1d1d1b" font-weight="bold" text-anchor="start">F1 em detalhe: 6,0 h até restabelecer</text><rect x="40" y="802" width="53.333333333333336" height="60" rx="2" fill="#ffffff" stroke="#1d1d1b" stroke-width="2"/><path d="M44 858 L89.33333333333334 806" stroke="#9a9284" stroke-width="3"/><text x="66.66666666666667" y="896" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">0,5</text><rect x="93.33333333333334" y="802" width="53.333333333333336" height="60" rx="2" fill="#2f7d4f" stroke="#1d1d1b" stroke-width="2"/><text x="120.00000000000001" y="896" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">0,5</text><rect x="146.66666666666669" y="802" width="320.0" height="60" rx="2" fill="#ffffff" stroke="#1d1d1b" stroke-width="2"/><text x="306.6666666666667" y="896" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">3,0</text><rect x="466.6666666666667" y="802" width="160.0" height="60" rx="2" fill="#2f7d4f" stroke="#1d1d1b" stroke-width="2"/><text x="546.6666666666667" y="896" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">1,5</text><rect x="626.6666666666667" y="802" width="53.333333333333336" height="60" rx="2" fill="#2f7d4f" stroke="#1d1d1b" stroke-width="2"/><text x="653.3333333333334" y="896" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">0,5</text><text x="306.6666666666667" y="842" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">espera da peça</text><rect x="40" y="932" width="26" height="26" rx="3" fill="#2f7d4f" stroke="#1d1d1b" stroke-width="2"/><text x="78" y="953" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">reparo ativo 2,5 h</text><rect x="370" y="932" width="26" height="26" rx="3" fill="#ffffff" stroke="#1d1d1b" stroke-width="2"/><text x="408" y="953" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">espera 3,5 h</text><rect x="40" y="1006" width="640" height="60" rx="8" fill="#fffdf7" stroke="#1d1d1b" stroke-width="3"/><text x="360" y="1045" font-size="24" fill="#1d1d1b" font-weight="bold" text-anchor="middle">Operação: 320 − 4 − 6 − 10 = 300 h</text><rect x="40" y="1096" width="640" height="236" rx="8" fill="#fffdf7" stroke="#1d1d1b" stroke-width="3"/><rect x="40" y="1096" width="14" height="236" rx="4" fill="#2f7d4f"/><text x="72" y="1136" font-size="26" fill="#2f7d4f" font-weight="bold" text-anchor="start">Regra A · 3 falhas</text><text x="72" y="1170" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">falha = perda de função, máquina parada</text><text x="72" y="1214" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">MTBF  300 h ÷ 3</text><text x="656" y="1214" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="end">100 h</text><text x="72" y="1256" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">MTTR  até restabelecer 10 h ÷ 3</text><text x="656" y="1256" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="end">3 h 20 min</text><text x="72" y="1298" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">reparo ativo  5 h ÷ 3</text><text x="656" y="1298" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="end">1 h 40 min</text><rect x="40" y="1358" width="640" height="236" rx="8" fill="#fffdf7" stroke="#1d1d1b" stroke-width="3"/><rect x="40" y="1358" width="14" height="236" rx="4" fill="#a33a2a"/><text x="72" y="1398" font-size="26" fill="#a33a2a" font-weight="bold" text-anchor="start">Regra B · 4 ordens</text><text x="72" y="1432" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">toda ordem corretiva conta, até a lâmpada</text><text x="72" y="1476" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">MTBF  720 h do mês ÷ 4</text><text x="656" y="1476" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="end">180 h</text><text x="72" y="1518" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">MTTR  26 h de ordem aberta ÷ 4</text><text x="656" y="1518" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="end">6,5 h</text><text x="72" y="1560" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">da abertura ao encerramento</text><text x="40" y="1648" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Mesmo mês, mesmas ordens: muda só a regra.</text><text x="40" y="1690" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Ilustração · Torno 2026</text></svg>