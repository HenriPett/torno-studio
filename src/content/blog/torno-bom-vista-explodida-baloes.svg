104" y="1162" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">1 un · semiacabado, OP própria</text><rect x="40" y="1172" width="640" height="68" fill="#fffdf7"/><circle cx="112" cy="1206" r="20" fill="#fffdf7" stroke="#8a6a3e" stroke-width="3"/><text x="112" y="1214" font-size="22" fill="#8a6a3e" font-weight="bold" text-anchor="middle">4a</text><text x="144" y="1202" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">TB-25 · tubo Ø 25 mm</text><text x="144" y="1230" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">1,80 m · perda 5% · compra: barra 6 m</text><rect x="40" y="1240" width="640" height="68" fill="#efe8da"/><circle cx="72" cy="1274" r="20" fill="#fffdf7" stroke="#1d1d1b" stroke-width="3"/><text x="72" y="1282" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">5</text><text x="104" y="1270" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">PF-M8 · parafuso M8 × 20</text><text x="104" y="1298" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">8 un · compra: caixa de 100</text><rect x="40" y="1308" width="640" height="68" fill="#fffdf7"/><circle cx="72" cy="1342" r="20" fill="#fffdf7" stroke="#5f7350" stroke-width="3"/><text x="72" y="1350" font-size="22" fill="#5f7350" font-weight="bold" text-anchor="middle">6</text><text x="104" y="1338" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">TP-01 · tinta em pó</text><text x="104" y="1366" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">0,40 kg · perda 10% + 1 kg por OP</text><rect x="40" y="764" width="640" height="612" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="40" y="1426" font-size="26" fill="#1d1d1b" font-weight="bold" text-anchor="start">Explosão para a OP de 50 carrinhos</text><text x="40" y="1466" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Parafuso PF-M8:</text><text x="40" y="1496" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">50 × (8 + 2 × 4) = 800 = 8 caixas</text><text x="40" y="1538" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Tubo TB-25 (OP da alça):</text><text x="40" y="1568" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">50 × 1,80 × 1,05 = 94,5 m</text><text x="40" y="1598" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">= 15,75 barras → compra de 16 barras</text><text x="40" y="1640" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Tinta TP-01:</text><text x="40" y="1670" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">50 × 0,40 × 1,10 + 1 = 23 kg</text><text x="40" y="1710" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Ilustração · Torno 2026</text></svg>