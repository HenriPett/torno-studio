<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1740" viewBox="0 0 720 1740" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Vista explodida do carrinho CP-300 e sua estrutura</title><desc id="d1">Exemplo fictício. Vista explodida do carrinho plataforma CP-300, revisão C, da Indústria Exemplo Ltda., com balões numerados ligados a uma tabela. Balão 1: PL-300, plataforma soldada, 1 unidade, semiacabado com ordem de produção própria. Balão 2: KR-125, rodízio giratório, 2 unidades, fantasma: não vira ordem nem estoque; seus componentes vão direto para a ordem do carrinho: 2a, RG-125, roda giratória, 1 unidade; 2b, PF-M8, parafuso, 4 unidades. Balão 3: RF-125, roda fixa, 2 unidades, comprada, entrou na revisão C. Balão 4: AL-30, alça tubular, 1 unidade, semiacabado com ordem própria; 4a, TB-25, tubo de 25 milímetros, 1,80 metro, perda de 5%, comprado em barra de 6 metros. Balão 5: PF-M8, parafuso M8, 8 unidades, comprado em caixa de 100. Balão 6: TP-01, tinta em pó, 0,40 quilo, perda de 10% mais 1 quilo por ordem. Explosão para 50 carrinhos: parafusos 50 vezes 8 mais 2 vezes 4, igual a 800, 8 caixas; tubo 50 vezes 1,80 vezes 1,05, igual a 94,5 metros, 15,75 barras, compra de 16 barras; tinta 50 vezes 0,40 vezes 1,10, mais 1, igual a 23 quilos.</desc><rect x="0" y="0" width="720" height="1740" fill="#f4efe6"/><text x="40" y="58" font-size="28" fill="#1d1d1b" font-weight="bold" text-anchor="start">Uma vista, uma estrutura</text><rect x="450" y="30" width="230" height="38" rx="6" fill="#1d1d1b"/><text x="565" y="57" font-size="22" fill="#f4efe6" font-weight="bold" text-anchor="middle">EXEMPLO FICTÍCIO</text><text x="40" y="104" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Carrinho plataforma CP-300 · revisão C</text><rect x="40" y="128" width="640" height="560" rx="12" fill="#fffdf7" stroke="#1d1d1b" stroke-width="2"/><path d="M250 250 L250 175 Q250 158 267 158 L453 158 Q470 158 470 175 L470 