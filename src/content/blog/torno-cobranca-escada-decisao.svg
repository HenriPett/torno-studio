<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1070" viewBox="0 0 720 1070" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Escada de quem decide cada passo da cobrança</title><desc id="d1">Exemplo fictício. Escada de quatro degraus que mostra quem decide cada passo da cobrança na Distribuidora Exemplo Ltda.; quanto mais alto o degrau, maior o efeito sobre o cliente e menos o sistema decide sozinho. Degrau 1, o sistema sozinho, por regra aprovada: lembrete D−3, avisos D+1, D+5 e D+10, segunda via com valor atualizado, parar quando a baixa entra, pausar quando há acordo ou contestação registrados. Degrau 2, a equipe do financeiro: telefonema no D+15, acordo dentro da alçada, registro da contestação, atualização do contato que voltou. Degrau 3, gestor financeiro ou diretoria: acordo fora da alçada, dispensa de multa ou juros, proposta de negativação ou de protesto a partir do D+30, encerramento da cobrança. Degrau 4, advogado: texto dos avisos, multa, juros e correção do contrato, relação de consumo, base legal de tratamento de dados, notificação prévia, protesto e cobrança judicial. Nota ao lado: negativação e protesto nunca saem de um agendamento; saem de uma decisão registrada com nome e data.</desc><rect x="0.0" y="0.0" width="720.0" height="1070.0" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14.0" y="14.0" width="692.0" height="1042.0" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30.0" y="58.0" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Quem decide cada passo</text><text x="30.0" y="92.0" font-size="21" text-anchor="start" font-weight="normal" fill="#1d1d1b">quanto mais alto, menos o sistema decide</text><rect x="470.0" y="108.0" width="222.0" height="40.0" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581.0" y="136.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><path d="M 30 836 L 30 686 L 80 686 L 80 514 L 130 514 L 130 342 L 180 342 L 180 170 L 230 170 L 230 836 Z" fill="#e9e4d8" stroke="#1d1d1b" stroke-width="2"/><rect x="34.0" y="690.0" width="42.0" height="26.0" rx="3" fill="#2f5d8a" stroke="none" stroke-width="0"/><text x="55.0" y="710.0" font-size="19" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text><line x1="80.0" y1="687.0" x2="250.0" y2="687.0" stroke="#2f5d8a" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="250.0" y="686.0" width="440.0" height="140.0" rx="6" fill="#dde8f3" stroke="#2f5d8a" stroke-width="2"/><text x="264.0" y="714.0" font-size="20" text-anchor="start" font-weight="bold" fill="#2f5d8a">1 · Sistema, por regra aprovada</text><text x="264.0" y="742.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">lembrete D−3 · avisos D+1, D+5, D+10</text><text x="264.0" y="766.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">segunda via com valor atualizado</text><text x="264.0" y="790.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">para com a baixa; pausa com acordo</text><text x="264.0" y="814.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">ou contestação registrados</text><rect x="84.0" y="518.0" width="42.0" height="26.0" rx="3" fill="#2e6b2d" stroke="none" stroke-width="0"/><text x="105.0" y="538.0" font-size="19" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text><line x1="130.0" y1="515.0" x2="250.0" y2="515.0" stroke="#2e6b2d" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="250.0" y="514.0" width="440.0" height="140.0" rx="6" fill="#e3efe0" stroke="#2e6b2d" stroke-width="2"/><text x="264.0" y="542.0" font-size="20" text-anchor="start" font-weight="bold" fill="#2e6b2d">2 · Equipe do financeiro</text><text x="264.0" y="570.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">telefonema no D+15</text><text x="264.0" y="594.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">acordo dentro da alçada</text><text x="264.0" y="618.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">registra a contestação</text><text x="264.0" y="642.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">atualiza o contato que voltou</text><rect x="134.0" y="346.0" width="42.0" height="26.0" rx="3" fill="#7a5600" stroke="none" stroke-width="0"/><text x="155.0" y="366.0" font-size="19" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text><line x1="180.0" y1="343.0" x2="250.0" y2="343.0" stroke="#7a5600" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="250.0" y="342.0" width="440.0" height="140.0" rx="6" fill="#fff3cd" stroke="#7a5600" stroke-width="2"/><text x="264.0" y="370.0" font-size="20" text-anchor="start" font-weight="bold" fill="#7a5600">3 · Gestor financeiro / diretoria</text><text x="264.0" y="398.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">acordo fora da alçada</text><text x="264.0" y="422.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">dispensa de multa ou juros</text><text x="264.0" y="446.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">propõe negativação ou protesto</text><text x="264.0" y="470.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">a partir do D+30</text><rect x="184.0" y="174.0" width="42.0" height="26.0" rx="3" fill="#9b2a1f" stroke="none" stroke-width="0"/><text x="205.0" y="194.0" font-size="19" text-anchor="middle" font-weight="bold" fill="#ffffff">4</text><line x1="230.0" y1="171.0" x2="250.0" y2="171.0" stroke="#9b2a1f" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="250.0" y="170.0" width="440.0" height="140.0" rx="6" fill="#fbe3e0" stroke="#9b2a1f" stroke-width="2"/><text x="264.0" y="198.0" font-size="20" text-anchor="start" font-weight="bold" fill="#9b2a1f">4 · Advogado</text><text x="264.0" y="226.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">texto dos avisos · multa e juros</text><text x="264.0" y="250.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">relação de consumo · LGPD</text><text x="264.0" y="274.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">notificação prévia · protesto</text><text x="264.0" y="298.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">cobrança judicial</text><rect x="30.0" y="866.0" width="660.0" height="96.0" rx="6" fill="#ffffff" stroke="#9b2a1f" stroke-width="2" stroke-dasharray="6 4"/><text x="48.0" y="898.0" font-size="19" text-anchor="start" font-weight="bold" fill="#9b2a1f">Negativação e protesto nunca saem de um agendamento:</text><text x="48.0" y="926.0" font-size="18" text-anchor="start" font-weight="normal" fill="#9b2a1f">saem de uma decisão registrada, com nome, data e</text><text x="48.0" y="950.0" font-size="18" text-anchor="start" font-weight="normal" fill="#9b2a1f">a orientação do advogado anexada.</text><text x="30.0" y="996.0" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55" font-style="italic">↑ efeito sobre o cliente cresce a cada degrau</text><text x="690.0" y="1040.0" font-size="18" text-anchor="end" font-weight="normal" fill="#4a4f55">Ilustração · Torno 2026</text></svg>