 x="597.0" y="881" font-size="18" text-anchor="middle" font-weight="bold" fill="#ffffff">01/02 · fatura</text><rect x="550" y="538" width="134" height="32" rx="4" fill="#ffffff" stroke="#9b2a1f" stroke-width="2"/><text x="617.0" y="561" font-size="18" text-anchor="middle" font-weight="bold" fill="#9b2a1f">16/06 plano</text><text x="30" y="924" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55">amarelo: a rotina calcula e envia o aviso · preto: fatura</text><text x="30" y="964" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">A: 3,56% → R$ 2.568,29</text><text x="30" y="994" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">B: −0,85% → mantém R$ 1.150,00 (regra do contrato)</text><text x="30" y="1024" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">C: 4,20% sobre R$ 4.600,00 → R$ 4.793,20</text><text x="30" y="1054" font-size="18" text-anchor="start" font-weight="normal" fill="#9b2a1f" font-style="italic">a troca de plano em junho não muda a data-base de C</text><text x="690" y="1100" font-size="18" text-anchor="end" font-weight="normal" fill="#4a4f55">Ilustração · Torno 2026</text></svg>