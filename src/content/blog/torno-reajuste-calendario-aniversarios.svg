<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1130" viewBox="0 0 720 1130" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Calendário de aniversários: três contratos, três janelas de índice</title><desc id="d1">Exemplo fictício. Calendário de 16 meses, de novembro de 2025 a fevereiro de 2027, com três contratos da Manutenção Exemplo Ltda. Contrato A, IPCA, mensalidade R$ 2.480,00, aniversário em 01/12: janela de 12 meses do índice de novembro de 2025 a outubro de 2026; cálculo e aviso em 16/11/2026; fatura reajustada em 01/12/2026; 3,56%, R$ 2.568,29. Contrato B, IGP-M, R$ 1.150,00, aniversário em 01/01: janela de dezembro de 2025 a novembro de 2026; cálculo e aviso em 15/12/2026; fatura de 01/01/2027; acumulado de −0,85%, valor mantido em R$ 1.150,00. Contrato C, IPCA, R$ 3.900,00, aniversário em 01/02: troca de plano em 16/06/2026 para R$ 4.600,00, sem mudar a data-base; janela de janeiro a dezembro de 2026; cálculo e aviso em 15/01/2027; fatura de 01/02/2027; 4,20% sobre R$ 4.600,00, R$ 4.793,20. Regra do exemplo: 12 meses terminados dois meses antes do aniversário. Taxas inventadas.</desc><rect x="0" y="0" width="720" height="1130" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14" y="14" width="692" height="1102" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30" y="58" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Um calendário, três aniversários</text><text x="30" y="90" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">Manutenção Exemplo Ltda. · regra: 12 meses até M−2</text><rect x="470" y="104" width="222" height="40" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581" y="132" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><text x="30" y="130" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55" font-style="italic">taxas inventadas, não são os índices publicados</text><rect x="130" y="160" width="182" height="84" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.5"/><text x="221.0" y="186" font-size="20" text-anchor="middle" font-weight="bold" fill="#1d1d1b">A · IPCA</text><text x="221.0" y="210" font-size="18" text-anchor="middle" font-weight="normal" fill="#1d1d1b">R$ 2.480,00</text><text x="221.0" y="234" font-size="18" text-anchor="middle" font-weight="normal" fill="#4a4f55">aniv. 01/12</text><rect x="318" y="160" width="182" height="84" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.5"/><text x="409.0" y="186" font-size="20" text-anchor="middle" font-weight="bold" fill="#1d1d1b">B · IGP-M</text><text x="409.0" y="210" font-size="18" text-anchor="middle" font-weight="normal" fill="#1d1d1b">R$ 1.150,00</text><text x="409.0" y="234" font-size="18" text-anchor="middle" font-weight="normal" fill="#4a4f55">aniv. 01/01</text><rect x="506" y="160" width="182" height="84" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.5"/><text x="597.0" y="186" font-size="20" text-anchor="middle" font-weight="bold" fill="#1d1d1b">C · IPCA</text><text x="597.0" y="210" font-size="18" text-anchor="middle" font-weight="normal" fill="#1d1d1b">R$ 3.900,00</text><text x="597.0" y="234" font-size="18" text-anchor="middle" font-weight="normal" fill="#4a4f55">aniv. 01/02</text><rect x="30" y="256" width="92" height="36" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="76" y="282" font-size="18" text-anchor="middle" font-weight="normal" fill="#1d1d1b">nov/25</text><line x1="30" y1="294" x2="690" y2="294" stroke="#d8d2c4" stroke-width="1"/><rect x="30" y="296" width="92" height="36" rx="0" fill="#ece7dc" stroke="none" stroke-width="0"/><text x="76" y="322" font-size="18" text-anchor="middle" font-weight="normal" fill="#1d1d1b">dez/25</text><line x1="30" y1="334" x2="690" y2="334" stroke="#d8d2c4" stroke-width="1"/><rect x="30" y="336" width="92" height="36" rx="0" fill="#ffffff" stroke="none" stroke