<svg xmlns="http://www.w3.org/2000/svg" width="720" height="938" viewBox="0 0 720 938" role="img" aria-label="Como ler o relatório"><rect width="720" height="938" fill="#f7f6f2"/><text x="36" y="55" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#1c5a49">TORNO · GUIA VISUAL</text><text x="36" y="116" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#16181a">Como ler o relatório</text><text x="36" y="164" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">Decida com evidências do cenário testado.</text><rect x="32" y="200" width="656" height="135" rx="14" fill="#fff" stroke="#b4c6bd" stroke-width="2"/><text x="52" y="240" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1c5a49">1 · Metas combinadas</text><text x="52" y="280" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">Compare o resultado com os critérios de</text><text x="52" y="313" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">aceitação acordados antes.</text><path d="M358 339 v12 m-6 -6 6 6 6 -6" fill="none" stroke="#1c5a49" stroke-width="3"/><rect x="32" y="355" width="656" height="135" rx="14" fill="#fff" stroke="#b4c6bd" stroke-width="2"/><text x="52" y="395" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1c5a49">2 · Erros e lentidão</text><text x="52" y="435" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">Leia falhas e percentis: a média pode</text><text x="52" y="468" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">ocultar respostas muito lentas.</text><path d="M358 494 v12 m-6 -6 6 6 6 -6" fill="none" stroke="#1c5a49" stroke-width="3"/><rect x="32" y="510" width="656" height="135" rx="14" fill="#fff" stroke="#b4c6bd" stroke-width="2"/><text x="52" y="550" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1c5a49">3 · Limites do ensaio</text><text x="52" y="590" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">Confira carga, duração, ambiente e</text><text x="52" y="623" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">dependências efetivamente testados.</text><path d="M358 649 v12 m-6 -6 6 6 6 -6" fill="none" stroke="#1c5a49" stroke-width="3"/><rect x="32" y="665" width="656" height="135" rx="14" fill="#fff" stroke="#b4c6bd" stroke-width="2"/><text x="52" y="705" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1c5a49">4 · Decisão e próximo teste</text><text x="52" y="745" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">Registre o que atende, o que falta corrigir</text><text x="52" y="778" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">e o que será reavaliado.</text><text x="36" y="902" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="600" fill="#1c5a49">O ensaio não garante todo uso futuro.</text></svg>