<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1268" viewBox="0 0 720 1268" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">O dia do técnico no mapa</title><desc id="d1">Exemplo fictício. Mapa de um bairro em grade, visto de cima, com o dia do técnico T1 da Exemplo Refrigeração e Climatização Ltda. na sexta-feira 04/12/2026, das 8h às 17h. Rota: base, às 8h; 40 minutos até a OS-0415, limpeza de contrato num condomínio, onde espera 15 minutos a portaria liberar e trabalha 90 minutos; 40 minutos até a OS-0416, visita de diagnóstico, 60 minutos, orçamento enviado e aguardando aprovação; almoço de 65 minutos; 30 minutos até a OS-0417, onde trabalha 150 minutos e colhe o aceite do cliente em 10 minutos; 40 minutos de volta à base, às 17h. Abaixo, uma régua do dia com os blocos coloridos e o total: trabalho 310 minutos, 65,26% do tempo fora do almoço; deslocamento 150 minutos, 31,58%; espera 15 minutos, 3,16%; almoço 65 minutos fora da conta. Nota: indicador definido, sem meta.</desc><rect x="0" y="0" width="720" height="1268" fill="#f6f3ec"/><rect x="14" y="14" width="692" height="1240" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="530" y="30" width="160" height="34" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="610" y="53" font-size="15" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="62" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">O dia do técnico no mapa</text><text x="30" y="96" font-size="18" text-anchor="start" fill="#6b6b66">Técnico T1 · sexta 04/12/2026 · 8h às 17h</text><text x="30" y="122" font-size="18" text-anchor="start" fill="#6b6b66">Deslocamento, espera e trabalho apontados na OS.</text><rect x="40" y="160" width="640" height="520" rx="6" fill="#ece6d8" stroke="#1d1d1b" stroke-width="2"/><line x1="120" y1="160" x2="120" y2="680" stroke="#ffffff" stroke-width="10"/><line x1="200" y1="160" x2="200" y2