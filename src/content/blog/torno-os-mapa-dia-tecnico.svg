idth="2"/><text x="280" y="615" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f4e79">40 min</text><rect x="92" y="584" width="56" height="52" rx="6" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="0"/><text x="120" y="617" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">BASE</text><circle cx="280" cy="250" r="24" fill="#2e7d32" stroke="#ffffff" stroke-width="4"/><text x="280" y="257" font-size="21" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text><circle cx="600" cy="340" r="24" fill="#b7791f" stroke="#ffffff" stroke-width="4"/><text x="600" y="347" font-size="21" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text><circle cx="440" cy="520" r="24" fill="#2e7d32" stroke="#ffffff" stroke-width="4"/><text x="440" y="527" font-size="21" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text><rect x="170" y="180" width="220" height="44" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/><text x="280" y="208" font-size="17" text-anchor="middle" font-weight="bold" fill="#2e7d32">1 · OS-0415 condomínio</text><rect x="470" y="270" width="200" height="44" rx="4" fill="#ffffff" stroke="#b7791f" stroke-width="2"/><text x="570" y="298" font-size="17" text-anchor="middle" font-weight="bold" fill="#b7791f">2 · OS-0416 visita</text><rect x="250" y="456" width="170" height="44" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/><text x="335" y="484" font-size="17" text-anchor="middle" font-weight="bold" fill="#2e7d32">3 · OS-0417</text><text x="30" y="716" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">Régua do dia (8h → 17h)</text><rect x="40.00" y="730" width="47.41" height="44" fill="#1f4e79" stroke="#ffffff" stroke-width="1.5" fill-opacity="0.55"/><rect x="87.41" y="730" width="17.78" height="44" fill="#b7791f" stroke="#ffffff" stroke-width="1.5"/><rect x="105.19" y="730" width="106.67" height="44" fill="#2e7d32" stroke="#ffffff" stroke-width="1.5"/><rect x="211.85" y="730" width="47.41" height="44" fill="#1f4e79" stroke="#ffffff" stroke-width="1.5" fill-opacity="0.55"/><rect x="259.26" y="730" width="71.11" height="44" fill="#2e7d32" stroke="#ffffff" stroke-width="1.5"/><rect x="330.37" y="730" width="77.04" height="44" fill="#bdb7aa" stroke="#ffffff" stroke-width="1.5"/><rect x="407.41" y="730" width="35.56" height="44" fill="#1f4e79" stroke="#ffffff" stroke-width="1.5" fill-opacity="0.55"/><rect x="442.96" y="730" width="189.63" height="44" fill="#2e7d32" stroke="#ffffff" stroke-width="1.5"/><rect x="632.59" y="730" width="47.41" height="44" fill="#1f4e79" stroke="#ffffff" stroke-width="1.5" fill-opacity="0.55"/><line x1="40.00" y1="774" x2="40.00" y2="784" stroke="#1d1d1b" stroke-width="1.5"/><text x="40.00" y="804" font-size="15" text-anchor="middle" fill="#6b6b66">8h</text><line x1="111.11" y1="774" x2="111.11" y2="784" stroke="#1d1d1b" stroke-width="1.5"/><text x="111.11" y="804" font-size="15" text-anchor="middle" fill="#6b6b66">9h</text><line x1="182.22" y1="774" x2="182.22" y2="784" stroke="#1d1d1b" stroke-width="1.5"/><text x="182.22" y="804" font-size="15" text-anchor="middle" fill="#6b6b66">10h</text><line x1="253.33" y1="774" x2="253.33" y2="784" stroke="#1d1d1b" stroke-width="1.5"/><text x="253.33" y="804" font-size="15" text-anchor="middle" fill="#6b6b66">11h</text><line x1="324.44" y1="774" x2="324.44" y2="784" stroke="#1d1d1b" stroke-width="1.5"/><text x="324.44" y="804" font-size="15" text-anchor="middle" fill="#6b6b66">12h</text><line x1="395.56" y1="774" x2="395.56" y2="784" stroke="#1d1d1b" stroke-width="1.5"/><text x="395.56" y="804" font-size="15" text-anchor="middle" fill="#6b6b66">13h</text><line x1="466.67" y1="774" x2="466.67" y2="784" stroke="#1d1d1b" stroke-width="1.5"/><text x="466.67" y="804" font-size="15" text-anchor="middle" fill="#6b6b66">14h</text><line x1="537.78" y1="774" x2="537.78" y2="784" stroke="#1d1d1b" stroke-width="1.5"/><text x="537.78" y="804" font-size="15" text-anchor="middle" fill="#6b6b66">15h</text><line x1="608.89" y1="774" x2="608.89" y2="784" stroke="#1d1d1b" stroke-width="1.5"/><text x="608.89" y="804" font-size="15" text-anchor="middle" fill="#6b6b66">16h</text><line x1="680.00" y1="774" x2="680.00" y2="784" stroke="#1d1d1b" stroke-width="1.5"/><text x="680.00" y="804" font-size="15" text-anchor="middle" fill="#6b6b66">17h</text><rect x="40" y="830" width="28" height="28" fill="#2e7d32"/><text x="82" y="850" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">Trabalho</text><text x="680" y="850" font-size="19" text-anchor="end" font-weight="bold" fill="#1d1d1b">65,26%</text><text x="82" y="876" font-size="17" text-anchor="start" fill="#6b6b66">90 + 60 + 150 + 10 (aceite) = 310 min</text><rect x="40" y="902" width="28" height="28" fill="#1f4e79" fill-opacity="0.55"/><text x="82" y="922" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">Deslocamento</text><text x="680" y="922" font-size="19" text-anchor="end" font-weight="bold" fill="#1d1d1b">31,58%</text><text x="82" y="948" font-size="17" text-anchor="start" fill="#6b6b66">40 + 40 + 30 + 40 = 150 min</text><rect x="40" y="974" width="28" height="28" fill="#b7791f"/><text x="82" y="994" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">Espera</text><text x="680" y="994" font-size="19" text-anchor="end" font-weight="bold" fill="#1d1d1b">3,16%</text><text x="82" y="1020" font-size="17" text-anchor="start" fill="#6b6b66">portaria da OS-0415: 15 min</text><rect x="40" y="1046" width="28" height="28" fill="#bdb7aa"/><text x="82" y="1066" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">Almoço</text><text x="680" y="1066" font-size="19" text-anchor="end" font-weight="bold" fill="#1d1d1b">—</text><text x="82" y="1092" font-size="17" text-anchor="start" fill="#6b6b66">65 min, fora da conta</text><line x1="40" y1="1114" x2="680" y2="1114" stroke="#1d1d1b" stroke-width="1.5"/><text x="40" y="1144" font-size="18" text-anchor="start" font-weight="bold" fill="#1d1d1b">Base de cálculo: 540 − 65 = 475 min.</text><text x="40" y="1174" font-size="17" text-anchor="start" fill="#6b6b66">Indicador definido, sem meta: o que entra em cada bloco</text><text x="40" y="1198" font-size="17" text-anchor="start" fill="#6b6b66">é regra escrita, não impressão do supervisor.</text><text x="30" y="1234" font-size="15" text-anchor="start" fill="#6b6b66">Exemplo fictício: empresa, cliente, valores e datas inventados.</text><text x="690" y="1234" font-size="15" text-anchor="end" fill="#6b6b66">Ilustração · Torno 2026</text></svg>