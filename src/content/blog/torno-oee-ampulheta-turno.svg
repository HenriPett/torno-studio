<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1720" viewBox="0 0 720 1720" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Ampulheta do turno: de 480 minutos a minutos de peça boa</title><desc id="d1">Exemplo fictício. Ampulheta do turno A da prensa P-07 da Metalúrgica Exemplo Ltda. 480 minutos de turno, das 06:00 às 14:00. Saem 50 minutos planejados: refeição 30 e preventiva 20; ficam 430 minutos de tempo planejado. Saem 80 minutos de paradas: setup 40, quebra 25 e falta de material 15; ficam 350 minutos operando. Saem 50 minutos de ritmo: microparadas 18 e velocidade reduzida 32; ficam 300 minutos em ritmo ideal, 600 peças a 30 segundos. Saem 18 minutos de qualidade: refugo 24 e retrabalho 12, 36 peças vezes 0,5 minuto; ficam 282 minutos de peça boa, 564 peças. Disponibilidade 350 ÷ 430 = 81,4%. Performance 300 ÷ 350 = 85,7%. Qualidade 564 ÷ 600 = 94,0%. OEE 282 ÷ 430 = 65,6%.</desc><rect x="0" y="0" width="720" height="1720" rx="0" fill="#f4efe6"/><text x="40" y="58" font-size="32" fill="#1d1d1b" font-weight="bold" text-anchor="start">Do turno à peça boa</text><rect x="450" y="30" width="230" height="38" rx="6" fill="#1d1d1b"/><text x="565" y="57" font-size="22" fill="#f4efe6" font-weight="bold" text-anchor="middle">EXEMPLO FICTÍCIO</text><text x="40" y="104" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Metalúrgica Exemplo Ltda. · prensa P-07 · turno A</text><rect x="20" y="124" width="680" height="26" rx="8" fill="#8a6a3e" stroke="#1d1d1b" stroke-width="3"/><rect x="20" y="1290" width="680" height="26" rx="8" fill="#8a6a3e" stroke="#1d1d1b" stroke-width="3"/><path d="M40 150 L40 740 L330 900 L330 930 M680 150 L680 740 L390 900 L390 930 M330 930 L330 960 L40 1120 L40 1290 M390 930 L390 960 L680 1120 L680 1290" fill="none" stroke="#1d1d1b" stroke-width="4" stroke-linejoin="round"/><rect x="60.0" y="170" width="600.0" height="54" rx="8" fill="#e9d9b8" stroke="#1d1d1b" stroke-width="3"/><text x="360" y="205" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">480 min · turno 06:00–14:00</text><rect x="91.2" y="310" width="537.5" height="54" rx="8" fill="#dfc79c" stroke="#1d1d1b" stroke-width="3"/><text x="360" y="345" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">430 min · tempo planejado</text><rect x="141.2" y="450" width="437.5" height="54" rx="8" fill="#d4b582" stroke="#1d1d1b" stroke-width="3"/><text x="360" y="485" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">350 min · operando</text><rect x="172.5" y="590" width="375.0" height="54" rx="8" fill="#c9a46a" stroke="#1d1d1b" stroke-width="3"/><text x="360" y="625" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">300 min · ritmo ideal</text><text x="360" y="676" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">300 min = 600 peças × 30 s</text><text x="360" y="258" font-size="22" fill="#a33a2a" font-weight="bold" text-anchor="middle">− 50 min planejados</text><text x="360" y="290" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="middle">refeição 30 · preventiva 20</text><text x="360" y="398" font-size="22" fill="#a33a2a" font-weight="bold" text-anchor="middle">− 80 min de paradas</text><text x="360" y="430" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="middle">setup 40 · quebra 25 · falta de material 15</text><text x="360" y="538" font-size="22" fill="#a33a2a" font-weight="bold" text-anchor="middle">− 50 min de ritmo</text><text x="360" y="570" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="middle">microparadas 18 · velocidade reduzida 32</text><text x="360" y="722" font-size="22" fill="#a33a2a" font-weight="bold" text-anchor="middle">− 18 min de qualidade</text><text x="360" y="754" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="middle">refugo 24 + retrabalho 12 = 36 pç × 0,5 min</text><path d="M360 830 L360 1110" stroke="#c9a46a" stroke-width="8" stroke-dasharray="14 10"/><text x="360" y="1150" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">564 peças boas de primeira</text><rect x="183.8" y="1200" width="352.5" height="60" rx="8" fill="#2f7d4f" stroke="#1d1d1b" stroke-width="3"/><text x="360" y="1238" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="middle">282 min de peça boa</text><rect x="40" y="1350" width="640" height="290" rx="8" fill="#fffdf7" stroke="#1d1d1b" stroke-width="3"/><text x="64" y="1398" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Disponibilidade</text><text x="330" y="1398" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">350 ÷ 430</text><text x="656" y="1398" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="end">81,4%</text><text x="64" y="1444" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Performance</text><text x="330" y="1444" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">300 ÷ 350</text><text x="656" y="1444" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="end">85,7%</text><text x="64" y="1490" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Qualidade</text><text x="330" y="1490" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">564 ÷ 600</text><text x="656" y="1490" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="end">94,0%</text><path d="M64 1512 L656 1512" stroke="#1d1d1b" stroke-width="2"/><text x="64" y="1554" font-size="30" fill="#1d1d1b" font-weight="bold" text-anchor="start">OEE</text><text x="330" y="1554" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">282 ÷ 430</text><text x="656" y="1554" font-size="30" fill="#2f7d4f" font-weight="bold" text-anchor="end">65,6%</text><text x="64" y="1598" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Minutos de peça boa ÷ minutos planejados</text><text x="40" y="1690" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Ilustração · Torno 2026</text></svg>