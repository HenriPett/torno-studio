<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1216" viewBox="0 0 720 1216" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Planta dos circuitos de cartões do suporte SE-40: 18 de produção, 3 e 2 de retirada</title><desc id="d1">Exemplo fictício. Planta baixa da Metalúrgica Exemplo Ltda.: prensa PR-03 e posto de cartões à esquerda, supermercado S-02 no centro, linhas LM-01 e LM-02 à direita. Circuito de produção PR-03–S-02: suporte SE-40, caixa de 60, 720 por dia, tempo de reposição 1,3 dia útil, 17,16 arredondado para 18 cartões. Retirada S-02–LM-01: 480 por dia, 4 horas, 2,2 para 3 cartões. Retirada S-02–LM-02: 240 por dia, 4 horas, 1,1 para 2 cartões. Regra: demanda × tempo × 1,10 ÷ 60, sempre para cima, mínimo 2. Estoque máximo do circuito de produção: 1.080 suportes, 1,5 dia.</desc><defs><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b30"/></marker></defs><rect x="0" y="0" width="720" height="1216" fill="#f6f3ec"/><rect x="14" y="14" width="692" height="1188" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30" y="58" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Suporte SE-40 · planta dos circuitos</text><text x="30" y="92" font-size="22" text-anchor="start" font-weight="normal" fill="#1d1d1b">Metalúrgica Exemplo Ltda. · plano de novembro</text><text x="30" y="136" font-size="22" text-anchor="start" font-weight="normal" fill="#4a4f55">vista de cima, sem escala</text><rect x="470" y="108" width="222" height="40" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581" y="136" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><rect x="30" y="166" wi