<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1400" viewBox="0 0 720 1400" role="img" aria-labelledby="title desc"><title id="title">Contrato de valores monetários</title><desc id="desc">Ficha editorial de moeda, unidade, precisão, etapa, regra de arredondamento e total. Não define uma política universal nem um produto financeiro.</desc><rect width="720" height="1400" fill="#f7f6f2"/>
<text x="36" y="55" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">TORNO · SIGNIFICADO E CÁLCULO</text>
<text x="36" y="118" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700">O total depende da regra</text>
<text x="36" y="164" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Combine o significado antes de conferir os valores.</text>
<rect x="32" y="210" width="656" height="174" rx="12" fill="#fff" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="253" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Moeda e unidade</text>
<text x="54" y="304" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Qual moeda é usada e em qual unidade</text>
<text x="54" y="345" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">o valor é recebido, calculado e enviado?</text>
<rect x="32" y="414" width="656" height="174" rx="12" fill="#eeece6" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="457" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Precisão</text>
<text x="54" y="508" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Quantas casas participam do cálculo?</text>
<text x="54" y="549" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Quais aparecem na exibição?</text>
<rect x="32" y="618" width="656" height="174" rx="12" fill="#fff" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="661" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Etapa</text>
<text x="54" y="712" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">O arredondamento ocorre por item,</text>
<text x="54" y="753" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">no subtotal ou em outro ponto definido?</text>
<rect x="32" y="822" width="656" height="174" rx="12" fill="#eeece6" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="865" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Regra</text>
<text x="54" y="916" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Como tratar os casos na fronteira</text>
<text x="54" y="957" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">e valores negativos, quando aplicáveis?</text>
<rect x="32" y="1026" width="656" height="174" rx="12" fill="#fff" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="1069" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Total e consistência</text>
<text x="54" y="1120" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Qual composição é esperada para o total?</text>
<text x="54" y="1161" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Tela, arquivo e integração seguem o acordo?</text>
<text x="36" y="1280" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">Formatar a tela não define todo o cálculo.</text>
<text x="36" y="1350" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Proposta editorial · adapte ao sistema.</text>
</svg>
