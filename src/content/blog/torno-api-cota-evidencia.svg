<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1140" viewBox="0 0 720 1140" role="img" aria-labelledby="title desc"><title id="title">Que evidência pedir no ensaio</title><desc id="desc">Ficha editorial para conferir uma condição de limite, pendências, retomada e resultado sem tratar o desenho como arquitetura real.</desc><rect width="720" height="1140" fill="#f7f6f2"/>
<text x="36" y="55" fill="#1c5a49" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">TORNO · EVIDÊNCIA PARA O ACEITE</text>
<text x="36" y="118" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700">Mostre o que foi conferido</text>
<text x="36" y="164" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Combine um ensaio autorizado e seus limites.</text>
<rect x="32" y="210" width="656" height="160" rx="12" fill="#fff" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="252" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Condição e contexto</text>
<text x="54" y="298" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Identifique versão, ambiente e provedor.</text>
<text x="54" y="337" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Diga como o limite foi exercitado.</text>
<rect x="32" y="400" width="656" height="160" rx="12" fill="#fff" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="442" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Espera e visibilidade</text>
<text x="54" y="488" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Mostre o estado da operação pendente</text>
<text x="54" y="527" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">e o encaminhamento ao responsável.</text>
<rect x="32" y="590" width="656" height="160" rx="12" fill="#fff" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="632" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Retomada e resultado</text>
<text x="54" y="678" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Confira o que foi concluído ou permaneceu</text>
<text x="54" y="717" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">pendente e se houve efeito repetido.</text>
<rect x="32" y="780" width="656" height="160" rx="12" fill="#fff" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="822" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Alcance da conclusão</text>
<text x="54" y="868" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Separe resposta simulada de teste real.</text>
<text x="54" y="907" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Registre o que não foi demonstrado.</text>
<text x="36" y="1030" fill="#1c5a49" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">Peça evidência do comportamento combinado.</text>
<text x="36" y="1100" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Proposta editorial · adapte ao produto.</text>
</svg>
