t x="281" y="493" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#3f7064">chave de acesso guardada</text></g><circle cx="62" cy="650" r="19" fill="#1e2837"/><text x="62" y="658" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">3</text><g filter="url(#ink)" transform="rotate(-7 281 650)"><rect x="96" y="568" width="370" height="164" rx="10" fill="none" stroke="#9b4f45" stroke-width="5"/><rect x="104" y="576" width="354" height="148" rx="5" fill="none" stroke="#9b4f45" stroke-width="2"/></g><g transform="rotate(-7 281 650)"><text x="281" y="611" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#9b4f45">SUBSTITUÍDA</text><text x="281" y="643" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#9b4f45">evento de cancelamento</text><text x="281" y="673" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#9b4f45">por substituição</text><text x="281" y="703" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#9b4f45">07/10/2026</text></g><path d="M257 826 L257 906" fill="none" stroke="#1e2837" stroke-width="7" stroke-linecap="round"/><path d="M237 896 L257 924 L277 896 Z" fill="#1e2837" stroke="#1e2837" stroke-width="3" stroke-linejoin="round"/><g transform="rotate(1.2 257 1020)"><rect x="29" y="952" width="466" height="340" rx="6" fill="#1e2837" opacity=".16"/><rect x="24" y="946" width="466" height="340" rx="6" fill="#fffdf8" stroke="#8a8f94" stroke-width="2.5"/><text x="48" y="990" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">NFS-e substituta</text><line x1="48" y1="1006" x2="466" y2="1006" stroke="#b9b6aa" stroke-width="2"/><text x="48" y="1038" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">DPS série 1, nº 1043</text></g><circle cx="62" cy="1150" r="19" fill="#1e2837"/><text x="62" y="1158" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">4</text><g filter="url(#ink)"><rect x="96" y="1080" width="370" height="140" rx="10" fill="none" stroke="#5e5a7e" stroke-width="5"/><rect x="104" y="1088" width="354" height="124" rx="5" fill="none" stroke="#5e5a7e" stroke-width="2"/></g><g><text x="281" y="1126" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#5e5a7e">MANIFESTAÇÃO</text><text x="281" y="1158" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#5e5a7e">DO TOMADOR</text><text x="281" y="1188" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#5e5a7e">confirmação · 09/10/2026</text></g><path d="M502 272 Q516 272 516 286 L516 664 Q516 678 528 678 Q516 678 516 692 L516 1196 Q516 1220 502 1220" fill="none" stroke="#536270" stroke-width="3.5" stroke-linecap="round"/><g transform="rotate(-2 617 678)"><rect x="534" y="590" width="166" height="176" rx="6" fill="#efe6c8" stroke="#b8ab7e" stroke-width="2.5"/><text x="544" y="626" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" font-style="italic" fill="#3b3a35">Cada</text><text x="544" y="656" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" font-style="italic" fill="#3b3a35">carimbo:</text><text x="544" y="686" font-family="Arial,Helvetica,sans-serif" font-size="22" font-style="italic" fill="#3b3a35">XML guardado,</text><text x="544" y="716" font-family="Arial,Helvetica,sans-serif" font-size="22" font-style="italic" fill="#3b3a35">data e hora,</text><text x="544" y="746" font-family="Arial,Helvetica,sans-serif" font-size="22" font-style="italic" fill="#3b3a35">quem pediu</text></g><text x="32" y="1340" font-family="Arial,Helvetica,sans-serif" font-size="2