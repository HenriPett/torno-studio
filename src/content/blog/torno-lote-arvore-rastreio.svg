<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc"><title id="title">De onde veio e para onde foi o lote L26290</title><desc id="desc">Árvore horizontal de rastreabilidade do lote fictício L26290: no centro, o tronco Lote L26290 · MT-340 · fabricação 18/08/2026 · validade 17/08/2027 · 480 caixas recebidas; à esquerda, para trás, a raiz com a nota de entrada 4410 de 01/09/2026 e o fornecedor Conservas Exemplo Ltda; à direita, para frente, galhos com espessura proporcional à quantidade para Mercado Alfa 120 caixas, Padaria Central 96 e Restaurante Exemplo 60, expedidas, 276 no total; um galho tracejado com 24 caixas separadas para pedido ainda não expedido, a retirar; e um galho hachurado com 180 caixas na prateleira, em quarentena. No pé, a conta 276 + 24 + 180 = 480 caixas e o selo A soma fecha com o recebido. Marcado Exemplo fictício.</desc><rect width="720" height="1280" rx="24" fill="#f4f2eb"/><text x="32" y="52" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1e2837">De onde veio e para onde foi o lote L26290</text><rect x="472" y="66" width="216" height="40" rx="20" fill="#fffdf8" stroke="#536270" stroke-width="2.5"/><text x="580" y="94" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#536270" text-anchor="middle">Exemplo fictício</text><defs><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fffdf8"/><rect width="3.5" height="8" fill="#536270"/></pattern></defs><text x="24" y="152" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#536270">Para trás:</text><text x="24" y="180" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#536270">quem entregou</text><text x="452" y="152" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#536270">Para frente:</text>