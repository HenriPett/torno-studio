 cx · expedido</text><path d="M400 640.6H412Q442 640.6 442 610.6V520Q442 490 472 490H640" fill="none" stroke="#426d6b" stroke-width="6" stroke-linejoin="round"/><text x="452" y="446" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#1e2837">Restaurante Exemplo</text><text x="452" y="472" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">60 cx · expedido</text><path d="M668 300H684V490H668" fill="none" stroke="#426d6b" stroke-width="3.5" stroke-linejoin="round"/><path d="M684 395H694" stroke="#426d6b" stroke-width="3.5"/><text x="688" y="540" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#426d6b" text-anchor="end">Expedidas: 276 cx</text><path d="M400 644.8H410Q440 644.8 440 674.8V670Q440 700 470 700H640" fill="none" stroke="#536270" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="452" y="734" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e2837">24 cx separadas</text><text x="452" y="762" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#1e2837">pedido ainda não</text><text x="452" y="790" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#1e2837">expedido → retirar</text><path d="M400 655H394Q424 655 424 685V850Q424 880 454 880H540" fill="none" stroke="#536270" stroke-width="18" stroke-linejoin="round"/><path d="M400 655H394Q424 655 424 685V850Q424 880 454 880H540" fill="none" stroke="url(#h)" stroke-width="13" stroke-linejoin="round"/><rect x="540" y="856" width="148" height="48" rx="6" fill="url(#h)" stroke="#536270" stroke-width="3"/><text x="452" y="938" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e2837">180 cx na prateleira</text><text x="452" y="966" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#1e2837">→ quarentena</text><rect x="190" y="550" width="210" height="180" rx="14" fill="#fffdf8" stroke="#426d6b" stroke-width="4"/><text x="295" y="590" font-