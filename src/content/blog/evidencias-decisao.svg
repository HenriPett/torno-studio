<svg xmlns="http://www.w3.org/2000/svg" width="360" height="674" viewBox="0 0 360 674" role="img" aria-labelledby="title desc"><title id="title">Da dúvida à decisão antes de refazer um sistema</title><desc id="desc">Quatro etapas: reproduzir o fluxo, delimitar dependências, testar recuperação e comparar alternativas. Evidência ausente permanece uma pergunta aberta.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#27443d" stroke-width="1.5"/></marker></defs><rect width="360" height="674" fill="#f6f3eb"/><g font-family="DejaVu Sans, sans-serif" fill="#18372f"><text x="20" y="32" font-size="13" font-weight="700">ANTES DE REFAZER</text><text x="20" y="63" font-size="24" font-weight="700">Da dúvida à decisão</text><rect x="20" y="88" width="320" height="104" rx="12" fill="#ffffff" stroke="#b7c9bd"/><text x="36" y="116" font-size="18" font-weight="700">1  Reproduzir</text><text x="36" y="143" font-size="16">Versão, ambiente e fluxo</text><text x="36" y="166" font-size="16">observado com autorização</text><path d="M180,196 V214" fill="none" stroke="#27443d" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="220" width="320" height="104" rx="12" fill="#ffffff" stroke="#b7c9bd"/><text x="36" y="248" font-size="18" font-weight="700">2  Delimitar</text><text x="36" y="275" font-size="16">Regra afetada, dependências</text><text x="36" y="298" font-size="16">e limites ainda desconhecidos</text><path d="M180,328 V346" fill="none" stroke="#27443d" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="352" width="320" height="104" rx="12" fill="#ffffff" stroke="#b7c9bd"/><text x="36" y="380" font-size="18" font-weight="700">3  Recuperar</text><text x="36" y="407" font-size="16">Restauração verificada</text><text x="36" y="430" font-size="16">e condições de reversão</text><path d="M180,460 V478" fill="none" stroke="#27443d" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="484" width="320" height="104" rx="12" fill="#ffffff" stroke="#b7c9bd"/><text x="36" y="512" font-size="18" font-weight="700">4  Comparar</text><text x="36" y="539" font-size="16">Caminhos, premissas e</text><text x="36" y="562" font-size="16">próxima entrega verificável</text><text x="20" y="620" font-size="15" font-weight="700">Evidência ausente = pergunta aberta</text><text x="20" y="650" font-size="15">Torno Studio • Diagrama original</text></g></svg>
