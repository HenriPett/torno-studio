<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1290" viewBox="0 0 720 1290" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">A pilha de peneiras: em que ordem as regras de preço passam</title><desc id="d1">Exemplo fictício: Detergente 5 L, 60 unidades, para a Mercearia Ponte Alta em 12/11/2026. Tabela geral R$ 40,00 não vale porque o cliente tem tabela própria, Revenda B versão 3, R$ 36,00. Faixa de 50 unidades ou mais, menos 5 por cento, dá R$ 34,20; a promoção de 10 a 20/11, R$ 35,00, não acumula com a faixa e fica o menor, R$ 34,20. Desconto manual de 3 por cento, dentro do limite do vendedor, dá R$ 33,174. Pix à vista, menos 2 por cento, dá R$ 32,51052. Arredondamento do unitário em 2 casas: R$ 32,51; 60 unidades, total R$ 1.950,60. Torno Studio 2026.</desc><rect x="0" y="0" width="720" height="1290" fill="#f4efe6"/><text x="40" y="58" font-size="32" fill="#1d1d1b" font-weight="bold" text-anchor="start">A pilha de peneiras</text><text x="40" y="98" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Detergente 5 L · 60 un · 12/11/2026</text><text x="40" y="130" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Cliente: Mercearia Ponte Alta</text><rect x="450" y="76" width="230" height="38" rx="6" fill="#1d1d1b"/><text x="565" y="103" font-size="22" fill="#f4efe6" font-weight="bold" text-anchor="middle">EXEMPLO FICTÍCIO</text><path d="M40 160 L680 160 L650 252 L70 252 Z" fill="#d9cfbf" stroke="#5c564c" stroke-width="3" stroke-dasharray="10 8"/><text x="96" y="198" font-size="22" fill="#5c564c" font-weight="bold" text-anchor="start">0 · Tabela geral</text><text x="96" y="232" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">só se o cliente não tem tabela</text><rect x="480" y="178" width="168" height="56" rx="28" fill="#fffdf7" stroke="#5c564c" stroke-width="2"/><text x="564" y="215" font-size="22" fill="#5c564c" font-weight="bold" text-anchor="mi