<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1500" viewBox="0 0 720 1500" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Árvore de revisões de um documento</title><desc id="d1">Exemplo fictício. Árvore de revisões da IT-USI-014, instrução de trabalho de torneamento da haste H-20, da Exemplo Instrumentais Cirúrgicos Ltda. Rev. 00: aprovada em 12/03/2025, vigente de 17/03/2025 a 10/08/2025, obsoleta, retida e bloqueada até 08/08/2030. Rev. 01: aprovada em 04/08/2025, vigente de 11/08/2025 a 30/11/2026, obsoleta, retida e bloqueada até 04/12/2031. Motivo da revisão 02: RNC-2026-118, de 03/11/2026, rebarba na haste. Documento externo: desenho do cliente DES-CLI-4471, revisão C substituída pela revisão D, recebida em 13/11/2026. Ramo encerrado: rascunho 02-A, elaborado em 10/11/2026 por Tiago S., recusado na verificação em 16/11/2026 por Renata M. porque usa a cota da revisão C do desenho; fica no histórico e não vira revisão. Rascunho 02-B: elaborado em 18/11/2026, verificado em 23/11/2026 por Renata M., aprovado em 25/11/2026 por Marcos A. Rev. 02: vigente desde 01/12/2026; treinamento de 5 de 6 operadores até 30/11; Wagner L., em férias, treinado em 07/12 antes de operar. Só uma revisão vigente por vez; as obsoletas ficam retidas e bloqueadas; o rascunho recusado não vira revisão.</desc><rect x="0" y="0" width="720" height="1500" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="10" y="10" width="700" height="1480" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="450" y="24" width="246" height="46" rx="4" fill="#fff" stroke="#b3261e" stroke-width="2"/><text x="573" y="56" font-size="22" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="118" font-size="30" text-anchor="start" font-weight="bold" fill="#1d1d1b">Árvore de revisões de um documento</text><text x="30" y="154" font-size="20" text-anchor="start" fill="#5a5a55">IT-USI-014 · torneamento da haste H-20</text><text x="30" y="180" font-size="18" text-anchor="start" fill="#5a5a55">Exemplo Instrumentais Cirúrgicos Ltda.</text><rect x="110" y="210" width="500" height="160" rx="10" fill="#ecebe6" stroke="#8a8780" stroke-width="2.5"/><text x="128" y="242" font-size="21" text-anchor="start" font-weight="bold" fill="#5a5a55">Rev. 00</text><path d="M 576 230 L 576 224 Q 582 214 588 224 L 588 230" fill="none" stroke="#b3261e" stroke-width="3"/><rect x="572" y="230" width="20" height="16" rx="3" fill="#b3261e" stroke="#b3261e" stroke-width="0"/><text x="128" y="272" font-size="17" text-anchor="start" fill="#1d1d1b">aprovada qua 12/03/2025</text><text x="128" y="297" font-size="17" text-anchor="start" fill="#1d1d1b">vigente de 17/03/2025 a 10/08/2025</text><text x="128" y="322" font-size="17" text-anchor="start" fill="#1d1d1b">obsoleta: retida e bloqueada</text><text x="128" y="347" font-size="17" text-anchor="start" fill="#1d1d1b">até qui 08/08/2030</text><line x1="360" y1="370" x2="360" y2="410" stroke="#8a8780" stroke-width="3"/><rect x="110" y="410" width="500" height="160" rx="10" fill="#ecebe6" stroke="#8a8780" stroke-width="2.5"/><text x="128" y="442" font-size="21" text-anchor="start" font-weight="bold" fill="#5a5a55">Rev. 01</text><path d="M 576 430 L 576 424 Q 582 414 588 424 L 588 430" fill="none" stroke="#b3261e" stroke-width="3"/><rect x="572" y="430" width="20" height="16" rx="3" fill="#b3261e" stroke="#b3261e" stroke-width="0"/><text x="128" y="472" font-size="17" text-anchor="start" fill="#1d1d1b">aprovada seg 04/08/2025</text><text x="128" y="497" font-size="17" text-anchor="start" fill="#1d1d1b">vigente de 11/08/2025 a 30/11/2026</text><text x="128" y="522" font-size="17" text-anchor="start" fill="#1d1d1b">obsoleta: retida e bloqueada</text><text x="128" y="547" font-size="17" text-anchor="start" fill="#1d1d1b">até qui 04/12/2031</text><rect x="110" y="606" width="500" height="62" rx="8" fill="#fbe9e7" stroke="#b3261e" stroke-width="2"/><text x="130" y="632" font-size="17" text-anchor="start" font-weight="bold" fill="#b3261e">Motivo: RNC-2026-118, ter 03/11/2026</text><text x="130" y="656" font-size="17" text-anchor="start" fill="#1d1d1b">rebarba na haste: nova pastilha e novo avanço</text><line x1="360" y1="570" x2="360" y2="606" stroke="#8a8780" stroke-width="3"/><path d="M 360 668 L 360 700 L 190 700 L 190 740" fill="none" stroke="#8a8780" stroke-width="3" stroke-dasharray="8 6"/><path d="M 360 700 L 530 700 L 530 740" fill="none" stroke="#1f4e79" stroke-width="3"/><rect x="30" y="740" width="320" height="300" rx="10" fill="#f3f1ea" stroke="#8a8780" stroke-width="2.5" stroke-dasharray="8 6"/><text x="48" y="772" font-size="21" text-anchor="start" font-weight="bold" fill="#5a5a55">Rascunho 02-A</text><text x="48" y="802" font-size="17" text-anchor="start" fill="#1d1d1b">ter 10/11: Tiago S.</text><text x="48" y="827" font-size="17" text-anchor="start" fill="#1d1d1b">seg 16/11: recusado</text><text x="48" y="852" font-size="17" text-anchor="start" fill="#1d1d1b">na verificação</text><text x="48" y="877" font-size="17" text-anchor="start" fill="#1d1d1b">(Renata M.):</text><text x="48" y="902" font-size="17" text-anchor="start" fill="#1d1d1b">usa a cota da rev. C</text><text x="48" y="927" font-size="17" text-anchor="start" fill="#1d1d1b">do desenho do cliente</text><text x="48" y="952" font-size="17" text-anchor="start" fill="#1d1d1b">ramo encerrado: fica no</text><text x="48" y="977" font-size="17" text-anchor="start" fill="#1d1d1b">histórico, não vira revisão</text><line x1="300" y1="752" x2="336" y2="788" stroke="#b3261e" stroke-width="4"/><line x1="336" y1="752" x2="300" y2="788" stroke="#b3261e" stroke-width="4"/><rect x="370" y="740" width="320" height="300" rx="10" fill="#fff" stroke="#1f4e79" stroke-width="2.5"/><text x="388" y="772" font-size="21" text-anchor="start" font-weight="bold" fill="#1f4e79">Rascunho 02-B</text><text x="388" y="802" font-size="17" text-anchor="start" fill="#1d1d1b">qua 18/11: Tiago S.</text><text x="388" y="827" font-size="17" text-anchor="start" fill="#1d1d1b">seg 23/11: verificado</text><text x="388" y="852" font-size="17" text-anchor="start" fill="#1d1d1b">(Renata M.)</text><text x="388" y="877" font-size="17" text-anchor="start" fill="#1d1d1b">qua 25/11: aprovado</text><text x="388" y="902" font-size="17" text-anchor="start" fill="#1d1d1b">(Marcos A.)</text><text x="388" y="927" font-size="17" text-anchor="start" fill="#1d1d1b">vigência: ter 01/12</text><line x1="530" y1="1040" x2="530" y2="1110" stroke="#1f4e79" stroke-width="3"/><path d="M 530 1110 L 525.3 1098.9 L 534.7 1098.9 Z" fill="#1f4e79" stroke="none"/><rect x="30" y="1100" width="320" height="150" rx="8" fill="#fff8e1" stroke="#a66f00" stroke-width="2"/><text x="48" y="1130" font-size="18" text-anchor="start" font-weight="bold" fill="#a66f00">Documento externo</text><text x="48" y="1158" font-size="17" text-anchor="start" fill="#1d1d1b">DES-CLI-4471 (cliente)</text><text x="48" y="1183" font-size="17" text-anchor="start" fill="#1d1d1b">rev. C → rev. D</text><text x="48" y="1208" font-size="17" text-anchor="start" fill="#1d1d1b">recebida sex 13/11/2026</text><line x1="190" y1="1100" x2="190" y2="1044" stroke="#a66f00" stroke-width="2"/><path d="M 190 1044 L 194.7 1055.1 L 185.3 1055.1 Z" fill="#a66f00" stroke="none"/><line x1="350" y1="1175" x2="368" y2="1175" stroke="#a66f00" stroke-width="2"/><path d="M 368 1175 L 356.9 1179.7 L 356.9 1170.3 Z" fill="#a66f00" stroke="none"/><rect x="370" y="1110" width="320" height="200" rx="10" fill="#dcefdc" stroke="#2e7d32" stroke-width="3"/><text x="388" y="1144" font-size="21" text-anchor="start" font-weight="bold" fill="#2e7d32">Rev. 02 · VIGENTE</text><text x="388" y="1174" font-size="17" text-anchor="start" fill="#1d1d1b">desde ter 01/12/2026</text><text x="388" y="1199" font-size="17" text-anchor="start" fill="#1d1d1b">treinados até seg 30/11:</text><text x="388" y="1224" font-size="17" text-anchor="start" fill="#1d1d1b">5 de 6 operadores</text><text x="388" y="1249" font-size="17" text-anchor="start" fill="#1d1d1b">Wagner L. (férias):</text><text x="388" y="1274" font-size="17" text-anchor="start" fill="#1d1d1b">treinado seg 07/12, antes de operar</text><rect x="30" y="1340" width="24" height="18" rx="3" fill="#dcefdc" stroke="#2e7d32" stroke-width="2"/><text x="64" y="1355" font-size="17" text-anchor="start" fill="#1d1d1b">vigente: uma por vez</text><rect x="370" y="1340" width="24" height="18" rx="3" fill="#ecebe6" stroke="#8a8780" stroke-width="2"/><text x="404" y="1355" font-size="17" text-anchor="start" fill="#1d1d1b">obsoleta, retida e bloqueada</text><rect x="30" y="1374" width="24" height="18" rx="3" fill="#f3f1ea" stroke="#8a8780" stroke-width="2" stroke-dasharray="5 4"/><text x="64" y="1389" font-size="17" text-anchor="start" fill="#1d1d1b">rascunho recusado</text><path d="M 372 1380 L 372 1374 Q 378 1364 384 1374 L 384 1380" fill="none" stroke="#b3261e" stroke-width="3"/><rect x="368" y="1380" width="20" height="16" rx="3" fill="#b3261e" stroke="#b3261e" stroke-width="0"/><text x="404" y="1389" font-size="17" text-anchor="start" fill="#1d1d1b">só a qualidade abre, em leitura</text><text x="30" y="1444" font-size="18" text-anchor="start" fill="#5a5a55">Só uma revisão vigente por vez; as obsoletas ficam retidas</text><text x="30" y="1470" font-size="18" text-anchor="start" fill="#5a5a55">e bloqueadas; o rascunho recusado não vira revisão.</text><text x="690" y="1470" font-size="18" text-anchor="end" fill="#5a5a55">Ilustração · Torno 2026</text></svg>