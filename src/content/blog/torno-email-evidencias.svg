<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1220" viewBox="0 0 720 1220" role="img" aria-labelledby="title desc"><title id="title">Ficha para aceitar e-mails do sistema</title><desc id="desc">Modelo editorial com evento, mensagem e destino controlado, estado e evidência, responsável e ação, alcance do teste e pendências.</desc><rect width="720" height="1220" fill="#f7f6f2"/>
<text x="36" y="55" fill="#1c5a49" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">TORNO · EVIDÊNCIA PARA O ACEITE</text>
<text x="36" y="118" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700">O que o ensaio demonstrou?</text>
<text x="36" y="164" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Use destinatários controlados e dados de teste.</text>
<rect x="32" y="210" width="656" height="154" rx="12" fill="#fff" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="250" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Evento e mensagem</text>
<text x="54" y="294" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Qual evento gera a mensagem e como</text>
<text x="54" y="334" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">relacionar os dois sem expor dados?</text>
<rect x="32" y="390" width="656" height="154" rx="12" fill="#eeece6" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="430" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Destino controlado</text>
<text x="54" y="474" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Qual endereço de teste está autorizado?</text>
<text x="54" y="514" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Quem pode conferir o resultado?</text>
<rect x="32" y="570" width="656" height="154" rx="12" fill="#fff" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="610" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Estado e evidência</text>
<text x="54" y="654" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Qual estado foi observado e qual referência</text>
<text x="54" y="694" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">permite localizar o evento no provedor?</text>
<rect x="32" y="750" width="656" height="154" rx="12" fill="#eeece6" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="790" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Responsável e ação</text>
<text x="54" y="834" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Quem acompanha atrasos ou falhas?</text>
<text x="54" y="874" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Qual encaminhamento foi combinado?</text>
<rect x="32" y="930" width="656" height="154" rx="12" fill="#fff" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="970" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Limites e pendências</text>
<text x="54" y="1014" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Quais etapas foram simuladas ou não vistas?</text>
<text x="54" y="1054" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Que evidência falta para a conclusão?</text>
<text x="36" y="1170" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Proposta editorial · sem endereços reais.</text>
</svg>
