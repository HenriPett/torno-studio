<svg xmlns="http://www.w3.org/2000/svg" width="720" height="814" aria-labelledby="title desc" role="img" viewBox="0 0 720 814"><title id="title">Duas entregas, qual efeito?</title><desc id="desc">Exemplo fictício para combinar o aceite.</desc><rect width="720" height="814" fill="#f7f6f2"/><text x="36" y="55" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">TORNO · GUIA VISUAL</text><text x="36" y="116" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="700">Duas entregas, qual efeito?</text><text x="36" y="166" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Exemplo fictício para combinar o aceite.</text><rect width="656" height="132" x="32" y="205" fill="#fff" stroke="#b4c6bd" stroke-width="2" rx="14"/><text x="52" y="243" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Primeira entrega: aprovação A</text><text x="52" y="282" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Resultado esperado: criar uma tarefa</text><text x="52" y="315" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">para essa aprovação.</text><path fill="none" stroke="#1c5a49" stroke-width="3" d="M360 341 v12 m-7 -7 7 7 7 -7"/><rect width="656" height="132" x="32" y="358" fill="#fff" stroke="#b4c6bd" stroke-width="2" rx="14"/><text x="52" y="396" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Reentrega da mesma aprovação A</text><text x="52" y="435" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Reconhecer a repetição e conferir</text><text x="52" y="468" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">que a tarefa não foi criada de novo.</text><path fill="none" stroke="#1c5a49" stroke-width="3" d="M360 494 v12 m-7 -7 7 7 7 -7"/><rect width="656" height="132" x="32" y="511" fill="#fff" stroke="#b4c6bd" stroke-width="2" rx="14"/><text x="52" y="549" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Nova mudança no mesmo objeto</text><text x="52" y="588" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Aplicar a regra da nova atualização;</text><text x="52" y="621" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">não descartá-la só pelo ID do objeto.</text><text x="36" y="679" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="600">Confira também os efeitos externos.</text><text x="36" y="711" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="600">Repetição e ordem são requisitos distintos.</text></svg>