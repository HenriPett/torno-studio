<svg xmlns="http://www.w3.org/2000/svg" width="720" height="814" viewBox="0 0 720 814" role="img" aria-labelledby="title desc"><title id="title">Duas entregas, qual efeito?</title><desc id="desc">Exemplo fictício para combinar o aceite.</desc><rect width="720" height="814" fill="#f7f6f2"/><text x="36" y="55" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#1c5a49">TORNO · GUIA VISUAL</text><text x="36" y="116" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="700" fill="#16181a">Duas entregas, qual efeito?</text><text x="36" y="166" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">Exemplo fictício para combinar o aceite.</text><rect x="32" y="205" width="656" height="132" rx="14" fill="white" stroke="#b4c6bd" stroke-width="2"/><text x="52" y="243" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1c5a49">Primeira entrega: aprovação A</text><text x="52" y="282" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">Resultado esperado: criar uma tarefa</text><text x="52" y="315" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">para essa aprovação.</text><path d="M360 341 v12 m-7 -7 7 7 7 -7" stroke="#1c5a49" stroke-width="3" fill="none"/><rect x="32" y="358" width="656" height="132" rx="14" fill="white" stroke="#b4c6bd" stroke-width="2"/><text x="52" y="396" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1c5a49">Reentrega da mesma aprovação A</text><text x="52" y="435" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">Reconhecer a repetição e conferir</text><text x="52" y="468" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">que a tarefa não foi criada de novo.</text><path d="M360 494 v12 m-7 -7 7 7 7 -7" stroke="#1c5a49" stroke-width="3" fill="none"/><rect x="32" y="511" width="656" height="132" rx="14" fill="white" stroke="#b4c6bd" stroke-width="2"/><text x="52" y="549" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1c5a49">Nova mudança no mesmo objeto</text><text x="52" y="588" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">Aplicar a regra da nova atualização;</text><text x="52" y="621" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">não descartá-la só pelo ID do objeto.</text><text x="36" y="679" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="600" fill="#1c5a49">Confira também os efeitos externos.</text><text x="36" y="711" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="600" fill="#1c5a49">Repetição e ordem são requisitos distintos.</text></svg>