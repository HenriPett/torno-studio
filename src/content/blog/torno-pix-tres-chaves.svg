<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1160" viewBox="0 0 720 1160" role="img" aria-labelledby="title desc"><title id="title">Chaveiro com idRec, txid e endToEndId de uma parcela (exemplo fictício)</title><desc id="desc">Chaveiro fictício com três etiquetas presas no mesmo aro: etiqueta grande “idRec — contrato C-0312, mensalidade, valor variável, novas tentativas: sim”; etiqueta média “txid — parcela dez/2026, R$ 980,00, vencimento 10/12”; duas etiquetas pequenas penduradas no txid, “endToEndId 1 — tentativa 10/12, sem saldo” e “endToEndId 2 — tentativa 14/12, liquidado”.</desc><rect width="720" height="1160" rx="24" fill="#f4f2eb"/><text x="360" y="50" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#1e2837" text-anchor="middle">Três chaves de uma parcela</text><circle cx="360" cy="112" r="38" fill="none" stroke="#536270" stroke-width="9"/><path d="M360 150C360 173 360 173 360 196" fill="none" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/><path d="M360 478C360 508 360 508 360 538" fill="none" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/><path d="M360 770C360 810 205 810 205 850" fill="none" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/><path d="M360 770C360 810 515 810 515 850" fill="none" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/><path d="M116 190H604L630 216V478H90V216Z" fill="#fffdf8" stroke="#536270" stroke-width="2.5" stroke-linejoin="round"/><path d="M91.5 272V216L116 191.5H604L628.5 216V272Z" fill="#426d6b"/><circle cx="360" cy="212" r="9" fill="#f4f2eb" stroke="#536270" stroke-width="2.5"/><text x="360" y="254" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">idRec</text><text x="120" y="306" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1e2837">Contrato C-0312</text><text x="120" y="344" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#1e2837">Mensalidade · valor variável</text><text x="120" y="380" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#1e2837">Novas tentativas: sim</text><text x="120" y="440" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270" font-style="italic">aponta o contrato</text><path d="M156 532H564L590 558V778H130V558Z" fill="#fffdf8" stroke="#536270" stroke-width="2.5" stroke-linejoin="round"/><path d="M131.5 606V558L156 533.5H564L588.5 558V606Z" fill="#426d6b"/><circle cx="360" cy="554" r="9" fill="#f4f2eb" stroke="#536270" stroke-width="2.5"/><text x="360" y="590" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">txid</text><text x="160" y="634" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1e2837">Parcela dez/2026</text><text x="160" y="668" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#1e2837">R$ 980,00</text><text x="160" y="700" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#1e2837">Vencimento 10/12</text><text x="160" y="738" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270" font-style="italic">aponta a parcela ·</text><text x="160" y="764" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270" font-style="italic">não muda nas novas tentativas</text><path d="M76 844H324L350 870V1050H50V870Z" fill="#f1f0eb" stroke="#536270" stroke-width="2.5" stroke-linejoin="round"/><path d="M51.5 904V870L76 845.5H324L348.5 870V904Z" fill="#536270"/><circle cx="200" cy="866" r="9" fill="#f4f2eb" stroke="#536270" stroke-width="2.5"/><text x="200" y="896" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">endToEndId 1</text><text x="72" y="946" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Tentativa 10/12</text><text x="72" y="984" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#536270">sem saldo</text><path d="M396 844H644L670 870V1050H370V870Z" fill="#fffdf8" stroke="#536270" stroke-width="2.5" stroke-linejoin="round"/><path d="M371.5 904V870L396 845.5H644L668.5 870V904Z" fill="#426d6b"/><circle cx="520" cy="866" r="9" fill="#f4f2eb" stroke="#536270" stroke-width="2.5"/><text x="520" y="896" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">endToEndId 2</text><text x="392" y="946" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Tentativa 14/12</text><g transform="rotate(-7 520 1000)"><rect x="440" y="974" width="170" height="46" rx="10" fill="#fffdf8" stroke="#426d6b" stroke-width="4"/><rect x="446" y="980" width="158" height="34" rx="6" fill="none" stroke="#426d6b" stroke-width="1.5"/><text x="525" y="1006" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#426d6b" text-anchor="middle">liquidado</text></g><text x="360" y="1086" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270" text-anchor="middle" font-style="italic">aponta o dinheiro que entrou</text><text x="360" y="1118" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270" text-anchor="middle">Exemplo fictício · identificadores encurtados ·</text><text x="360" y="1144" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270" text-anchor="middle">Torno Studio 2026</text></svg>