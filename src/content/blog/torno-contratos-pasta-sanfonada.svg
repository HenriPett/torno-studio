<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1500" viewBox="0 0 720 1500" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Pasta sanfonada de um contrato de cliente</title><desc id="d1">Exemplo fictício. Pasta sanfonada do contrato CT-CLI-112 entre a Exemplo Armazéns Frios Ltda. e o cliente Laticínios Exemplo Ltda., armazenagem refrigerada, situação na segunda 15/03/2027. Sete divisórias, da frente para o fundo: 1, contrato assinado na quarta 22/05/2024, PDF assinado com hash, início no sábado 01/06/2024, prazo inicial de 24 meses até domingo 31/05/2026 e depois prazo indeterminado, denúncia por qualquer parte com 60 dias de aviso escrito; a cláusula de quantidade, 300 posições-palete, aparece riscada como substituída pelo aditivo 01; 2, aditivo 01 assinado na segunda 02/06/2025, 450 posições-palete e nova tabela a partir da terça 01/07/2025; 3, obrigação recorrente da Exemplo: comprovante anual do seguro das mercadorias armazenadas, prazo quarta 10/02/2027, enviado na sexta 05/02/2027; 4, notificação de denúncia do cliente recebida por e-mail no endereço da cláusula na sexta 08/01/2027; encerramento na terça 09/03/2027, data confirmada pelo jurídico; 5, faturamento final: março proporcional a 9 dias e diárias de 12 posições-palete de quarta 10/03 a sexta 12/03/2027, pela cláusula 9.3; novos recebimentos bloqueados desde 10/03; 6, termo de encerramento e quitação assinado na segunda 15/03/2027; contrato passa a encerrado; 7, guarda até 15/03/2037, decisão do jurídico; depois, eliminação só com termo. Rodapé: cada divisória é uma versão ou um evento, com data e prova; vale a cláusula do último documento que a alterou.</desc><rect x="0" y="0" width="720" height="1500" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="10" y="10" width="700" height="1480" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="450" y="24" width="246" height="46" rx="4" fill="#fff" stroke="#b3261e" stroke-width="2"/><text x="573" y="56" font-size="22" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="118" font-size="30" text-anchor="start" font-weight="bold" fill="#1d1d1b">A pasta sanfonada do CT-CLI-112</text><text x="30" y="154" font-size="20" text-anchor="start" fill="#5a5a55">cliente Laticínios Exemplo · armazenagem refrigerada · em 15/03/2027</text><rect x="40" y="180" width="640" height="1230" rx="10" fill="#e8dcc0" stroke="#1d1d1b" stroke-width="3"/><path d="M 40 180 L 26 190 L 40 275 L 26 360 L 40 445 L 26 530 L 40 615 L 26 700 L 40 785 L 26 870 L 40 955 L 26 1040 L 40 1125 L 26 1210 L 40 1295 L 26 1380" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="70" y="200" width="170" height="34" rx="8" fill="#fff" stroke="#1d1d1b" stroke-width="3"/><text x="84" y="224" font-size="16" text-anchor="start" font-weight="bold" fill="#1d1d1b">1 · Contrato</text><rect x="60" y="230" width="600" height="134" rx="6" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><text x="80" y="258" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">Contrato assinado</text><text x="80" y="282" font-size="16" text-anchor="start" fill="#5a5a55">qua 22/05/2024 · PDF assinado + hash</text><text x="80" y="308" font-size="16" text-anchor="start" fill="#1d1d1b">início sáb 01/06/2024 · 24 meses até 31/05/2026;</text><text x="80" y="330" font-size="16" text-anchor="start" fill="#1d1d1b">depois indeterminado; denúncia com 60 dias</text><text x="80" y="352" font-size="16" text-anchor="start" fill="#1d1d1b">300 posições-palete → substituída pelo aditivo 01</text><line x1="80" y1="347" x2="224" y2="347" stroke="#b3261e" stroke-width="2"/><rect x="260" y="370" width="170" height="34" rx="8" fill="#fff" stroke="#1f4e79" stroke-width="3"/><text x="274" y="394" font-size="16" text-anchor="start" font-weight="bold" fill="#1f4e79">2 · Aditivo 01</text><rect x="60" y="400" width="600" height="134" rx="6" fill="#fff" stroke="#1f4e79" stroke-width="2"/><text x="80" y="428" font-size="19" text-anchor="start" font-weight="bold" fill="#1f4e79">Aditivo 01</text><text x="80" y="452" font-size="16" text-anchor="start" fill="#5a5a55">seg 02/06/2025</text><text x="80" y="478" font-size="16" text-anchor="start" fill="#1d1d1b">450 posições-palete e nova tabela</text><text x="80" y="500" font-size="16" text-anchor="start" fill="#1d1d1b">a partir de ter 01/07/2025</text><rect x="450" y="540" width="170" height="34" rx="8" fill="#dcefdc" stroke="#2e7d32" stroke-width="3"/><text x="464" y="564" font-size="16" text-anchor="start" font-weight="bold" fill="#2e7d32">3 · Seguro</text><rect x="60" y="570" width="600" height="134" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="2"/><text x="80" y="598" font-size="19" text-anchor="start" font-weight="bold" fill="#2e7d32">Seguro das mercadorias</text><text x="80" y="622" font-size="16" text-anchor="start" fill="#5a5a55">obrigação recorrente da Exemplo</text><text x="80" y="648" font-size="16" text-anchor="start" fill="#1d1d1b">comprovante anual: prazo qua 10/02/2027</text><text x="80" y="670" font-size="16" text-anchor="start" fill="#1d1d1b">enviado sex 05/02/2027</text><rect x="70" y="710" width="170" height="34" rx="8" fill="#fdecea" stroke="#b3261e" stroke-width="3"/><text x="84" y="734" font-size="16" text-anchor="start" font-weight="bold" fill="#b3261e">4 · Aviso</text><rect x="60" y="740" width="600" height="134" rx="6" fill="#fff" stroke="#b3261e" stroke-width="2"/><text x="80" y="768" font-size="19" text-anchor="start" font-weight="bold" fill="#b3261e">Notificação do cliente</text><text x="80" y="792" font-size="16" text-anchor="start" fill="#5a5a55">recebida sex 08/01/2027 · e-mail da cláusula</text><text x="80" y="818" font-size="16" text-anchor="start" fill="#1d1d1b">denúncia com 60 dias de aviso</text><text x="80" y="840" font-size="16" text-anchor="start" fill="#1d1d1b">encerramento ter 09/03/2027 (jurídico confirmou)</text><rect x="260" y="880" width="170" height="34" rx="8" fill="#fff8e1" stroke="#a66f00" stroke-width="3"/><text x="274" y="904" font-size="16" text-anchor="start" font-weight="bold" fill="#a66f00">5 · Faturas</text><rect x="60" y="910" width="600" height="134" rx="6" fill="#fff" stroke="#a66f00" stroke-width="2"/><text x="80" y="938" font-size="19" text-anchor="start" font-weight="bold" fill="#a66f00">Faturamento final</text><text x="80" y="962" font-size="16" text-anchor="start" fill="#5a5a55">cláusula 9.3</text><text x="80" y="988" font-size="16" text-anchor="start" fill="#1d1d1b">março proporcional a 9 dias; diárias de 12 posições-palete</text><text x="80" y="1010" font-size="16" text-anchor="start" fill="#1d1d1b">de qua 10/03 a sex 12/03; recebimentos bloqueados</text><rect x="450" y="1050" width="170" height="34" rx="8" fill="#fff" stroke="#1d1d1b" stroke-width="3"/><text x="464" y="1074" font-size="16" text-anchor="start" font-weight="bold" fill="#1d1d1b">6 · Termo</text><rect x="60" y="1080" width="600" height="134" rx="6" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><text x="80" y="1108" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">Termo de encerramento</text><text x="80" y="1132" font-size="16" text-anchor="start" fill="#5a5a55">seg 15/03/2027 · quitação</text><text x="80" y="1158" font-size="16" text-anchor="start" fill="#1d1d1b">estado do contrato: encerrado</text><rect x="70" y="1220" width="170" height="34" rx="8" fill="#ecebe6" stroke="#5a5a55" stroke-width="3"/><text x="84" y="1244" font-size="16" text-anchor="start" font-weight="bold" fill="#5a5a55">7 · Guarda</text><rect x="60" y="1250" width="600" height="134" rx="6" fill="#fff" stroke="#5a5a55" stroke-width="2"/><text x="80" y="1278" font-size="19" text-anchor="start" font-weight="bold" fill="#5a5a55">Guarda</text><text x="80" y="1302" font-size="16" text-anchor="start" fill="#5a5a55">até 15/03/2037 · decisão do jurídico</text><text x="80" y="1328" font-size="16" text-anchor="start" fill="#1d1d1b">depois, eliminação só com termo</text><text x="30" y="1448" font-size="18" text-anchor="start" fill="#5a5a55">Cada divisória: uma versão ou um evento, com data e prova.</text><text x="30" y="1474" font-size="18" text-anchor="start" fill="#5a5a55">Vale a cláusula do último documento que a alterou.</text><text x="690" y="1474" font-size="18" text-anchor="end" fill="#5a5a55">Ilustração · Torno 2026</text></svg>