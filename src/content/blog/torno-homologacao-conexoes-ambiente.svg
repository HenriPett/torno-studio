<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" aria-labelledby="title desc" role="img" viewBox="0 0 720 1120"><title id="title">Confira as conexões do ambiente</title><desc id="desc">Mapa editorial das conexões de aplicação, banco de dados, arquivos e serviços externos. Não representa uma arquitetura real.</desc><rect width="720" height="1120" fill="#f7f6f2"/><text x="36" y="55" fill="#1c5a49" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">TORNO · MAPA DE CONFERÊNCIA</text><text x="36" y="117" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700">Confira cada conexão</text><text x="36" y="164" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">O nome do ambiente não prova os destinos.</text><rect width="656" height="144" x="32" y="210" fill="#e2ede8" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="56" y="254" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700">Aplicação em homologação</text><text x="56" y="296" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Confirme endereço, versão e responsável.</text><path fill="none" stroke="#1c5a49" stroke-width="3" d="M76 354 L76 883"/><path fill="none" stroke="#1c5a49" stroke-width="3" d="M76 460 L118 460"/><rect width="570" height="144" x="118" y="402" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="140" y="441" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Banco de dados</text><text x="140" y="481" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Qual recurso de teste recebe a gravação?</text><text x="140" y="515" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Existe ligação com a operação real?</text><path fill="none" stroke="#1c5a49" stroke-width="3" d="M76 628 L118 628"/><rect width="570" height="144" x="118" y="570" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="140" y="609" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Arquivos</text><text x="140" y="649" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Onde o conteúdo será guardado?</text><text x="140" y="683" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Qual recurso de teste está preparado?</text><path fill="none" stroke="#1c5a49" stroke-width="3" d="M76 796 L118 796"/><rect width="570" height="144" x="118" y="738" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="140" y="777" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Serviços externos</text><text x="140" y="817" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Sandbox, simulação ou caminho desativado?</text><text x="140" y="851" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Confira mensagens e tarefas automáticas.</text><rect width="656" height="126" x="32" y="940" fill="#eeece6" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="980" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700">Algum componente aponta para produção?</text><text x="54" y="1022" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Peça a verificação e a condição de teste</text><text x="54" y="1054" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">antes de executar ações sobre ele.</text></svg>