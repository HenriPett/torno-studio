<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1250" viewBox="0 0 720 1250" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">O balde do custo fixo: absorvido pelas ordens e não absorvido pela ociosidade</title><desc id="d1">Exemplo fictício. Balde do custo fixo do centro Usinagem CNC da Metalúrgica Exemplo Ltda. em novembro de 2026. O balde tem capacidade de R$ 36.000, o orçamento fixo do mês, para a capacidade normal de 400 horas-máquina, o que dá a taxa de R$ 90,00 por hora. Em novembro, as ordens usaram 300 horas: a parte cheia, em azul, é o custo fixo absorvido pelas ordens, 300 × 90 = R$ 27.000. A parte vazia, hachurada, são 100 horas ociosas, 100 × 90 = R$ 9.000 de custo fixo não absorvido, que não entra no custo das peças; o destino é decisão do contador. Acima da borda, R$ 400 de gasto fixo além do orçado: o real foi R$ 36.400. No custo indireto variável, o real foi R$ 9.300 contra 300 × 30 = R$ 9.000 aplicados, R$ 300 de gasto a mais. Embaixo, a armadilha riscada: dividir o fixo real pelas horas reais, 36.400 ÷ 300 = R$ 121,33 por hora, daria R$ 24,27 de fixo por flange em vez de R$ 18,00; a peça ficaria mais cara só porque a fábrica produziu menos.</desc><rect x="0.0" y="0.0" width="720.0" height="1250.0" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14.0" y="14.0" width="692.0" height="1222.0" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30.0" y="58.0" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">O balde do custo fixo</text><text x="30.0" y="92.0" font-size="22" text-anchor="start" font-weight="normal" fill="#1d1d1b">Centro Usinagem CNC · nov/2026</text><text x="30.0" y="136.0" font-size="22" text-anchor="start" font-weight="normal" fill="#4a4f55">orçamento ÷ capacidade normal</text><rect x="470.0" y="108.0" width="222.0" height="40.0" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581.0" y="136.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><rect x="30.0" y="170.0" width="660.0" height="680.0" rx="6" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.5"/><text x="46.0" y="204.0" font-size="21" text-anchor="start" font-weight="bold" fill="#1d1d1b">R$ 36.000 ÷ 400 h normais = R$ 90,00/h</text><rect x="110.0" y="294.7" width="260.0" height="5.3" rx="0" fill="#fbe4e1" stroke="#b42318" stroke-width="1"/><defs><pattern id="hz" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#b8860b" stroke-width="3"/></pattern></defs><rect x="110.0" y="300.0" width="260.0" height="120.0" rx="0" fill="url(#hz)" stroke="none" stroke-width="0"/><rect x="110.0" y="420.0" width="260.0" height="360.0" rx="0" fill="#dde8f3" stroke="none" stroke-width="0"/><path d="M110,288 L110,780 L370,780 L370,288" fill="none" stroke="#1d1d1b" stroke-width="4"/><line x1="110.0" y1="420.0" x2="370.0" y2="420.0" stroke="#1f4e79" stroke-width="2"/><text x="240.0" y="570.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#1f4e79">absorvido</text><text x="240.0" y="602.0" font-size="20" text-anchor="middle" font-weight="normal" fill="#1f4e79">pelas ordens</text><text x="240.0" y="660.0" font-size="21" text-anchor="middle" font-weight="normal" fill="#1f4e79">300 h × 90</text><text x="240.0" y="692.0" font-size="24" text-anchor="middle" font-weight="bold" fill="#1f4e79">R$ 27.000</text><line x1="96.0" y1="780.0" x2="110.0" y2="780.0" stroke="#1d1d1b" stroke-width="1.5"/><text x="92.0" y="786.0" font-size="17" text-anchor="end" font-weight="normal" fill="#4a4f55">0 h</text><line x1="96.0" y1="660.0" x2="110.0" y2="660.0" stroke="#1d1d1b" stroke-width="1.5"/><text x="92.0" y="666.0" font-size="17" text-anchor="end" font-weight="normal" fill="#4a4f55">100 h</text><line x1="96.0" y1="540.0" x2="110.0" y2="540.0" stroke="#1d1d1b" stroke-width="1.5"/><text x="92.0" y="546.0" font-size="17" text-anchor="end" font-weight="normal" fill="#4a4f55">200 h</text><line x1="96.0" y1="420.0" x2="110.0" y2="420.0" stroke="#1d1d1b" stroke-width="1.5"/><text x="92.0" y="426.0" font-size="17" text-anchor="end" font-weight="normal" fill="#4a4f55">300 h</text><line x1="96.0" y1="300.0" x2="110.0" y2="300.0" stroke="#1d1d1b" stroke-width="1.5"/><text x="92.0" y="306.0" font-size="17" text-anchor="end" font-weight="normal" fill="#4a4f55">400 h</text><text x="46.0" y="240.0" font-size="19" text-anchor="start" font-weight="bold" fill="#b42318">+ R$ 400: fixo real 36.400, acima do orçado</text><line x1="300.0" y1="248.0" x2="360.0" y2="292.7" stroke="#b42318" stroke-width="1.5"/><text x="392.0" y="318.0" font-size="21" text-anchor="start" font-weight="bold" fill="#7a5600">não absorvido</text><text x="392.0" y="344.0" font-size="19" text-anchor="start" font-weight="normal" fill="#7a5600">100 h ociosas × 90</text><text x="392.0" y="372.0" font-size="22" text-anchor="start" font-weight="bold" fill="#7a5600">R$ 9.000</text><text x="392.0" y="398.0" font-size="18" text-anchor="start" font-weight="normal" fill="#7a5600">fora do custo da peça;</text><text x="392.0" y="420.0" font-size="18" text-anchor="start" font-weight="normal" fill="#7a5600">destino: contador</text><text x="392.0" y="500.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1f4e79">OP 7001: 212 h</text><text x="392.0" y="526.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1f4e79">OP 7002: 88 h</text><text x="392.0" y="700.0" font-size="18" text-anchor="start" font-weight="bold" fill="#1d1d1b">CIF variável:</text><text x="392.0" y="724.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">9.300 real − 9.000</text><text x="392.0" y="748.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">aplicados = R$ 300</text><text x="392.0" y="772.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">a mais</text><rect x="30.0" y="870.0" width="660.0" height="300.0" rx="6" fill="#fbe4e1" stroke="#b42318" stroke-width="1.5"/><text x="46.0" y="904.0" font-size="22" text-anchor="start" font-weight="bold" fill="#b42318">Armadilha: dividir o fixo pelas horas reais</text><text x="46.0" y="942.0" font-size="21" text-anchor="start" font-weight="normal" fill="#1d1d1b">36.400 ÷ 300 h = R$ 121,33/h</text><text x="46.0" y="976.0" font-size="21" text-anchor="start" font-weight="normal" fill="#1d1d1b">fixo por flange: 0,20 h × 121,33</text><text x="46.0" y="1012.0" font-size="22" text-anchor="start" font-weight="bold" fill="#b42318">= R$ 24,27 por flange, não R$ 18,00</text><text x="46.0" y="1060.0" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">A peça não ficou mais cara de fazer.</text><text x="46.0" y="1090.0" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">A fábrica produziu menos. CPC 16 (R1),</text><text x="46.0" y="1120.0" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">item 13: baixo volume não aumenta</text><text x="46.0" y="1150.0" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">o fixo alocado a cada unidade.</text><text x="30.0" y="1216.0" font-size="22" text-anchor="start" font-weight="normal" fill="#4a4f55">Ilustração · Torno 2026</text><text x="690.0" y="1216.0" font-size="22" text-anchor="end" font-weight="normal" fill="#4a4f55">números inventados</text></svg>