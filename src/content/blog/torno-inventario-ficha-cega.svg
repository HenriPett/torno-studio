<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1966" viewBox="0 0 720 1966" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">A ficha de contagem cega e a apuração</title><desc id="d1">Exemplo fictício. Prancheta com a ficha da contagem cíclica C-0311 de 10/11/2026. Ficha da 1ª contagem, contador C1, sem o saldo esperado na tela ou no papel: B-02-1 parafuso M8, 110; B-02-2 bucha 8 mm, 78; B-03-1 fita veda-rosca, 230; B-03-2 disjuntor 20 A, 48. Em outra folha, separada da prancheta, a ficha da recontagem cega pelo contador C2, sem o esperado e sem a 1ª contagem: B-02-2, 78; B-03-1, 200; B-03-2, 48. Apuração no sistema, vista pela supervisão: B-02-1 esperado 110, 1ª 110, ajuste 0; B-02-2 esperado 80, 1ª 78, 2ª 78, ajuste menos 2, R$ 24,00, aprovado pela supervisora de estoque; B-03-1 esperado 200, 1ª 230, 2ª 200, ajuste 0, a 1ª contagem fica como erro; B-03-2 esperado 52, 1ª 48, 2ª 48, ajuste menos 4, R$ 140,00, aprovado pelo gerente, motivo em apuração. Regras do exemplo: recontar se a diferença passar de 2 por cento ou de R$ 50,00 a custo; ajuste até R$ 100,00 aprovado pela supervisora e acima disso pelo gerente; quem contou não aprova o ajuste; total ajustado de R$ 164,00 a menos. Torno Studio 2026.</desc><rect x="0" y="0" width="720" height="1966" rx="0" fill="#f4efe6"/><text x="40" y="58" font-size="32" fill="#1d1d1b" font-weight="bold" text-anchor="start">A ficha cega e a apuração</text><text x="40" y="98" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Contagem cíclica C-0311 · 10/11/2026</text><rect x="450" y="76" width="230" height="38" rx="6" fill="#1d1d1b"/><text x="565" y="103" font-size="22" fill="#f4efe6" font-weight="bold" text-anchor="middle">EXEMPLO FICTÍCIO</text><rect x="40" y="136" width="640" height="430" rx="18" fill="#d8bf95" stroke="#1d1d1b" stroke-width="4"/><rect x="76" y="182" width="568" height="354" rx="0" fill="#fffdf7" stroke="#1d1d1b" stroke-width="2"/><rect 