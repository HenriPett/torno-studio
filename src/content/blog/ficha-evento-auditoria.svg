<svg xmlns="http://www.w3.org/2000/svg" width="720" height="822" viewBox="0 0 720 822" role="img" aria-labelledby="title desc"><title id="title">O que o evento precisa contar</title><desc id="desc">Sistema fictício · dados apenas ilustrativos.</desc><rect width="720" height="822" fill="#f7f6f2"/><text x="36" y="54" fill="#1c5a49" font-family="Arial,sans-serif" font-size="24" font-weight="700">TORNO · GUIA VISUAL</text><text x="36" y="113" fill="#16181a" font-family="Arial,sans-serif" font-size="32" font-weight="700">O que o evento precisa contar</text><text x="36" y="158" fill="#16181a" font-family="Arial,sans-serif" font-size="24" font-weight="400">Sistema fictício · dados apenas ilustrativos.</text><rect x="32" y="195" width="656" height="153" rx="12" fill="white" stroke="#b4c6bd" stroke-width="2"/><text x="52" y="234" fill="#1c5a49" font-family="Arial,sans-serif" font-size="27" font-weight="700">Evento e ator</text><text x="52" y="273" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Evento: alteração de status.</text><text x="52" y="304" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Ator: conta de teste OPERADOR-A.</text><text x="52" y="335" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Recurso: pedido fictício PED-001.</text><rect x="32" y="369" width="656" height="153" rx="12" fill="white" stroke="#b4c6bd" stroke-width="2"/><text x="52" y="408" fill="#1c5a49" font-family="Arial,sans-serif" font-size="27" font-weight="700">Tempo e resultado</text><text x="52" y="447" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Quando: instante com fuso definido.</text><text x="52" y="478" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Resultado: alteração aceita ou negada.</text><text x="52" y="509" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Regra: quais mudanças entram no registro?</text><rect x="32" y="543" width="656" height="153" rx="12" fill="white" stroke="#b4c6bd" stroke-width="2"/><text x="52" y="582" fill="#1c5a49" font-family="Arial,sans-serif" font-size="27" font-weight="700">Referência para investigar</text><text x="52" y="621" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Identificador do evento e da operação.</text><text x="52" y="652" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Referência ao recurso, sem copiar</text><text x="52" y="683" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">todo o conteúdo do pedido.</text><text x="36" y="757" fill="#1c5a49" font-family="Arial,sans-serif" font-size="24" font-weight="700">Defina os campos para o seu sistema.</text></svg>