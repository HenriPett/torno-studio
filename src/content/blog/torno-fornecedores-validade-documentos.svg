<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1220" viewBox="0 0 720 1220" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Validade de documentos de fornecedores: setembro a dezembro de 2026</title><desc id="d1">Exemplo fictício. Linha do tempo de setembro a dezembro de 2026. Embalagens Exemplo, certidão de regularidade fiscal federal: válida até 15/10 (validade impressa), aviso de 15/09 a 15/10; pendência documental de 16/10 a 21/10; nova certidão anexada em 22/10, válida até 20/04/2027. Eventos: 15/09 aviso ao comprador e à qualidade; 16/10 pedido novo recusado por documento vencido; 20/10 OC 4588, emitida em 01/10, recebida normalmente; 22/10 nova certidão anexada, pendência encerrada. Tratamentos Térmicos Exemplo, licença de operação: válida até 30/11, em aviso desde 31/10. Aços Exemplo, certificado ISO 9001 do fornecedor: válido em todo o período, até 12/03/2027. Regras: a validade vem do documento, não de uma conta de dias; o vencimento bloqueia pedido novo, não o recebimento de pedido emitido antes; anexo sem data de validade é recusado.</desc><rect x="0.0" y="0.0" width="720.0" height="1220.0" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14.0" y="14.0" width="692.0" height="1192.0" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30.0" y="58.0" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Validade de documentos</text><text x="30.0" y="92.0" font-size="21" text-anchor="start" font-weight="normal" fill="#1d1d1b">fornecedores da Metalúrgica Exemplo · 2026</text><rect x="470.0" y="108.0" width="222.0" height="40.0" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581.0" y="136.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><text x="30.0" y="136.0" font-size="20" text-anchor="start" font-weight="normal" fill="#4a4f55">set → dez · pendência separada da situação</text><line x1="60.0" y1="200.0" x2="60.0" y2="760.0" stroke="#4a4f55" stroke-width="1" stroke-dasharray="3 4"/><text x="64.0" y="192.0" font-size="20" text-anchor="start" font-weight="bold" fill="#4a4f55">set</text><line x1="212.5" y1="200.0" x2="212.5" y2="760.0" stroke="#4a4f55" stroke-width="1" stroke-dasharray="3 4"/><text x="216.5" y="192.0" font-size="20" text-anchor="start" font-weight="bold" fill="#4a4f55">out</text><line x1="370.0" y1="200.0" x2="370.0" y2="760.0" stroke="#4a4f55" stroke-width="1" stroke-dasharray="3 4"/><text x="374.0" y="192.0" font-size="20" text-anchor="start" font-weight="bold" fill="#4a4f55">nov</text><line x1="522.5" y1="200.0" x2="522.5" y2="760.0" stroke="#4a4f55" stroke-width="1" stroke-dasharray="3 4"/><text x="526.5" y="192.0" font-size="20" text-anchor="start" font-weight="bold" fill="#4a4f55">dez</text><line x1="680.0" y1="200.0" x2="680.0" y2="760.0" stroke="#4a4f55" stroke-width="1" stroke-dasharray="3 4"/><text x="30.0" y="240.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">Embalagens Exemplo · certidão federal</text><rect x="60.0" y="290.0" width="228.7" height="34.0" rx="0" fill="#dde8f3" stroke="#1f4e79" stroke-width="1.5"/><rect x="131.1" y="290.0" width="157.5" height="34.0" rx="0" fill="#fff3cd" stroke="#b8860b" stroke-width="1.5"/><rect x="288.7" y="290.0" width="30.5" height="34.0" rx="0" fill="#fbe4e1" stroke="#b42318" stroke-width="1.5"/><rect x="319.2" y="290.0" width="360.8" height="34.0" rx="0" fill="#dde8f3" stroke="#1f4e79" stroke-width="1.5"/><path d="M680 294 L694 307 L680 320 Z" fill="#1f4e79" stroke="#1f4e79" stroke-width="1"/><text x="62.0" y="350.0" font-size="18" text-anchor="start" font-weight="bold" fill="#1f4e79">válida até 15/10</text><text x="466.6" y="314.0" font-size="18" text-anchor="start" font-weight="bold" fill="#1f4e79">até 20/04/2027</text><line x1="131.1" y1="290.0" x2="131.1" y2="272.0" stroke="#1d1d1b" stroke-width="1.2"/><circle cx="131.1" cy="270.0" r="13" fill="#ffffff" stroke="#1d1d