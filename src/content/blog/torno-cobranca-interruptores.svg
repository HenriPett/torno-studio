<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1200" viewBox="0 0 720 1200" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Quadro de interruptores que param, pausam ou trocam o canal da régua</title><desc id="d1">Exemplo fictício. Quadro com oito interruptores que mudam a régua de cobrança da Distribuidora Exemplo Ltda., cada um com o evento que o aciona, quem registra e o efeito. 1. Pagamento baixado pela conciliação: para a régua do título. 2. Pagamento informado pelo cliente, com comprovante, ainda sem baixa: pausa por até 2 dias úteis; sem baixa, vai para a fila do financeiro. 3. Acordo registrado pelo financeiro: pausa até a data combinada; acordo quebrado retoma no passo combinado. 4. Contestação aberta: pausa só o título contestado; os outros títulos do cliente seguem. 5. Título ou nota cancelada, ou devolução total: para e tira o título da régua. 6. Renegociação: para o título original; o título novo tem régua própria. 7. Pedido do contato para não receber por um canal, opt-out: troca o canal, só aquele canal. 8. E-mail que voltou, bounce permanente: marca o endereço como inválido e troca de canal se houver outro com permissão; senão, fila para atualizar o contato. Rodapé: parar é diferente de pausar; todo acionamento fica registrado com quem, quando e por quê.</desc><rect x="0.0" y="0.0" width="720.0" height="1200.0" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14.0" y="14.0" width="692.0" height="1172.0" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30.0" y="58.0" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">O que para a régua</text><text x="30.0" y="92.0" font-size="21" text-anchor="start" font-weight="normal" fill="#1d1d1b">Distribuidora Exemplo Ltda. · 8 interruptores</text><rect x="470.0" y="108.0" width="222.0" height="40.0" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581.0" y="136.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><rect x="30.0" y="150.0" width="660.0" height="910.0" rx="8" fill="#e9e4d8" stroke="#1d1d1b" stroke-width="2"/><rect x="44.0" y="160.0" width="632.0" height="100.0" rx="6" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.2"/><rect x="60.0" y="178.0" width="44.0" height="64.0" rx="6" fill="#3b3f44" stroke="#1d1d1b" stroke-width="1.5"/><rect x="68.0" y="186.0" width="28.0" height="22.0" rx="3" fill="#9b2a1f" stroke="none" stroke-width="0"/><text x="82.0" y="234.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff">I</text><text x="124.0" y="196.0" font-size="21" text-anchor="start" font-weight="bold" fill="#1d1d1b">1. Pagamento baixado</text><text x="124.0" y="224.0" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55">quem registra: conciliação</text><rect x="500.0" y="174.0" width="160.0" height="34.0" rx="5" fill="#fbe3e0" stroke="#9b2a1f" stroke-width="2"/><text x="580.0" y="198.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#9b2a1f">PARA</text><text x="124.0" y="250.0" font-size="18" text-anchor="start" font-weight="normal" fill="#9b2a1f">régua do título encerrada</text><rect x="44.0" y="272.0" width="632.0" height="100.0" rx="6" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.2"/><rect x="60.0" y="290.0" width="44.0" height="64.0" rx="6" fill="#3b3f44" stroke="#1d1d1b" stroke-width="1.5"/><rect x="68.0" y="298.0" width="28.0" height="22.0" rx="3" fill="#7a5600" stroke="none" stroke-width="0"/><text x="82.0" y="346.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff">I</text><text x="124.0" y="308.0" font-size="21" text-anchor="start" font-weight="bold" fill="#1d1d1b">2. Pagamento informado</text><text x="124.0" y="336.0" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55">quem registra: cliente, com comprovante</text><rect x="500.0" y="286.0" width="160.0" height="34.0" rx="5" fill="#fff3cd" stroke="#7a5600" stroke-width="2"/><text x="580.0" y="310.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#7a5600">PAUSA</text><text x="124.0" y="362.0" font-size="18" text-anchor="start" font-weight="normal" fill="#7a5600">até 2 dias úteis; sem baixa → fila</text><rect x="44.0" y="384.0" width="632.0" height="100.0" rx="6" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.2"/><rect x="60.0" y="402.0" width="44.0" height="64.0" rx="6" fill="#3b3f44" stroke="#1d1d1b" stroke-width="1.5"/><rect x="68.0" y="410.0" width="28.0" height="22.0" rx="3" fill="#7a5600" stroke="none" stroke-width="0"/><text x="82.0" y="458.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff">I</text><text x="124.0" y="420.0" font-size="21" text-anchor="start" font-weight="bold" fill="#1d1d1b">3. Acordo registrado</text><text x="124.0" y="448.0" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55">quem registra: financeiro</text><rect x="500.0" y="398.0" width="160.0" height="34.0" rx="5" fill="#fff3cd" stroke="#7a5600" stroke-width="2"/><text x="580.0" y="422.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#7a5600">PAUSA</text><text x="124.0" y="474.0" font-size="18" text-anchor="start" font-weight="normal" fill="#7a5600">até a data; se quebrar, retoma</text><rect x="44.0" y="496.0" width="632.0" height="100.0" rx="6" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.2"/><rect x="60.0" y="514.0" width="44.0" height="64.0" rx="6" fill="#3b3f44" stroke="#1d1d1b" stroke-width="1.5"/><rect x="68.0" y="522.0" width="28.0" height="22.0" rx="3" fill="#7a5600" stroke="none" stroke-width="0"/><text x="82.0" y="570.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff">I</text><text x="124.0" y="532.0" font-size="21" text-anchor="start" font-weight="bold" fill="#1d1d1b">4. Contestação aberta</text><text x="124.0" y="560.0" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55">quem registra: financeiro / comercial</text><rect x="500.0" y="510.0" width="160.0" height="34.0" rx="5" fill="#fff3cd" stroke="#7a5600" stroke-width="2"/><text x="580.0" y="534.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#7a5600">PAUSA</text><text x="124.0" y="586.0" font-size="18" text-anchor="start" font-weight="normal" fill="#7a5600">só o título contestado</text><rect x="44.0" y="608.0" width="632.0" height="100.0" rx="6" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.2"/><rect x="60.0" y="626.0" width="44.0" height="64.0" rx="6" fill="#3b3f44" stroke="#1d1d1b" stroke-width="1.5"/><rect x="68.0" y="634.0" width="28.0" height="22.0" rx="3" fill="#9b2a1f" stroke="none" stroke-width="0"/><text x="82.0" y="682.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff">I</text><text x="124.0" y="644.0" font-size="21" text-anchor="start" font-weight="bold" fill="#1d1d1b">5. Título cancelado</text><text x="124.0" y="672.0" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55">quem registra: faturamento</text><rect x="500.0" y="622.0" width="160.0" height="34.0" rx="5" fill="#fbe3e0" stroke="#9b2a1f" stroke-width="2"/><text x="580.0" y="646.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#9b2a1f">PARA</text><text x="124.0" y="698.0" font-size="18" text-anchor="start" font-weight="normal" fill="#9b2a1f">NF cancelada ou devolução total</text><rect x="44.0" y="720.0" width="632.0" height="100.0" rx="6" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.2"/><rect x="60.0" y="738.0" width="44.0" height="64.0" rx="6" fill="#3b3f44" stroke="#1d1d1b" stroke-width="1.5"/><rect x="68.0" y="746.0" width="28.0" height="22.0" rx="3" fill="#9b2a1f" stroke="none" stroke-width="0"/><text x="82.0" y="794.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff">I</text><text x="124.0" y="756.0" font-size="21" text-anchor="start" font-weight="bold" fill="#1d1d1b">6. Renegociação</text><text x="124.0" y="784.0" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55">quem registra: financeiro, com alçada</text><rect x="500.0" y="734.0" width="160.0" height="34.0" rx="5" fill="#fbe3e0" stroke="#9b2a1f" stroke-width="2"/><text x="580.0" y="758.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#9b2a1f">PARA</text><text x="124.0" y="810.0" font-size="18" text-anchor="start" font-weight="normal" fill="#9b2a1f">original sai; título novo, régua nova</text><rect x="44.0" y="832.0" width="632.0" height="100.0" rx="6" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.2"/><rect x="60.0" y="850.0" width="44.0" height="64.0" rx="6" fill="#3b3f44" stroke="#1d1d1b" stroke-width="1.5"/><rect x="68.0" y="858.0" width="28.0" height="22.0" rx="3" fill="#2f5d8a" stroke="none" stroke-width="0"/><text x="82.0" y="906.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff">I</text><text x="124.0" y="868.0" font-size="21" text-anchor="start" font-weight="bold" fill="#1d1d1b">7. Opt-out de canal</text><text x="124.0" y="896.0" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55">quem registra: contato do cliente</text><rect x="500.0" y="846.0" width="160.0" height="34.0" rx="5" fill="#dde8f3" stroke="#2f5d8a" stroke-width="2"/><text x="580.0" y="870.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#2f5d8a">TROCA</text><text x="124.0" y="922.0" font-size="18" text-anchor="start" font-weight="normal" fill="#2f5d8a">só aquele canal deixa de ser usado</text><rect x="44.0" y="944.0" width="632.0" height="100.0" rx="6" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.2"/><rect x="60.0" y="962.0" width="44.0" height="64.0" rx="6" fill="#3b3f44" stroke="#1d1d1b" stroke-width="1.5"/><rect x="68.0" y="970.0" width="28.0" height="22.0" rx="3" fill="#2f5d8a" stroke="none" stroke-width="0"/><text x="82.0" y="1018.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff">I</text><text x="124.0" y="980.0" font-size="21" text-anchor="start" font-weight="bold" fill="#1d1d1b">8. E-mail voltou</text><text x="124.0" y="1008.0" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55">quem registra: provedor de e-mail</text><rect x="500.0" y="958.0" width="160.0" height="34.0" rx="5" fill="#dde8f3" stroke="#2f5d8a" stroke-width="2"/><text x="580.0" y="982.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#2f5d8a">TROCA</text><text x="124.0" y="1034.0" font-size="18" text-anchor="start" font-weight="normal" fill="#2f5d8a">endereço inválido; outro canal ou fila</text><text x="30.0" y="1096.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">Parar ≠ pausar: a pausa tem data ou condição de volta.</text><text x="30.0" y="1126.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">Cada acionamento grava quem, quando, por quê e qual título.</text><text x="690.0" y="1170.0" font-size="18" text-anchor="end" font-weight="normal" fill="#4a4f55">Ilustração · Torno 2026</text></svg>