 y="306.0" font-size="19" text-anchor="end" font-weight="normal" fill="#1d1d1b">125</text><text x="520.0" y="306.0" font-size="19" text-anchor="end" font-weight="normal" fill="#1d1d1b">120</text><text x="610.0" y="306.0" font-size="19" text-anchor="end" font-weight="normal" fill="#1d1d1b">3 R01</text><text x="680.0" y="306.0" font-size="19" text-anchor="end" font-weight="normal" fill="#1d1d1b">2 T01</text><line x1="30.0" y1="320.0" x2="690.0" y2="320.0" stroke="#d8d2c4" stroke-width="1"/><text x="40.0" y="352.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">03/11 B</text><text x="128.0" y="352.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">20 torno *</text><text x="440.0" y="352.0" font-size="19" text-anchor="end" font-weight="normal" fill="#1d1d1b">75</text><text x="520.0" y="352.0" font-size="19" text-anchor="end" font-weight="normal" fill="#1d1d1b">70</text><text x="610.0" y="352.0" font-size="19" text-anchor="end" font-weight="normal" fill="#1d1d1b">2 R01</text><text x="680.0" y="352.0" font-size="19" text-anchor="end" font-weight="normal" fill="#1d1d1b">3 T01</text><line x1="30.0" y1="366.0" x2="690.0" y2="366.0" stroke="#d8d2c4" stroke-width="1"/><text x="40.0" y="398.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">04/11</text><text x="128.0" y="398.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">25 retrabalho</text><text x="440.0" y="398.0" font-size="19" text-anchor="end" font-weight="normal" fill="#1d1d1b">5</text><text x="520.0" y="398.0" font-size="19" text-anchor="end" font-weight="normal" fill="#1d1d1b">4</text><text x="610.0" y="398.0" font-size="19" text-anchor="end" font-weight="normal" fill="#1d1d1b">1 R01</text><text x="680.0" y="398.0" font-size="19" text-anchor="end" font-weight="normal" fill="#1d1d1b">—</text><line x1="30.0" y1="412.0" x2="690.0" y2="412.0" stroke="#d8d2c4" stroke-width="1"/><text x="40.0" y="444.0" font-size="19" text-anchor=