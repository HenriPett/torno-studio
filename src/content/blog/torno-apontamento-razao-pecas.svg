<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" viewBox="0 0 720 1120" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Livro-razão de peças da OP 8301</title><desc id="d1">Exemplo fictício. Livro-razão de peças da OP 8301, 200 eixos EX-40, Metalúrgica Exemplo Ltda. Colunas: entraram, boas, refugo com motivo, retrabalho. 03/11 corte: 202, 200 boas, 2 refugo R02. 03/11 turno A torneamento: 125, 120, 3 R01, 2 retrabalho T01. 03/11 turno B torneamento: 75, 70, 2 R01, 3 T01; inclui 30 boas apontadas às 15h50 sem conexão, sincronizadas às 15h56, enviadas duas vezes e contadas uma. 03/11 às 15h00, tentativa de apontar 130 no fresamento, sem motivo, com 120 torneadas: recusada. 04/11 retrabalho: 5, 4 boas, 1 R01. 04/11 fresamento: 194, 192, 2 R04. 04/11 inspeção final: 192, 191, 1 R01. Fechamento em 04/11: 202 = 191 + 11, tolerância mínima 190. 06/11 estorno da inspeção: menos 191 e menos 1, sem apagar a linha original; novo apontamento: 190 aprovadas, 2 refugo, motivo laudo revisto, lançado pelo PCP. Fechamento revisto: 202 = 190 + 12, ainda dentro da tolerância.</desc><rect x="0.0" y="0.0" width="720.0" height="1120.0" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14.0" y="14.0" width="692.0" height="1092.0" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30.0" y="58.0" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Razão de peças · OP 8301</text><text x="30.0" y="92.0" font-size="21" text-anchor="start" font-weight="normal" fill="#1d1d1b">200 eixos EX-40 · corte → inspeção</text><rect x="470.0" y="108.0" width="222.0" height="40.0" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581.0" y="136.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><text x="30.0" y="136.0" font-size="19" text-anchor="start" font-weight="normal" fill="#4a4f55">R01 dimensional · R02 corte · R04 manuseio</text><text x="