<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="title desc"><title id="title">IBS e CBS na nota: datas de obrigatoriedade</title><desc id="desc">Escada de três marcos: 03/08/2026 para NF-e e NFC-e; 01/12/2026 para NF-e de quem não é contribuinte do ICMS; 01/01/2027 para Simples Nacional, monofásica e Duimp. Abaixo, marcador tracejado: a validação que rejeita a nota sem os campos foi adiada, sem data.</desc><rect width="720" height="440" rx="24" fill="#f4f2eb"/><text x="32" y="54" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#1e2837">IBS e CBS na nota: datas de obrigatoriedade</text><g font-family="Arial,sans-serif" fill="#1e2837"><rect x="32" y="230" width="208" height="90" fill="#e0edf0"/><rect x="256" y="190" width="208" height="130" fill="#cfe3e3"/><rect x="480" y="150" width="208" height="170" fill="#bad6d5"/><text x="48" y="264" font-size="24" font-weight="700">03/08/2026</text><text x="48" y="292" font-size="17">NF-e e NFC-e</text><text x="272" y="224" font-size="24" font-weight="700">01/12/2026</text><text x="272" y="252" font-size="17">NF-e de quem não é</text><text x="272" y="274" font-size="17">contribuinte do ICMS</text><text x="496" y="184" font-size="24" font-weight="700">01/01/2027</text><text x="496" y="212" font-size="17">Simples Nacional,</text><text x="496" y="234" font-size="17">monofásica e Duimp</text></g><path d="M32 320H688" stroke="#1e2837" stroke-width="3"/><rect x="32" y="352" width="656" height="64" rx="14" fill="#fffdf8" stroke="#536270" stroke-width="2.5" stroke-dasharray="9 7"/><text x="56" y="392" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#c8782f">?</text><text x="88" y="379" font-family="Arial,sans-serif" font-size="17" fill="#1e2837">Validação que rejeita a nota sem os campos:</text><text x="88" y="401" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#536270">adiada, sem data</text></svg>
