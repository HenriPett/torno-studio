<svg xmlns="http://www.w3.org/2000/svg" width="720" height="822" aria-labelledby="title desc" role="img" viewBox="0 0 720 822"><title id="title">Permissões precisam de contexto</title><desc id="desc">Matriz ilustrativa: combine cada regra real.</desc><rect width="720" height="822" fill="#f7f6f2"/><text x="36" y="54" fill="#1c5a49" font-family="Arial,sans-serif" font-size="24" font-weight="700">TORNO · GUIA VISUAL</text><text x="36" y="113" fill="#16181a" font-family="Arial,sans-serif" font-size="32" font-weight="700">Permissões precisam de contexto</text><text x="36" y="158" fill="#16181a" font-family="Arial,sans-serif" font-size="24" font-weight="400">Matriz ilustrativa: combine cada regra real.</text><rect width="656" height="153" x="32" y="195" fill="#fff" stroke="#b4c6bd" stroke-width="2" rx="12"/><text x="52" y="234" fill="#1c5a49" font-family="Arial,sans-serif" font-size="27" font-weight="700">Operador · unidade atribuída</text><text x="52" y="273" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Consultar: permitido na própria unidade.</text><text x="52" y="304" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Alterar: apenas registros em rascunho.</text><text x="52" y="335" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Exportar: negado neste exemplo.</text><rect width="656" height="153" x="32" y="369" fill="#fff" stroke="#b4c6bd" stroke-width="2" rx="12"/><text x="52" y="408" fill="#1c5a49" font-family="Arial,sans-serif" font-size="27" font-weight="700">Gestor · organização atribuída</text><text x="52" y="447" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Consultar: permitido na organização.</text><text x="52" y="478" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Alterar: após aprovação da mudança.</text><text x="52" y="509" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Exportar: somente relatório autorizado.</text><rect width="656" height="153" x="32" y="543" fill="#fff" stroke="#b4c6bd" stroke-width="2" rx="12"/><text x="52" y="582" fill="#1c5a49" font-family="Arial,sans-serif" font-size="27" font-weight="700">Condição faz parte da permissão</text><text x="52" y="621" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Defina ação, recurso, escopo e condição.</text><text x="52" y="652" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Outro papel ou contexto pode exigir</text><text x="52" y="683" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">uma decisão diferente.</text><text x="36" y="757" fill="#1c5a49" font-family="Arial,sans-serif" font-size="24" font-weight="700">Exemplo editorial; não é política universal.</text></svg>