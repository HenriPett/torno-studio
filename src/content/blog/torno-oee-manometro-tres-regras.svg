><rect x="40" y="916" width="640" height="48" rx="0" fill="#efe7d6"/><text x="56" y="948" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Disponibilidade</text><text x="362" y="948" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">81,4%</text><rect x="429" y="921" width="116" height="38" rx="6" fill="#d8bf95" stroke="#1d1d1b" stroke-width="2"/><text x="487" y="948" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">89,7%</text><rect x="557" y="921" width="116" height="38" rx="6" fill="#d8bf95" stroke="#1d1d1b" stroke-width="2"/><text x="615" y="948" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">77,8%</text><rect x="40" y="964" width="640" height="48" rx="0" fill="#fffdf7"/><text x="56" y="996" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Performance</text><text x="362" y="996" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">85,7%</text><rect x="429" y="969" width="116" height="38" rx="6" fill="#d8bf95" stroke="#1d1d1b" stroke-width="2"/><text x="487" y="996" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">94,3%</text><text x="615" y="996" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">85,7%</text><rect x="40" y="1012" width="640" height="48" rx="0" fill="#efe7d6"/><text x="56" y="1044" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Qualidade</text><text x="362" y="1044" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">94,0%</text><rect x="429" y="1017" width="116" height="38" rx="6" fill="#d8bf95" stroke="#1d1d1b" stroke-width="2"/><text x="487" y="1044" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">96,0%</text><text x="615" y="1044" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">94,0%</text><rect x="40" y="1060" width="640" height="48" rx="0" fill="#e2d3b4"/><text x="56" y="1092" font-siz