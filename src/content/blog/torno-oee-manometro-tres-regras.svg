<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1360" viewBox="0 0 720 1360" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Mesmo turno, três OEEs: o manômetro e as regras</title><desc id="d1">Exemplo fictício. Manômetro de 0 a 100% com três ponteiros para o mesmo turno A da prensa P-07 da Metalúrgica Exemplo Ltda.: 480 minutos, 600 peças, 24 refugadas e 12 retrabalhadas. A, regra combinada: 65,6%. B: 81,2%. C: 62,7%. Tempo planejado: A 430 min, B 390 min, C 450 min. Preventiva de 20 min: A fora, B fora, C perda. Setup de 40 min: A perda, B fora, C perda. Ciclo de referência: A 30 s, B 33 s, C 30 s. Retrabalho de 12 peças: A não boa, B boa, C não boa. Disponibilidade: A 81,4%, B 89,7%, C 77,8%. Performance: A 85,7%, B 94,3%, C 85,7%. Qualidade: A 94,0%, B 96,0%, C 94,0%. OEE: A 65,6%, B 81,2%, C 62,7%. Mesmos minutos e mesmas peças; muda só a regra. Refeição de 30 min fora do tempo planejado nas três; 30 s é o ciclo ideal e 33 s o ciclo do roteiro.</desc><rect x="0" y="0" width="720" height="1360" rx="0" fill="#f4efe6"/><text x="40" y="58" font-size="32" fill="#1d1d1b" font-weight="bold" text-anchor="start">Mesmo turno, três OEEs</text><rect x="450" y="30" width="230" height="38" rx="6" fill="#1d1d1b"/><text x="565" y="57" font-size="22" fill="#f4efe6" font-weight="bold" text-anchor="middle">EXEMPLO FICTÍCIO</text><text x="40" y="104" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Metalúrgica Exemplo Ltda. · prensa P-07 · turno A</text><text x="40" y="138" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">480 min · 600 peças · 24 refugo · 12 retrabalho</text><path d="M80 470 A280 280 0 0 1 640 470 Z" fill="#fffdf7" stroke="#1d1d1b" stroke-width="4"/><path d="M110.0 470.0 A250 250 0 0 1 610.0 470.0" fill="none" stroke="#d8bf95" stroke-width="18"/><path d="M124.0 470.0 L100.0 470.0" stroke="#1d1d1b" stroke-width="3"/><path d="M135.6 397.1 L120.3 392.1" stroke="#1d1d1