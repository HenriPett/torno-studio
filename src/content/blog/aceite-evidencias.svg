<svg xmlns="http://www.w3.org/2000/svg" width="720" height="967" viewBox="0 0 720 967" role="img" aria-labelledby="title desc"><title id="title">O que pedir no teste de aceite</title><desc id="desc">Combine cenário, resultado e evidência.</desc><rect width="720" height="967" fill="#f7f6f2"/><text x="36" y="55" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#1c5a49">TORNO · GUIA VISUAL</text><text x="36" y="116" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="700" fill="#16181a">O que pedir no teste de aceite</text><text x="36" y="166" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">Combine cenário, resultado e evidência.</text><rect x="32" y="205" width="656" height="132" rx="14" fill="white" stroke="#b4c6bd" stroke-width="2"/><text x="52" y="243" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1c5a49">Repetição e entregas próximas</text><text x="52" y="282" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">Conferir identidade do evento, estado</text><text x="52" y="315" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">final e efeitos que devem ser únicos.</text><path d="M360 341 v12 m-7 -7 7 7 7 -7" stroke="#1c5a49" stroke-width="3" fill="none"/><rect x="32" y="358" width="656" height="132" rx="14" fill="white" stroke="#b4c6bd" stroke-width="2"/><text x="52" y="396" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1c5a49">Falha antes ou após o registro</text><text x="52" y="435" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">Mostrar etapa da falha, estado salvo</text><text x="52" y="468" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">e recuperação conforme o combinado.</text><path d="M360 494 v12 m-7 -7 7 7 7 -7" stroke="#1c5a49" stroke-width="3" fill="none"/><rect x="32" y="511" width="656" height="132" rx="14" fill="white" stroke="#b4c6bd" stroke-width="2"/><text x="52" y="549" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1c5a49">Nova mudança legítima</text><text x="52" y="588" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">Mostrar eventos distintos, regra</text><text x="52" y="621" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">aplicada e histórico do estado.</text><path d="M360 647 v12 m-7 -7 7 7 7 -7" stroke="#1c5a49" stroke-width="3" fill="none"/><rect x="32" y="664" width="656" height="132" rx="14" fill="white" stroke="#b4c6bd" stroke-width="2"/><text x="52" y="702" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1c5a49">Conclusão do ensaio</text><text x="52" y="741" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">Registrar versão do fluxo, efeitos</text><text x="52" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">conferidos e dependências não testadas.</text><text x="36" y="832" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="600" fill="#1c5a49">O ensaio vale para o cenário demonstrado.</text><text x="36" y="864" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="600" fill="#1c5a49">Documente limites antes de aceitar.</text></svg>