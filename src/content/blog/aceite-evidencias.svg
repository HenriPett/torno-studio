<svg xmlns="http://www.w3.org/2000/svg" width="720" height="967" aria-labelledby="title desc" role="img" viewBox="0 0 720 967"><title id="title">O que pedir no teste de aceite</title><desc id="desc">Combine cenário, resultado e evidência.</desc><rect width="720" height="967" fill="#f7f6f2"/><text x="36" y="55" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">TORNO · GUIA VISUAL</text><text x="36" y="116" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="700">O que pedir no teste de aceite</text><text x="36" y="166" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Combine cenário, resultado e evidência.</text><rect width="656" height="132" x="32" y="205" fill="#fff" stroke="#b4c6bd" stroke-width="2" rx="14"/><text x="52" y="243" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Repetição e entregas próximas</text><text x="52" y="282" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Conferir identidade do evento, estado</text><text x="52" y="315" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">final e efeitos que devem ser únicos.</text><path fill="none" stroke="#1c5a49" stroke-width="3" d="M360 341 v12 m-7 -7 7 7 7 -7"/><rect width="656" height="132" x="32" y="358" fill="#fff" stroke="#b4c6bd" stroke-width="2" rx="14"/><text x="52" y="396" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Falha antes ou após o registro</text><text x="52" y="435" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Mostrar etapa da falha, estado salvo</text><text x="52" y="468" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">e recuperação conforme o combinado.</text><path fill="none" stroke="#1c5a49" stroke-width="3" d="M360 494 v12 m-7 -7 7 7 7 -7"/><rect width="656" height="132" x="32" y="511" fill="#fff" stroke="#b4c6bd" stroke-width="2" rx="14"/><text x="52" y="549" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Nova mudança legítima</text><text x="52" y="588" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Mostrar eventos distintos, regra</text><text x="52" y="621" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">aplicada e histórico do estado.</text><path fill="none" stroke="#1c5a49" stroke-width="3" d="M360 647 v12 m-7 -7 7 7 7 -7"/><rect width="656" height="132" x="32" y="664" fill="#fff" stroke="#b4c6bd" stroke-width="2" rx="14"/><text x="52" y="702" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Conclusão do ensaio</text><text x="52" y="741" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Registrar versão do fluxo, efeitos</text><text x="52" y="774" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">conferidos e dependências não testadas.</text><text x="36" y="832" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="600">O ensaio vale para o cenário demonstrado.</text><text x="36" y="864" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="600">Documente limites antes de aceitar.</text></svg>