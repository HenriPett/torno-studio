<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1604" viewBox="0 0 720 1604" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">A multa chega com o prazo correndo</title><desc id="d1">Exemplo fictício. Notificação de autuação do veículo V-02 da Exemplo Distribuidora Ltda., em envelope com aviso de recebimento, carimbos expedida em 20/10/2026 e recebida na portaria em 27/10; em 27/10 faltam 23 dias. Régua de 02/10 a 19/11: 18 dias até expedir, 7 dias no correio, 23 dias para a empresa. Datas: sexta 02/10 às 14h37, infração; terça 20/10, expedição; terça 27/10, recebida e Marcos sugerido; quinta 05/11, Marcos e a empresa assinam; sexta 06/11, protocolo com comprovante; quinta 12/11, prazo interno, 7 dias antes; quinta 19/11, prazo impresso na notificação. Reserva do V-02 em 02/10: Marcos L., retirada 13h05, devolução 17h40, infração às 14h37 dentro do intervalo; condutor provável, sugestão para o gestor confirmar. Sem indicação até 19/11, responde o proprietário; pessoa jurídica, nova multa de 2 vezes a original, CTB art. 257, parágrafos 7º e 8º.</desc><rect x="0" y="0" width="720" height="1604" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="10" y="10" width="700" height="1584" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="450" y="24" width="246" height="46" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="573" y="56" font-size="22" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="118" font-size="32" text-anchor="start" font-weight="bold" fill="#1d1d1b">A multa chega com o prazo correndo</text><text x="30" y="158" font-size="22" text-anchor="start" fill="#5a5a55">Notificação de autuação · veículo V-02</text><rect x="60" y="200" width="600" height="300" rx="6" fill="#ffffff" stroke="#1d1d1b" stroke-width="3"/><path d="M60 200 L360.0 350 L660 200" fill="none" stroke="#1d1d1b" stroke-width="3"/><path d="M60 500 L290 320 M660