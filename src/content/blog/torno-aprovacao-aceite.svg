<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1260" aria-labelledby="title desc" role="img" viewBox="0 0 720 1260"><title id="title">Aceite do fluxo de aprovação</title><desc id="desc">Ficha editorial de cenários para aprovação, devolução, ausência do ator e dados alterados. Defina resultado esperado e evidência, sem caso real.</desc><rect width="720" height="1260" fill="#f7f6f2"/><text x="36" y="55" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">TORNO · ACEITE POR CENÁRIO</text><text x="36" y="118" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700">Mostre o resultado combinado</text><text x="36" y="164" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Para cada cenário, defina o esperado e a evidência.</text><rect width="656" height="176" x="32" y="210" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="253" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Aprovação</text><text x="54" y="304" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Quem decide e qual estado resulta?</text><text x="54" y="345" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Confira decisão, acesso e efeito registrado.</text><rect width="656" height="176" x="32" y="420" fill="#eeece6" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="463" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Devolução</text><text x="54" y="514" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Quem corrige e como o pedido retorna?</text><text x="54" y="555" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Confira a mensagem e a retomada prevista.</text><rect width="656" height="176" x="32" y="630" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="673" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Ausência do responsável</text><text x="54" y="724" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Qual cobertura foi autorizada para decidir?</text><text x="54" y="765" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Demonstre a alternativa e seus limites.</text><rect width="656" height="176" x="32" y="840" fill="#eeece6" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="883" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Dados alterados</text><text x="54" y="934" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">A mudança exige nova análise?</text><text x="54" y="975" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Confira o estado e o alcance da decisão.</text><text x="36" y="1115" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">Registre diferenças e evidências pendentes.</text><text x="36" y="1155" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Combine responsável e nova verificação.</text><text x="36" y="1210" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Proposta editorial · sem caso ou teste real.</text></svg>