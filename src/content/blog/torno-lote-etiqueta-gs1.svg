tica,sans-serif" font-size="22" fill="#1e2837">260615 → 15/06/2026</text><text x="408" y="630" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#1e2837">(AAMMDD)</text><circle cx="68" cy="562" r="16" fill="#536270"/><text x="68" y="570" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">B</text><text x="94" y="570" font-family="Courier New,Courier,monospace" font-size="22" font-weight="700" fill="#1e2837">(11) 260615</text><path d="M94 580H239.2" stroke="#536270" stroke-width="5" stroke-linecap="round"/><path d="M247.2 580H392" stroke="#536270" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 7"/><rect x="392" y="656" width="296" height="108" rx="12" fill="#fffdf8" stroke="#b5651d" stroke-width="3"/><circle cx="418" cy="684" r="16" fill="#b5651d"/><text x="418" y="692" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">C</text><text x="442" y="692" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#b5651d">(17) Validade</text><text x="408" y="724" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#1e2837">270614 → 14/06/2027</text><text x="408" y="752" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#1e2837">(AAMMDD)</text><circle cx="68" cy="684" r="16" fill="#b5651d"/><text x="68" y="692" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">C</text><text x="94" y="692" font-family="Courier New,Courier,monospace" font-size="22" font-weight="700" fill="#1e2837">(17) 270614</text><path d="M94 702H239.2" stroke="#b5651d" stroke-width="5" stroke-linecap="round"/><path d="M247.2 702H392" stroke="#b5651d" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 7"/><rect x="392" y="778" width="296" height="192" rx="12" fill="#fffdf8" stroke="#1e2837" stroke-width="3"/><circle cx="418" cy="806" r="16" fill="#1e2837"/><text x="418" y="814" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">D</text><text x="442" y="814" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e2837">(10) Lote</text><text x="408" y="846" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#1e2837">L26241 ·</text><text x="408" y="874" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#1e2837">1 a 20 caracteres</text><text x="408" y="902" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#1e2837">alfanuméricos ·</text><text x="408" y="930" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#1e2837">não deve repetir</text><text x="408" y="958" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#1e2837">para o mesmo GTIN</text><circle cx="68" cy="806" r="16" fill="#1e2837"/><text x="68" y="814" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">D</text><text x="94" y="814" font-family="Courier New,Courier,monospace" font-size="22" font-weight="700" fill="#1e2837">(10) L26241</text><path d="M94 824H239.2" stroke="#1e2837" stroke-width="5" stroke-linecap="round"/><path d="M247.2 824H392" stroke="#1e2837" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 7"/><rect x="32" y="1010" width="656" height="182" rx="12" fill="#ffffff" stroke="#536270" stroke-width="2.5"/><circle cx="632" cy="1054" r="22" fill="none" stroke="#536270" stroke-width="5"/><path d="M648 1070L664 1088" stroke="#536270" stroke-width="7" stroke-linecap="round"/><text x="52" y="1052" font-family="Courier New,Courier,monospace" font-size="24" font-weight="700" fill="#b5651d">(17) 270600</text><text x="52" y="1090" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e2837">dia 00 = último dia do mês → 30/06/2027</text><text x="52" y="1130" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">regra geral da GS1; desde 01/01/2025,</text><text x="52" y="1158" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">produtos de saúde regulados não usam 00</text><g transform="rotate(-4 360 1316)"><rect x="60" y="1236" width="600" height="160" rx="8" fill="#fffdf8" stroke="#426d6b" stroke-width="3.5" stroke-dasharray="12 7"/><text x="80" y="1274" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#426d6b">Etiqueta sem (10)?</text><text x="80" y="1310" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#1e2837">O contrato decide: recusar ou criar</text><text x="80" y="1338" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#1e2837">lote interno marcado</text><text x="80" y="1376" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">regra do projeto, não do padrão GS1</text></g><text x="32" y="1450" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">GTIN, datas e lote inventados.</text><text x="32" y="1480" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">Ilustração original Torno Studio, 2026</text></svg>