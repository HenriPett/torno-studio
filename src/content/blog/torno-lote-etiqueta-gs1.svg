<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1500" viewBox="0 0 720 1500" role="img" aria-labelledby="title desc"><title id="title">O que está na etiqueta da caixa</title><desc id="desc">Etiqueta de caixa fictícia ampliada com o cabeçalho MOLHO DE TOMATE 340 g · CX 24 · MT-340, barras ilustrativas e a linha legível (01) 12000000012343 (11) 260615 (17) 270614 (10) L26241; cada campo é sublinhado e decodificado ao lado: GTIN do item comercial da caixa, fabricação 15/06/2026, validade 14/06/2027 e lote L26241 de 1 a 20 caracteres que não deve repetir para o mesmo GTIN. Um detalhe mostra a validade (17) 270600 lida como 30/06/2027, porque o dia 00 indica o último dia do mês, com a nota de que desde 01/01/2025 produtos de saúde regulados não usam 00; um carimbo tracejado pergunta o que fazer com etiqueta sem (10) e responde que o contrato decide entre recusar ou criar lote interno marcado. Marcado Exemplo fictício.</desc><rect width="720" height="1500" rx="24" fill="#f4f2eb"/><text x="32" y="52" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1e2837">O que está na etiqueta da caixa</text><rect x="472" y="66" width="216" height="40" rx="20" fill="#fffdf8" stroke="#536270" stroke-width="2.5"/><text x="580" y="94" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#536270" text-anchor="middle">Exemplo fictício</text><rect x="36" y="136" width="340" height="750" rx="14" fill="#1e2837" opacity=".12"/><rect x="32" y="130" width="340" height="750" rx="14" fill="#ffffff" stroke="#536270" stroke-width="1.5"/><circle cx="202" cy="158" r="10" fill="#f4f2eb" stroke="#536270" stroke-width="1.5"/><text x="52" y="212" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e2837">MOLHO DE TOMATE<tspan x="52" dy="28">340 g · CX 24 · MT-340</tspan></text><g fill="#1e2837"><rect x="52" y="262" width="3" height="60"/><rect x="57" y="262" width="4" height="60"/><rect x="65" y="262" width="