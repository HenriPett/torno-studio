<svg xmlns="http://www.w3.org/2000/svg" width="720" height="994" aria-label="O relatório deve seguir a restauração." role="img" viewBox="0 0 720 994"><rect width="720" height="994" x="0" y="0" fill="#f7f6f2" stroke="none" stroke-width="2" rx="0"/><text x="36" y="55" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">TORNO · GUIA VISUAL</text><text x="36" y="116" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="700">Que prova pedir?</text><text x="36" y="162" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">O relatório deve seguir a restauração.</text><rect width="656" height="138" x="32" y="200" fill="#fff" stroke="#b4c6bd" stroke-width="2" rx="14"/><rect width="58" height="58" x="48" y="230" fill="#e2ede8" stroke="none" stroke-width="2" rx="12"/><text x="64" y="269" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">1</text><text x="125" y="246" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Cópia identificada</text><text x="125" y="285" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Qual data, sistema e escopo</text><text x="125" y="318" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">foram usados no teste?</text><path fill="none" stroke="#1c5a49" stroke-width="3" d="M358 343 v15 m-8 -8 8 8 8 -8"/><rect width="656" height="138" x="32" y="362" fill="#fff" stroke="#b4c6bd" stroke-width="2" rx="14"/><rect width="58" height="58" x="48" y="392" fill="#e2ede8" stroke="none" stroke-width="2" rx="12"/><text x="64" y="431" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">2</text><text x="125" y="408" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Ambiente separado</text><text x="125" y="447" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Onde a cópia foi restaurada</text><text x="125" y="480" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">e quem conduziu o teste?</text><path fill="none" stroke="#1c5a49" stroke-width="3" d="M358 505 v15 m-8 -8 8 8 8 -8"/><rect width="656" height="138" x="32" y="524" fill="#fff" stroke="#b4c6bd" stroke-width="2" rx="14"/><rect width="58" height="58" x="48" y="554" fill="#e2ede8" stroke="none" stroke-width="2" rx="12"/><text x="64" y="593" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">3</text><text x="125" y="570" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Conferências</text><text x="125" y="609" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Quais dados, funções e vínculos</text><text x="125" y="642" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">foram de fato verificados?</text><path fill="none" stroke="#1c5a49" stroke-width="3" d="M358 667 v15 m-8 -8 8 8 8 -8"/><rect width="656" height="138" x="32" y="686" fill="#fff" stroke="#b4c6bd" stroke-width="2" rx="14"/><rect width="58" height="58" x="48" y="716" fill="#e2ede8" stroke="none" stroke-width="2" rx="12"/><text x="64" y="755" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">4</text><text x="125" y="732" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Registro</text><text x="125" y="771" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">O que passou, falhou ou ficou</text><text x="125" y="804" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">fora da verificação?</text><text x="36" y="931" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="600">Teste anterior não garante recuperação futura.</text></svg>