<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1516" viewBox="0 0 720 1516" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Anatomia de uma ordem de serviço</title><desc id="d1">Exemplo fictício. Vista explodida da ordem de serviço OS-2026-0417 da Exemplo Refrigeração e Climatização Ltda., em oito camadas, cada uma com quem preenche. 1 Abertura e triagem, pela atendente, terça 01/12/2026: Cliente Beta, pessoa física; ar-condicionado split de 12.000 BTU; sintoma não gela; visita na quarta 02/12 de manhã. 2 Diagnóstico, pelo técnico, quarta 02/12: vazamento na conexão da condensadora e capacitor fraco; 3 fotos. 3 Orçamento O-0417 versão 1, emitido pelo técnico e congelado pelo sistema: mão de obra 2,5 h a R$ 140,00, R$ 350,00; capacitor R$ 48,00; gás 1,2 kg a R$ 95,00, R$ 114,00; porca flare R$ 22,50; total R$ 534,50; válido até sábado 12/12/2026; execução em 04/12; Pix na conclusão. 4 Aprovação do orçamento, pelo cliente, quinta 03/12 às 19h48, pelo link, versão 1. 5 Execução, pelo técnico, sexta 04/12: capacitor 1, gás 1,4 kg aplicados e 1,2 kg cobrados, porca 1; baixa do estoque do veículo V2; 30 minutos de deslocamento e 2 h 30 de trabalho. 6 Aceite do serviço, pelo cliente, às 16h12, com assinatura e 4 fotos. 7 Fechamento, pelo financeiro: NFS-e do serviço, R$ 350,00; NF-e das peças e materiais, R$ 184,50, conforme orientação do contador. 8 Garantia, calculada pelo sistema pelas regras escritas da empresa: legal de 90 dias até 04/03/2027; contratual de mais 90 dias até 02/06/2027. Rodapé: cada camada guarda quem, quando e o que mudou.</desc><rect x="0" y="0" width="720" height="1516" fill="#f6f3ec"/><rect x="14" y="14" width="692" height="1488" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="530" y="30" width="160" height="34" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="610" y="53" font-size="15" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="62" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Anatomia de uma ordem de serviço</text><text x="30" y="96" font-size="18" text-anchor="start" fill="#6b6b66">OS-2026-0417 · Exemplo Refrigeração e Climatização Ltda.</text><text x="30" y="122" font-size="18" text-anchor="start" fill="#6b6b66">Cada camada tem um dono e um momento.</text><rect x="46" y="156" width="620" height="152" rx="4" fill="#e4dfd3" stroke="none" stroke-width="0"/><rect x="40" y="150" width="620" height="152" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="3"/><circle cx="66" cy="176" r="17" fill="#1f4e79"/><text x="66" y="183" font-size="19" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text><text x="94" y="183" font-size="20" text-anchor="start" font-weight="bold" fill="#1f4e79">Abertura e triagem</text><text x="94" y="208" font-size="16" text-anchor="start" font-style="italic" fill="#6b6b66">atendente · ter 01/12</text><text x="94" y="234" font-size="18" text-anchor="start" fill="#1d1d1b">Cliente Beta (pessoa física) · split 12.000 BTU</text><text x="94" y="260" font-size="18" text-anchor="start" fill="#1d1d1b">Sintoma relatado: “não gela”</text><text x="94" y="286" font-size="18" text-anchor="start" fill="#1d1d1b">Visita: qua 02/12, manhã</text><line x1="360" y1="302" x2="360" y2="324" stroke="#6b6b66" stroke-width="2" stroke-dasharray="4 4"/><rect x="60" y="330" width="620" height="126" rx="4" fill="#e4dfd3" stroke="none" stroke-width="0"/><rect x="54" y="324" width="620" height="126" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="3"/><circle cx="80" cy="350" r="17" fill="#1f4e79"/><text x="80" y="357" font-size="19" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text><text x="108" y="357" font-size="20" text-anchor="start" font-weight="bold" fill="#1f4e79">Diagnóstico</text><text x="108" y="382" font-size="16" text-anchor="start" font-style="italic" fill="#6b6b66">técnico · qua 02/12</text><text x="108" y="408" font-size="18" text-anchor="start" fill="#1d1d1b">Vazamento na conexão da condensadora</text><text x="108" y="434" font-size="18" text-anchor="start" fill="#1d1d1b">Capacitor fraco · 3 fotos anexadas</text><line x1="360" y1="450" x2="360" y2="472" stroke="#6b6b66" stroke-width="2" stroke-dasharray="4 4"/><rect x="46" y="478" width="620" height="178" rx="4" fill="#e4dfd3" stroke="none" stroke-width="0"/><rect x="40" y="472" width="620" height="178" rx="4" fill="#ffffff" stroke="#b7791f" stroke-width="3"/><circle cx="66" cy="498" r="17" fill="#b7791f"/><text x="66" y="505" font-size="19" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text><text x="94" y="505" font-size="20" text-anchor="start" font-weight="bold" fill="#b7791f">Orçamento O-0417 · versão 1</text><text x="94" y="530" font-size="16" text-anchor="start" font-style="italic" fill="#6b6b66">técnico emite · sistema congela</text><text x="94" y="556" font-size="18" text-anchor="start" fill="#1d1d1b">Mão de obra 2,5 h × R$ 140,00 = R$ 350,00</text><text x="94" y="582" font-size="18" text-anchor="start" fill="#1d1d1b">Capacitor R$ 48,00 · gás 1,2 kg × R$ 95,00 = R$ 114,00</text><text x="94" y="608" font-size="18" text-anchor="start" fill="#1d1d1b">Porca flare R$ 22,50 · total R$ 534,50</text><text x="94" y="634" font-size="18" text-anchor="start" fill="#1d1d1b">Válido até sáb 12/12 · execução 04/12 · Pix</text><line x1="360" y1="650" x2="360" y2="672" stroke="#6b6b66" stroke-width="2" stroke-dasharray="4 4"/><rect x="60" y="678" width="620" height="100" rx="4" fill="#e4dfd3" stroke="none" stroke-width="0"/><rect x="54" y="672" width="620" height="100" rx="4" fill="#ffffff" stroke="#b7791f" stroke-width="3"/><circle cx="80" cy="698" r="17" fill="#b7791f"/><text x="80" y="705" font-size="19" text-anchor="middle" font-weight="bold" fill="#ffffff">4</text><text x="108" y="705" font-size="20" text-anchor="start" font-weight="bold" fill="#b7791f">Aprovação do orçamento</text><text x="108" y="730" font-size="16" text-anchor="start" font-style="italic" fill="#6b6b66">cliente · qui 03/12 19h48</text><text x="108" y="756" font-size="18" text-anchor="start" fill="#1d1d1b">Pelo link · versão 1 · fica gravada</text><line x1="360" y1="772" x2="360" y2="794" stroke="#6b6b66" stroke-width="2" stroke-dasharray="4 4"/><rect x="46" y="800" width="620" height="152" rx="4" fill="#e4dfd3" stroke="none" stroke-width="0"/><rect x="40" y="794" width="620" height="152" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><circle cx="66" cy="820" r="17" fill="#2e7d32"/><text x="66" y="827" font-size="19" text-anchor="middle" font-weight="bold" fill="#ffffff">5</text><text x="94" y="827" font-size="20" text-anchor="start" font-weight="bold" fill="#2e7d32">Execução</text><text x="94" y="852" font-size="16" text-anchor="start" font-style="italic" fill="#6b6b66">técnico · sex 04/12</text><text x="94" y="878" font-size="18" text-anchor="start" fill="#1d1d1b">Capacitor 1 · porca 1 · gás 1,4 kg aplicado,</text><text x="94" y="904" font-size="18" text-anchor="start" fill="#1d1d1b">1,2 kg cobrado · baixa no estoque do veículo V2</text><text x="94" y="930" font-size="18" text-anchor="start" fill="#1d1d1b">Deslocamento 30 min · trabalho 2 h 30</text><line x1="360" y1="946" x2="360" y2="968" stroke="#6b6b66" stroke-width="2" stroke-dasharray="4 4"/><rect x="60" y="974" width="620" height="100" rx="4" fill="#e4dfd3" stroke="none" stroke-width="0"/><rect x="54" y="968" width="620" height="100" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><circle cx="80" cy="994" r="17" fill="#2e7d32"/><text x="80" y="1001" font-size="19" text-anchor="middle" font-weight="bold" fill="#ffffff">6</text><text x="108" y="1001" font-size="20" text-anchor="start" font-weight="bold" fill="#2e7d32">Aceite do serviço</text><text x="108" y="1026" font-size="16" text-anchor="start" font-style="italic" fill="#6b6b66">cliente · 16h12</text><text x="108" y="1052" font-size="18" text-anchor="start" fill="#1d1d1b">Assinatura na tela + 4 fotos</text><line x1="360" y1="1068" x2="360" y2="1090" stroke="#6b6b66" stroke-width="2" stroke-dasharray="4 4"/><rect x="46" y="1096" width="620" height="126" rx="4" fill="#e4dfd3" stroke="none" stroke-width="0"/><rect x="40" y="1090" width="620" height="126" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="3"/><circle cx="66" cy="1116" r="17" fill="#1d1d1b"/><text x="66" y="1123" font-size="19" text-anchor="middle" font-weight="bold" fill="#ffffff">7</text><text x="94" y="1123" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">Fechamento</text><text x="94" y="1148" font-size="16" text-anchor="start" font-style="italic" fill="#6b6b66">financeiro</text><text x="94" y="1174" font-size="18" text-anchor="start" fill="#1d1d1b">NFS-e do serviço R$ 350,00</text><text x="94" y="1200" font-size="18" text-anchor="start" fill="#1d1d1b">NF-e de peças e materiais R$ 184,50 (contador)</text><line x1="360" y1="1216" x2="360" y2="1238" stroke="#6b6b66" stroke-width="2" stroke-dasharray="4 4"/><rect x="60" y="1244" width="620" height="126" rx="4" fill="#e4dfd3" stroke="none" stroke-width="0"/><rect x="54" y="1238" width="620" height="126" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="3"/><circle cx="80" cy="1264" r="17" fill="#b3261e"/><text x="80" y="1271" font-size="19" text-anchor="middle" font-weight="bold" fill="#ffffff">8</text><text x="108" y="1271" font-size="20" text-anchor="start" font-weight="bold" fill="#b3261e">Garantia</text><text x="108" y="1296" font-size="16" text-anchor="start" font-style="italic" fill="#6b6b66">sistema, pelas regras escritas</text><text x="108" y="1322" font-size="18" text-anchor="start" fill="#1d1d1b">Legal 90 dias: até 04/03/2027</text><text x="108" y="1348" font-size="18" text-anchor="start" fill="#1d1d1b">Contratual + 90 dias: até 02/06/2027</text><rect x="40" y="1390" width="640" height="58" rx="4" fill="#fbe9e7" stroke="#b3261e" stroke-width="2"/><text x="360" y="1426" font-size="19" text-anchor="middle" font-weight="bold" fill="#b3261e">Cada camada guarda quem, quando e o que mudou.</text><text x="30" y="1482" font-size="15" text-anchor="start" fill="#6b6b66">Exemplo fictício: empresa, cliente, valores e datas inventados.</text><text x="690" y="1482" font-size="15" text-anchor="end" fill="#6b6b66">Ilustração · Torno 2026</text></svg>