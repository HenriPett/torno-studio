<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1160" viewBox="0 0 720 1160" role="img" aria-labelledby="title desc"><title id="title">Ao atingir a cota da API</title><desc id="desc">Roteiro editorial de reconhecimento do limite, pendência visível, espera conforme o provedor e retomada controlada.</desc><rect width="720" height="1160" fill="#f7f6f2"/>
<text x="36" y="55" fill="#1c5a49" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">TORNO · COMPORTAMENTO DA INTEGRAÇÃO</text>
<text x="36" y="118" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="700">A cota foi atingida. E agora?</text>
<text x="36" y="164" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Combine o comportamento antes do aceite.</text>
<rect x="32" y="210" width="656" height="160" rx="12" fill="#fff" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="253" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Reconheça o limite</text>
<text x="54" y="299" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Confira o sinal documentado pelo provedor.</text>
<text x="54" y="338" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Confira se a restrição é compartilhada.</text>
<path d="M360 370 L360 402" stroke="#1c5a49" stroke-width="3" fill="none"/>
<rect x="32" y="402" width="656" height="160" rx="12" fill="#eeece6" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="445" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Preserve a pendência visível</text>
<text x="54" y="491" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Identifique o que ainda não foi concluído.</text>
<text x="54" y="530" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Defina quem acompanha e quem age.</text>
<path d="M360 562 L360 594" stroke="#1c5a49" stroke-width="3" fill="none"/>
<rect x="32" y="594" width="656" height="160" rx="12" fill="#fff" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="637" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Espere conforme a regra</text>
<text x="54" y="683" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Consulte a orientação aplicável à API.</text>
<text x="54" y="722" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Não suponha que sempre há Retry-After.</text>
<path d="M360 754 L360 786" stroke="#1c5a49" stroke-width="3" fill="none"/>
<rect x="32" y="786" width="656" height="160" rx="12" fill="#fff" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="829" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Retome de forma controlada</text>
<text x="54" y="875" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Confira o resultado antes de repetir ações.</text>
<text x="54" y="914" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">A retomada deve evitar efeitos duplicados.</text>
<text x="36" y="1035" fill="#1c5a49" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">Fila ou espera não garantem a conclusão.</text>
<text x="36" y="1080" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Registre limites e tratamento das falhas.</text>
<text x="36" y="1130" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Proposta editorial · adapte ao produto.</text>
</svg>
