<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1032" viewBox="0 0 720 1032" role="img" aria-labelledby="title desc"><title id="title">Régua do prazo de 8 horas úteis, de quinta a segunda</title><desc id="desc">Exemplo fictício em faixas, uma por dia, com expediente de segunda a sexta das 08h às 18h (America/Sao_Paulo) e SLA de 8 horas úteis. Quinta 19/11/2026: chamado aberto às 16h30, contam 1h30 até as 18h. Sexta 20/11: feriado nacional, não conta. Sábado e domingo: não contam. Segunda 23/11: contam 1h das 08h às 09h, pausa aguardando cliente das 09h00 às 10h30 não conta, e contam 5h30 das 10h30 às 16h00. Total 1h30 + 1h + 5h30 = 8h, e o prazo vence segunda às 16h00; sem a pausa venceria às 14h30. Legenda: contado, não contado, pausado.</desc><defs><pattern id="hn" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#e6e3da"/><rect width="4" height="12" fill="#aab2b8"/></pattern><pattern id="hp" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="12" height="12" fill="#b5651d"/><rect width="3" height="12" fill="#e3b27d"/></pattern></defs><rect width="720" height="1032" rx="24" fill="#f4f2eb"/><text x="32" y="52" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1e2837">Quando vence o prazo de 8 horas úteis?</text><rect x="32" y="68" width="216" height="40" rx="20" fill="#fffdf8" stroke="#536270" stroke-width="2.5"/><text x="140" y="96" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#536270">Exemplo fictício</text><text x="32" y="146" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">Expediente seg–sex, 08h–18h · America/Sao_Paulo</text><text x="150" y="190" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle" fill="#536270">08h</text><text x="420" y="190" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle" fill="#536270">13h</text><text x="690" y="190" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle" fill="#536270">18h</text><text x="32" y="234" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e2837">Qui</text><text x="32" y="258" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">19/11</text><rect x="150" y="212" width="540" height="44" fill="#fffdf8" stroke="#536270" stroke-width="2"/><rect x="609.0" y="212" width="81.0" height="44" fill="#1c5a49"/><text x="649.5" y="243" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">1h30</text><path d="M609.0 206V268" stroke="#1e2837" stroke-width="4"/><path d="M599.0 274h20l-10 -14z" fill="#1e2837"/><text x="609.0" y="304" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1e2837">Abertura 16h30</text><text x="32" y="364" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e2837">Sex</text><text x="32" y="388" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">20/11</text><rect x="150" y="342" width="540" height="44" fill="url(#hn)" stroke="#536270" stroke-width="2"/><text x="420" y="373" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1e2837" stroke="#f4f2eb" stroke-width="5" paint-order="stroke">Feriado nacional · não conta</text><text x="150" y="418" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">Dia Nacional de Zumbi e da Consciência Negra</text><text x="32" y="492" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e2837">Sáb</text><text x="32" y="516" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">21/11</text><rect x="150" y="470" width="540" height="44" fill="url(#hn)" stroke="#536270" stroke-width="2"/><text x="420" y="501" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1e2837" stroke="#f4f2eb" stroke-width="5" paint-order="stroke">Sem expediente · não conta</text><text x="32" y="568" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e2837">Dom</text><text x="32" y="592" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">22/11</text><rect x="150" y="546" width="540" height="44" fill="url(#hn)" stroke="#536270" stroke-width="2"/><text x="420" y="577" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1e2837" stroke="#f4f2eb" stroke-width="5" paint-order="stroke">Sem expediente · não conta</text><text x="32" y="690" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e2837">Seg</text><text x="32" y="714" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">23/11</text><rect x="150" y="668" width="540" height="44" fill="#fffdf8" stroke="#536270" stroke-width="2"/><rect x="150" y="668" width="54" height="44" fill="#1c5a49"/><text x="177.0" y="699" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">1h</text><rect x="204" y="668" width="81.0" height="44" fill="url(#hp)"/><rect x="285.0" y="668" width="297.0" height="44" fill="#1c5a49"/><text x="433.5" y="699" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">5h30</text><rect x="208" y="676" width="73.0" height="28" rx="6" fill="#fff"/><text x="244.5" y="698" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#7a4210">pausa</text><path d="M501.0 660V720" stroke="#536270" stroke-width="3" stroke-dasharray="6 5"/><text x="501.0" y="652" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle" fill="#536270">Sem a pausa: 14h30</text><path d="M582 662V724" stroke="#1e2837" stroke-width="4"/><path d="M572 730h20l-10 -14z" fill="#1e2837"/><text x="582" y="760" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1e2837">Vence 16h00</text><text x="32" y="794" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#7a4210">Pausa: aguardando cliente, 09h00–10h30</text><rect x="32" y="818" width="656" height="72" rx="14" fill="#fffdf8" stroke="#1e2837" stroke-width="2.5"/><text x="360" y="864" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1e2837">1h30 + 1h + 5h30 = 8h úteis</text><rect x="32" y="928" width="28" height="28" fill="#1c5a49"/><text x="68" y="951" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#1e2837">Contado</text><rect x="210" y="928" width="28" height="28" fill="url(#hn)" stroke="#536270" stroke-width="2"/><text x="246" y="951" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#1e2837">Não contado</text><rect x="420" y="928" width="28" height="28" fill="url(#hp)"/><text x="456" y="951" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#1e2837">Pausado</text><text x="32" y="1004" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">Exemplo fictício · Torno Studio 2026</text></svg>