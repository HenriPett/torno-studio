<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1700" viewBox="0 0 720 1700" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Abastecimento que não fecha</title><desc id="d1">Exemplo fictício. Bomba de combustível para o caminhão V-01 a diesel da Exemplo Distribuidora Ltda., tanque de 120 litros, faixa de referência de 5,0 a 7,0 km/l. Visor: segunda 16/11, 22h47, 140,0 litros, odômetro digitado 121.420. Tanque com marca de 120 litros e excesso de 20 litros. Conta de tanque cheio a tanque cheio: 05/11, 120.400 km, ponto de partida; 09/11, 480 km ÷ 80,0 L = 6,00 km/l, dentro; 13/11, 420 km ÷ 75,0 L = 5,60 km/l, dentro; 16/11, 120 km ÷ 140,0 L = 0,86 km/l, fora. Média de 05/11 a 13/11: 5,81 km/l. Bandeiras: litros acima do tanque, 140 contra 120; consumo fora da faixa, 0,86 contra 5,0 a 7,0; fora do turno, 22h47, turno das 6h às 18h, sem reserva ativa. Telemetria: V-01 parado no pátio das 18h12 às 6h40. Ocorrência para o gestor, não acusação.</desc><rect x="0" y="0" width="720" height="1700" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="10" y="10" width="700" height="1680" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="450" y="24" width="246" height="46" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="573" y="56" font-size="22" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="118" font-size="32" text-anchor="start" font-weight="bold" fill="#1d1d1b">Abastecimento que não fecha</text><text x="30" y="158" font-size="22" text-anchor="start" fill="#5a5a55">V-01 · caminhão leve a diesel · tanque de 120 L</text><text x="30" y="188" font-size="22" text-anchor="start" fill="#5a5a55">faixa de referência: 5,0 a 7,0 km/l</text><rect x="50" y="220" width="300" height="470" rx="14" fill="#d9d3c4" stroke="#1d1d1b" stroke-width="3"/><rect x="70" y="240" width="260" height="200" rx="8" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="2"/><