<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1520" viewBox="0 0 720 1520" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">A posição confere, não bloqueia</title><desc id="d1">Exemplo fictício. Mapa esquemático da marcação de entrada de Diego M., vendedor externo, segunda 09/11/2026 às 08:10. Cliente agendado no centro de um círculo de 300 metros; a marcação está a 1,4 km, fora do raio, com precisão de 35 metros. Etiqueta: fora do raio, ocorrência para a gestora, a marcação não é bloqueada, comprovante emitido. Nota da gestora Renata: cliente atendeu em unidade nova, não cadastrada. Guardado: hora da marcação com fuso; posição no instante da marcação e precisão; distância ao cliente agendado; ocorrência e explicação; posição retida por 90 dias. Não guardado: trajeto entre clientes; posição fora das marcações; foto do rosto, só o resultado da conferência biométrica; contatos e outros dados do celular. Finalidade escrita antes, mínimo necessário, LGPD art. 6º, I e III.</desc><rect x="0" y="0" width="720" height="1520" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="10" y="10" width="700" height="1500" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="450" y="24" width="246" height="46" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="573" y="56" font-size="22" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="118" font-size="32" text-anchor="start" font-weight="bold" fill="#1d1d1b">A posição confere, não bloqueia</text><text x="30" y="158" font-size="22" text-anchor="start" fill="#5a5a55">Diego M. · vendedor externo · seg 09/11/2026, 08:10</text><text x="30" y="188" font-size="22" text-anchor="start" fill="#5a5a55">Raio de referência do exemplo: 300 m do cliente</text><rect x="40" y="238" width="640" height="560" rx="4" fill="#eef0ea" stroke="#1d1d1b" stroke-width="2"/><line x1="120" y1="238" x2="160" y2="798" stroke="#ffffff" stroke-width="14"/><line x1="260" y1="238" x2="300" y2="798" stroke="#ffffff" stroke-width="14"/><line x1="400" y1="238" x2="440" y2="798" stroke="#ffffff" stroke-width="14"/><line x1="540" y1="238" x2="580" y2="798" stroke="#ffffff" stroke-width="14"/><line x1="40" y1="358" x2="680" y2="328" stroke="#ffffff" stroke-width="14"/><line x1="40" y1="538" x2="680" y2="508" stroke="#ffffff" stroke-width="14"/><line x1="40" y1="698" x2="680" y2="668" stroke="#ffffff" stroke-width="14"/><circle cx="170" cy="538" r="80" fill="#e3efe3" fill-opacity="0.8" stroke="#2e6b3a" stroke-width="3" stroke-dasharray="8 6"/><rect x="154" y="522" width="32" height="32" rx="3" fill="#2e6b3a" stroke="#1d1d1b" stroke-width="2"/><text x="170" y="590" font-size="20" text-anchor="middle" font-weight="bold" fill="#2e6b3a">cliente</text><text x="170" y="446" font-size="20" text-anchor="middle" font-weight="bold" fill="#2e6b3a">raio 300 m</text><line x1="170" y1="538" x2="543.6" y2="478" stroke="#b3261e" stroke-width="3" stroke-dasharray="10 7"/><rect x="296.8" y="462.0" width="120" height="40" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="356.8" y="490.0" font-size="24" text-anchor="middle" font-weight="bold" fill="#b3261e">1,4 km</text><circle cx="543.6" cy="478" r="9" fill="#b3261e" fill-opacity="0.25" stroke="#b3261e" stroke-width="2"/><path d="M543.6 478 L529.6 444 A16 16 0 1 1 557.6 444 Z" fill="#b3261e" stroke="#1d1d1b" stroke-width="2"/><text x="543.6" y="518" font-size="20" text-anchor="middle" font-weight="bold" fill="#1d1d1b">marcação 08:10</text><text x="543.6" y="542" font-size="18" text-anchor="middle" fill="#5a5a55">precisão 35 m</text><line x1="70" y1="768" x2="150" y2="768" stroke="#1d1d1b" stroke-width="4"/><text x="160" y="775" font-size="18" text-anchor="start" fill="#1d1d1b">300 m</text><rect x="40" y="828" width="640" height="150" rx="6" fill="#fbe9c0" stroke="#8a5a00" stroke-width="2"/><text x="60" y="866" font-size="23" text-anchor="start" font-weight="bold" fill="#8a5a00">Fora do raio → ocorrência para a gestora</text><text x="60" y="900" font-size="20" text-anchor="start" fill="#1d1d1b">Marcação gravada, comprovante emitido, sem bloqueio.</text><text x="60" y="936" font-size="20" text-anchor="start" font-style="italic" fill="#5a5a55">Renata: “cliente atendeu em unidade nova,</text><text x="60" y="962" font-size="20" text-anchor="start" font-style="italic" fill="#5a5a55">ainda não cadastrada.”</text><rect x="40" y="1008" width="310" height="360" rx="6" fill="#e3efe3" stroke="#2e6b3a" stroke-width="2"/><rect x="370" y="1008" width="310" height="360" rx="6" fill="#f8e1df" stroke="#b3261e" stroke-width="2"/><text x="195" y="1048" font-size="23" text-anchor="middle" font-weight="bold" fill="#2e6b3a">GUARDADO</text><text x="525" y="1048" font-size="23" text-anchor="middle" font-weight="bold" fill="#b3261e">NÃO GUARDADO</text><circle cx="62" cy="1087" r="5" fill="#2e6b3a"/><text x="78" y="1094" font-size="20" text-anchor="start" fill="#1d1d1b">hora da marcação</text><text x="78" y="1122" font-size="20" text-anchor="start" fill="#1d1d1b">com fuso</text><circle cx="62" cy="1157" r="5" fill="#2e6b3a"/><text x="78" y="1164" font-size="20" text-anchor="start" fill="#1d1d1b">posição no instante</text><text x="78" y="1192" font-size="20" text-anchor="start" fill="#1d1d1b">e precisão</text><circle cx="62" cy="1227" r="5" fill="#2e6b3a"/><text x="78" y="1234" font-size="20" text-anchor="start" fill="#1d1d1b">distância ao cliente</text><circle cx="62" cy="1269" r="5" fill="#2e6b3a"/><text x="78" y="1276" font-size="20" text-anchor="start" fill="#1d1d1b">ocorrência e explicação</text><circle cx="62" cy="1311" r="5" fill="#2e6b3a"/><text x="78" y="1318" font-size="20" text-anchor="start" fill="#1d1d1b">posição retida 90 dias</text><circle cx="392" cy="1087" r="5" fill="#b3261e"/><text x="408" y="1094" font-size="20" text-anchor="start" fill="#1d1d1b">trajeto entre clientes</text><circle cx="392" cy="1129" r="5" fill="#b3261e"/><text x="408" y="1136" font-size="20" text-anchor="start" fill="#1d1d1b">posição fora</text><text x="408" y="1164" font-size="20" text-anchor="start" fill="#1d1d1b">das marcações</text><circle cx="392" cy="1199" r="5" fill="#b3261e"/><text x="408" y="1206" font-size="20" text-anchor="start" fill="#1d1d1b">foto do rosto (só o</text><text x="408" y="1234" font-size="20" text-anchor="start" fill="#1d1d1b">resultado da biometria)</text><circle cx="392" cy="1269" r="5" fill="#b3261e"/><text x="408" y="1276" font-size="20" text-anchor="start" fill="#1d1d1b">contatos e outros</text><text x="408" y="1304" font-size="20" text-anchor="start" fill="#1d1d1b">dados do celular</text><text x="360" y="1450" font-size="19" text-anchor="middle" fill="#5a5a55">Finalidade escrita antes, mínimo necessário</text><text x="360" y="1480" font-size="19" text-anchor="middle" fill="#5a5a55">(LGPD, art. 6º, I e III). Regras do exemplo.</text><text x="696" y="1498" font-size="16" text-anchor="end" fill="#5a5a55">Ilustração · Torno 2026</text></svg>