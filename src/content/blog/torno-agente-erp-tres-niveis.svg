<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Três níveis de ação de um agente no ERP</title><desc id="desc">Cartões mostram consultar, preparar e executar, cada qual com maior responsabilidade.</desc><rect width="1200" height="620" fill="#f2f5f4"/><text x="58" y="78" font-family="Arial" font-size="38" font-weight="700" fill="#163a3f">O mesmo ERP. Três poderes diferentes.</text><g font-family="Arial"><rect x="56" y="130" width="340" height="414" rx="24" fill="#d9eee8"/><circle cx="107" cy="190" r="28" fill="#1e736c"/><text x="98" y="200" font-size="28" font-weight="700" fill="white">1</text><text x="85" y="275" font-size="36" font-weight="700" fill="#163a3f">Consultar</text><text x="85" y="334" font-size="23" fill="#31494a">Ler dados permitidos</text><text x="85" y="390" font-size="21" fill="#31494a">Ex.: status do pedido</text><text x="85" y="487" font-size="20" fill="#1e736c">Sem alterar o registro</text><rect x="430" y="130" width="340" height="414" rx="24" fill="#f7e6ba"/><circle cx="481" cy="190" r="28" fill="#986612"/><text x="472" y="200" font-size="28" font-weight="700" fill="white">2</text><text x="459" y="275" font-size="36" font-weight="700" fill="#493d22">Preparar</text><text x="459" y="334" font-size="23" fill="#5e5237">Propor um rascunho</text><text x="459" y="390" font-size="21" fill="#5e5237">Ex.: mudança de endereço</text><text x="459" y="487" font-size="20" fill="#986612">Aguardando revisão</text><rect x="804" y="130" width="340" height="414" rx="24" fill="#f4dcd8"/><circle cx="855" cy="190" r="28" fill="#9b4d43"/><text x="846" y="200" font-size="28" font-weight="700" fill="white">3</text><text x="833" y="275" font-size="36" font-weight="700" fill="#4b302e">Executar</text><text x="833" y="334" font-size="23" fill="#684644">Mudar o dado oficial</text><text x="833" y="390" font-size="21" fill="#684644">Ex.: confirmar alteração</text><text x="833" y="487" font-size="20" fill="#9b4d43">Exige controle próprio</text></g></svg>