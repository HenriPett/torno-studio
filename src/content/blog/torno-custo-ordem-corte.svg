<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1150" viewBox="0 0 720 1150" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Ordem aberta no fechamento: o que está em produção em elaboração</title><desc id="d1">Exemplo fictício. Corte de uma ordem de produção aberta no fechamento de 30/11/2026: OP 7002, 800 flanges FL-80, da Metalúrgica Exemplo Ltda. A barra de 800 peças tem duas camadas. Camada de material: 960 kg requisitados para as 800 peças, a R$ 13,00, R$ 12.480. Camada de conversão: só 440 peças passaram pela operação 10, torneamento CNC, com 88 horas: mão de obra 88 × 46,00 = R$ 4.048 e custos indiretos 88 × 120,00 = R$ 10.560; as outras 360 peças só têm material. Nenhuma peça foi apontada como produção acabada. Saldo em produção em elaboração: R$ 27.088. Pelo padrão equivalente, 800 × 15,00 + 440 × 33,00 = R$ 26.520; a diferença de R$ 568 é 480 de preço do material mais 88 de taxa da mão de obra. Ao lado, um alerta: OP 6950, sem movimento desde 14/10, ainda aberta, com saldo de R$ 1.150, entra na lista de ordens a encerrar ou justificar antes do fechamento.</desc><rect x="0.0" y="0.0" width="720.0" height="1150.0" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14.0" y="14.0" width="692.0" height="1122.0" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30.0" y="58.0" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Ordem aberta no fechamento</text><text x="30.0" y="92.0" font-size="22" text-anchor="start" font-weight="normal" fill="#1d1d1b">OP 7002 · 800 flanges · 30/11/2026</text><text x="30.0" y="136.0" font-size="22" text-anchor="start" font-weight="normal" fill="#4a4f55">nada apontado como acabado</text><rect x="470.0" y="108.0" width="222.0" height="40.0" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581.0" y="136.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><rect x="30.0" y="170.0" width="660.0" height="520.0" rx="6" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.5"/><text x="46.0" y="204.0" font-size="21" text-anchor="start" font-weight="bold" fill="#1d1d1b">Corte da ordem: 800 peças</text><rect x="60.0" y="236.0" width="330.0" height="100.0" rx="0" fill="#dde8f3" stroke="#1f4e79" stroke-width="1.5"/><rect x="390.0" y="236.0" width="270.0" height="100.0" rx="0" fill="#ffffff" stroke="#4a4f55" stroke-width="1.5" stroke-dasharray="6 5"/><text x="70.0" y="266.0" font-size="19" text-anchor="start" font-weight="bold" fill="#1f4e79">conversão: op. 10 feita</text><text x="70.0" y="292.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1f4e79">440 peças · 88 h</text><text x="70.0" y="316.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1f4e79">MOD 4.048 + CIF 10.560</text><text x="400.0" y="266.0" font-size="19" text-anchor="start" font-weight="bold" fill="#4a4f55">360 peças</text><text x="400.0" y="292.0" font-size="19" text-anchor="start" font-weight="normal" fill="#4a4f55">sem operação</text><rect x="60.0" y="336.0" width="600.0" height="70.0" rx="0" fill="#fff3cd" stroke="#b8860b" stroke-width="1.5"/><text x="70.0" y="366.0" font-size="19" text-anchor="start" font-weight="bold" fill="#7a5600">material: 960 kg × 13,00 = R$ 12.480</text><text x="70.0" y="392.0" font-size="18" text-anchor="start" font-weight="normal" fill="#7a5600">requisitado para as 800 peças</text><line x1="60.0" y1="418.0" x2="660.0" y2="418.0" stroke="#1d1d1b" stroke-width="2"/><line x1="60.0" y1="418.0" x2="60.0" y2="428.0" stroke="#1d1d1b" stroke-width="1.5"/><text x="60.0" y="450.0" font-size="17" text-anchor="middle" font-weight="normal" fill="#4a4f55">0</text><line x1="210.0" y1="418.0" x2="210.0" y2="428.0" stroke="#1d1d1b" stroke-width="1.5"/><text x="210.0" y="450.0" font-size="17" text-anchor="middle" font-weight="normal" fill="#4a4f55">200</text><line x1="390.0" y1="418.0" x2="390.0" y2="428.0" stroke="#1d1d1b" stroke-width="1.5"/><text x="390.0" y="450.0" font-size="17" text-anchor="middle" font-weight="normal" fill="#4a4f55">440</text><line x1="510.0" y1="418.0" x2="510.0" y2="428.0" stroke="#1d1d1b" stroke-width="1.5"/><text x="510.0" y="450.0" font-size="17" text-anchor="middle" font-weight="normal" fill="#4a4f55">600</text><line x1="660.0" y1="418.0" x2="660.0" y2="428.0" stroke="#1d1d1b" stroke-width="1.5"/><text x="660.0" y="450.0" font-size="17" text-anchor="middle" font-weight="normal" fill="#4a4f55">800</text><text x="360.0" y="476.0" font-size="17" text-anchor="middle" font-weight="normal" fill="#4a4f55">peças</text><text x="46.0" y="516.0" font-size="21" text-anchor="start" font-weight="bold" fill="#1d1d1b">Saldo em elaboração</text><text x="674.0" y="516.0" font-size="22" text-anchor="end" font-weight="bold" fill="#1f4e79">R$ 27.088</text><text x="46.0" y="550.0" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">Padrão equivalente</text><text x="674.0" y="550.0" font-size="20" text-anchor="end" font-weight="normal" fill="#1d1d1b">R$ 26.520</text><text x="46.0" y="578.0" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55">800 × 15,00 + 440 × 33,00</text><text x="46.0" y="618.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">Diferença</text><text x="674.0" y="618.0" font-size="20" text-anchor="end" font-weight="bold" fill="#b42318">R$ 568</text><text x="46.0" y="646.0" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55">480 preço do material + 88 taxa da mão de obra</text><text x="46.0" y="672.0" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55">(horas iguais ao padrão para 440 peças)</text><rect x="30.0" y="710.0" width="660.0" height="170.0" rx="6" fill="#fbe4e1" stroke="#b42318" stroke-width="1.5"/><text x="46.0" y="744.0" font-size="21" text-anchor="start" font-weight="bold" fill="#b42318">Lista de fechamento</text><text x="46.0" y="778.0" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">OP 6950 · sem movimento desde 14/10</text><text x="46.0" y="808.0" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">ainda aberta · saldo R$ 1.150</text><text x="46.0" y="842.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">→ encerrar ou justificar antes de</text><text x="46.0" y="868.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">fechar novembro</text><rect x="30.0" y="900.0" width="660.0" height="170.0" rx="6" fill="#fff8e6" stroke="#b8860b" stroke-width="1.5"/><text x="46.0" y="934.0" font-size="21" text-anchor="start" font-weight="bold" fill="#1d1d1b">O que o contador recebe</text><text x="46.0" y="968.0" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">saldo por ordem, por item e por conta,</text><text x="46.0" y="998.0" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">que bate com o razão na mesma data;</text><text x="46.0" y="1028.0" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">ordens abertas com data, quantidade</text><text x="46.0" y="1056.0" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">iniciada e operações feitas</text><text x="30.0" y="1116.0" font-size="22" text-anchor="start" font-weight="normal" fill="#4a4f55">Ilustração · Torno 2026</text><text x="690.0" y="1116.0" font-size="22" text-anchor="end" font-weight="normal" fill="#4a4f55">números inventados</text></svg>