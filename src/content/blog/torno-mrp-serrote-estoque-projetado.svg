<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1300" viewBox="0 0 720 1300" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Estoque projetado da RF-125 em serrote e mensagem de antecipar</title><desc id="d1">Exemplo fictício. Gráfico em serrote do estoque projetado da roda fixa RF-125 da Indústria Exemplo Ltda., rodada de 16/11/2026, semanas de 16/11 a 21/12, com linha tracejada do estoque de segurança de 60. Com o PC 7731 antecipado: começo e fim de cada semana 220 e 60; 410 e 130; 130 e 70; 220 e 60; 160 e 80; 180 e 60, com chegadas de 350, 150, 100 e 100. Sem antecipar, a semana de 23/11 sobe só a 260 e termina em menos 20, falta de material; na semana de 30/11 o PC 7731 chega e a linha volta a 130 e termina em 70. Bilhete: mensagem antecipar PC 7731, 150 rodas, de 30/11 para 23/11; emitido em 13/11, 10 dias úteis com o feriado de 20/11, chegada em 30/11; para 23/11 o prazo padrão pedia emissão em 06/11, negociar; trata o comprador, sem pedido novo.</desc><rect x="0" y="0" width="720" height="1300" rx="0" fill="#f4efe6" stroke="none" stroke-width="0"/><text x="40" y="58" font-size="28" fill="#1d1d1b" font-weight="bold" text-anchor="start">Estoque projetado da RF-125</text><rect x="450" y="82" width="230" height="38" rx="6" fill="#1d1d1b" stroke="none" stroke-width="0"/><text x="565" y="109" font-size="22" fill="#f4efe6" font-weight="bold" text-anchor="middle">EXEMPLO FICTÍCIO</text><text x="40" y="104" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Rodada de 16/11/2026</text><text x="40" y="136" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Indústria Exemplo Ltda.</text><rect x="120" y="190" width="570" height="384.0" rx="0" fill="#fffdf8" stroke="#5c564c" stroke-width="1.5"/><path d="M120 526.0 L690 526.0" stroke="#1d1d1b" stroke-width="2.5" fill="none"/><text x="110" y="534.0" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="end">0</text><pa