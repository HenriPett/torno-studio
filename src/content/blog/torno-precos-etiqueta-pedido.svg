<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1400" viewBox="0 0 720 1400" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">A etiqueta do pedido: frente com o preço, verso com o porquê</title><desc id="d1">Exemplo fictício. Frente da etiqueta: pedido PV-1088, linha 1, Detergente 5 L, 60 unidades, R$ 32,51 por unidade, total R$ 1.950,60, preço gravado em 12/11/2026 às 14:20. Verso: tabela Revenda B versão 3, vigente desde 01/11; faixa de 50 unidades ou mais, menos 5 por cento; promoção de R$ 35,00 descartada porque a faixa deu menos; desconto manual de 3 por cento pelo vendedor, dentro do limite de 3 por cento, sem aprovação; Pix à vista, menos 2 por cento; arredondamento do unitário em 2 casas. Abaixo, em 01/12/2026 entra a Revenda B versão 4, mais 6 por cento, R$ 38,16; o pedido PV-1088 não muda; um pedido novo de 02/12 parte de R$ 38,16. Torno Studio 2026.</desc><rect x="0" y="0" width="720" height="1400" fill="#f4efe6"/><text x="40" y="58" font-size="32" fill="#1d1d1b" font-weight="bold" text-anchor="start">A etiqueta do pedido</text><text x="40" y="98" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Pedido PV-1088 · linha 1</text><rect x="450" y="76" width="230" height="38" rx="6" fill="#1d1d1b"/><text x="565" y="103" font-size="22" fill="#f4efe6" font-weight="bold" text-anchor="middle">EXEMPLO FICTÍCIO</text><path d="M68 128 C 30 150, 30 190, 68 200" fill="none" stroke="#b8862f" stroke-width="4"/><path d="M80 130 L680 130 L680 460 L80 460 L40 420 L40 170 Z" fill="#fffdf7" stroke="#1d1d1b" stroke-width="3"/><circle cx="68" cy="200" r="10" fill="#f4efe6" stroke="#1d1d1b" stroke-width="3"/><text x="84" y="180" font-size="22" fill="#5c564c" font-weight="bold" text-anchor="start">FRENTE</text><text x="84" y="226" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Detergente 5 L · 60 un</text><text x="84" y="300" font-size="48" fill="#2f7d4f" font-weight="bold" text-anchor="start">R$ 32,51</text><text x="300" y="300" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">por unidade</text><path d="M84 326 L656 326" stroke="#d9cfbf" stroke-width="3"/><text x="84" y="366" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Total da linha</text><text x="656" y="366" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="end">R$ 1.950,60</text><text x="84" y="410" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Gravado em</text><text x="656" y="410" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="end">12/11/2026 14:20</text><path d="M68 470 C 30 492, 30 530, 68 540" fill="none" stroke="#b8862f" stroke-width="4"/><path d="M80 480 L680 480 L680 950 L80 950 L40 910 L40 520 Z" fill="#fffdf7" stroke="#1d1d1b" stroke-width="3"/><circle cx="68" cy="540" r="10" fill="#f4efe6" stroke="#1d1d1b" stroke-width="3"/><text x="84" y="530" font-size="22" fill="#5c564c" font-weight="bold" text-anchor="start">VERSO · por que este preço</text><text x="84" y="580" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Tabela</text><text x="250" y="580" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Revenda B v3 (desde 01/11)</text><text x="84" y="630" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Faixa</text><text x="250" y="630" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">≥ 50 un: −5% → 34,20</text><text x="84" y="680" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Promoção</text><text x="250" y="680" font-size="22" fill="#5c564c" font-weight="bold" text-anchor="start">R$ 35,00 descartada</text><text x="84" y="730" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Manual</text><text x="250" y="730" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">−3% · vendedor · limite 3%</text><text x="84" y="780" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Aprovação</text><text x="250" y="780" font-size="22" fill="#2f7d4f" font-weight="bold" text-anchor="start">não exigida</text><text x="84" y="830" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Pagamento</text><text x="250" y="830" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Pix à vista: −2%</text><text x="84" y="880" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Arredonda</text><text x="250" y="880" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">unitário, 2 casas</text><rect x="40" y="990" width="640" height="300" rx="8" fill="#d9cfbf"/><text x="60" y="1032" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">01/12/2026 · entra Revenda B v4</text><text x="60" y="1072" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">+6% na tabela: R$ 36,00 → R$ 38,16</text><g transform="rotate(-4 360 1140)"><rect x="70" y="1102" width="580" height="74" rx="8" fill="none" stroke="#2f7d4f" stroke-width="5"/><text x="360" y="1150" font-size="28" fill="#2f7d4f" font-weight="bold" text-anchor="middle">PV-1088 CONTINUA R$ 32,51</text></g><text x="60" y="1222" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Pedido novo em 02/12:</text><text x="60" y="1260" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">parte de R$ 38,16, com as mesmas regras</text><text x="680" y="1360" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="end">Ilustração · Torno Studio 2026</text></svg>