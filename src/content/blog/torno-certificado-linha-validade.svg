<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1215" viewBox="0 0 720 1215" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Dois certificados, uma troca sem parar</title><desc id="d1">Exemplo fictício. Linha do tempo de novembro de 2026 a janeiro de 2027 com dois trilhos de validade da Distribuidora Exemplo de Ferramentas Ltda. CERT-2026, série terminando em 7F3A, vence na quinta-feira 14/01/2027 às 16h20. Alertas: 30/11 (45 dias antes, enviado); 15/12, 30/12, 07/01 e 13/01 cancelados porque o certificado deixou de estar em uso. CERT-2027, série terminando em 9C41, válido de 09/12/2026 às 10h05 a 09/12/2027. 09/12: carga, com uma senha errada recusada, e teste em homologação de NF-e da matriz e da filial, distribuição de DF-e e NFS-e. 10/12: aprovação do diretor. 14/12 às 6h30: ativação; o CERT-2026 vira reserva, com volta possível, até 14/01. 15/01: arquivo antigo apagado do cofre. Faixa de sobreposição de 09/12 a 14/01: os dois certificados válidos ao mesmo tempo. Próximo alerta: 25/10/2027, 45 dias antes do vencimento do CERT-2027.</desc><defs><marker id="ab" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L16,7 L0,14 z" fill="#1f4e79"/></marker><marker id="ag" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L16,7 L0,14 z" fill="#2e7d32"/></marker><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L16,7 L0,14 z" fill="#b3261e"/></marker><marker id="ak" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L16,7 L0,14 z" fill="#1d1d1b"/></marker><marker id="ay" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L16,7 L0,14 z" fill="#6b6b66"/></marker></defs><rect x="0" y="0" width="720" height=