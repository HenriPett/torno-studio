9766" y="570" font-size="15" text-anchor="middle" font-weight="bold" fill="#b26a00">os dois válidos: dá para trocar sem parar</text><text x="30" y="346" font-size="18" text-anchor="start" font-weight="bold" fill="#1f4e79">CERT-2026 · série …7F3A</text><rect x="30" y="286" width="256.9334795321637" height="28" rx="0" fill="#1f4e79" stroke="#1f4e79" stroke-width="1"/><pattern id="hz" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#dbe7f3"/><line x1="0" y1="0" x2="0" y2="10" stroke="#1f4e79" stroke-width="4"/></pattern><rect x="286.9334795321637" y="286" width="336.13764619883045" height="28" rx="0" fill="url(#hz)" stroke="#1f4e79" stroke-width="1.5"/><circle cx="623.0711257309941" cy="300" r="11" fill="#b3261e" stroke="none" stroke-width="0"/><text x="623.0711257309941" y="340" font-size="15" text-anchor="middle" font-weight="bold" fill="#b3261e">vence</text><text x="623.0711257309941" y="358" font-size="15" text-anchor="middle" font-weight="bold" fill="#b3261e">14/01 16h20</text><text x="455.0023026315789" y="340" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f4e79">reserva:</text><text x="455.0023026315789" y="358" font-size="15" text-anchor="middle" font-weight="normal" fill="#1f4e79">volta com um clique</text><path d="M123.21052631578948,256 L145.21052631578948,256 L134.21052631578948,274 Z" fill="#b26a00" stroke="#b26a00" stroke-width="2"/><text x="134.21052631578948" y="250" font-size="15" text-anchor="middle" font-weight="bold" fill="#b26a00">D−45</text><path d="M283.7368421052631,256 L305.7368421052631,256 L294.7368421052631,274 Z" fill="#ffffff" stroke="#b26a00" stroke-width="2"/><text x="294.7368421052631" y="250" font-size="15" text-anchor="middle" font-weight="bold" fill="#6b6b66">D−30</text><line x1="281.7368421052631" y1="253" x2="307.7368421052631" y2="277" stroke="#6b6b66" stroke-width="2"/><path d="M444.2631578947368,256 L466.2631578947368,256 L455.2631578947368,274 Z" fill="#ffffff" stroke="#b26a00" stroke-width="2"/><text x="455.2631578947368" y="250" font-size="15" text-anchor="middle" font-weight="bold" fill="#6b6b66">D−15</text><line x1="442.2631578947368" y1="253" x2="468.2631578947368" y2="277" stroke="#6b6b66" stroke-width="2"/><path d="M529.8771929824561,256 L551.8771929824561,256 L540.8771929824561,274 Z" fill="#ffffff" stroke="#b26a00" stroke-width="2"/><text x="540.8771929824561" y="250" font-size="15" text-anchor="middle" font-weight="bold" fill="#6b6b66">D−7</text><line x1="527.8771929824561" y1="253" x2="553.8771929824561" y2="277" stroke="#6b6b66" stroke-width="2"/><path d="M594.0877192982456,256 L616.0877192982456,256 L605.0877192982456,274 Z" fill="#ffffff" stroke="#b26a00" stroke-width="2"/><text x="605.0877192982456" y="250" font-size="15" text-anchor="middle" font-weight="bold" fill="#6b6b66">D−1</text><line x1="592.0877192982456" y1="253" x2="618.0877192982456" y2="277" stroke="#6b6b66" stroke-width="2"/><text x="30" y="436" font-size="18" text-anchor="start" font-weight="bold" fill="#2e7d32">CERT-2027 · série …9C41</text><rect x="234.98538011695905" y="456" width="455.01461988304095" height="28" rx="0" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><line x1="690" y1="470" x2="704" y2="470" stroke="#2e7d32" stroke-width="4" marker-end="url(#ag)"/><circle cx="234.98538011695905" cy="470" r="9" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><line x1="286.9334795321637" y1="314" x2="286.9334795321637" y2="454" stroke="#1d1d1b" stroke-width="4" marker-end="url(#ak)"/><line x1="234.98538011695905" y1="486" x2="211.98538011695905" y2="512" stroke="#6b6b66" stroke-width="1.5"/><circle cx="211.98538011695905" cy="526" r="15" fill="#1d1d1b" stroke="none" stroke-width="0"/><text x="211.98538011695905" y="532" font-size="17" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text><line x1="246.57894736842104" y1="486" x2="250.57894736842104" y2="512" stroke="#6b6b66" stroke-width="1.5"/><circle cx="250.57894736842104" cy="526" r="15" fill="#1d1d1b" stroke="none" stroke-width="0"/><text x="250.57894736842104" y="532" font-size="17" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text><line x1="286.9334795321637" y1="486" x2="289.9334795321637" y2="512" stroke="#6b6b66" stroke-width="1.5"/><circle cx="289.9334795321637" cy="526" r="15" fill="#1d1d1b" stroke="none" stroke-width="0"/><text x="289.9334795321637" y="532" font-size="17" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text><line x1="630.5043859649123" y1="486" x2="630.5043859649123" y2="512" stroke="#6b6b66" stroke-width="1.5"/><circle cx="630.5043859649123" cy="526" r="15" fill="#1d1d1b" stroke="none" stroke-width="0"/><text x="630.5043859649123" y="532" font-size="17" text-anchor="middle" font-weight="bold" fill="#ffffff">4</text><text x="30" y="630" font-size="22" text-anchor="start" font-weight="bold" fill="#1d1d1b">O que aconteceu</text><circle cx="46" cy="666" r="15" fill="#1d1d1b" stroke="none" stroke-width="0"/><text x="46" y="672" font-size="17" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text><text x="74" y="672" font-size="17" text-anchor="start" font-weight="bold" fill="#1d1d1b">qua 09/12</text><text x="180" y="672" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">CERT-2027 emitido às 10h05. Carga: senha errada</text><text x="180" y="695" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">recusada, nada muda em produção; com a senha certa,</text><text x="180" y="718" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">entra "em teste". Homologação: NF-e da matriz e da</text><text x="180" y="741" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">filial, distribuição de DF-e e NFS-e.</text><circle cx="46" cy="784" r="15" fill="#1d1d1b" stroke="none" stroke-width="0"/><text x="46" y="790" font-size="17" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text><text x="74" y="790" font-size="17" text-anchor="start" font-weight="bold" fill="#1d1d1b">qui 10/12</text><text x="180" y="790" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">Diretor aprova a ativação; TI agenda.</text><circle cx="46" cy="833" r="15" fill="#1d1d1b" stroke="none" stroke-width="0"/><text x="46" y="839" font-size="17" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text><text x="74" y="839" font-size="17" text-anchor="start" font-weight="bold" fill="#1d1d1b">seg 14/12</text><text x="180" y="839" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">6h30: CERT-2027 ativo; CERT-2026 vira reserva.</text><text x="180" y="862" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">Primeiras notas às 6h52 (matriz) e 7h10 (filial).</text><circle cx="46" cy="905" r="15" fill="#1d1d1b" stroke="none" stroke-width="0"/><text x="46" y="911" font-size="17" text-anchor="middle" font-weight="bold" fill="#ffffff">4</text><text x="74" y="911" font-size="17" text-anchor="start" font-weight="bold" fill="#1d1d1b">sex 15/01</text><text x="180" y="911" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">CERT-2026 venceu na véspera às 16h20;</text><text x="180" y="934" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">arquivo e senha saem do cofre; cadastro fica.</text><path d="M40,963 L62,963 L51,981 Z" fill="#b26a00" stroke="#b26a00" stroke-width="2"/><text x="74" y="977" font-size="16" text-anchor="start" font-weight="normal" fill="#1d1d1b">alerta enviado (D−45, 30/11)</text><path d="M40,993 L62,993 L51,1011 Z" fill="#ffffff" stroke="#b26a00" stroke-width="2"/><line x1="39" y1="987" x2="63" y2="1013" stroke="#6b6b66" stroke-width="2"/><text x="74" y="1007" font-size="16" text-anchor="start" font-weight="normal" fill="#1d1d1b">cancelado: o certificado saiu de uso (15/12, 30/12, 07/01, 13/01)</text><rect x="30" y="1047" width="660" height="62" rx="6" fill="#e3f0e3" stroke="#2e7d32" stroke-width="2"/><text x="46" y="1073" font-size="18" text-anchor="start" font-weight="bold" fill="#2e7d32">Próximo alerta: seg 25/10/2027</text><text x="46" y="1097" font-size="16" text-anchor="start" font-weight="normal" fill="#2e7d32">45 dias antes do vencimento do CERT-2027 (09/12/2027, 10h05)</text><line x1="30" y1="1153" x2="690" y2="1153" stroke="#6b6b66" stroke-width="1"/><text x="30" y="1181" font-size="15" text-anchor="start" font-weight="normal" fill="#6b6b66">Exemplo fictício: certificados, séries, datas e alertas inventados.</text><text x="690" y="1181" font-size="15" text-anchor="end" font-weight="normal" fill="#6b6b66">Ilustração · Torno 2026</text></svg>