<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1480" viewBox="0 0 720 1480" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">A plaqueta fica; a história se acumula</title><desc id="d1">Exemplo fictício. Plaqueta patrimonial ampliada do notebook PAT-000187 da Exemplo Armazéns Gerais Ltda., com um QR ilustrativo; a plaqueta carrega só o número, e local e responsável ficam no sistema. Ficha de vida: 08/05/2024, NF-e de entrada, R$ 6.000; 13/05/2024, disponível para uso na filial, com Bruno, depreciação contábil de R$ 90 por mês e fiscal de R$ 100 por mês; 03/03/2025, sai da filial, em trânsito; 05/03/2025, aceite de Ana na matriz por leitura da plaqueta, centro de custo muda; 28/10/2026, furto com boletim de ocorrência, não chegou ao sistema; 16/11/2026, inventário, cadastrado e não achado; 19/11/2026, baixa aprovada, 30 quotas, valor contábil e perda de R$ 3.300, saldo fiscal de R$ 3.000 para o contador. Carimbo: baixado, não excluído.</desc><rect x="0" y="0" width="720" height="1480" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="10" y="10" width="700" height="1460" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="450" y="24" width="246" height="46" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="573" y="56" font-size="22" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="118" font-size="32" text-anchor="start" font-weight="bold" fill="#1d1d1b">A plaqueta fica; a</text><text x="30" y="158" font-size="32" text-anchor="start" font-weight="bold" fill="#1d1d1b">história se acumula</text><text x="30" y="198" font-size="22" text-anchor="start" fill="#5a5a55">Notebook PAT-000187 · da compra à baixa</text><rect x="46" y="236" width="640" height="300" rx="18" fill="#bdb9ae" stroke="none" stroke-width="0"/><rect x="40" y="230" width="640" height="300" rx="18" fill="#e4e2dc" stroke="#1d1d1b" stroke-width="3"/><circle cx="64" cy="25