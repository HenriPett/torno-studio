<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1660" viewBox="0 0 720 1660" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Inventário da matriz: onde cada bem estava</title><desc id="d1">Exemplo fictício. Planta baixa do escritório e do armazém da matriz da Exemplo Armazéns Gerais Ltda. no inventário de segunda 16/11/2026, com 248 bens esperados. Lido no local: 236. Lido em outro local: 5 (3 cadeiras do RH na sala de reunião; 2 monitores do financeiro no comercial). Cadastrado e não achado: 7 (233 impressora e 175 notebook no financeiro; 098 cadeira no RH; 210 projetor no comercial; 187 notebook na coordenação; 140 e 141 cadeiras no depósito). Achado sem cadastro: 3 (cafeteira em comodato na recepção; nobreak de R$ 780 no financeiro; monitor sem plaqueta no comercial). 236 + 5 + 7 = 248. Segunda rodada em 17 e 18/11: 140 e 141 reetiquetadas; 175 em home office, localizado com termo e foto; 210 em conserto com nota de remessa de 26/10; 187 furtado em 28/10 com boletim, proposta de baixa; 098 descartada em agosto, declaração, baixa por sucata; 233 pendente com prazo. Não achado não vira baixa automática.</desc><rect x="0" y="0" width="720" height="1660" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="10" y="10" width="700" height="1640" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="450" y="24" width="246" height="46" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="573" y="56" font-size="22" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="118" font-size="32" text-anchor="start" font-weight="bold" fill="#1d1d1b">Inventário da matriz:</text><text x="30" y="158" font-size="32" text-anchor="start" font-weight="bold" fill="#1d1d1b">onde cada bem estava</text><text x="30" y="198" font-size="22" text-anchor="start" fill="#5a5a55">Exemplo Armazéns Gerais · segunda 16/11/2026</text><text x="30" y="228" font-size="22" text-anc