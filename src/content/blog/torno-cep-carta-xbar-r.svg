<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1270" viewBox="0 0 720 1270" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Carta X̄-R do diâmetro do eixo EX-12: estudo e monitoramento</title><desc id="d1">Exemplo fictício. Carta de médias e amplitudes do diâmetro do eixo EX-12 da Metalúrgica Exemplo Ltda., torno TC-04, subgrupos de 5 peças seguidas, um por hora. Subgrupos 1 a 25: fase de estudo; 26 a 33: monitoramento com os limites v1. Média: LC 20,0040 mm, LSC 20,0171, LIC 19,9908; linha de +2 sigma em 20,0127. Subgrupos 29 e 30 acima de +2 sigma, sem sinal com as regras da empresa. Subgrupo 31 com média 20,0198, acima do LSC: sinal. Amplitude: LC 0,0227, LSC 0,0481, LIC 0; subgrupo 33 com amplitude 0,054: sinal. Contas: LSC = 20,00395 + 0,577 × 0,02272 = 20,0171; LIC = 19,9908; LSC da amplitude = 2,115 × 0,02272 = 0,0481.</desc><rect x="0.0" y="0.0" width="720.0" height="1270.0" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14.0" y="14.0" width="692.0" height="1242.0" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30.0" y="58.0" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Eixo EX-12 · carta X̄-R do diâmetro</text><text x="30.0" y="92.0" font-size="22" text-anchor="start" font-weight="normal" fill="#1d1d1b">Metalúrgica Exemplo Ltda. · torno TC-04</text><text x="30.0" y="136.0" font-size="22" text-anchor="start" font-weight="normal" fill="#4a4f55">5 peças seguidas por hora</text><rect x="470.0" y="108.0" width="222.0" height="40.0" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581.0" y="136.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><rect x="30.0" y="160.0" width="660.0" height="452.0" rx="0" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.5"/><text x="46.0" y="188.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">Média do subgrupo (mm)</text><rect x="441.8