79">ter 12/08/2025</text><text x="184" y="384" font-size="17" text-anchor="start" fill="#1d1d1b">aditivo 01: câmara 5 e novo valor mensal</text><text x="184" y="404" font-size="15" text-anchor="start" fill="#5a5a55">a cláusula de preço passa a valer pelo aditivo</text><rect x="120" y="440" width="60" height="44" rx="6" fill="#fdecea" stroke="#b3261e" stroke-width="3"/><text x="150" y="469" font-size="22" text-anchor="middle" font-weight="bold" fill="#b3261e">⇄</text><text x="194" y="456" font-size="17" text-anchor="start" font-weight="bold" fill="#b3261e">qua 31/12/2025 · limite do aviso</text><text x="194" y="478" font-size="17" text-anchor="start" fill="#1d1d1b">passou sem decisão: a planilha só tinha</text><text x="194" y="500" font-size="17" text-anchor="start" fill="#1d1d1b">o vencimento (31/03/2026)</text><text x="30" y="572" font-size="18" text-anchor="start" font-weight="bold" fill="#5a5a55">2026</text><circle cx="150" cy="566" r="13" fill="#fdecea" stroke="#b3261e" stroke-width="3"/><text x="184" y="562" font-size="17" text-anchor="start" font-weight="bold" fill="#b3261e">qua 01/04/2026</text><text x="184" y="584" font-size="17" text-anchor="start" fill="#1d1d1b">renovou sozinho: 2º período</text><text x="184" y="604" font-size="15" text-anchor="start" fill="#5a5a55">até qua 31/03/2027</text><rect x="176" y="626" width="516" height="150" rx="6" fill="#fff" stroke="#a66f00" stroke-width="2"/><text x="194" y="652" font-size="17" text-anchor="start" font-weight="bold" fill="#a66f00">alertas: 60, 30, 15 e 7 dias antes do limite interno</text><circle cx="150" cy="678" r="7" fill="#a66f00" stroke="#a66f00" stroke-width="1"/><text x="194" y="682" font-size="17" text-anchor="start" font-weight="bold" fill="#1d1d1b">sex 16/10</text><text x="294" y="682" font-size="17" text-anchor="start" fill="#1d1d1b">60 dias (sáb 17/10 → dia útil anterior)</text><circle cx="150" cy="706" r="7" fill="#a66f00" stroke="#a66f00" stroke-width="1"/><text x="194" y="710" font-size="17" text-anchor="start" font-weight="bold" fill="#1d1d1b">seg 16/11</text><text x="294" y="710" font-size="17" text-anchor="start" fill="#1d1d1b">30 dias</text><circle cx="150" cy="734" r="7" fill="#a66f00" stroke="#a66f00" stroke-width="1"/><text x="194" y="738" font-size="17" text-anchor="start" font-weight="bold" fill="#1d1d1b">ter 01/12</text><text x="294" y="738" font-size="17" text-anchor="start" fill="#1d1d1b">15 dias</text><circle cx="150" cy="762" r="7" fill="#a66f00" stroke="#a66f00" stroke-width="1"/><text x="194" y="766" font-size="17" text-anchor="start" font-weight="bold" fill="#1d1d1b">qua 09/12</text><text x="294" y="766" font-size="17" text-anchor="start" fill="#1d1d1b">7 dias</text><circle cx="150" cy="828" r="13" fill="#fff" stroke="#1f4e79" stroke-width="3"/><text x="184" y="824" font-size="17" text-anchor="start" font-weight="bold" fill="#1f4e79">qua 09/12/2026</text><text x="184" y="846" font-size="17" text-anchor="start" fill="#1d1d1b">decisão: não renovar</text><text x="184" y="866" font-size="15" text-anchor="start" fill="#5a5a55">registrada por Paula R.; aprovada por Edson M.</text><circle cx="150" cy="906" r="13" fill="#fff" stroke="#1f4e79" stroke-width="3"/><text x="184" y="902" font-size="17" text-anchor="start" font-weight="bold" fill="#1f4e79">qui 10/12/2026</text><text x="184" y="924" font-size="17" text-anchor="start" fill="#1d1d1b">notificação enviada</text><text x="184" y="944" font-size="15" text-anchor="start" fill="#5a5a55">e-mail ao endereço da cláusula + carta com AR</text><circle cx="150" cy="984" r="13" fill="#dcefdc" stroke="#2e7d32" stroke-width="3"/><text x="184" y="980" font-size="17" text-anchor="start" font-weight="bold" fill="#2e7d32">seg 14/12/2026</text><text x="184" y="1002" font-size="17" text-anchor="start" fill="#1d1d1b">AR recebido: prova de entrega anexada</text><circle cx="150" cy="1050" r="13" fill="#fff" stroke="#a66f00" stroke-width="3"/><text x="184" y="1046" font-size="17" text-anchor="start" font-weight="bold" fill="#a66f00">qua 16/12/2026</text><text x="184" y="1068" font-size="17" text-anchor="start" fill="#1d1d1b">limite interno (15 dias antes do contratual)</text><rect x="120" y="1118" width="60" height="44" rx="6" fill="#dcefdc" stroke="#2e7d32" stroke-width="3"/><text x="150" y="1147" font-size="22" text-anchor="middle" font-weight="bold" fill="#2e7d32">⇄</text><text x="194" y="1134" font-size="17" text-anchor="start" font-weight="bold" fill="#2e7d32">qui 31/12/2026 · limite contratual do aviso</text><text x="194" y="1156" font-size="17" text-anchor="start" fill="#1d1d1b">confirmado pelo jurídico; a notificação</text><text x="194" y="1178" font-size="17" text-anchor="start" fill="#1d1d1b">já chegou: o ramo da renovação fecha</text><path d="M 159 1162 C 210 1230, 350 1250, 350 1290" fill="none" stroke="#5a5a55" stroke-width="3" stroke-dasharray="10 8"/><path d="M 141 1162 C 192 1240, 332 1260, 332 1300" fill="none" stroke="#5a5a55" stroke-width="3" stroke-dasharray="10 8"/><rect x="320" y="1300" width="330" height="74" rx="6" fill="#ecebe6" stroke="#5a5a55" stroke-width="2" stroke-dasharray="6 5"/><text x="336" y="1328" font-size="17" text-anchor="start" font-weight="bold" fill="#5a5a55">ramo fechado: renovação</text><text x="336" y="1352" font-size="17" text-anchor="start" fill="#5a5a55">até sex 31/03/2028</text><line x1="210" y1="1210" x2="250" y2="1250" stroke="#b3261e" stroke-width="4"/><line x1="250" y1="1210" x2="210" y2="1250" stroke="#b3261e" stroke-width="4"/><text x="30" y="1256" font-size="18" text-anchor="start" font-weight="bold" fill="#5a5a55">2027</text><rect x="110" y="1394" width="80" height="52" rx="6" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="2"/><text x="150" y="1427" font-size="20" text-anchor="middle" font-weight="bold" fill="#fff">FIM</text><text x="206" y="1416" font-size="18" text-anchor="start" font-weight="bold" fill="#1d1d1b">qua 31/03/2027 · encerramento</text><text x="206" y="1440" font-size="17" text-anchor="start" fill="#1d1d1b">pedidos novos bloqueados a partir de 01/04/2027</text><text x="30" y="1508" font-size="18" text-anchor="start" fill="#5a5a55">O alerta conta do limite do aviso, não do vencimento.</text><text x="30" y="1534" font-size="18" text-anchor="start" fill="#5a5a55">O desvio fica no aviso, 90 dias antes do fim.</text><text x="690" y="1534" font-size="18" text-anchor="end" fill="#5a5a55">Ilustração · Torno 2026</text></svg>