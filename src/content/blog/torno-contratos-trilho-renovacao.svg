<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1560" viewBox="0 0 720 1560" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">O trilho de um contrato com renovação automática</title><desc id="d1">Exemplo fictício. Contrato CT-FOR-031 da Exemplo Armazéns Frios Ltda. com a Refrigeração Exemplo Ltda., manutenção das câmaras frias, desenhado como uma linha de trem que desce pelo tempo, com estações e dois desvios. Estações: assinatura eletrônica na quinta 20/03/2025, versão assinada guardada no repositório; início na terça 01/04/2025, período de 12 meses com renovação automática por períodos iguais, salvo notificação escrita recebida com 90 dias de antecedência do término; aditivo 01 na terça 12/08/2025, inclusão da câmara 5 e novo valor mensal; primeiro desvio na quarta 31/12/2025, limite do aviso do primeiro período, que passou sem decisão porque a planilha só tinha o vencimento, e o trem seguiu para a renovação automática de quarta 01/04/2026, segundo período até quarta 31/03/2027. No segundo período: alertas de 60, 30, 15 e 7 dias antes do limite interno na sexta 16/10, segunda 16/11, terça 01/12 e quarta 09/12/2026; decisão de não renovar registrada por Paula R. e aprovada por Edson M. na quarta 09/12/2026; notificação enviada na quinta 10/12/2026 por e-mail ao endereço da cláusula e por carta com aviso de recebimento, recebido na segunda 14/12/2026; limite interno na quarta 16/12/2026; segundo desvio na quinta 31/12/2026, limite contratual para o fornecedor receber o aviso, confirmado pelo jurídico; a notificação fecha o ramo da renovação até sexta 31/03/2028 e o trem segue para o fim na quarta 31/03/2027, encerramento. Rodapé: o alerta conta do limite do aviso, não do vencimento; o desvio fica no aviso.</desc><rect x="0" y="0" width="720" height="1560" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="10" y="10" width="700" height="1540" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><rec