dth="4"/><line x1="134" y1="594" x2="166" y2="594" stroke="#c9c6bd" stroke-width="4"/><line x1="134" y1="616" x2="166" y2="616" stroke="#c9c6bd" stroke-width="4"/><line x1="134" y1="638" x2="166" y2="638" stroke="#c9c6bd" stroke-width="4"/><line x1="134" y1="660" x2="166" y2="660" stroke="#c9c6bd" stroke-width="4"/><line x1="134" y1="682" x2="166" y2="682" stroke="#c9c6bd" stroke-width="4"/><line x1="134" y1="704" x2="166" y2="704" stroke="#c9c6bd" stroke-width="4"/><line x1="134" y1="726" x2="166" y2="726" stroke="#c9c6bd" stroke-width="4"/><line x1="134" y1="748" x2="166" y2="748" stroke="#c9c6bd" stroke-width="4"/><line x1="134" y1="770" x2="166" y2="770" stroke="#c9c6bd" stroke-width="4"/><line x1="134" y1="792" x2="166" y2="792" stroke="#c9c6bd" stroke-width="4"/><line x1="134" y1="814" x2="166" y2="814" stroke="#c9c6bd" stroke-width="4"/><line x1="134" y1="836" x2="166" y2="836" stroke="#c9c6bd" stroke-width="4"/><line x1="134" y1="858" x2="166" y2="858" stroke="#c9c6bd" stroke-width="4"/><line x1="134" y1="880" x2="166" y2="880" stroke="#c9c6bd" stroke-width="4"/><line x1="134" y1="902" x2="166" y2="902" stroke="#c9c6bd" stroke-width="4"/><line x1="134" y1="924" x2="166" y2="924" stroke="#c9c6bd" stroke-width="4"/><line x1="134" y1="946" x2="166" y2="946" stroke="#c9c6bd" stroke-width="4"/><line x1="134" y1="968" x2="166" y2="968" stroke="#c9c6bd" stroke-width="4"/><line x1="134" y1="990" x2="166" y2="990" stroke="#c9c6bd" stroke-width="4"/><line x1="134" y1="1012" x2="166" y2="1012" stroke="#c9c6bd" stroke-width="4"/><line x1="134" y1="1034" x2="166" y2="1034" stroke="#c9c6bd" stroke-width="4"/><line x1="134" y1="1056" x2="166" y2="1056" stroke="#c9c6bd" stroke-width="4"/><line x1="134" y1="1078" x2="166" y2="1078" stroke="#c9c6bd" stroke-width="4"/><line x1="134" y1="1100" x2="166" y2="1100" stroke="#c9c6bd" stroke-width="4"/><line x1="134" y1="1122" x2="166" y2="1122" stroke="#c9c6bd" stroke-width="4"/><line x1="134" y1="1144" x2="166" y2="1144" stroke="#c