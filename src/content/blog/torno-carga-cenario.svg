<svg xmlns="http://www.w3.org/2000/svg" width="720" height="938" viewBox="0 0 720 938" role="img" aria-label="Antes de gerar a carga"><rect width="720" height="938" fill="#f7f6f2"/><text x="36" y="55" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#1c5a49">TORNO · GUIA VISUAL</text><text x="36" y="116" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#16181a">Antes de gerar a carga</text><text x="36" y="164" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">Descreva o uso que o ensaio representa.</text><rect x="32" y="200" width="656" height="135" rx="14" fill="#fff" stroke="#b4c6bd" stroke-width="2"/><text x="52" y="240" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1c5a49">1 · Quem e quando</text><text x="52" y="280" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">Quais perfis usam o sistema? Como o uso</text><text x="52" y="313" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">varia ao longo do tempo?</text><path d="M358 339 v12 m-6 -6 6 6 6 -6" fill="none" stroke="#1c5a49" stroke-width="3"/><rect x="32" y="355" width="656" height="135" rx="14" fill="#fff" stroke="#b4c6bd" stroke-width="2"/><text x="52" y="395" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1c5a49">2 · Quais ações</text><text x="52" y="435" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">Descreva jornadas, frequência e dados usados</text><text x="52" y="468" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">em cada ação.</text><path d="M358 494 v12 m-6 -6 6 6 6 -6" fill="none" stroke="#1c5a49" stroke-width="3"/><rect x="32" y="510" width="656" height="135" rx="14" fill="#fff" stroke="#b4c6bd" stroke-width="2"/><text x="52" y="550" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1c5a49">3 · Qual ambiente</text><text x="52" y="590" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">Registre versão, recursos, configuração e</text><text x="52" y="623" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">diferenças para o uso real.</text><path d="M358 649 v12 m-6 -6 6 6 6 -6" fill="none" stroke="#1c5a49" stroke-width="3"/><rect x="32" y="665" width="656" height="135" rx="14" fill="#fff" stroke="#b4c6bd" stroke-width="2"/><text x="52" y="705" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#1c5a49">4 · Quais dependências</text><text x="52" y="745" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">Indique serviços reais ou simulados e os</text><text x="52" y="778" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#16181a">limites do ensaio.</text><text x="36" y="902" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="600" fill="#1c5a49">Cenário documentado → resultado interpretável.</text></svg>