<svg xmlns="http://www.w3.org/2000/svg" width="480" height="856" viewBox="0 0 480 856" role="img" aria-labelledby="title desc"><title id="title">Organize o que já sabe e o que falta decidir</title><desc id="desc">Três grupos para preparar orçamento: confirmado, a confirmar e fora da primeira etapa.</desc><rect width="480" height="856" rx="24" fill="#f5f2e9"/><g font-family="Arial, Helvetica, sans-serif" fill="#172b2b"><text x="24" y="40" font-size="18" font-weight="700" letter-spacing="1">TORNO · EXEMPLO HIPOTÉTICO</text><text x="24" y="86" font-size="30" font-weight="700">Organize o que já sabe</text><text x="24" y="123" font-size="30" font-weight="700">e o que falta decidir</text><rect x="20" y="154" width="440" height="168" rx="16" fill="#173c3c" stroke="#b4c6bd"/><g fill="#fff"><text x="40" y="190" font-size="22" font-weight="700">01 · CONFIRMADO</text><text x="40" y="230" font-size="22">Nome e versão dos sistemas;</text><text x="40" y="262" font-size="22">link da documentação oficial;</text><text x="40" y="294" font-size="22">contato técnico do fornecedor.</text></g><rect x="20" y="344" width="440" height="168" rx="16" fill="#fff" stroke="#b4c6bd"/><g fill="#172b2b"><text x="40" y="380" font-size="22" font-weight="700">02 · A CONFIRMAR</text><text x="40" y="420" font-size="22">Exemplo: acesso para testes.</text><text x="40" y="452" font-size="22">Quem responde: fornecedor.</text><text x="40" y="484" font-size="22">Impacto: validar a integração.</text></g><rect x="20" y="534" width="440" height="168" rx="16" fill="#fff" stroke="#b4c6bd"/><g fill="#172b2b"><text x="40" y="570" font-size="22" font-weight="700">03 · FORA DA ETAPA</text><text x="40" y="610" font-size="22">Exemplo: importar todo</text><text x="40" y="642" font-size="22">o histórico de pedidos.</text><text x="40" y="674" font-size="22">Registrar a exclusão na proposta.</text></g><text x="24" y="740" font-size="21" font-weight="700">Pendência precisa de responsável</text><text x="24" y="771" font-size="21" font-weight="700">e impacto descrito.</text></g></svg>
