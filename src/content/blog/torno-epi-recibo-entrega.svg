<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1580" viewBox="0 0 720 1580" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Recibo de entrega de EPI</title><desc id="d1">Exemplo fictício. Recibo de entrega de EPI em forma de canhoto, linha 5 da ficha de EPI de Carlos M., matrícula 0457, da Exemplo Metalúrgica Ltda. Função na data: operador de prensa, matriz prensas versão 3. EPI: luva anticorte, tamanho 10, 1 par. CA EX-207, vencido em 10/11/2026, com carimbo: CA vencido após a compra. Lote L-1020, recebido em 20/10/2026 com CA válido nessa data; validade do fabricante 08/2029. Motivo: troca periódica de 15 dias. Entregue em 18/11/2026 às 07h12, no almoxarifado central, por Ana P. Identificação: biometria digital, conferida. Devolução do par anterior: descarte. Próxima troca: 03/12/2026. No canhoto: a linha não é editada; correção só por estorno ligado. Abaixo, duas verificações: CA válido no recebimento, em 20/10, sim; validade do fabricante na entrega, sim; entrega permitida, conforme decisão registrada do SST.</desc><rect x="0" y="0" width="720" height="1580" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="10" y="10" width="700" height="1560" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="450" y="24" width="246" height="46" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="573" y="56" font-size="22" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="118" font-size="32" text-anchor="start" font-weight="bold" fill="#1d1d1b">Recibo de entrega de EPI</text><text x="30" y="158" font-size="22" text-anchor="start" fill="#5a5a55">Exemplo Metalúrgica Ltda. · ficha de EPI, linha 5</text><rect x="40" y="190" width="640" height="896" rx="8" fill="#ffffff" stroke="#1d1d1b" stroke-width="2"/><rect x="40" y="190" width="640" height="56" rx="8" fill="#1f4e79" stroke="#1f4e79" stroke-width="2"/><rect x="40" y="218" width="640" height=