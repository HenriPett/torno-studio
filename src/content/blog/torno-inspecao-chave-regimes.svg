<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1740" viewBox="0 0 720 1740" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Chave de regime de inspeção: normal, severo, atenuado e interrompido, com o histórico de 11 lotes</title><desc id="d1">Exemplo fictício. Chave seletora de regime de inspeção do fornecedor Usinados Exemplo Ltda. para o pino-guia PG-12, com quatro posições: normal, severo, interrompido e atenuado; em 11/11/2026 aponta para normal. Regras de troca conforme MIL-STD-105E, 4.7 e 4.8: normal para severo com 2 rejeitados em até 5 lotes seguidos; severo para normal com 5 lotes seguidos aceitos; severo para interrompido com 5 rejeições acumuladas no severo; normal para atenuado com 10 aceitos, limite da tabela, produção estável e a empresa considerar desejável; atenuado para normal com 1 rejeitado, produção irregular ou outro motivo. Histórico com NQA 1,5, nível II, n = 200: RC-01 3 defeituosas aceito; RC-02 9 rejeitado; RC-03 4 aceito; RC-04 8 rejeitado, passa a severo; RC-05 6 rejeitado com Ac 5; RC-06 2, RC-07 4, RC-08 1, RC-09 5 e RC-10 3 aceitos, volta a normal; RC-11 4 aceito. Rejeições acumuladas no severo: 1 de 5. Atenuado não usado.</desc><rect x="0" y="0" width="720" height="1740" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14" y="14" width="692" height="1712" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30" y="58" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Regime de inspeção · fornecedor</text><text x="30" y="92" font-size="22" text-anchor="start" font-weight="normal" fill="#1d1d1b">Usinados Exemplo Ltda. · pino-guia PG-12</text><text x="30" y="136" font-size="22" text-anchor="start" font-weight="normal" fill="#4a4f55">situação em 11/11/2026</text><rect x="470" y="108" width="222" height="40" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581" y="136" font-size="22" text-anchor="middle" font-weight="bold" 