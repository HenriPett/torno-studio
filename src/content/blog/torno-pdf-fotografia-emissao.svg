<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1160" viewBox="0 0 720 1160" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Fotografia na emissão: recibo congelado e cadastro alterado depois</title><desc id="d1">Exemplo fictício: o recibo R-0412 da Padaria Ribeiro ME, emitido em 03/11/2026 às 14:05 com endereço Rua das Acácias, 120, valor R$ 1.980,00 e modelo versão 2, fica guardado como uma fotografia. Em 10/11 o cadastro mostra Padaria Ribeiro Ltda. e Av. Brasil, 455. Reabrir ou tirar segunda via entrega o mesmo arquivo; regerar com o cadastro de hoje criaria documento diferente com o mesmo número; corrigir de verdade gera R-0412-A e marca o original como substituído. Torno Studio 2026.</desc><rect x="0" y="0" width="720" height="1160" rx="0" fill="#f4efe6"/><text x="40" y="58" font-size="32" fill="#1d1d1b" font-weight="bold" text-anchor="start">Fotografia na emissão</text><rect x="450" y="76" width="230" height="38" rx="6" fill="#1d1d1b"/><text x="565" y="103" font-size="22" fill="#f4efe6" font-weight="bold" text-anchor="middle">EXEMPLO FICTÍCIO</text><g transform="rotate(-3 220 354)"><rect x="46" y="150" width="360" height="420" rx="4" fill="#d9cfbf"/><rect x="40" y="144" width="360" height="420" rx="4" fill="#ffffff" stroke="#8a7f6e" stroke-width="2"/><rect x="62" y="166" width="316" height="300" rx="2" fill="#e9eef2"/><text x="80" y="206" font-size="24" fill="#1d1d1b" font-weight="bold" text-anchor="start">Recibo R-0412</text><text x="80" y="250" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Padaria Ribeiro ME</text><text x="80" y="294" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Rua das Acácias, 120</text><text x="80" y="338" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Valor: R$ 1.980,00</text><text x="80" y="382" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Serviço: instalação</text><text x="80" y="426" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Modelo: versão 2</text><text x="220" y="510" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="middle">emitido em 03/11/2026</text><text x="220" y="542" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="middle">14:05 · arquivo guardado</text></g><circle cx="372" cy="150" r="34" fill="#f3d98b" stroke="#1d1d1b" stroke-width="2"/><text x="372" y="158" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">clic</text><rect x="426" y="180" width="260" height="330" rx="6" fill="#fffdf7" stroke="#8a7f6e" stroke-width="2"/><text x="440" y="214" font-size="24" fill="#1d1d1b" font-weight="bold" text-anchor="start">Cadastro hoje</text><text x="440" y="244" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">10/11/2026</text><line x1="440" y1="258" x2="672" y2="258" stroke="#b9d3e6" stroke-width="1.5"/><rect x="436" y="270" width="240" height="72" rx="4" fill="#f3d98b"/><text x="444" y="298" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Padaria Ribeiro</text><text x="444" y="328" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Ltda.</text><rect x="436" y="352" width="240" height="72" rx="4" fill="#f3d98b"/><text x="444" y="380" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Av. Brasil, 455</text><text x="444" y="410" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">mudou em 07/11</text><text x="444" y="462" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Os dados</text><text x="444" y="492" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">mudaram depois.</text><text x="40" y="628" font-size="24" fill="#1d1d1b" font-weight="bold" text-anchor="start">Alguém pede o recibo de 03/11 de novo:</text><rect x="40" y="656" width="640" height="130" rx="6" fill="#fffdf7" stroke="#8a7f6e" stroke-width="2"/><circle cx="76" cy="696" r="16" fill="#2f7d4f"/><path d="M68 696 l6 6 l11 -12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="108" y="704" font-size="24" fill="#2f7d4f" font-weight="bold" text-anchor="start">Reabrir ou tirar 2ª via</text><text x="108" y="740" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Entrega o mesmo arquivo de 03/11:</text><text x="108" y="770" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Rua das Acácias, modelo 2, hash igual.</text><rect x="40" y="806" width="640" height="130" rx="6" fill="#fffdf7" stroke="#8a7f6e" stroke-width="2"/><circle cx="76" cy="846" r="16" fill="#c94f4f"/><path d="M69 839 l14 14 M83 839 l-14 14" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="108" y="854" font-size="24" fill="#c94f4f" font-weight="bold" text-anchor="start">Regerar com o cadastro de hoje</text><text x="108" y="890" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Recibo de 03/11 com endereço de 10/11:</text><text x="108" y="920" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">documento diferente com o mesmo número.</text><rect x="40" y="956" width="640" height="130" rx="6" fill="#fffdf7" stroke="#8a7f6e" stroke-width="2"/><circle cx="76" cy="996" r="16" fill="#1d1d1b"/><text x="76" y="1004" font-size="22" fill="#ffffff" font-weight="bold" text-anchor="middle">A</text><text x="108" y="1004" font-size="24" fill="#1d1d1b" font-weight="bold" text-anchor="start">Corrigir de verdade</text><text x="108" y="1040" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Novo documento R-0412-A, com motivo;</text><text x="108" y="1070" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">o original fica marcado como substituído.</text><text x="680" y="1130" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="end">Ilustração · Torno Studio 2026</text></svg>