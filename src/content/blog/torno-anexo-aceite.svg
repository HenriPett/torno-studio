<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1140" aria-labelledby="title desc" role="img" viewBox="0 0 720 1140"><title id="title">Uma matriz para aceitar anexos</title><desc id="desc">Ficha editorial de estado, acesso, substituição e erro, com resultados e evidências definidos. Não representa cliente ou ensaio real.</desc><rect width="720" height="1140" fill="#f7f6f2"/><text x="36" y="55" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">TORNO · ACEITE DO COMPORTAMENTO</text><text x="36" y="118" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="700">O que precisa ser demonstrado?</text><text x="36" y="164" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Combine cenário, resultado esperado e evidência.</text><rect width="656" height="166" x="32" y="210" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="253" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Estado</text><text x="54" y="301" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">O que a pessoa vê durante o envio</text><text x="54" y="341" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">e depois de aceitação ou rejeição?</text><rect width="656" height="166" x="32" y="404" fill="#eeece6" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="447" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Acesso</text><text x="54" y="495" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Quais perfis podem anexar e consultar?</text><text x="54" y="535" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Como conferir tentativas sem permissão?</text><rect width="656" height="166" x="32" y="598" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="641" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Substituição e histórico</text><text x="54" y="689" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">O que acontece ao trocar o arquivo?</text><text x="54" y="729" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Qual versão continua disponível e a quem?</text><rect width="656" height="166" x="32" y="792" fill="#eeece6" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="835" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Erro e retomada</text><text x="54" y="883" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Como lidar com interrupção ou rejeição?</text><text x="54" y="923" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">O que ficou salvo e o que pode ser repetido?</text><text x="36" y="1039" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">Registre limites, diferenças e pendências.</text><text x="36" y="1100" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Proposta editorial · sem caso ou teste real.</text></svg>