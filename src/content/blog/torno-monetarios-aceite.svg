<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1300" aria-labelledby="title desc" role="img" viewBox="0 0 720 1300"><title id="title">Evidências para aceitar valores e arredondamento</title><desc id="desc">Ficha editorial de entrada, cálculo intermediário, resultado esperado, tela e integração, e pendências. Sem valores numéricos ou resultados de cliente.</desc><rect width="720" height="1300" fill="#f7f6f2"/><text x="36" y="55" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">TORNO · EVIDÊNCIA PARA O ACEITE</text><text x="36" y="118" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700">Confira cada fronteira</text><text x="36" y="164" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Defina o esperado antes de executar o ensaio.</text><rect width="656" height="162" x="32" y="210" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="252" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Entrada</text><text x="54" y="298" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Qual valor, moeda e unidade entram?</text><text x="54" y="337" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Confira o formato e as condições do cenário.</text><rect width="656" height="162" x="32" y="398" fill="#eeece6" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="440" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Cálculo intermediário</text><text x="54" y="486" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Qual regra e etapa foram combinadas?</text><text x="54" y="525" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Preserve a referência usada na conferência.</text><rect width="656" height="162" x="32" y="586" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="628" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Resultado esperado</text><text x="54" y="674" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">O total corresponde à composição definida?</text><text x="54" y="713" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Confira casos de fronteira pertinentes.</text><rect width="656" height="162" x="32" y="774" fill="#eeece6" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="816" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Tela e integração</text><text x="54" y="862" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">O que é exibido, salvo, exportado ou enviado?</text><text x="54" y="901" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Compare o significado em cada saída.</text><rect width="656" height="162" x="32" y="962" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="1004" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Evidência e pendência</text><text x="54" y="1050" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Registre versão, esperado e observado.</text><text x="54" y="1089" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Qual diferença ainda precisa de resposta?</text><text x="36" y="1235" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Proposta editorial · sem caso ou teste real.</text></svg>