<svg xmlns="http://www.w3.org/2000/svg" width="720" height="822" aria-labelledby="title desc" role="img" viewBox="0 0 720 822"><title id="title">Da regra ao aceite</title><desc id="desc">Roteiro ilustrativo em ambiente autorizado.</desc><rect width="720" height="822" fill="#f7f6f2"/><text x="36" y="54" fill="#1c5a49" font-family="Arial,sans-serif" font-size="24" font-weight="700">TORNO · GUIA VISUAL</text><text x="36" y="113" fill="#16181a" font-family="Arial,sans-serif" font-size="32" font-weight="700">Da regra ao aceite</text><text x="36" y="158" fill="#16181a" font-family="Arial,sans-serif" font-size="24" font-weight="400">Roteiro ilustrativo em ambiente autorizado.</text><rect width="656" height="153" x="32" y="195" fill="#fff" stroke="#b4c6bd" stroke-width="2" rx="12"/><text x="52" y="234" fill="#1c5a49" font-family="Arial,sans-serif" font-size="27" font-weight="700">1 · Escrever a regra de negócio</text><text x="52" y="273" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Quem pode fazer qual ação, em qual</text><text x="52" y="304" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">recurso, escopo e condição?</text><rect width="656" height="153" x="32" y="369" fill="#fff" stroke="#b4c6bd" stroke-width="2" rx="12"/><text x="52" y="408" fill="#1c5a49" font-family="Arial,sans-serif" font-size="27" font-weight="700">2 · Conferir permitido e negado</text><text x="52" y="447" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Teste o acesso previsto e a tentativa</text><text x="52" y="478" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">fora do escopo ou da condição.</text><rect width="656" height="153" x="32" y="543" fill="#fff" stroke="#b4c6bd" stroke-width="2" rx="12"/><text x="52" y="582" fill="#1c5a49" font-family="Arial,sans-serif" font-size="27" font-weight="700">3 · Guardar evidência do aceite</text><text x="52" y="621" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Registre cenário, resultado esperado,</text><text x="52" y="652" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">resultado observado e limites do teste.</text><text x="36" y="757" fill="#1c5a49" font-family="Arial,sans-serif" font-size="24" font-weight="700">Use dados de teste e acesso autorizado.</text></svg>