<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Uma tarefa em dois idiomas, mostrada como um caderno aberto</title>
<desc id="desc">Um caderno editorial aberto apresenta o mesmo percurso fictício nas páginas PT e EN. Cada página contém formulário, confirmação e mensagem, indicando que todo o percurso precisa ser definido.</desc>
