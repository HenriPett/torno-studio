<svg xmlns="http://www.w3.org/2000/svg" width="720" height="668" viewBox="0 0 720 668" role="img" aria-labelledby="title desc"><title id="title">Comissão por faixa: sobre o total e marginal (exemplo fictício)</title><desc id="desc">Gráfico de degraus fictício: comissão no eixo vertical e vendas do mês no eixo horizontal, de R$ 0 a R$ 120.000,00, com faixas de 2% até R$ 50.000,00, 3% até R$ 100.000,00 e 4% acima. A linha contínua da faixa sobre o total salta de R$ 1.000,00 para R$ 1.500,03 em R$ 50.001,00 e de R$ 3.000,00 para R$ 4.000,04 em R$ 100.001,00, terminando em R$ 4.800,00. A linha tracejada da faixa marginal sobe sem saltos: R$ 1.000,00 em R$ 50.000,00, R$ 2.500,00 em R$ 100.000,00 e R$ 3.300,00 em R$ 120.000,00. Destaque: R$ 1,00 a mais de venda, R$ 1.000,04 a mais de comissão. Exemplo fictício.</desc><rect width="720" height="668" rx="24" fill="#f4f2eb"/><text x="24" y="42" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1e2837">Comissão por faixa de vendas</text><rect x="496" y="14" width="200" height="42" rx="21" fill="#fffdf8" stroke="#536270" stroke-width="2.5"/><text x="596.0" y="42.5" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#536270" text-anchor="middle">Exemplo fictício</text><path d="M24 92H74" stroke="#c8782f" stroke-width="5" stroke-linecap="round"/><text x="88" y="100" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e2837">Faixa sobre o total</text><path d="M24 134H74" stroke="#426d6b" stroke-width="4" stroke-dasharray="9 7" stroke-linecap="round"/><circle cx="49" cy="134" r="6" fill="#fffdf8" stroke="#426d6b" stroke-width="3"/><text x="88" y="142" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e2837">Faixa marginal</text><text x="24" y="186" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">(contínua: degraus · tracejada: sem saltos)</text><text x="24" y="228" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e2837">Comissão (R$)</text><rect x="80.0" y="272" width="195.0" height="248" fill="#fffdf8"/><rect x="81.0" y="236" width="193.0" height="34" rx="6" fill="#426d6b"/><text x="177.5" y="261" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">≤ 50 mil: 2%</text><rect x="275.0" y="272" width="195.0" height="248" fill="#eaeee9"/><rect x="276.0" y="236" width="193.0" height="34" rx="6" fill="#426d6b"/><text x="372.5" y="261" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">≤ 100 mil: 3%</text><rect x="470.0" y="272" width="226.0" height="248" fill="#fffdf8"/><rect x="471.0" y="236" width="224.0" height="34" rx="6" fill="#426d6b"/><text x="583.0" y="261" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">&gt; 100 mil: 4%</text><path d="M80.0 520.0H548.0" stroke="#d9d5c8" stroke-width="1.5"/><text x="72" y="527.0" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270" text-anchor="end">0</text><path d="M80.0 470.4H548.0" stroke="#d9d5c8" stroke-width="1.5"/><text x="72" y="477.4" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270" text-anchor="end">1.000</text><path d="M80.0 420.8H548.0" stroke="#d9d5c8" stroke-width="1.5"/><text x="72" y="427.8" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270" text-anchor="end">2.000</text><path d="M80.0 371.2H548.0" stroke="#d9d5c8" stroke-width="1.5"/><text x="72" y="378.2" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270" text-anchor="end">3.000</text><path d="M80.0 321.6H548.0" stroke="#d9d5c8" stroke-width="1.5"/><text x="72" y="328.6" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270" text-anchor="end">4.000</text><path d="M80.0 272.0H548.0" stroke="#d9d5c8" stroke-width="1.5"/><text x="72" y="279.0" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270" text-anchor="end">5.000</text><path d="M80.0 520V528" stroke="#536270" stroke-width="2"/><text x="80.0" y="554" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270" text-anchor="middle">0</text><path d="M275.0 520V528" stroke="#536270" stroke-width="2"/><text x="275.0" y="554" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270" text-anchor="middle">50.000</text><path d="M470.0 520V528" stroke="#536270" stroke-width="2"/><text x="470.0" y="554" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270" text-anchor="middle">100.000</text><path d="M548.0 520V528" stroke="#536270" stroke-width="2"/><path d="M80.0 272V520H548.0" fill="none" stroke="#536270" stroke-width="2.5"/><text x="314" y="596" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e2837" text-anchor="middle">Vendas do mês (R$ 0 a R$ 120.000)</text><path d="M80.0 520.0L275.0 470.4L275.0 445.6L470.0 371.2L470.0 321.6L548.0 281.9" fill="none" stroke="#c8782f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M80.0 520.0L275.0 470.4L470.0 396.0L548.0 356.3" fill="none" stroke="#426d6b" stroke-width="4" stroke-dasharray="9 7" stroke-linejoin="round" stroke-linecap="round"/><circle cx="275.0" cy="470.4" r="7" fill="#fffdf8" stroke="#426d6b" stroke-width="3"/><circle cx="470.0" cy="396.0" r="7" fill="#fffdf8" stroke="#426d6b" stroke-width="3"/><circle cx="548.0" cy="356.3" r="7" fill="#fffdf8" stroke="#426d6b" stroke-width="3"/><circle cx="548.0" cy="281.9" r="7" fill="#c8782f"/><text x="562.0" y="288.9" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e2837">R$ 4.800,00</text><text x="562.0" y="363.3" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e2837">R$ 3.300,00</text><rect x="92" y="282" width="320" height="104" rx="10" fill="#fffdf8" stroke="#c8782f" stroke-width="3"/><text x="106" y="312" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e2837">R$ 1,00 a mais de venda</text><text x="106" y="342" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#8a5a2b">→ R$ 1.000,04 a mais</text><text x="106" y="372" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#8a5a2b">de comissão</text><path d="M412 334.0C437 334.0 430.0 346.4 460.0 346.4" fill="none" stroke="#c8782f" stroke-width="3" stroke-linecap="round"/><path d="M460.0 346.4L446.0 336.4M460.0 346.4L446.0 356.4" fill="none" stroke="#c8782f" stroke-width="3" stroke-linecap="round"/><text x="24" y="652" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">Ilustração original Torno Studio, 2026 · exemplo fictício</text></svg>