<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1060" viewBox="0 0 720 1060" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Certo e errado lado a lado: o reajuste do contrato A</title><desc id="d1">Exemplo fictício. Comparação lado a lado do reajuste do contrato A da Manutenção Exemplo Ltda., mensalidade R$ 2.480,00. No alto, as 12 taxas mensais inventadas, de novembro de 2025 a outubro de 2026: 0,31; 0,42; 0,27; 0,55; 0,38; 0,29; 0,21; 0,18; −0,06; 0,15; 0,47 e 0,33 por cento. À esquerda, a conta pela regra do contrato do exemplo: multiplicar os 12 fatores, 1,0031 × 1,0042 × … × 1,0033 = 1,035552…; acumulado de 3,555…%, arredondado para 3,56% como o contrato manda; 2.480,00 × 1,0356 = 2.568,288, arredondado para R$ 2.568,29. À direita, três contas diferentes: somar as taxas dá 3,50% e R$ 2.566,80, R$ 1,49 a menos; usar o fator sem arredondar o percentual dá R$ 2.568,17, R$ 0,12 a menos, o que só é erro porque o contrato manda arredondar o percentual a duas casas; outubro digitado como 0,38 em vez de 0,33 dá 3,61% e R$ 2.569,53, R$ 1,24 a mais. Taxas inventadas, não são o IPCA publicado.</desc><rect x="0" y="0" width="720" height="1060" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14" y="14" width="692" height="1032" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30" y="58" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Mesma mensalidade, quatro contas</text><text x="30" y="90" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">contrato A · R$ 2.480,00 · IPCA do contrato</text><rect x="470" y="104" width="222" height="40" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581" y="132" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><text x="30" y="130" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55" font-style="italic">taxas inventadas, % ao mês, nov/25 a out/26</text><rect x="30" y="150" width="102" height="56" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.2"/><text x="81" y="172" font-size="18" text-anchor="middle" font-weight="normal" fill="#4a4f55">nov</text><text x="81" y="196" font-size="20" text-anchor="middle" font-weight="bold" fill="#1d1d1b">0,31</text><rect x="140" y="150" width="102" height="56" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.2"/><text x="191" y="172" font-size="18" text-anchor="middle" font-weight="normal" fill="#4a4f55">dez</text><text x="191" y="196" font-size="20" text-anchor="middle" font-weight="bold" fill="#1d1d1b">0,42</text><rect x="250" y="150" width="102" height="56" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.2"/><text x="301" y="172" font-size="18" text-anchor="middle" font-weight="normal" fill="#4a4f55">jan</text><text x="301" y="196" font-size="20" text-anchor="middle" font-weight="bold" fill="#1d1d1b">0,27</text><rect x="360" y="150" width="102" height="56" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.2"/><text x="411" y="172" font-size="18" text-anchor="middle" font-weight="normal" fill="#4a4f55">fev</text><text x="411" y="196" font-size="20" text-anchor="middle" font-weight="bold" fill="#1d1d1b">0,55</text><rect x="470" y="150" width="102" height="56" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.2"/><text x="521" y="172" font-size="18" text-anchor="middle" font-weight="normal" fill="#4a4f55">mar</text><text x="521" y="196" font-size="20" text-anchor="middle" font-weight="bold" fill="#1d1d1b">0,38</text><rect x="580" y="150" width="102" height="56" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.2"/><text x="631" y="172" font-size="18" text-anchor="middle" font-weight="normal" fill="#4a4f55">abr</text><text x="631" y="196" font-size="20" text-anchor="middle" font-weight="bold" fill="#1d1d1b">0,29</text><rect x="30" y="214" width="102" height="56" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.2"/><text x="81" y="236" font-size="18" text-anchor="middle" font-weight="normal" fill="#4a4f55">mai</text><text x="81" y="260" font-size="20" text-anchor="middle" font-weight="bold" fill="#1d1d1b">0,21</text><rect x="140" y="214" width="102" height="56" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.2"/><text x="191" y="236" font-size="18" text-anchor="middle" font-weight="normal" fill="#4a4f55">jun</text><text x="191" y="260" font-size="20" text-anchor="middle" font-weight="bold" fill="#1d1d1b">0,18</text><rect x="250" y="214" width="102" height="56" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.2"/><text x="301" y="236" font-size="18" text-anchor="middle" font-weight="normal" fill="#4a4f55">jul</text><text x="301" y="260" font-size="20" text-anchor="middle" font-weight="bold" fill="#9b2a1f">−0,06</text><rect x="360" y="214" width="102" height="56" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.2"/><text x="411" y="236" font-size="18" text-anchor="middle" font-weight="normal" fill="#4a4f55">ago</text><text x="411" y="260" font-size="20" text-anchor="middle" font-weight="bold" fill="#1d1d1b">0,15</text><rect x="470" y="214" width="102" height="56" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.2"/><text x="521" y="236" font-size="18" text-anchor="middle" font-weight="normal" fill="#4a4f55">set</text><text x="521" y="260" font-size="20" text-anchor="middle" font-weight="bold" fill="#1d1d1b">0,47</text><rect x="580" y="214" width="102" height="56" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.2"/><text x="631" y="236" font-size="18" text-anchor="middle" font-weight="normal" fill="#4a4f55">out</text><text x="631" y="260" font-size="20" text-anchor="middle" font-weight="bold" fill="#1d1d1b">0,33</text><rect x="30" y="300" width="320" height="520" rx="8" fill="#eaf2ea" stroke="#2e6b3a" stroke-width="2.5"/><text x="190" y="334" font-size="21" text-anchor="middle" font-weight="bold" fill="#2e6b3a">Pela regra do contrato</text><text x="50" y="376" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">multiplica os 12 fatores</text><text x="50" y="414" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">1,0031 × 1,0042 × …</text><text x="50" y="452" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">× 1,0033 = 1,035552…</text><text x="50" y="490" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">acumulado 3,555…%</text><text x="50" y="528" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">arredonda a 2 casas:</text><text x="50" y="566" font-size="22" text-anchor="start" font-weight="bold" fill="#2e6b3a">3,56%</text><text x="50" y="612" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">2.480,00 × 1,0356</text><text x="50" y="650" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">= 2.568,288</text><text x="50" y="688" font-size="22" text-anchor="start" font-weight="bold" fill="#2e6b3a">R$ 2.568,29</text><rect x="370" y="300" width="320" height="160" rx="8" fill="#f6e3e0" stroke="#9b2a1f" stroke-width="2.5"/><text x="390" y="338" font-size="21" text-anchor="start" font-weight="bold" fill="#9b2a1f">soma as taxas</text><text x="390" y="378" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">3,50% → R$ 2.566,80</text><text x="390" y="424" font-size="24" text-anchor="start" font-weight="bold" fill="#9b2a1f">−1,49 por mês</text><rect x="370" y="480" width="320" height="160" rx="8" fill="#f6e3e0" stroke="#9b2a1f" stroke-width="2.5"/><text x="390" y="518" font-size="21" text-anchor="start" font-weight="bold" fill="#9b2a1f">não arredonda o %</text><text x="390" y="558" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">fator cheio → R$ 2.568,17</text><text x="390" y="604" font-size="24" text-anchor="start" font-weight="bold" fill="#9b2a1f">−0,12 por mês</text><rect x="370" y="660" width="320" height="160" rx="8" fill="#f6e3e0" stroke="#9b2a1f" stroke-width="2.5"/><text x="390" y="698" font-size="21" text-anchor="start" font-weight="bold" fill="#9b2a1f">out digitado 0,38</text><text x="390" y="738" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">3,61% → R$ 2.569,53</text><text x="390" y="784" font-size="24" text-anchor="start" font-weight="bold" fill="#9b2a1f">+1,24 por mês</text><text x="30" y="864" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">O fator cheio não é errado em si: é diferente da regra</text><text x="30" y="890" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">deste contrato, que manda arredondar o % a 2 casas.</text><text x="30" y="930" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">Escreva a regra; o sistema e a planilha de conferência</text><text x="30" y="956" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">precisam chegar ao mesmo centavo.</text><text x="30" y="996" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55" font-style="italic">taxas inventadas; não são o IPCA publicado pelo IBGE</text><text x="690" y="1030" font-size="18" text-anchor="end" font-weight="normal" fill="#4a4f55">Ilustração · Torno 2026</text></svg>