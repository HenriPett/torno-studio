<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1380" viewBox="0 0 720 1380" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Mapa fictício do trajeto e conta da quilometragem com veículo próprio</title><desc id="d1">Exemplo fictício, cidades e distâncias inventadas. Mapa com a matriz em Vila Esperança e Porto Claro, onde ficam o hotel e os clientes, ligadas por uma rodovia de 214 km por trecho, referência de rota da política; em Porto Claro, um circuito de deslocamentos locais entre o hotel e dois clientes, 37 km. Odômetro do carro de Renata: 48210 na saída, terça 08/12, 07h10, e 48675 na volta, sexta 11/12, 19h30. Contas: 48.675 menos 48.210, igual a 465 km; rota 214 + 214 + 37 = 465 km, diferença 0 km; tolerância da política até 10% acima da rota; 465 km vezes R$ 1,20, igual a R$ 558,00. Quadro vermelho, simulação: nota de combustível de 10/12, R$ 180,00, recusada na mesma prestação porque o valor por km já paga combustível e desgaste. R$ 1,20 por km é valor da política fictícia, não referência de mercado nem regra trabalhista ou fiscal.</desc><rect x="0" y="0" width="720" height="1380" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="10" y="10" width="700" height="1360" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="450" y="24" width="246" height="46" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="573" y="56" font-size="22" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="118" font-size="32" text-anchor="start" font-weight="bold" fill="#1d1d1b">Quilometragem com veículo próprio</text><text x="30" y="158" font-size="22" text-anchor="start" fill="#5a5a55">Renata M., viagem de 08 a 11/12/2026</text><text x="30" y="188" font-size="22" text-anchor="start" fill="#5a5a55">cidades e distâncias fictícias</text><rect x="30" y="215" width="660" height="560" rx="0" fill="#eef2e6" stroke="#1d1d1b" stroke-width="1"/><path d="M30,365 C200,330 260,470 420,520 S620,640 690,715" fill="none" stroke="#9fbbdb" stroke-width="14"/><path d="M140,690 C220,600 160,520 260,470 S420,420 380,360 S470,300 540,330" fill="none" stroke="#ffffff" stroke-width="12"/><path d="M140,690 C220,600 160,520 260,470 S420,420 380,360 S470,300 540,330" fill="none" stroke="#c25e00" stroke-width="4" stroke-dasharray="14 8"/><circle cx="140" cy="690" r="16" fill="#1d1d1b" stroke="#ffffff" stroke-width="3"/><circle cx="540" cy="330" r="16" fill="#1d1d1b" stroke="#ffffff" stroke-width="3"/><text x="166" y="698" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">Vila Esperança (matriz)</text><text x="530" y="380" font-size="20" text-anchor="end" font-weight="bold" fill="#1d1d1b">Porto Claro</text><path d="M540,330 L560,420 L640,300 L610,250 L540,330" fill="none" stroke="#1f5fa8" stroke-width="4"/><rect x="542" y="404" width="36" height="32" rx="4" fill="#ffffff" stroke="#1f5fa8" stroke-width="2"/><text x="560" y="427" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f5fa8">H</text><rect x="622" y="284" width="36" height="32" rx="4" fill="#ffffff" stroke="#1f5fa8" stroke-width="2"/><text x="640" y="307" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f5fa8">C1</text><rect x="592" y="234" width="36" height="32" rx="4" fill="#ffffff" stroke="#1f5fa8" stroke-width="2"/><text x="610" y="257" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f5fa8">C2</text><rect x="250" y="560" width="300" height="64" rx="4" fill="#ffffff" stroke="#c25e00" stroke-width="2"/><text x="400" y="586" font-size="20" text-anchor="middle" font-weight="bold" fill="#c25e00">rodovia: 214 km por trecho</text><text x="400" y="612" font-size="18" text-anchor="middle" fill="#1d1d1b">referência de rota da política</text><rect x="470" y="455" width="210" height="64" rx="4" fill="#ffffff" stroke="#1f5fa8" stroke-width="2"/><text x="575" y="481" font-size="20" text-anchor="middle" font-weight="bold" fill="#1f5fa8">locais: 37 km</text><text x="575" y="507" font-size="18" text-anchor="middle" fill="#1d1d1b">H = hotel, C = cliente</text><text x="30" y="820" font-size="22" text-anchor="start" font-weight="bold" fill="#1d1d1b">Odômetro do carro da Renata</text><rect x="30" y="840" width="40" height="54" rx="3" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1"/><text x="50" y="878" font-size="28" text-anchor="middle" font-weight="bold" fill="#ffffff">4</text><rect x="74" y="840" width="40" height="54" rx="3" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1"/><text x="94" y="878" font-size="28" text-anchor="middle" font-weight="bold" fill="#ffffff">8</text><rect x="118" y="840" width="40" height="54" rx="3" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1"/><text x="138" y="878" font-size="28" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text><rect x="162" y="840" width="40" height="54" rx="3" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1"/><text x="182" y="878" font-size="28" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text><rect x="206" y="840" width="40" height="54" rx="3" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1"/><text x="226" y="878" font-size="28" text-anchor="middle" font-weight="bold" fill="#ffffff">0</text><text x="30" y="924" font-size="20" text-anchor="start" fill="#5a5a55">saída: ter 08/12, 07h10</text><rect x="380" y="840" width="40" height="54" rx="3" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1"/><text x="400" y="878" font-size="28" text-anchor="middle" font-weight="bold" fill="#ffffff">4</text><rect x="424" y="840" width="40" height="54" rx="3" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1"/><text x="444" y="878" font-size="28" text-anchor="middle" font-weight="bold" fill="#ffffff">8</text><rect x="468" y="840" width="40" height="54" rx="3" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1"/><text x="488" y="878" font-size="28" text-anchor="middle" font-weight="bold" fill="#ffffff">6</text><rect x="512" y="840" width="40" height="54" rx="3" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1"/><text x="532" y="878" font-size="28" text-anchor="middle" font-weight="bold" fill="#ffffff">7</text><rect x="556" y="840" width="40" height="54" rx="3" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1"/><text x="576" y="878" font-size="28" text-anchor="middle" font-weight="bold" fill="#ffffff">5</text><text x="380" y="924" font-size="20" text-anchor="start" fill="#5a5a55">volta: sex 11/12, 19h30</text><text x="30" y="980" font-size="20" text-anchor="start" fill="#1d1d1b">Odômetro: 48.675 − 48.210 = 465 km</text><text x="30" y="1014" font-size="20" text-anchor="start" fill="#1d1d1b">Rota: 214 + 214 + 37 = 465 km; diferença 0 km</text><text x="30" y="1048" font-size="20" text-anchor="start" fill="#1d1d1b">Tolerância da política: até 10% acima da rota</text><text x="30" y="1082" font-size="22" text-anchor="start" font-weight="bold" fill="#2e6b34">465 km × R$ 1,20 = R$ 558,00</text><rect x="30" y="1126" width="660" height="124" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="50" y="1158" font-size="20" text-anchor="start" font-weight="bold" fill="#b3261e">Recusado na mesma prestação (simulação):</text><text x="50" y="1188" font-size="20" text-anchor="start" fill="#1d1d1b">nota de combustível de 10/12, R$ 180,00: o valor</text><text x="50" y="1216" font-size="20" text-anchor="start" fill="#1d1d1b">por km já paga combustível e desgaste.</text><text x="30" y="1290" font-size="20" text-anchor="start" fill="#5a5a55">R$ 1,20 por km é valor da política fictícia, não</text><text x="30" y="1318" font-size="20" text-anchor="start" fill="#5a5a55">referência de mercado nem regra trabalhista ou fiscal.</text><text x="690" y="1354" font-size="20" text-anchor="end" fill="#5a5a55">Ilustração · Torno 2026</text></svg>