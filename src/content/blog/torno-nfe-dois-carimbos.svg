<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="title desc"><title id="title">Autorizada não é o mesmo que correta</title><desc id="desc">À esquerda, uma nota fiscal fictícia com o carimbo AUTORIZADA. À direita, a ficha Conferida? com quatro itens: classificação definida pelo contador, código vigente na data de emissão, itens somam o total e XML guardado.</desc><rect width="720" height="440" rx="24" fill="#f4f2eb"/><text x="32" y="54" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#1e2837">Autorizada não é o mesmo que correta</text><rect x="32" y="90" width="300" height="320" rx="14" fill="#fffdf8" stroke="#b6afa4" stroke-width="2"/><text x="52" y="122" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#536270">Nota fictícia</text><g fill="#d3cec4"><rect x="52" y="146" width="150" height="10" rx="5"/><rect x="52" y="178" width="220" height="10" rx="5"/><rect x="52" y="206" width="190" height="10" rx="5"/><rect x="52" y="234" width="205" height="10" rx="5"/></g><path d="M52 272H312" stroke="#b6afa4" stroke-width="2"/><rect x="212" y="288" width="100" height="12" rx="6" fill="#536270"/><g transform="rotate(-10 172 350)"><rect x="76" y="324" width="192" height="52" rx="8" fill="#fffdf8" fill-opacity=".85" stroke="#c8782f" stroke-width="4"/><text x="172" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#c8782f">AUTORIZADA</text></g><rect x="372" y="90" width="316" height="320" rx="14" fill="#e0edf0"/><text x="392" y="132" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#1e2837">Conferida?</text><g fill="#fffdf8" stroke="#426d6b" stroke-width="2.5"><rect x="392" y="170" width="22" height="22" rx="4"/><rect x="392" y="222" width="22" height="22" rx="4"/><rect x="392" y="274" width="22" height="22" rx="4"/><rect x="392" y="326" width="22" height="22" rx="4"/></g><g font-family="Arial,sans-serif" font-size="17" fill="#1e2837"><text x="428" y="187">Classificação definida</text><text x="428" y="209">pelo contador</text><text x="428" y="239">Código vigente na data</text><text x="428" y="261">de emissão</text><text x="428" y="291">Itens somam o total</text><text x="428" y="343">XML guardado</text></g></svg>
