<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1200" aria-labelledby="title desc" role="img" viewBox="0 0 720 1200"><title id="title">Evidências para aceitar uma exportação</title><desc id="desc">Ficha editorial de escopo, contagens, campos críticos, limites e resultado. Não se trata de backup ou migração.</desc><rect width="720" height="1200" fill="#f7f6f2"/><text x="36" y="55" fill="#1c5a49" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">TORNO · CONFERÊNCIA DO ARQUIVO</text><text x="36" y="118" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="700">O download não encerra o aceite</text><text x="36" y="164" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Combine o esperado antes de gerar a evidência.</text><rect width="656" height="150" x="32" y="210" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="250" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Escopo</text><text x="54" y="292" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Qual perfil, filtro e referência de corte</text><text x="54" y="330" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">definem o conjunto esperado?</text><rect width="656" height="150" x="32" y="386" fill="#eeece6" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="426" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Contagens</text><text x="54" y="468" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Quantos registros eram esperados?</text><text x="54" y="506" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Como conferir ausências ou repetições?</text><rect width="656" height="150" x="32" y="562" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="602" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Campos críticos</text><text x="54" y="644" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Datas, identificadores e valores mantêm</text><text x="54" y="682" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">o significado no aplicativo de destino?</text><rect width="656" height="150" x="32" y="738" fill="#eeece6" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="778" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Limites</text><text x="54" y="820" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Houve truncamento, exclusão ou falha?</text><text x="54" y="858" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">O que não participou da conferência?</text><rect width="656" height="150" x="32" y="914" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="954" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Resultado e pendências</text><text x="54" y="996" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Registre esperado, observado e evidência.</text><text x="54" y="1034" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Quem trata a diferença e como a verifica?</text><text x="36" y="1155" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Proposta editorial · adapte ao sistema.</text></svg>