<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1150" viewBox="0 0 720 1150" role="img" aria-labelledby="t2 d2" font-family="Arial, Helvetica, sans-serif"><title id="t2">Mesclagem como dois rios que se juntam</title><desc id="d2">Ilustração com exemplo fictício: o rio C-2210 (site) leva 1 pedido, 1 nota e 1 contrato; o rio C-1042 (balcão) leva 3 pedidos, 2 notas e 1 anexo; depois da confluência, C-1042 sobrevivente leva 4 pedidos, 3 notas e 2 anexos. Uma placa indica que C-2210 aponta para C-1042, um marco registra quem, quando e o que mudou, e uma comporta pergunta: desfazer? Regra escrita antes. Torno Studio 2026.</desc><rect width="720" height="1150" fill="#eef3e6"/><text x="40" y="58" font-size="32" fill="#1d1d1b" font-weight="bold" text-anchor="start" >A mesclagem é uma confluência</text><rect x="450" y="76" width="230" height="38" rx="6" fill="#1d1d1b"/><text x="565" y="103" font-size="22" fill="#eef3e6" font-weight="bold" text-anchor="middle" >EXEMPLO FICTÍCIO</text><path d="M 40 230 C 140 300, 250 420, 330 560" fill="none" stroke="#4f8fb8" stroke-width="104" stroke-linecap="round"/><path d="M 680 230 C 580 300, 470 420, 390 560" fill="none" stroke="#4f8fb8" stroke-width="104" stroke-linecap="round"/><path d="M 360 560 C 360 700, 330 850, 360 1160" fill="none" stroke="#4f8fb8" stroke-width="160"/><path d="M 40 230 C 140 300, 250 420, 330 560" fill="none" stroke="#8fc3e3" stroke-width="96" stroke-linecap="round"/><path d="M 680 230 C 580 300, 470 420, 390 560" fill="none" stroke="#8fc3e3" stroke-width="96" stroke-linecap="round"/><path d="M 360 560 C 360 700, 330 850, 360 1160" fill="none" stroke="#8fc3e3" stroke-width="150"/><path d="M 128 320 q 11 -10 22 0 t 22 0" fill="none" stroke="#ffffff" stroke-width="3"/><path d="M 538 320 q 11 -10 22 0 t 22 0" fill="none" stroke="#ffffff" stroke-width="3"/><path d="M 308 760 q 11 -10 22 0 t 22 0" fill="none" stroke="#ffffff" stroke-width="3"/><path d="M 348 960 q 11 -10 22 0 t 22 0" fill="none" stroke="#ffffff" stroke-width="3"/><text x="40" y="170" font-size="26" fill="#1d1d1b" font-weight="bold" text-anchor="start" >C-2210 · site</text><text x="680" y="170" font-size="26" fill="#1d1d1b" font-weight="bold" text-anchor="end" >C-1042 · balcão</text><rect x="51.0" y="240" width="128.0" height="40" rx="8" fill="#fffdf7" stroke="#1d1d1b" stroke-width="2"/><text x="115" y="268" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle" >1 pedido</text><rect x="163.5" y="333" width="103.0" height="40" rx="8" fill="#fffdf7" stroke="#1d1d1b" stroke-width="2"/><text x="215" y="361" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle" >1 nota</text><rect x="213.5" y="433" width="153.0" height="40" rx="8" fill="#fffdf7" stroke="#1d1d1b" stroke-width="2"/><text x="290" y="461" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle" >1 contrato</text><rect x="534.75" y="240" width="140.5" height="40" rx="8" fill="#fffdf7" stroke="#1d1d1b" stroke-width="2"/><text x="605" y="268" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle" >3 pedidos</text><rect x="452.25" y="333" width="115.5" height="40" rx="8" fill="#fffdf7" stroke="#1d1d1b" stroke-width="2"/><text x="510" y="361" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle" >2 notas</text><rect x="382.25" y="433" width="115.5" height="40" rx="8" fill="#fffdf7" stroke="#1d1d1b" stroke-width="2"/><text x="440" y="461" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle" >1 anexo</text><rect x="200" y="610" width="320" height="94" rx="10" fill="#1d1d1b"/><text x="360" y="646" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="middle" >C-1042 sobrevivente</text><text x="360" y="684" font-size="22" fill="#ffffff" font-weight="normal" text-anchor="middle" >4 pedidos · 3 notas · 2 anexos</text><rect x="74" y="560" width="8" height="150" fill="#6b4f2e"/><path d="M 16 520 L 214 520 L 238 548 L 214 576 L 16 576 Z" fill="#c9a26b" stroke="#6b4f2e" stroke-width="2"/><text x="116" y="556" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle" >C-2210 → C-1042</text><text x="40" y="746" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start" >apelido: o ID</text><text x="40" y="774" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start" >antigo ainda</text><text x="40" y="802" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start" >acha o cliente</text><path d="M 548 760 L 548 640 Q 616 600 684 640 L 684 760 Z" fill="#b7b1a6" stroke="#5c564c" stroke-width="2"/><text x="616" y="668" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle" >Trilha</text><text x="616" y="698" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle" >quem</text><text x="616" y="724" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle" >quando</text><text x="616" y="750" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle" >o quê</text><rect x="250" y="840" width="16" height="130" fill="#5c564c"/><rect x="454" y="840" width="16" height="130" fill="#5c564c"/><rect x="246" y="828" width="228" height="16" fill="#5c564c"/><rect x="272" y="850" width="28" height="64" fill="#a8743f" stroke="#6b4f2e" stroke-width="1.5"/><rect x="308" y="850" width="28" height="64" fill="#a8743f" stroke="#6b4f2e" stroke-width="1.5"/><rect x="344" y="850" width="28" height="64" fill="#a8743f" stroke="#6b4f2e" stroke-width="1.5"/><rect x="380" y="850" width="28" height="64" fill="#a8743f" stroke="#6b4f2e" stroke-width="1.5"/><rect x="416" y="850" width="28" height="64" fill="#a8743f" stroke="#6b4f2e" stroke-width="1.5"/><text x="490" y="880" font-size="26" fill="#1d1d1b" font-weight="bold" text-anchor="start" >Desfazer?</text><text x="490" y="912" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start" >Regra escrita</text><text x="490" y="940" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start" >antes de mesclar</text><rect x="28" y="1050" width="400" height="48" rx="8" fill="#eef3e6" stroke="#1d1d1b" stroke-width="2"/><text x="42" y="1082" font-size="24" fill="#1d1d1b" font-weight="bold" text-anchor="start" >Nada do histórico fica para trás.</text><rect x="372" y="1110" width="320" height="34" rx="6" fill="#eef3e6"/><text x="680" y="1136" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="end" >Ilustração · Torno Studio 2026</text></svg>