<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1290" viewBox="0 0 720 1290" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Extrato do saldo em poder de terceiros do SR-125 na Zincagem Modelo</title><desc id="d1">Exemplo fictício. Extrato do saldo em poder de terceiros do suporte SR-125 bruto da Indústria Exemplo Ltda. na Zincagem Modelo Ltda., até 17/11/2026. 03/11 remessa NF 4501, lote L2611-03, OP 6201, +1.000, saldo 1.000. 05/11 remessa NF 4502, lote L2611-07, OP 6202, +500, saldo 1.500. 10/11 retorno NF 812, 600 zincados, −600, saldo 900. 17/11 retorno NF 845, 360 zincados, −360, saldo 540. 17/11 NF 845, 15 não aplicados voltam brutos, −15, saldo 525. 17/11 refugo declarado, 12 peças, tolerância 10, −12, saldo 513. Saldo por lote: L2611-03, 13 peças, previsto 13/11, vencido, sem explicação, o terceiro deu por encerrado; L2611-07, 500 peças, previsto 19/11, no prazo.</desc><rect x="0" y="0" width="720" height="1290" rx="0" fill="#e9ecef" stroke="none" stroke-width="0"/><rect x="14" y="14" width="692" height="1262" rx="8" fill="#fdfdfb" stroke="#a7adb4" stroke-width="3"/><circle cx="34" cy="40" r="6" fill="#e9ecef" stroke="#c4c9cf" stroke-width="1.5"/><circle cx="686" cy="40" r="6" fill="#e9ecef" stroke="#c4c9cf" stroke-width="1.5"/><circle cx="34" cy="76" r="6" fill="#e9ecef" stroke="#c4c9cf" stroke-width="1.5"/><circle cx="686" cy="76" r="6" fill="#e9ecef" stroke="#c4c9cf" stroke-width="1.5"/><circle cx="34" cy="112" r="6" fill="#e9ecef" stroke="#c4c9cf" stroke-width="1.5"/><circle cx="686" cy="112" r="6" fill="#e9ecef" stroke="#c4c9cf" stroke-width="1.5"/><circle cx="34" cy="148" r="6" fill="#e9ecef" stroke="#c4c9cf" stroke-width="1.5"/><circle cx="686" cy="148" r="6" fill="#e9ecef" stroke="#c4c9cf" stroke-width="1.5"/><circle cx="34" cy="184" r="6" fill="#e9ecef" stroke="#c4c9cf" stroke-width="1.5"/><circle cx="686" cy="184" r="6" fill="#e9ecef" stroke="#c4c9cf" stroke-width="1.5"/><circle cx="34" cy="