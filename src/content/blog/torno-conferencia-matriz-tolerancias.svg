<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1060" viewBox="0 0 720 1060" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Matriz de conferência das NF-e 45.210 e 45.388 contra o PC 7712</title><desc id="d1">Exemplo fictício. Metalúrgica Exemplo Ltda. Mapa de calor com seis linhas (NF-e 45.210 barra, óleo, pastilha e frete; NF-e 45.388 barra e pastilha) e seis colunas (vínculo com o pedido; de-para e fator; quantidade contra recebido; preço líquido contra pedido; frete e condição; resultado). Verde conferido, amarelo dentro da tolerância ou corrigido, vermelho bloqueado, cinza não se aplica. 45.210 barra: quantidade 615 contra 610 (0,82%) vermelha em 09/11, amarela em 10/11 com 615 contra 612 (0,49%); preço R$ 9,80 líquido verde; resultado amarelo. Óleo: tudo verde, fator 20, R$ 18,50/L. Pastilha: fator 10 verde, quantidade 60 contra 60 verde, preço R$ 43,00 contra R$ 42,00 (2,38%) vermelho, resultado vermelho R$ 60,00. Frete: R$ 180,00 em pedido com frete do fornecedor, vermelho. 45.388 barra: 590 contra 590, acumulado 1.205 contra 1.202 (0,25%), verde. 45.388 pastilha: R$ 42,00, verde. Sem o fator 10, a pastilha compararia R$ 430,00 com R$ 42,00, 923,81% acima. NF-e 45.210 bloqueada em 09/11 por R$ 289,00, liberada em 12/11 com acerto de R$ 240,00; valor a pagar R$ 12.247,00. NF-e 45.388 liberada sem ação manual, R$ 7.462,00.</desc><rect x="0.0" y="0.0" width="720.0" height="1060.0" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14.0" y="14.0" width="692.0" height="1032.0" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30.0" y="58.0" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Matriz de conferência</text><text x="30.0" y="92.0" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">cada célula é uma regra escrita · PC 7712</text><rect x="470.0" y="108.0" width="222.0" height="40.0" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581.0" y="136.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><text x="690.0" y="1030.0" font-size="18" text-anchor="end" font-weight="normal" fill="#4a4f55">Ilustração · Torno 2026</text><text x="194.0" y="170.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d1d1b">vínculo</text><text x="194.0" y="190.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d1d1b">pedido</text><text x="282.0" y="170.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d1d1b">de-para</text><text x="282.0" y="190.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d1d1b">e fator</text><text x="370.0" y="170.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d1d1b">qtd ↔</text><text x="370.0" y="190.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d1d1b">recebido</text><text x="458.0" y="170.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d1d1b">preço ↔</text><text x="458.0" y="190.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d1d1b">pedido</text><text x="546.0" y="170.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d1d1b">frete e</text><text x="546.0" y="190.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d1d1b">condição</text><text x="634.0" y="170.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d1d1b">resultado</text><text x="30.0" y="232.0" font-size="16" text-anchor="start" font-weight="bold" fill="#1d1d1b">NF-e 45.210</text><text x="30.0" y="254.0" font-size="16" text-anchor="start" font-weight="normal" fill="#4a4f55">barra</text><rect x="152.0" y="202.0" width="84.0" height="74.0" rx="4" fill="#dcebd5" stroke="#2e6b2d" stroke-width="2"/><text x="194.0" y="245.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1d1d1b">xPed 7712</text><rect x="240.0" y="202.0" width="84.0" height="74.0" rx="4" fill="#dcebd5" stroke="#2e6b2d" strok