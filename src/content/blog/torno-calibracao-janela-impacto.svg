<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1370" viewBox="0 0 720 1370" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Linha do tempo do micrômetro MIC-014: janela de impacto e lotes medidos desde a última evidência de bom estado</title><desc id="d1">Exemplo fictício. Eixo ER-40, Ø 40,00 ± 0,02 mm, Usinagem Exemplo Ltda. Calibração aprovada em 12/11/2025; verificação intermediária com bloco-padrão de 40 mm aprovada em 05/10/2026; retirada de uso em 10/11/2026; certificado registrado como reprovado em 16/11/2026, erro de +0,006 mm em 40 mm e U de 0,0015 mm. Janela de impacto de 05/10 a 10/11/2026, 36 dias. Lote L2609-21, 28/09, 400 peças, fora da janela. L2610-04, 07/10, 300 expedidas, menor leitura 39,993, corrigida 39,987, liberado com justificativa. L2610-15, 21/10, 450 expedidas, 39,985, corrigida 39,979, RNC com o cliente. L2611-02, 04/11, 200 em estoque, 39,996, corrigida 39,990, liberado com justificativa. L2611-06, 09/11, 250 em estoque, 39,983, corrigida 39,977, RNC e saldo bloqueado. Suspeita: leitura abaixo de 39,9875 mm.</desc><rect x="0" y="0" width="720" height="1370" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14" y="14" width="692" height="1342" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30" y="58" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">MIC-014 reprovado: o que ele mediu?</text><text x="30" y="92" font-size="22" text-anchor="start" font-weight="normal" fill="#1d1d1b">eixo ER-40 · Ø 40,00 ± 0,02 mm</text><rect x="470" y="108" width="222" height="40" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581" y="136" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><text x="30" y="136" font-size="22" text-anchor="start" font-weight="normal" fill="#4a4f55">Usinagem Exemplo Ltda.</text><text x="30" y="182" font-size="22" text-anchor="start" font-weight="bold" fill="#2e6b30">12/11/2025 · calibração aprovada (CC-2025-0877)</text><path d="M110 190 L110 810" stroke="#1d1d1b" stroke-width="3" fill="none"/><path d="M96 196 L124 190 M96 204 L124 198" stroke="#1d1d1b" stroke-width="2" fill="none"/><rect x="88" y="294.2857142857143" width="44" height="433.4693877551021" rx="0" fill="#f3c6bd" stroke="none" stroke-width="0"/><path d="M150 294.2857142857143 L150 727.7551020408164" stroke="#b03a2e" stroke-width="2" fill="none" stroke-dasharray="6 4"/><path d="M144 294.2857142857143 L156 294.2857142857143" stroke="#b03a2e" stroke-width="2" fill="none"/><path d="M144 727.7551020408164 L156 727.7551020408164" stroke="#b03a2e" stroke-width="2" fill="none"/><text x="170" y="555.2244897959183" font-size="22" text-anchor="start" font-weight="bold" fill="#b03a2e">janela de impacto: 05/10 a 10/11</text><text x="170" y="587.2244897959183" font-size="22" text-anchor="start" font-weight="normal" fill="#b03a2e">36 dias, 4 lotes, 1.200 peças</text><circle cx="110" cy="210.0" r="8" fill="#7a7a76" stroke="#ffffff" stroke-width="2"/><text x="92" y="218.0" font-size="22" text-anchor="end" font-weight="bold" fill="#7a7a76">28/09</text><text x="170" y="218.0" font-size="22" text-anchor="start" font-weight="normal" fill="#7a7a76">L2609-21 · 400 · fora da janela</text><circle cx="110" cy="294.2857142857143" r="8" fill="#2e6b30" stroke="#ffffff" stroke-width="2"/><text x="92" y="302.2857142857143" font-size="22" text-anchor="end" font-weight="bold" fill="#2e6b30">05/10</text><text x="170" y="302.2857142857143" font-size="22" text-anchor="start" font-weight="bold" fill="#2e6b30">verificação com bloco 40 mm: ok</text><circle cx="110" cy="318.36734693877554" r="8" fill="#1d1d1b" stroke="#ffffff" stroke-width="2"/><text x="92" y="336.2857142857143" font-size="22" text-anchor="end" font-weight="bold" fill="#1d1d1b">07/10</text><path d="M120 318.36734693877554 L164 328.2857142857143" stroke="#1d1d1b" stroke-width="1.5" fill="none"/><text x="170" y="336.2857142857143" font-s