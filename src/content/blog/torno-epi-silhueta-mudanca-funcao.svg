<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1330" viewBox="0 0 720 1330" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Mudança de função: o que entra, continua e sai</title><desc id="d1">Exemplo fictício. Silhueta de trabalhador de frente com etiquetas ligadas às partes do corpo, mostrando a mudança de função de Carlos M. em 23/11/2026, de operador de prensa (matriz prensas versão 3) para auxiliar de solda (matriz soldagem versão 2). Continua: óculos de proteção; protetor auricular, próxima troca 03/12; calçado de segurança, troca por dano ou desgaste. Entra: máscara de solda; respirador PFF2, troca a cada 7 dias, treinamento antes da entrega, com bloqueio; avental de raspa; luva de raspa, troca em 23/12. Sai: luva anticorte, devolvida para descarte, troca de 03/12 cancelada. Legenda: verde entra, cinza continua, vermelho sai. A lista nasce da comparação entre as duas matrizes na data da mudança.</desc><rect x="0" y="0" width="720" height="1330" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="10" y="10" width="700" height="1310" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="450" y="24" width="246" height="46" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="573" y="56" font-size="22" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="118" font-size="32" text-anchor="start" font-weight="bold" fill="#1d1d1b">Mudança de função</text><text x="30" y="158" font-size="22" text-anchor="start" fill="#5a5a55">O que entra, continua e sai · Carlos M.</text><rect x="30" y="190" width="300" height="90" rx="4" fill="#e8e4da" stroke="#5a5a55" stroke-width="2"/><text x="180" y="224" font-size="22" text-anchor="middle" font-weight="bold" fill="#5a5a55">Até 22/11</text><text x="180" y="256" font-size="19" text-anchor="middle" fill="#5a5a55">Operador de prensa · v3</text><rect x="390" y="190" width="300" height="90" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="3"/><text x="540" y="224" font-size="22" text-anchor="middle" font-weight="bold" fill="#1f4e79">Desde 23/11</text><text x="540" y="256" font-size="19" text-anchor="middle" fill="#1f4e79">Auxiliar de solda · v2</text><path d="M 336 235 L 380 235 M 368 223 L 382 235 L 368 247" fill="none" stroke="#1d1d1b" stroke-width="3"/><rect x="344" y="416" width="32" height="30" rx="2" fill="#cfc9bb" stroke="#5a5a55" stroke-width="2"/><circle cx="360" cy="380" r="42" fill="#cfc9bb" stroke="#5a5a55" stroke-width="2"/><path d="M 318 440 L 402 440 L 430 480 L 446 730 L 418 734 L 404 530 L 404 760 L 392 1030 L 366 1030 L 362 790 L 358 790 L 354 1030 L 328 1030 L 316 760 L 316 530 L 302 734 L 274 730 L 290 480 Z" fill="#cfc9bb" stroke="#5a5a55" stroke-width="2"/><rect x="322" y="1030" width="46" height="22" rx="6" fill="#cfc9bb" stroke="#5a5a55" stroke-width="2"/><rect x="352" y="1030" width="46" height="22" rx="6" fill="#cfc9bb" stroke="#5a5a55" stroke-width="2"/><rect x="24" y="320" width="240" height="94" rx="4" fill="#ffffff" stroke="#6b6b66" stroke-width="3"/><rect x="24" y="320" width="240" height="30" rx="4" fill="#6b6b66" stroke="#6b6b66" stroke-width="0"/><text x="36" y="342" font-size="18" text-anchor="start" font-weight="bold" fill="#ffffff">CONTINUA</text><text x="36" y="376" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">Óculos de proteção</text><text x="36" y="402" font-size="19" text-anchor="start" fill="#5a5a55">troca por dano</text><line x1="264" y1="367.0" x2="338" y2="372" stroke="#6b6b66" stroke-width="2"/><circle cx="338" cy="372" r="5" fill="#6b6b66" stroke="#6b6b66" stroke-width="1"/><rect x="24" y="450" width="240" height="94" rx="4" fill="#ffffff" stroke="#6b6b66" stroke-width="3"/><rect x="24" y="450" width="240" height="30" rx="4" fill="#6b6b66" stroke="#6b6b66" stroke-width="0"/><text x="36" y="472" font-size="18" text-anchor="start" font-weight="bold" fill="#ffffff">CONTINUA</text><text x="36" y="506" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">Protetor auricular</text><text x="36" y="532" font-size="19" text-anchor="start" fill="#5a5a55">próxima troca 03/12</text><line x1="264" y1="497.0" x2="318" y2="386" stroke="#6b6b66" stroke-width="2"/><circle cx="318" cy="386" r="5" fill="#6b6b66" stroke="#6b6b66" stroke-width="1"/><rect x="24" y="630" width="240" height="146" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="3"/><rect x="24" y="630" width="240" height="30" rx="4" fill="#b3261e" stroke="#b3261e" stroke-width="0"/><text x="36" y="652" font-size="18" text-anchor="start" font-weight="bold" fill="#ffffff">SAI</text><text x="36" y="686" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">Luva anticorte</text><text x="36" y="712" font-size="19" text-anchor="start" fill="#5a5a55">devolvida: descarte</text><text x="36" y="738" font-size="19" text-anchor="start" fill="#5a5a55">troca de 03/12</text><text x="36" y="764" font-size="19" text-anchor="start" fill="#5a5a55">cancelada</text><line x1="264" y1="703.0" x2="288" y2="732" stroke="#b3261e" stroke-width="2"/><circle cx="288" cy="732" r="5" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><rect x="24" y="850" width="240" height="94" rx="4" fill="#ffffff" stroke="#6b6b66" stroke-width="3"/><rect x="24" y="850" width="240" height="30" rx="4" fill="#6b6b66" stroke="#6b6b66" stroke-width="0"/><text x="36" y="872" font-size="18" text-anchor="start" font-weight="bold" fill="#ffffff">CONTINUA</text><text x="36" y="906" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">Calçado de segurança</text><text x="36" y="932" font-size="19" text-anchor="start" fill="#5a5a55">troca por dano/desgaste</text><line x1="264" y1="897.0" x2="345" y2="1040" stroke="#6b6b66" stroke-width="2"/><circle cx="345" cy="1040" r="5" fill="#6b6b66" stroke="#6b6b66" stroke-width="1"/><rect x="456" y="320" width="240" height="94" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><rect x="456" y="320" width="240" height="30" rx="4" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="468" y="342" font-size="18" text-anchor="start" font-weight="bold" fill="#ffffff">ENTRA</text><text x="468" y="376" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">Máscara de solda</text><text x="468" y="402" font-size="19" text-anchor="start" fill="#5a5a55">troca por dano</text><line x1="456" y1="367.0" x2="392" y2="366" stroke="#2e7d32" stroke-width="2"/><circle cx="392" cy="366" r="5" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><rect x="456" y="440" width="240" height="146" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><rect x="456" y="440" width="240" height="30" rx="4" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="468" y="462" font-size="18" text-anchor="start" font-weight="bold" fill="#ffffff">ENTRA</text><text x="468" y="496" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">Respirador PFF2</text><text x="468" y="522" font-size="19" text-anchor="start" fill="#5a5a55">troca a cada 7 dias</text><text x="468" y="548" font-size="19" text-anchor="start" fill="#5a5a55">treinamento antes:</text><text x="468" y="574" font-size="19" text-anchor="start" fill="#5a5a55">bloqueio na entrega</text><line x1="456" y1="513.0" x2="372" y2="402" stroke="#2e7d32" stroke-width="2"/><circle cx="372" cy="402" r="5" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><rect x="456" y="630" width="240" height="94" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><rect x="456" y="630" width="240" height="30" rx="4" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="468" y="652" font-size="18" text-anchor="start" font-weight="bold" fill="#ffffff">ENTRA</text><text x="468" y="686" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">Avental de raspa</text><text x="468" y="712" font-size="19" text-anchor="start" fill="#5a5a55">troca por dano</text><line x1="456" y1="677.0" x2="392" y2="570" stroke="#2e7d32" stroke-width="2"/><circle cx="392" cy="570" r="5" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><rect x="456" y="770" width="240" height="94" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><rect x="456" y="770" width="240" height="30" rx="4" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="468" y="792" font-size="18" text-anchor="start" font-weight="bold" fill="#ffffff">ENTRA</text><text x="468" y="826" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">Luva de raspa</text><text x="468" y="852" font-size="19" text-anchor="start" fill="#5a5a55">troca em 23/12</text><line x1="456" y1="817.0" x2="432" y2="732" stroke="#2e7d32" stroke-width="2"/><circle cx="432" cy="732" r="5" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><rect x="60" y="1090" width="28" height="28" rx="4" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><text x="100" y="1112" font-size="22" text-anchor="start" fill="#1d1d1b">entra</text><rect x="270" y="1090" width="28" height="28" rx="4" fill="#6b6b66" stroke="#6b6b66" stroke-width="1"/><text x="310" y="1112" font-size="22" text-anchor="start" fill="#1d1d1b">continua</text><rect x="480" y="1090" width="28" height="28" rx="4" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="520" y="1112" font-size="22" text-anchor="start" fill="#1d1d1b">sai</text><rect x="30" y="1150" width="660" height="120" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="2"/><text x="360" y="1190" font-size="22" text-anchor="middle" font-weight="bold" fill="#1d1d1b">As três listas nascem da comparação</text><text x="360" y="1222" font-size="22" text-anchor="middle" fill="#1d1d1b">entre as duas matrizes na data da mudança.</text><text x="360" y="1252" font-size="20" text-anchor="middle" fill="#5a5a55">O que sai tem as trocas programadas canceladas.</text><text x="690" y="1300" font-size="20" text-anchor="end" fill="#5a5a55">Ilustração · Torno 2026</text></svg>