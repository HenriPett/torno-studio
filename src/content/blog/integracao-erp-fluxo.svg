<svg xmlns="http://www.w3.org/2000/svg" width="480" height="856" viewBox="0 0 480 856" role="img" aria-labelledby="title desc"><title id="title">Mapeie a direção dos dados</title><desc id="desc">Exemplo de CRM e ERP com envio de solicitação de pedido e retorno de identificador e situação.</desc><rect width="480" height="856" rx="24" fill="#f5f2e9"/><g font-family="Arial, Helvetica, sans-serif" fill="#172b2b"><text x="24" y="40" font-size="18" font-weight="700" letter-spacing="1">TORNO · EXEMPLO HIPOTÉTICO</text><text x="24" y="86" font-size="30" font-weight="700">Mapeie a direção</text><text x="24" y="123" font-size="30" font-weight="700">dos dados</text><rect x="20" y="154" width="440" height="168" rx="16" fill="#173c3c" stroke="#b4c6bd"/><g fill="#fff"><text x="40" y="190" font-size="22" font-weight="700">01 · CRM → ERP</text><text x="40" y="230" font-size="22">Aprovação comercial dispara</text><text x="40" y="262" font-size="22">uma solicitação de pedido.</text><text x="40" y="294" font-size="22">Definir quem pode autorizar.</text></g><rect x="20" y="344" width="440" height="168" rx="16" fill="#fff" stroke="#b4c6bd"/><g fill="#172b2b"><text x="40" y="380" font-size="22" font-weight="700">02 · ERP → CRM</text><text x="40" y="420" font-size="22">Identificador e situação</text><text x="40" y="452" font-size="22">retornam para acompanhamento.</text><text x="40" y="484" font-size="22">Confirmar o que a API expõe.</text></g><rect x="20" y="534" width="440" height="168" rx="16" fill="#fff" stroke="#b4c6bd"/><g fill="#172b2b"><text x="40" y="570" font-size="22" font-weight="700">03 · CADASTROS</text><text x="40" y="610" font-size="22">Quem mantém o dado oficial?</text><text x="40" y="642" font-size="22">Onde alterações são permitidas?</text><text x="40" y="674" font-size="22">Definir antes de sincronizar.</text></g><text x="24" y="740" font-size="21" font-weight="700">O fluxo depende dos recursos</text><text x="24" y="771" font-size="21" font-weight="700">e das regras dos dois sistemas.</text></g></svg>
