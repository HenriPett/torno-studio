<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1462" viewBox="0 0 720 1462" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">A estante e o relógio da contagem</title><desc id="d1">Exemplo fictício. Contagem cíclica C-0311 de 10/11/2026. Às 08:00 o sistema grava a foto do saldo de cada posição; o depósito continua operando. Estante com quatro posições. B-02-1, parafuso M8 em caixa de 100: foto 120, saída de 10 às 09:15, esperado 110, contagem às 10:05 de 110, diferença 0. B-02-2, bucha 8 mm em pacote de 50: foto 80, sem movimento, esperado 80, contagem às 10:20 de 78, diferença menos 2. B-03-1, fita veda-rosca: foto 200, sem movimento, esperado 200, contagem às 10:35 de 230, diferença mais 30. B-03-2, disjuntor 20 A: foto 40, entrada de 12 às 10:50, esperado 52, contagem às 11:10 de 48, diferença menos 4. Esperado é a foto mais os movimentos registrados até a hora em que a posição foi contada; movimento depois da contagem não é divergência, e a saída de 5 caixas de B-02-1 às 10:30 deixa o saldo final em 105; diferença fora da tolerância vai para recontagem cega por outra pessoa. Torno Studio 2026.</desc><rect x="0" y="0" width="720" height="1462" rx="0" fill="#f4efe6"/><text x="40" y="58" font-size="32" fill="#1d1d1b" font-weight="bold" text-anchor="start">A estante e o relógio</text><text x="40" y="98" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Contagem cíclica C-0311 · 10/11/2026</text><rect x="450" y="76" width="230" height="38" rx="6" fill="#1d1d1b"/><text x="565" y="103" font-size="22" fill="#f4efe6" font-weight="bold" text-anchor="middle">EXEMPLO FICTÍCIO</text><circle cx="112" cy="214" r="66" fill="#fffdf7" stroke="#1d1d1b" stroke-width="4"/><path d="M112.0 154.0 L112.0 164.0" fill="none" stroke="#1d1d1b" stroke-width="3"/><path d="M142.0 162.0 L137.0 170.7" fill="none" stroke="#1d1d1b" stroke-width="3"/><path d="M164.0 184.0 L155.3 189.0" fill="none" stroke="#1d1d1b" stroke-width="3"/><path d="M172.0 214.0 L162.0 214.0" fill="none" stroke="#1d1d1b" stroke-width="3"/><path d="M164.0 244.0 L155.3 239.0" fill="none" stroke="#1d1d1b" stroke-width="3"/><path d="M142.0 266.0 L137.0 257.3" fill="none" stroke="#1d1d1b" stroke-width="3"/><path d="M112.0 274.0 L112.0 264.0" fill="none" stroke="#1d1d1b" stroke-width="3"/><path d="M82.0 266.0 L87.0 257.3" fill="none" stroke="#1d1d1b" stroke-width="3"/><path d="M60.0 244.0 L68.7 239.0" fill="none" stroke="#1d1d1b" stroke-width="3"/><path d="M52.0 214.0 L62.0 214.0" fill="none" stroke="#1d1d1b" stroke-width="3"/><path d="M60.0 184.0 L68.7 189.0" fill="none" stroke="#1d1d1b" stroke-width="3"/><path d="M82.0 162.0 L87.0 170.7" fill="none" stroke="#1d1d1b" stroke-width="3"/><path d="M112 214 L80.8 232.0" fill="none" stroke="#1d1d1b" stroke-width="6" stroke-linecap="round"/><path d="M112 214 L112 162" fill="none" stroke="#1d1d1b" stroke-width="4" stroke-linecap="round"/><circle cx="112" cy="214" r="6" fill="#1d1d1b"/><text x="206" y="180" font-size="26" fill="#1d1d1b" font-weight="bold" text-anchor="start">08:00 · foto do saldo</text><text x="206" y="216" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">O sistema grava o saldo de cada</text><text x="206" y="248" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">posição antes de a contagem começar.</text><text x="206" y="280" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">O depósito continua vendendo.</text><rect x="40" y="320" width="640" height="680" rx="0" fill="#ece4d6" stroke="#1d1d1b" stroke-width="4"/><rect x="56" y="336" width="296" height="306" rx="4" fill="#fffdf7" stroke="#1d1d1b" stroke-width="3"/><rect x="70" y="350" width="116" height="36" rx="4" fill="#f1d36b" stroke="#1d1d1b" stroke-width="2"/><text x="128" y="376" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">B-02-1</text><text x="72" y="422" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Parafuso M8 (cx 100)</text><text x="72" y="458" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Foto 08:00: 120</text><text x="72" y="494" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Saída 09:15: −10</text><text x="72" y="530" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Esperado: 110</text><text x="72" y="566" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Contagem 10:05: 110</text><text x="72" y="606" font-size="22" fill="#2f7d4f" font-weight="bold" text-anchor="start">Diferença: 0</text><rect x="372" y="336" width="296" height="306" rx="4" fill="#fffdf7" stroke="#1d1d1b" stroke-width="3"/><rect x="386" y="350" width="116" height="36" rx="4" fill="#f1d36b" stroke="#1d1d1b" stroke-width="2"/><text x="444" y="376" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">B-02-2</text><text x="388" y="422" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Bucha 8 mm (pct 50)</text><text x="388" y="458" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Foto 08:00: 80</text><text x="388" y="494" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Sem movimento</text><text x="388" y="530" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Esperado: 80</text><text x="388" y="566" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Contagem 10:20: 78</text><text x="388" y="606" font-size="22" fill="#a33a2a" font-weight="bold" text-anchor="start">Diferença: −2</text><rect x="56" y="670" width="296" height="306" rx="4" fill="#fffdf7" stroke="#1d1d1b" stroke-width="3"/><rect x="70" y="684" width="116" height="36" rx="4" fill="#f1d36b" stroke="#1d1d1b" stroke-width="2"/><text x="128" y="710" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">B-03-1</text><text x="72" y="756" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Fita veda-rosca</text><text x="72" y="792" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Foto 08:00: 200</text><text x="72" y="828" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Sem movimento</text><text x="72" y="864" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Esperado: 200</text><text x="72" y="900" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Contagem 10:35: 230</text><text x="72" y="940" font-size="22" fill="#a33a2a" font-weight="bold" text-anchor="start">Diferença: +30</text><rect x="372" y="670" width="296" height="306" rx="4" fill="#fffdf7" stroke="#1d1d1b" stroke-width="3"/><rect x="386" y="684" width="116" height="36" rx="4" fill="#f1d36b" stroke="#1d1d1b" stroke-width="2"/><text x="444" y="710" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">B-03-2</text><text x="388" y="756" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Disjuntor 20 A</text><text x="388" y="792" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Foto 08:00: 40</text><text x="388" y="828" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Entrada 10:50: +12</text><text x="388" y="864" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Esperado: 52</text><text x="388" y="900" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Contagem 11:10: 48</text><text x="388" y="940" font-size="22" fill="#a33a2a" font-weight="bold" text-anchor="start">Diferença: −4</text><rect x="40" y="646" width="640" height="12" rx="0" fill="#d8bf95" stroke="#1d1d1b" stroke-width="3"/><rect x="40" y="988" width="640" height="12" rx="0" fill="#d8bf95" stroke="#1d1d1b" stroke-width="3"/><circle cx="56" cy="1056" r="5" fill="#1d1d1b"/><text x="72" y="1064" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Esperado = foto das 08:00 + movimentos</text><text x="72" y="1100" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">registrados até a hora em que aquela</text><text x="72" y="1136" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">posição foi contada.</text><circle cx="56" cy="1184" r="5" fill="#1d1d1b"/><text x="72" y="1192" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Movimento depois da contagem não é</text><text x="72" y="1228" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">divergência: em B-02-1, a saída de 5 cx</text><text x="72" y="1264" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">às 10:30 deixa o saldo final em 105.</text><circle cx="56" cy="1312" r="5" fill="#1d1d1b"/><text x="72" y="1320" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Diferença fora da tolerância vai para</text><text x="72" y="1356" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">recontagem cega, por outra pessoa.</text><text x="680" y="1432" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="end">Ilustração · Torno Studio 2026</text></svg>