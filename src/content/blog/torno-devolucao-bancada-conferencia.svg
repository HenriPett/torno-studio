<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1328" viewBox="0 0 720 1328" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">A bancada de conferência: apto, avariado ou descarte</title><desc id="d1">Exemplo fictício. Bancada de conferência vista de cima com os itens que voltaram da venda V-2050 em novembro. Bandeja de entrada, em conferência, fora do disponível, não vende: jogo de facas, 1 unidade, lacrado; garrafa térmica 1 L, 1 unidade, lacrada; panela de pressão 4,5 L, 1 unidade, válvula vazando. Três caixas: apto, volta ao disponível, com o jogo de facas e a garrafa térmica; avariado, bloqueado, com a panela, destino fornecedor; descarte, baixa com motivo, nenhum item neste exemplo. Prancheta: quem confere registra estado, foto e data; no exemplo, avariado só sai para fornecedor ou conserto; descarte só com aprovação do gerente; motivo do cliente e resultado da conferência ficam separados. Torno Studio 2026.</desc><rect x="0" y="0" width="720" height="1328" rx="0" fill="#f4efe6"/><text x="40" y="58" font-size="32" fill="#1d1d1b" font-weight="bold" text-anchor="start">A bancada de conferência</text><text x="40" y="98" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Venda V-2050 · novembro</text><rect x="450" y="76" width="230" height="38" rx="6" fill="#1d1d1b"/><text x="565" y="103" font-size="22" fill="#f4efe6" font-weight="bold" text-anchor="middle">EXEMPLO FICTÍCIO</text><rect x="24" y="130" width="672" height="1108" rx="18" fill="#d8bf95" stroke="#1d1d1b" stroke-width="3"/><path d="M40 170 C 240 162, 480 178, 680 170" fill="none" stroke="#c6a675" stroke-width="2"/><path d="M40 234 C 240 226, 480 242, 680 234" fill="none" stroke="#c6a675" stroke-width="2"/><path d="M40 298 C 240 290, 480 306, 680 298" fill="none" stroke="#c6a675" stroke-width="2"/><path d="M40 362 C 240 354, 480 370, 680 362" fill="none" stroke="#c6a675" stroke-width="2"/><path d="M40 426 C 240 418, 480 434, 680 42