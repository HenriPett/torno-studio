AS</text><text x="160" y="384" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">Jogo de facas</text><text x="160" y="416" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">1 un</text><text x="160" y="452" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">lacrado</text><rect x="266" y="262" width="188" height="220" rx="8" fill="#ffffff" stroke="#1d1d1b" stroke-width="2"/><rect x="280" y="278" width="160" height="70" rx="6" fill="#ece4d6" stroke="#5c564c" stroke-width="2"/><text x="360" y="320" font-size="22" fill="#5c564c" font-weight="bold" text-anchor="middle">GARRAFA</text><text x="360" y="384" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">Garrafa</text><text x="360" y="416" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">térmica 1 L</text><text x="360" y="452" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">1 un · lacrada</text><rect x="466" y="262" width="188" height="220" rx="8" fill="#ffffff" stroke="#1d1d1b" stroke-width="2"/><rect x="480" y="278" width="160" height="70" rx="6" fill="#ece4d6" stroke="#5c564c" stroke-width="2"/><text x="560" y="320" font-size="22" fill="#5c564c" font-weight="bold" text-anchor="middle">PANELA</text><text x="560" y="384" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">Panela 4,5 L</text><text x="560" y="416" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">1 un</text><text x="560" y="452" font-size="22" fill="#a33a2a" font-weight="bold" text-anchor="middle">válvula vaza</text><path d="M160 514 L160 548" stroke="#1d1d1b" stroke-width="4"/><path d="M148 542 L160 562 L172 542 Z" fill="#1d1d1b"/><path d="M360 514 L360 548" stroke="#1d1d1b" stroke-width="4"/><path d="M348 542 L360 562 L372 542 Z" fill="#1d1d1b"/><path d="M560 514 L560 548" stroke="#1d1d1b" stroke-width="4"/><path d="M548 542 L560 562 L572 542 Z" fill="#1d1d1b"/><rect x="60" y="574" width="192" height="340" rx="10" fill="#2f7d4f" stroke="#1d1d1b" stroke-width="3"/><rect x="72" y="694" width="168" height="206" rx="6" fill="#f7f2e8" stroke="#1d1d1b" stroke-width="2"/><text x="156" y="612" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="middle">APTO</text><text x="156" y="646" font-size="22" fill="#ffffff" font-weight="normal" text-anchor="middle">volta ao</text><text x="156" y="676" font-size="22" fill="#ffffff" font-weight="normal" text-anchor="middle">disponível</text><text x="156" y="744" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">Jogo de facas</text><text x="156" y="784" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">Garrafa</text><text x="156" y="824" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">térmica</text><rect x="264" y="574" width="192" height="340" rx="10" fill="#9a6a12" stroke="#1d1d1b" stroke-width="3"/><rect x="276" y="694" width="168" height="206" rx="6" fill="#f7f2e8" stroke="#1d1d1b" stroke-width="2"/><text x="360" y="612" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="middle">AVARIADO</text><text x="360" y="646" font-size="22" fill="#ffffff" font-weight="normal" text-anchor="middle">bloqueado</text><text x="360" y="744" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">Panela 4,5 L</text><text x="360" y="784" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">destino:</text><text x="360" y="824" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">fornecedor</text><rect x="468" y="574" width="192" height="340" rx="10" fill="#a33a2a" stroke="#1d1d1b" stroke-width="3"/><rect x="480" y="694" width="168" height="206" rx="6" fill="#f7f2e8" stroke="#1d1d1b" stroke-width="2"/><text x="564" y="612" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="middle">DESCARTE</text><text x="564" y="646" font-size="22" fill="#ffffff" font-weight="normal" text-anchor="middle">baixa com</text><text x="564" y="676" font-size="22" fill="#ffffff" font-weight="normal" text-anchor="middle">motivo</text><text x="564" y="744" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="middle">nenhum item</text><text x="564" y="784" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="middle">neste</text><text x="564" y="824" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="middle">exemplo</text><rect x="48" y="944" width="624" height="274" rx="10" fill="#fffdf7" stroke="#1d1d1b" stroke-width="3"/><rect x="300" y="930" width="120" height="30" rx="6" fill="#8a8173" stroke="#1d1d1b" stroke-width="2"/><circle cx="72" cy="992" r="5" fill="#1d1d1b"/><text x="88" y="1000" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Quem confere registra estado, foto e data.</text><circle cx="72" cy="1030" r="5" fill="#1d1d1b"/><text x="88" y="1038" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">No exemplo, avariado só sai para</text><text x="88" y="1076" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">fornecedor ou conserto.</text><circle cx="72" cy="1106" r="5" fill="#1d1d1b"/><text x="88" y="1114" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Descarte só com aprovação do gerente.</text><circle cx="72" cy="1144" r="5" fill="#1d1d1b"/><text x="88" y="1152" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Motivo do cliente e resultado da</text><text x="88" y="1190" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">conferência ficam separados.</text><text x="680" y="1288" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="end">Ilustração · Torno Studio 2026</text></svg>