<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1690" viewBox="0 0 720 1690" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Cópia controlada, não controlada e obsoleta</title><desc id="d1">Exemplo fictício. Três folhas da IT-USI-014, cada uma com um carimbo. Folha 1, carimbo azul CÓPIA CONTROLADA Nº 2: revisão 02, vigente desde 01/12/2026, posto torno CNC-07, entregue na terça 01/12/2026 às 07:40, quando a cópia nº 2 da revisão 01 foi recolhida. Folha 2, carimbo cinza CÓPIA NÃO CONTROLADA: revisão 01, impressa na sexta 27/11/2026 às 14:05 por Juliana P., válida só na data da impressão; em 01/12 já não é a revisão vigente. Folha 3, carimbo vermelho OBSOLETO, RETIDO: cópia controlada nº 1 da revisão 01, do posto CNC-05, devolvida na quarta 02/12/2026 às 09:15, um dia depois da vigência da revisão 02; arquivada pela qualidade com o prazo de guarda da revisão 01, não usar. Quadro: na vigência da revisão 02, o sistema lista as cópias controladas a trocar; a do CNC-07 foi trocada às 07:40 de 01/12; a do CNC-05 ficou pendente até 09:15 de 02/12, com aviso ao supervisor e à qualidade. Rodapé: o carimbo diz o que a folha é; a lista de distribuição diz onde está cada cópia controlada.</desc><rect x="0" y="0" width="720" height="1690" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="10" y="10" width="700" height="1670" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="450" y="24" width="246" height="46" rx="4" fill="#fff" stroke="#b3261e" stroke-width="2"/><text x="573" y="56" font-size="22" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="118" font-size="30" text-anchor="start" font-weight="bold" fill="#1d1d1b">Três folhas, três carimbos</text><text x="30" y="154" font-size="20" text-anchor="start" fill="#5a5a55">IT-USI-014 · torneamento da haste H-20</text><rect x="60" y="190" width="600" height="346" rx="4" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><rect x="60" y="190" width="600" height="64" rx="4" fill="#ecebe6" stroke="#1d1d1b" stroke-width="2"/><text x="80" y="218" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">IT-USI-014 · rev. 02</text><text x="80" y="242" font-size="16" text-anchor="start" fill="#5a5a55">vigente desde ter 01/12/2026</text><line x1="80" y1="282" x2="640" y2="282" stroke="#d9d4c7" stroke-width="8"/><line x1="80" y1="304" x2="580" y2="304" stroke="#d9d4c7" stroke-width="8"/><line x1="80" y1="326" x2="520" y2="326" stroke="#d9d4c7" stroke-width="8"/><line x1="80" y1="348" x2="640" y2="348" stroke="#d9d4c7" stroke-width="8"/><line x1="80" y1="370" x2="580" y2="370" stroke="#d9d4c7" stroke-width="8"/><g transform="rotate(-7 360 340)"><rect x="130" y="302" width="460" height="76" rx="8" fill="none" stroke="#1f4e79" stroke-width="5"/><text x="360" y="352" font-size="30" text-anchor="middle" font-weight="bold" fill="#1f4e79">CÓPIA CONTROLADA Nº 2</text></g><text x="80" y="434" font-size="17" text-anchor="start" fill="#1d1d1b">Posto: torno CNC-07</text><text x="80" y="460" font-size="17" text-anchor="start" fill="#1d1d1b">Entregue ter 01/12/2026 às 07:40;</text><text x="80" y="486" font-size="17" text-anchor="start" fill="#1d1d1b">recolhida a nº 2 da rev. 01 no mesmo ato</text><text x="80" y="512" font-size="17" text-anchor="start" fill="#1d1d1b">Trocar só pela lista de distribuição</text><rect x="60" y="570" width="600" height="346" rx="4" fill="#fbfaf7" stroke="#1d1d1b" stroke-width="2"/><rect x="60" y="570" width="600" height="64" rx="4" fill="#ecebe6" stroke="#1d1d1b" stroke-width="2"/><text x="80" y="598" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">IT-USI-014 · rev. 01</text><text x="80" y="622" font-size="16" text-anchor="start" fill="#5a5a55">impressa da tela, fora da lista</text><line x1="80" y1="662" x2="640" y2="662" stroke="#d9d4c7" stroke-width="8"/><line x1="80" y1="684" x2="580" y2="684" stroke="#d9d4c7" stroke-width="8"/><line x1="80" y1="706" x2="520" y2="706" stroke="#d9d4c7" stroke-width="8"/><line x1="80" y1="728" x2="640" y2="728" stroke="#d9d4c7" stroke-width="8"/><line x1="80" y1="750" x2="580" y2="750" stroke="#d9d4c7" stroke-width="8"/><g transform="rotate(-7 360 720)"><rect x="130" y="682" width="460" height="76" rx="8" fill="none" stroke="#8a8780" stroke-width="5"/><text x="360" y="732" font-size="30" text-anchor="middle" font-weight="bold" fill="#8a8780">CÓPIA NÃO CONTROLADA</text></g><text x="80" y="814" font-size="17" text-anchor="start" fill="#1d1d1b">Impressa sex 27/11/2026 às 14:05 por Juliana P.</text><text x="80" y="840" font-size="17" text-anchor="start" fill="#1d1d1b">Válida só na data da impressão</text><text x="80" y="866" font-size="17" text-anchor="start" fill="#1d1d1b">Em ter 01/12 já não é a revisão vigente</text><text x="80" y="892" font-size="17" text-anchor="start" fill="#1d1d1b">Para reunião, não para o posto</text><rect x="60" y="950" width="600" height="346" rx="4" fill="#fbf3f2" stroke="#1d1d1b" stroke-width="2"/><rect x="60" y="950" width="600" height="64" rx="4" fill="#ecebe6" stroke="#1d1d1b" stroke-width="2"/><text x="80" y="978" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">IT-USI-014 · rev. 01</text><text x="80" y="1002" font-size="16" text-anchor="start" fill="#5a5a55">vigente até seg 30/11/2026</text><line x1="80" y1="1042" x2="640" y2="1042" stroke="#d9d4c7" stroke-width="8"/><line x1="80" y1="1064" x2="580" y2="1064" stroke="#d9d4c7" stroke-width="8"/><line x1="80" y1="1086" x2="520" y2="1086" stroke="#d9d4c7" stroke-width="8"/><line x1="80" y1="1108" x2="640" y2="1108" stroke="#d9d4c7" stroke-width="8"/><line x1="80" y1="1130" x2="580" y2="1130" stroke="#d9d4c7" stroke-width="8"/><g transform="rotate(-7 360 1100)"><rect x="130" y="1062" width="460" height="76" rx="8" fill="none" stroke="#b3261e" stroke-width="5"/><text x="360" y="1112" font-size="30" text-anchor="middle" font-weight="bold" fill="#b3261e">OBSOLETO · RETIDO</text></g><text x="80" y="1194" font-size="17" text-anchor="start" fill="#1d1d1b">Cópia controlada nº 1, posto CNC-05</text><text x="80" y="1220" font-size="17" text-anchor="start" fill="#1d1d1b">Devolvida qua 02/12/2026 às 09:15</text><text x="80" y="1246" font-size="17" text-anchor="start" fill="#1d1d1b">Arquivada pela qualidade, com a guarda da rev. 01</text><text x="80" y="1272" font-size="17" text-anchor="start" fill="#1d1d1b">Não usar</text><rect x="40" y="1330" width="640" height="230" rx="12" fill="#fff" stroke="#1f4e79" stroke-width="2"/><text x="60" y="1364" font-size="20" text-anchor="start" font-weight="bold" fill="#1f4e79">Recolhimento na vigência da rev. 02</text><text x="60" y="1400" font-size="18" text-anchor="start" fill="#1d1d1b">nº 2 · CNC-07: trocada ter 01/12 às 07:40</text><text x="60" y="1430" font-size="18" text-anchor="start" fill="#1d1d1b">nº 1 · CNC-05: pendente até qua 02/12 às 09:15;</text><text x="60" y="1460" font-size="18" text-anchor="start" fill="#1d1d1b">aviso ao supervisor e à qualidade às 08:00 de 01/12</text><text x="60" y="1490" font-size="18" text-anchor="start" fill="#1d1d1b">não controladas: o sistema não sabe onde estão;</text><text x="60" y="1520" font-size="18" text-anchor="start" fill="#1d1d1b">por isso a marca diz até quando valem</text><text x="30" y="1634" font-size="18" text-anchor="start" fill="#5a5a55">O carimbo diz o que a folha é; a lista de distribuição</text><text x="30" y="1660" font-size="18" text-anchor="start" fill="#5a5a55">diz onde está cada cópia controlada.</text><text x="690" y="1660" font-size="18" text-anchor="end" fill="#5a5a55">Ilustração · Torno 2026</text></svg>