<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc"><title id="title">Duas respostas no mesmo formulário</title><desc id="desc">O formulário fictício mostra a resposta inicial sim, com fornecedor preenchido, e depois não, perguntando o destino do valor anterior.</desc><rect width="720" height="460" rx="24" fill="#f4f2eb"/><text x="32" y="58" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#1e2837">Quando a resposta muda</text><rect x="32" y="95" width="312" height="303" rx="17" fill="#fffefd" stroke="#c9d2d7" stroke-width="2"/><rect x="376" y="95" width="312" height="303" rx="17" fill="#fffefd" stroke="#c9d2d7" stroke-width="2"/><g font-family="Arial,sans-serif" fill="#1e2837"><text x="52" y="140" font-size="21" font-weight="700">Antes</text><text x="396" y="140" font-size="21" font-weight="700">Depois</text><text x="52" y="185" font-size="17">Escolhido?  Sim</text><text x="396" y="185" font-size="17">Escolhido?  Não</text><rect x="52" y="214" width="272" height="74" rx="10" fill="#e0edf0"/><text x="67" y="244" font-size="16">Fornecedor</text><text x="67" y="270" font-size="19" font-weight="700">Exemplo A</text><rect x="396" y="214" width="272" height="74" rx="10" fill="#ede7dc"/><text x="411" y="244" font-size="16">Valor anterior</text><text x="411" y="270" font-size="18" font-weight="700">Qual destino?</text><text x="52" y="342" font-size="16">Valor informado</text><text x="396" y="342" font-size="16">Regra a verificar</text></g><text x="32" y="434" font-family="Arial,sans-serif" font-size="14" fill="#536270">Etapas fictícias · não é uma interface de produto</text></svg>
