<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1540" viewBox="0 0 720 1540" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Matriz de treinamentos: situação em 01/12/2026</title><desc id="d1">Exemplo fictício. Matriz de calor da Exemplo Estruturas Metálicas Ltda., situação em terça 01/12/2026. Linhas: Bruno A., montador; Diego R., montador; Lúcia F., eletricista; Márcio T., caldeireiro; Carla S., auxiliar de almoxarifado que passa a operadora de dobradeira em 18/01/2027. Colunas: integração e ordem de serviço; NR-35 altura; NR-10 básico; NR-33 trabalhador autorizado; NR-12 dobradeira. Bruno: NR-35 vence, válido até 09/12/2026, faltam 8 dias. Diego: NR-35 válido até 04/05/2028, convalidado. Lúcia: NR-10 válido até 16/03/2027, afastada desde 21/09/2026, eventual no retorno. Márcio: NR-35 vencido desde 20/11/2026; NR-33 vence, válido até 14/01/2027, faltam 44 dias. Carla: NR-12 dobradeira pendente, exigido a partir de 18/01/2027. Integração em dia para todos; demais células não exigido. Notas: certificado EAD de NR-35 de Bruno, de 20/11/2026, recusado porque a NR-35 exige presencial desde 16/07/2026; cada célula vem da matriz da função na data, não de uma coluna digitada.</desc><rect x="0" y="0" width="720" height="1540" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="10" y="10" width="700" height="1520" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="450" y="24" width="246" height="46" rx="4" fill="#fff" stroke="#b3261e" stroke-width="2"/><text x="573" y="56" font-size="22" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="118" font-size="30" text-anchor="start" font-weight="bold" fill="#1d1d1b">Matriz de treinamentos</text><text x="30" y="156" font-size="20" text-anchor="start" fill="#5a5a55">Exemplo Estruturas Metálicas Ltda. · situação em ter 01/12/2026</text><rect x="25" y="190" width="670" height="84" rx="0" fill="#1f4e79" stroke="#1