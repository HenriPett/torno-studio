<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1600" viewBox="0 0 720 1600" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Dois livros para a mesma empilhadeira</title><desc id="d1">Exemplo fictício. Gráfico de linhas da empilhadeira PAT-000301, custo de R$ 150.000, disponível para uso em 06/04/2026, de abril de 2026 a março de 2036. Linha contábil (CPC 27): 142.125 no fim de 2026; 131.625 no fim de 2027, quando a revisão muda a vida útil total de 10 para 8 anos e a quota de R$ 875 para R$ 1.155 por mês, sem refazer o passado; 117.765, 103.905, 90.045, 76.185, 62.325 e 48.465 nos fins de 2028 a 2033; 45.000 (valor residual) a partir de março de 2034. Linha fiscal (Anexo III, 8427, 10% ao ano, R$ 1.250 por mês): 138.750 no fim de 2026, 123.750 no fim de 2027 e R$ 15.000 a menos por ano, até zero em março de 2036. A área entre as linhas é a diferença, relatório para o contador; o sistema não lança a diferença sozinho.</desc><rect x="0" y="0" width="720" height="1600" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="10" y="10" width="700" height="1580" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="450" y="24" width="246" height="46" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="573" y="56" font-size="22" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="118" font-size="32" text-anchor="start" font-weight="bold" fill="#1d1d1b">Dois livros para a</text><text x="30" y="158" font-size="32" text-anchor="start" font-weight="bold" fill="#1d1d1b">mesma empilhadeira</text><text x="30" y="198" font-size="22" text-anchor="start" fill="#5a5a55">PAT-000301 · custo R$ 150.000 · em uso desde 06/04/2026</text><text x="30" y="228" font-size="22" text-anchor="start" fill="#5a5a55">Saldo no fim de cada ano, em milhares de reais</text><rect x="30" y="250" width="660" height="680" rx="6" fill="#fffdf7" stroke="#1d1d1b" stroke-width="2"/><