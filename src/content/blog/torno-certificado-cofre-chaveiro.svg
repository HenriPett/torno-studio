<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1540" viewBox="0 0 720 1540" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">O cofre do certificado e quem tem cada chave</title><desc id="d1">Exemplo fictício. Cofre aberto com o certificado CERT-2027 da Distribuidora Exemplo de Ferramentas Ltda.: gaveta de cima com o arquivo A1 (PKCS#12) cifrado, gaveta de baixo com a senha cifrada à parte. Etiqueta do cadastro: titular matriz, CNPJ raiz fictício, série terminando em 9C41, válido de 09/12/2026 10h05 a 09/12/2027 10h05, usado em NF-e da matriz e da filial, distribuição de DF-e e NFS-e da matriz. Chaveiro com quatro papéis: serviço de emissão lê arquivo e senha para assinar e transmitir; responsável fiscal carrega arquivo e senha pela tela de carga com segundo fator e não pode baixar; diretor aprova a ativação e vê só o cadastro; TI agenda a troca e vê o registro, sem ver a senha. Ninguém baixa o arquivo de volta, vê a senha ou copia o certificado para outro ambiente. Lugares a evitar: pasta compartilhada com senha em arquivo de texto, e-mail encaminhado, repositório de código, computador de uma pessoa. A1 x A3 num sistema na nuvem: A1 arquivo e senha no cofre, emissão sem pessoa; A3 em token na mesa não serve a servidor na nuvem; A3 em HSM próprio ou guardado por prestador credenciado, integração com autenticação e disponibilidade próprias.</desc><defs><marker id="ab" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L16,7 L0,14 z" fill="#1f4e79"/></marker><marker id="ag" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L16,7 L0,14 z" fill="#2e7d32"/></marker><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L16,7 L0,14 z" fill="#b3261e"/></marker><marker id="ak" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L16,7 L0,14 z" fill="#1d1d1b"/></marker><marker id="ay" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L16,7 L0,14 z" fill="#6b6b66"/></marker></defs><rect x="0" y="0" width="720" height="1540" fill="#f6f3ec"/><rect x="14" y="14" width="692" height="1512" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="530" y="30" width="160" height="34" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="610" y="53" font-size="15" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="58" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">O cofre do certificado</text><text x="30" y="90" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">Distribuidora Exemplo de Ferramentas Ltda. · CERT-2027</text><rect x="34" y="130" width="300" height="330" rx="10" fill="#d9d4c7" stroke="#1d1d1b" stroke-width="3"/><rect x="50" y="146" width="268" height="298" rx="6" fill="#ece8dd" stroke="#1d1d1b" stroke-width="2"/><path d="M34,138 L14,160 L14,430 L34,452" fill="#c9c3b3" stroke="#1d1d1b" stroke-width="2"/><circle cx="24" cy="295" r="7" fill="#1d1d1b" stroke="none" stroke-width="0"/><text x="184" y="178" font-size="17" text-anchor="middle" font-weight="bold" fill="#1d1d1b">COFRE DE SEGREDOS</text><rect x="66" y="196" width="236" height="104" rx="4" fill="#dbe7f3" stroke="#1f4e79" stroke-width="2"/><text x="184" y="226" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f4e79">Gaveta 1 · ARQUIVO A1</text><text x="184" y="252" font-size="17" text-anchor="middle" font-weight="normal" fill="#1f4e79">formato PKCS#12</text><text x="184" y="278" font-size="17" text-anchor="middle" font-weight="normal" fill="#1f4e79">cifrado</text><rect x="66" y="316" width="236" height="104" rx="4" fill="#e3f0e3" stroke="#2e7d32" stroke-width="2"/><text x="184" y="346" font-size="17" text-anchor="middle" font-weight="bold" fill="#2e7d32">Gaveta 2 · SENHA</text><text x="184" y="372" font-size="17" text-anchor="middle" font-weight="normal" fill="#2e7d32">cifrada à parte,</text><text x="184" y="398" font-size="17" text-anchor="middle" font-weight="normal" fill="#2e7d32">nunca no mesmo lugar</text><rect x="360" y="130" width="330" height="330" rx="6" fill="#ffffff" stroke="#1d1d1b" stroke-width="2"/><circle cx="380" cy="152" r="7" fill="#f6f3ec" stroke="#1d1d1b" stroke-width="2"/><line x1="334" y1="170" x2="374" y2="152" stroke="#1d1d1b" stroke-width="1.5" stroke-dasharray="4 4"/><text x="400" y="160" font-size="17" text-anchor="start" font-weight="bold" fill="#1d1d1b">Cadastro (lido do certificado)</text><text x="376" y="194" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">Titular: matriz</text><text x="376" y="218" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">CNPJ raiz: fictício</text><text x="376" y="242" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">Série: …9C41</text><text x="376" y="266" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">Válido de 09/12/2026, 10h05</text><text x="376" y="290" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">até 09/12/2027, 10h05</text><text x="376" y="314" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">(horário de Brasília)</text><text x="376" y="350" font-size="17" text-anchor="start" font-weight="bold" fill="#1d1d1b">Usado em:</text><text x="376" y="376" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">NF-e da matriz e da filial</text><text x="376" y="400" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">distribuição de DF-e</text><text x="376" y="424" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">NFS-e da matriz</text><text x="30" y="510" font-size="22" text-anchor="start" font-weight="bold" fill="#1d1d1b">Quem tem cada chave</text><rect x="30" y="530" width="660" height="88" rx="6" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/><circle cx="66" cy="570" r="16" fill="none" stroke="#1f4e79" stroke-width="5"/><line x1="82" y1="570" x2="128" y2="570" stroke="#1f4e79" stroke-width="6"/><line x1="116" y1="570" x2="116" y2="584" stroke="#1f4e79" stroke-width="5"/><line x1="126" y1="570" x2="126" y2="580" stroke="#1f4e79" stroke-width="5"/><text x="146" y="562" font-size="19" text-anchor="start" font-weight="bold" fill="#1f4e79">Serviço de emissão</text><text x="146" y="588" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">lê arquivo e senha para assinar e transmitir;</text><text x="146" y="610" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">funciona sem pessoa por perto</text><rect x="30" y="630" width="660" height="88" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/><circle cx="66" cy="670" r="16" fill="none" stroke="#2e7d32" stroke-width="5"/><line x1="82" y1="670" x2="128" y2="670" stroke="#2e7d32" stroke-width="6"/><line x1="116" y1="670" x2="116" y2="684" stroke="#2e7d32" stroke-width="5"/><line x1="126" y1="670" x2="126" y2="680" stroke="#2e7d32" stroke-width="5"/><text x="146" y="662" font-size="19" text-anchor="start" font-weight="bold" fill="#2e7d32">Responsável fiscal</text><text x="146" y="688" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">carrega arquivo e senha na tela de carga,</text><text x="146" y="710" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">com segundo fator; não pode baixar</text><rect x="30" y="730" width="660" height="88" rx="6" fill="#ffffff" stroke="#b26a00" stroke-width="2"/><circle cx="66" cy="770" r="16" fill="none" stroke="#b26a00" stroke-width="5"/><line x1="82" y1="770" x2="128" y2="770" stroke="#b26a00" stroke-width="6"/><line x1="116" y1="770" x2="116" y2="784" stroke="#b26a00" stroke-width="5"/><line x1="126" y1="770" x2="126" y2="780" stroke="#b26a00" stroke-width="5"/><text x="146" y="762" font-size="19" text-anchor="start" font-weight="bold" fill="#b26a00">Diretor</text><text x="146" y="788" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">aprova a ativação depois do teste;</text><text x="146" y="810" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">vê só o cadastro</text><rect x="30" y="830" width="660" height="88" rx="6" fill="#ffffff" stroke="#6b6b66" stroke-width="2"/><circle cx="66" cy="870" r="16" fill="none" stroke="#6b6b66" stroke-width="5"/><line x1="82" y1="870" x2="128" y2="870" stroke="#6b6b66" stroke-width="6"/><line x1="116" y1="870" x2="116" y2="884" stroke="#6b6b66" stroke-width="5"/><line x1="126" y1="870" x2="126" y2="880" stroke="#6b6b66" stroke-width="5"/><text x="146" y="862" font-size="19" text-anchor="start" font-weight="bold" fill="#6b6b66">TI</text><text x="146" y="888" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">agenda a troca e vê o registro;</text><text x="146" y="910" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">não vê a senha</text><rect x="30" y="934" width="660" height="92" rx="6" fill="#f6dedc" stroke="#b3261e" stroke-width="2"/><text x="46" y="964" font-size="19" text-anchor="start" font-weight="bold" fill="#b3261e">Ninguém faz:</text><text x="46" y="990" font-size="17" text-anchor="start" font-weight="normal" fill="#b3261e">baixar o arquivo de volta · ver a senha ·</text><text x="46" y="1013" font-size="17" text-anchor="start" font-weight="normal" fill="#b3261e">copiar o certificado para outro ambiente</text><text x="30" y="1080" font-size="22" text-anchor="start" font-weight="bold" fill="#1d1d1b">Fora do cofre: lugares a evitar</text><rect x="30" y="1100" width="324" height="72" rx="6" fill="#ffffff" stroke="#6b6b66" stroke-width="1.5"/><text x="44" y="1130" font-size="17" text-anchor="start" font-weight="bold" fill="#1d1d1b">Pasta compartilhada</text><text x="44" y="1154" font-size="16" text-anchor="start" font-weight="normal" fill="#6b6b66">com senha.txt ao lado</text><circle cx="328" cy="1136" r="15" fill="#b3261e" stroke="none" stroke-width="0"/><line x1="321" y1="1129" x2="335" y2="1143" stroke="#ffffff" stroke-width="3"/><line x1="335" y1="1129" x2="321" y2="1143" stroke="#ffffff" stroke-width="3"/><rect x="366" y="1100" width="324" height="72" rx="6" fill="#ffffff" stroke="#6b6b66" stroke-width="1.5"/><text x="380" y="1130" font-size="17" text-anchor="start" font-weight="bold" fill="#1d1d1b">E-mail encaminhado</text><text x="380" y="1154" font-size="16" text-anchor="start" font-weight="normal" fill="#6b6b66">ao fornecedor e ao contador</text><circle cx="664" cy="1136" r="15" fill="#b3261e" stroke="none" stroke-width="0"/><line x1="657" y1="1129" x2="671" y2="1143" stroke="#ffffff" stroke-width="3"/><line x1="671" y1="1129" x2="657" y2="1143" stroke="#ffffff" stroke-width="3"/><rect x="30" y="1186" width="324" height="72" rx="6" fill="#ffffff" stroke="#6b6b66" stroke-width="1.5"/><text x="44" y="1216" font-size="17" text-anchor="start" font-weight="bold" fill="#1d1d1b">Repositório de código</text><text x="44" y="1240" font-size="16" text-anchor="start" font-weight="normal" fill="#6b6b66">ou arquivo de configuração</text><circle cx="328" cy="1222" r="15" fill="#b3261e" stroke="none" stroke-width="0"/><line x1="321" y1="1215" x2="335" y2="1229" stroke="#ffffff" stroke-width="3"/><line x1="335" y1="1215" x2="321" y2="1229" stroke="#ffffff" stroke-width="3"/><rect x="366" y="1186" width="324" height="72" rx="6" fill="#ffffff" stroke="#6b6b66" stroke-width="1.5"/><text x="380" y="1216" font-size="17" text-anchor="start" font-weight="bold" fill="#1d1d1b">Computador de uma pessoa</text><text x="380" y="1240" font-size="16" text-anchor="start" font-weight="normal" fill="#6b6b66">que precisa estar ligado</text><circle cx="664" cy="1222" r="15" fill="#b3261e" stroke="none" stroke-width="0"/><line x1="657" y1="1215" x2="671" y2="1229" stroke="#ffffff" stroke-width="3"/><line x1="671" y1="1215" x2="657" y2="1229" stroke="#ffffff" stroke-width="3"/><text x="30" y="1312" font-size="22" text-anchor="start" font-weight="bold" fill="#1d1d1b">Num sistema na nuvem</text><rect x="30" y="1330" width="150" height="34" rx="4" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><text x="105" y="1353" font-size="17" text-anchor="middle" font-weight="bold" fill="#ffffff">A1</text><text x="192" y="1353" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">arquivo e senha no cofre; emissão sem pessoa</text><rect x="30" y="1374" width="150" height="34" rx="4" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="105" y="1397" font-size="17" text-anchor="middle" font-weight="bold" fill="#ffffff">A3 em token</text><text x="192" y="1397" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">na mesa de alguém: não serve a servidor na nuvem</text><rect x="30" y="1418" width="150" height="34" rx="4" fill="#1f4e79" stroke="#1f4e79" stroke-width="1"/><text x="105" y="1441" font-size="17" text-anchor="middle" font-weight="bold" fill="#ffffff">A3 em HSM</text><text x="192" y="1441" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">próprio ou guardado por prestador credenciado:</text><text x="192" y="1465" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">integração, autenticação e disponibilidade próprias</text><line x1="30" y1="1478" x2="690" y2="1478" stroke="#6b6b66" stroke-width="1"/><text x="30" y="1506" font-size="15" text-anchor="start" font-weight="normal" fill="#6b6b66">Exemplo fictício: empresa, certificado, série, datas e papéis inventados.</text><text x="690" y="1506" font-size="15" text-anchor="end" font-weight="normal" fill="#6b6b66">Ilustração · Torno 2026</text></svg>