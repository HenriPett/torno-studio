<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1370" viewBox="0 0 720 1370" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Etiqueta de produto segregado com os campos da RNC</title><desc id="d1">Exemplo fictício. Etiqueta vermelha de produto não conforme, segregado, não usar, pendurada por um barbante. Campos: RNC-2026-0118, aberta em 05/11 às 14:10; item SP-210, lote L2611-07, ordem OP 4471; 800 peças na fábrica e 400 no cliente; defeito D-07, furo de 7,96 a 7,99 mm; requisito diâmetro 8,00 mm, mais 0,05, menos zero; severidade maior, chegou ao cliente; detectado na inspeção final, centro de usinagem CU-03; produto na área de segregação S-2; disposição pendente entre retrabalho, refugo e concessão, decidida pela qualidade. Contenção de 05/11 14:10 a 06/11 10:00, 19 horas e 50 minutos, dentro da meta de 24 horas.</desc><rect x="0" y="0" width="720" height="1370" fill="#f4efe6"/><text x="40" y="58" font-size="30" fill="#1d1d1b" font-weight="bold" text-anchor="start">Produto segregado</text><rect x="450" y="30" width="230" height="38" rx="6" fill="#1d1d1b"/><text x="565" y="57" font-size="22" fill="#f4efe6" font-weight="bold" text-anchor="middle">EXEMPLO FICTÍCIO</text><text x="40" y="104" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Indústria Exemplo Ltda. · o que a RNC precisa ter</text><path d="M360 128 L360 160" stroke="#1d1d1b" stroke-width="6"/><circle cx="360" cy="128" r="10" fill="#1d1d1b"/><path d="M360 160 C330 190 330 215 360 236" fill="none" stroke="#8a6a3e" stroke-width="4"/><path d="M360 160 C390 190 390 215 360 236" fill="none" stroke="#8a6a3e" stroke-width="4"/><path d="M150 200 L570 200 L650 280 L650 1190 Q650 1210 630 1210 L90 1210 Q70 1210 70 1190 L70 280 Z" fill="#fffdf7" stroke="#1d1d1b" stroke-width="4"/><path d="M150 200 L570 200 L650 280 L650 400 L70 400 L70 280 Z" fill="#a33a2a" stroke="#1d1d1b" stroke-width="4"/><circle cx="360" cy="240" r="18" fill="#f4efe6" stroke="#1d1d1b" stroke-width="4"/><text x="360" y="318" font-size="40" fill="#ffffff" font-weight="bold" text-anchor="middle">NÃO CONFORME</text><text x="360" y="366" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="middle">SEGREGADO · NÃO USAR</text><text x="100" y="440" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Número e abertura</text><text x="100" y="470" font-size="24" fill="#1d1d1b" font-weight="bold" text-anchor="start">RNC-2026-0118 · 05/11 14:10</text><path d="M100 488 L620 488" stroke="#d8cfbf" stroke-width="2"/><text x="100" y="518" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Item, lote e ordem</text><text x="100" y="548" font-size="24" fill="#1d1d1b" font-weight="bold" text-anchor="start">SP-210 · L2611-07 · OP 4471</text><path d="M100 566 L620 566" stroke="#d8cfbf" stroke-width="2"/><text x="100" y="596" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Quantidade afetada</text><text x="100" y="626" font-size="24" fill="#1d1d1b" font-weight="bold" text-anchor="start">800 na fábrica · 400 no cliente</text><path d="M100 644 L620 644" stroke="#d8cfbf" stroke-width="2"/><text x="100" y="674" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Defeito (código e medida)</text><text x="100" y="704" font-size="24" fill="#1d1d1b" font-weight="bold" text-anchor="start">D-07 · furo de 7,96 a 7,99 mm</text><path d="M100 722 L620 722" stroke="#d8cfbf" stroke-width="2"/><text x="100" y="752" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Requisito</text><text x="100" y="782" font-size="24" fill="#1d1d1b" font-weight="bold" text-anchor="start">Ø 8,00 mm, +0,05 / −0,00</text><path d="M100 800 L620 800" stroke="#d8cfbf" stroke-width="2"/><text x="100" y="830" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Severidade</text><text x="100" y="860" font-size="24" fill="#1d1d1b" font-weight="bold" text-anchor="start">MAIOR · chegou ao cliente</text><path d="M100 878 L620 878" stroke="#d8cfbf" stroke-width="2"/><text x="100" y="908" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Onde foi detectado</text><text x="100" y="938" font-size="24" fill="#1d1d1b" font-weight="bold" text-anchor="start">inspeção final · centro CU-03</text><path d="M100 956 L620 956" stroke="#d8cfbf" stroke-width="2"/><text x="100" y="986" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Onde está o produto</text><text x="100" y="1016" font-size="24" fill="#1d1d1b" font-weight="bold" text-anchor="start">área de segregação S-2</text><path d="M100 1034 L620 1034" stroke="#d8cfbf" stroke-width="2"/><text x="100" y="1068" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Disposição</text><rect x="100" y="1084" width="26" height="26" rx="3" fill="#fffdf7" stroke="#1d1d1b" stroke-width="3"/><text x="136" y="1106" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">retrabalho</text><rect x="280" y="1084" width="26" height="26" rx="3" fill="#fffdf7" stroke="#1d1d1b" stroke-width="3"/><text x="316" y="1106" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">refugo</text><rect x="460" y="1084" width="26" height="26" rx="3" fill="#fffdf7" stroke="#1d1d1b" stroke-width="3"/><text x="496" y="1106" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">concessão</text><rect x="100" y="1144" width="520" height="40" rx="6" fill="#e9d9b8" stroke="#1d1d1b" stroke-width="2"/><text x="360" y="1172" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">PENDENTE · decide a qualidade</text><text x="40" y="1255" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Contenção: 05/11 14:10 → 06/11 10:00</text><text x="40" y="1287" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">19 h 50 min; meta combinada: 24 h</text><text x="40" y="1337" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Ilustração · Torno 2026</text></svg>
