<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1160" aria-labelledby="title desc" role="img" viewBox="0 0 720 1160"><title id="title">Localize o erro e confira os totais</title><desc id="desc">Modelo editorial de relatório de rejeição com linhas fictícias, campo, motivo e ação; não representa cliente nem resultado de teste.</desc><rect width="720" height="1160" fill="#f7f6f2"/><text x="36" y="55" fill="#1c5a49" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">TORNO · DEVOLUTIVA DE ERROS</text><text x="36" y="118" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="700">O que precisa ser corrigido?</text><text x="36" y="164" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Modelo ilustrativo, sem arquivo ou teste real.</text><rect width="656" height="368" x="32" y="210" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="12"/><path stroke="#dcd9d1" stroke-width="2" d="M32 272 H688 M32 424 H688"/><text x="48" y="250" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">Linha</text><text x="140" y="250" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">Campo</text><text x="252" y="250" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">Motivo</text><text x="440" y="250" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">Ação</text><text x="48" y="318" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">2</text><text x="140" y="318" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Produto</text><text x="252" y="318" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Produto</text><text x="252" y="350" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">inexistente</text><text x="440" y="318" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Corrigir conforme</text><text x="440" y="350" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">o modelo aceito</text><text x="48" y="470" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">3</text><text x="140" y="470" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Campo</text><text x="252" y="470" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Obrigatório</text><text x="252" y="502" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">ausente</text><text x="440" y="470" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Preencher o</text><text x="440" y="502" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">campo indicado</text><text x="36" y="640" fill="#1c5a49" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Arquivo inválido ≠ linha inválida</text><text x="36" y="684" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Explique se o problema impede a leitura</text><text x="36" y="722" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">ou afeta registros identificáveis.</text><rect width="656" height="218" x="32" y="770" fill="#eeece6" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="814" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Totais com significado explícito</text><text x="54" y="860" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Diferencie linhas lidas, resultados da prévia</text><text x="54" y="899" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">e registros efetivamente gravados.</text><text x="54" y="945" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Explique rejeições e itens não importados.</text><text x="36" y="1048" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">O recibo deve permitir conferir cada resultado.</text><text x="36" y="1115" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Exemplo editorial fictício · adapte ao produto.</text></svg>