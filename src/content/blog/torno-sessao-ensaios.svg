<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">Bilhete de ensaio de sessão</title><desc id="desc">Bilhete fictício com três linhas para conferir sessão ativa, sessão vencida e novo login de outra pessoa.</desc><rect width="800" height="500" rx="24" fill="#e4d4bb"/><path d="M115 45h570v410H115z" fill="#fffdf6" stroke="#354f44" stroke-width="4"/><text x="155" y="108" font-family="sans-serif" font-size="32" font-weight="bold" fill="#263e35">Bilhete de ensaio</text><text x="155" y="144" font-family="sans-serif" font-size="17" fill="#526459">Exemplo editorial · nenhum teste executado</text><path d="M150 177H650M150 270H650M150 360H650" stroke="#b7c7bd" stroke-width="3"/><circle cx="180" cy="218" r="16" fill="#a7c6aa"/><circle cx="180" cy="310" r="16" fill="#e8b55e"/><circle cx="180" cy="400" r="16" fill="#ca8d76"/><text x="215" y="227" font-family="sans-serif" font-size="23" fill="#263e35">Sessão ativa</text><text x="215" y="319" font-family="sans-serif" font-size="23" fill="#263e35">Sessão vencida</text><text x="215" y="409" font-family="sans-serif" font-size="23" fill="#263e35">Outra pessoa entra</text></svg>
