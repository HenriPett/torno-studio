text x="595" y="850" font-size="22" fill="#ffffff" font-weight="bold" text-anchor="middle" >igual</text><text x="60" y="897" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start" >E-mail</text><text x="170" y="897" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start" >maria.souza@example.com</text><rect x="530" y="871" width="130" height="36" rx="18" fill="#2e7d4f"/><text x="595" y="896" font-size="22" fill="#ffffff" font-weight="bold" text-anchor="middle" >igual</text><text x="60" y="943" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start" >Nome</text><text x="170" y="943" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start" >Ap. ≠ Aparecida</text><rect x="530" y="917" width="130" height="36" rx="18" fill="#a35f00"/><text x="595" y="942" font-size="22" fill="#ffffff" font-weight="bold" text-anchor="middle" >parecido</text><text x="40" y="1031" font-size="24" fill="#1d1d1b" font-weight="bold" text-anchor="start" >Mesmo CPF: o sistema recusa e mostra C-1042.</text><text x="40" y="1067" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start" >Nome parecido, sozinho, gera só aviso.</text><text x="680" y="1126" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="end" >Ilustração · Torno Studio 2026</text></svg>