<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1140" viewBox="0 0 720 1140" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Ache as diferenças no cadastro: ficha existente e novo cadastro</title><desc id="d1">Ilustração com exemplo fictício: a ficha C-1042 e um novo cadastro digitado parecem diferentes em nome, CPF, celular e e-mail; na forma canônica, CPF, celular e e-mail são iguais e o nome é só parecido. Mesmo CPF: o sistema recusa e mostra C-1042. Torno Studio 2026.</desc><rect width="720" height="1140" fill="#f4efe6"/><text x="40" y="58" font-size="32" fill="#1d1d1b" font-weight="bold" text-anchor="start" >Ache as diferenças no cadastro</text><rect x="450" y="76" width="230" height="38" rx="6" fill="#1d1d1b"/><text x="565" y="103" font-size="22" fill="#f4efe6" font-weight="bold" text-anchor="middle" >EXEMPLO FICTÍCIO</text><g transform="rotate(-1.5 340 260)"><rect x="46" y="148" width="600" height="236" rx="6" fill="#d9cfbf"/><rect x="40" y="140" width="600" height="236" rx="6" fill="#fffdf7" stroke="#8a7f6e" stroke-width="2"/><line x1="40" y1="192" x2="640" y2="192" stroke="#c94f4f" stroke-width="2"/><text x="62" y="176" font-size="24" fill="#1d1d1b" font-weight="bold" text-anchor="start" >Ficha C-1042 · já cadastrada</text><line x1="60" y1="242" x2="620" y2="242" stroke="#b9d3e6" stroke-width="1.5"/><text x="62" y="232" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start" >Nome</text><text x="190" y="232" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start" >Maria Ap. Souza</text><line x1="60" y1="284" x2="620" y2="284" stroke="#b9d3e6" stroke-width="1.5"/><text x="62" y="274" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start" >CPF</text><text x="190" y="274" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start" >123.456.789-09</text><line x1="60" y1="326" x2="620" y2="326" stroke="#b9d3e6" stroke-width="1.5"/><text x="62" y="316" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start" >Celular</text><text x="190" y="316" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start" >(11) 98765-4321</text><line x1="60" y1="368" x2="620" y2="368" stroke="#b9d3e6" stroke-width="1.5"/><text x="62" y="358" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start" >E-mail</text><text x="190" y="358" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start" >maria.souza@example.com</text></g><g transform="rotate(1.2 370 540)"><rect x="76" y="428" width="600" height="236" rx="6" fill="#d9cfbf"/><rect x="70" y="420" width="600" height="236" rx="6" fill="#fffdf7" stroke="#8a7f6e" stroke-width="2"/><line x1="70" y1="472" x2="670" y2="472" stroke="#c94f4f" stroke-width="2"/><text x="92" y="456" font-size="24" fill="#1d1d1b" font-weight="bold" text-anchor="start" >Novo cadastro digitado</text><line x1="90" y1="522" x2="650" y2="522" stroke="#b9d3e6" stroke-width="1.5"/><text x="92" y="512" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start" >Nome</text><text x="220" y="512" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start" >MARIA APARECIDA SOUZA</text><line x1="90" y1="564" x2="650" y2="564" stroke="#b9d3e6" stroke-width="1.5"/><text x="92" y="554" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start" >CPF</text><text x="220" y="554" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start" >12345678909</text><line x1="90" y1="606" x2="650" y2="606" stroke="#b9d3e6" stroke-width="1.5"/><text x="92" y="596" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start" >Celular</text><text x="220" y="596" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start" >+55 11 98765 4321</text><line x1="90" y1="648" x2="650" y2="648" stroke="#b9d3e6" stroke-width="1.5"/><text x="92" y="638" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start" >E-mail</te