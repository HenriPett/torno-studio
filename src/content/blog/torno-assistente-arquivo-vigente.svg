<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1940" viewBox="0 0 720 1940" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">O arquivo do assistente e a resposta com fonte</title><desc id="d1">Exemplo fictício. Acervo do assistente de IA da Metalúrgica Exemplo Ltda., desenhado como uma gaveta de arquivo. Pasta IT-PRE-031 rev. D, setup da prensa P-07, carimbo vigente desde 03/11/2026: item 5.3, torque da matriz 210 N·m. Pasta IT-PRE-031 rev. C, carimbo obsoleta, substituída em 03/11/2026: item 5.3, torque da matriz 180 N·m. Pasta Custos de ferramental, com cadeado: restrita à diretoria e à engenharia. Fora da gaveta, fora do acervo: fichas de saúde e atestados dos funcionários, dado sensível. Pergunta de um operador do turno B: qual o torque de fixação da matriz na prensa P-07? Resposta: 210 N·m, em cruz, em duas passadas; fonte IT-PRE-031 rev. D, item 5.3; trecho: apertar os 4 parafusos M20 da matriz a 210 N·m, em cruz, em duas passadas. Pergunta do mesmo operador: quanto custa a matriz da P-07? Resposta: não encontrei isso nos documentos que você pode consultar. Regras do exemplo: a rev. C fica no histórico da qualidade e nunca entra numa resposta operacional; documento restrito não aparece na resposta de quem não tem acesso; toda resposta traz documento, revisão, item e o trecho usado. Torno 2026.</desc><rect x="0" y="0" width="720" height="1940" rx="0" fill="#f4efe6"/><text x="40" y="58" font-size="32" fill="#1d1d1b" font-weight="bold" text-anchor="start">O arquivo e a resposta</text><rect x="450" y="30" width="230" height="38" rx="6" fill="#1d1d1b"/><text x="565" y="57" font-size="22" fill="#f4efe6" font-weight="bold" text-anchor="middle">EXEMPLO FICTÍCIO</text><text x="40" y="104" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Metalúrgica Exemplo Ltda. · acervo do assistente</text><rect x="70" y="150" width="250" height="42" rx="8" fill="#d8bf95" stroke="#1d1d1b" stroke-width="3"/><text x="86" y="179" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">IT-PRE-031 rev. D</text><rect x="56" y="188" width="608" height="150" rx="6" fill="#fffdf7" stroke="#1d1d1b" stroke-width="3"/><text x="80" y="228" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Setup da prensa P-07</text><text x="80" y="264" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Item 5.3: torque da matriz 210 N·m</text><text x="80" y="306" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Em vigor desde 03/11/2026</text><rect x="462" y="280" width="180" height="44" rx="6" fill="none" stroke="#2f7d4f" stroke-width="3"/><text x="552" y="310" font-size="24" fill="#2f7d4f" font-weight="bold" text-anchor="middle">VIGENTE</text><rect x="220" y="354" width="250" height="42" rx="8" fill="#d8bf95" stroke="#1d1d1b" stroke-width="3"/><text x="236" y="383" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">IT-PRE-031 rev. C</text><rect x="56" y="392" width="608" height="150" rx="6" fill="#fffdf7" stroke="#1d1d1b" stroke-width="3"/><text x="80" y="432" font-size="22" fill="#5c564c" font-weight="bold" text-anchor="start">Setup da prensa P-07</text><text x="80" y="468" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Item 5.3: torque da matriz 180 N·m</text><path d="M80 461 L424 461" fill="none" stroke="#5c564c" stroke-width="2"/><text x="80" y="510" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Substituída em 03/11/2026</text><g transform="rotate(-8 560 500)"><rect x="462" y="476" width="196" height="46" rx="6" fill="none" stroke="#a33a2a" stroke-width="3"/><text x="560" y="508" font-size="24" fill="#a33a2a" font-weight="bold" text-anchor="middle">OBSOLETA</text></g><rect x="380" y="558" width="270" height="42" rx="8" fill="#d8bf95" stroke="#1d1d1b" stroke-width="3"/><text x="396" y="587" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Custos de ferramental</text><rect x="56" y="596" width="608" height="112" rx="6" fill="#fffdf7" stroke="#1d1d1b" stroke-width="3"/><text x="80" y="638" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Restrito: diretoria e engenharia</text><text x="80" y="674" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Operador não vê nem como pista.</text><rect x="596" y="640" width="40" height="32" rx="4" fill="#1d1d1b"/><path d="M604 640 L604 628 A12 12 0 0 1 628 628 L628 640" fill="none" stroke="#1d1d1b" stroke-width="4"/><rect x="40" y="708" width="640" height="80" rx="8" fill="#d8bf95" stroke="#1d1d1b" stroke-width="4"/><rect x="300" y="724" width="120" height="16" rx="6" fill="#f4efe6" stroke="#1d1d1b" stroke-width="2"/><text x="360" y="772" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="middle">Acervo do assistente</text><rect x="40" y="816" width="640" height="112" rx="8" fill="none" stroke="#a33a2a" stroke-width="3" stroke-dasharray="10 8"/><text x="64" y="856" font-size="22" fill="#a33a2a" font-weight="bold" text-anchor="start">Fora do acervo</text><text x="64" y="892" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Fichas de saúde e atestados (dado sensível)</text><text x="40" y="980" font-size="22" fill="#5c564c" font-weight="bold" text-anchor="start">Pergunta · operador, turno B</text><rect x="40" y="996" width="640" height="84" rx="14" fill="#ffffff" stroke="#1d1d1b" stroke-width="2"/><text x="64" y="1030" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Qual o torque de fixação da matriz</text><text x="64" y="1064" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">na prensa P-07?</text><rect x="40" y="1096" width="640" height="250" rx="14" fill="#efe7d6" stroke="#1d1d1b" stroke-width="2"/><text x="64" y="1136" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">210 N·m, em cruz, em duas passadas.</text><text x="64" y="1174" font-size="22" fill="#2f7d4f" font-weight="bold" text-anchor="start">Fonte: IT-PRE-031 rev. D, item 5.3</text><rect x="64" y="1196" width="592" height="126" rx="4" fill="#fffdf7"/><rect x="64" y="1196" width="8" height="126" rx="0" fill="#2f7d4f"/><text x="88" y="1234" font-size="22" fill="#1d1d1b" font-weight="normal" font-style="italic" text-anchor="start">“Apertar os 4 parafusos M20 da</text><text x="88" y="1268" font-size="22" fill="#1d1d1b" font-weight="normal" font-style="italic" text-anchor="start">matriz a 210 N·m, em cruz, em duas</text><text x="88" y="1302" font-size="22" fill="#1d1d1b" font-weight="normal" font-style="italic" text-anchor="start">passadas.”</text><text x="40" y="1392" font-size="22" fill="#5c564c" font-weight="bold" text-anchor="start">Pergunta · mesmo operador</text><rect x="40" y="1408" width="640" height="54" rx="14" fill="#ffffff" stroke="#1d1d1b" stroke-width="2"/><text x="64" y="1443" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Quanto custa a matriz da P-07?</text><rect x="40" y="1478" width="640" height="86" rx="14" fill="#efe7d6" stroke="#1d1d1b" stroke-width="2"/><text x="64" y="1513" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Não encontrei isso nos documentos</text><text x="64" y="1547" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">que você pode consultar.</text><text x="40" y="1616" font-size="26" fill="#1d1d1b" font-weight="bold" text-anchor="start">Regras do exemplo</text><circle cx="56" cy="1648" r="5" fill="#1d1d1b"/><text x="72" y="1656" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">A rev. C fica no histórico da qualidade;</text><text x="72" y="1692" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">nunca entra numa resposta operacional.</text><circle cx="56" cy="1734" r="5" fill="#1d1d1b"/><text x="72" y="1742" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Documento restrito não aparece na</text><text x="72" y="1778" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">resposta de quem não tem acesso.</text><circle cx="56" cy="1820" r="5" fill="#1d1d1b"/><text x="72" y="1828" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Toda resposta traz documento, revisão,</text><text x="72" y="1864" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">item e o trecho usado.</text><text x="680" y="1910" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="end">Ilustração · Torno 2026</text></svg>