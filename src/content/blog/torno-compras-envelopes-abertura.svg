<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1454" viewBox="0 0 720 1454" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Envelopes lacrados até o prazo</title><desc id="d1">Exemplo fictício. Abertura das propostas da cotação COT-0088 da Exemplo Caldeiraria Ltda. Linha do tempo: convite na sexta 27/11; prazo de resposta na quarta 02/12 às 17h00; mapa aberto na quinta 03/12. Antes do prazo, três envelopes lacrados: Aços Alfa, pelo portal; Beta Metais, por e-mail com PDF, digitada pelo comprador; Gama Distribuidora, pela planilha do convite. A tela do comprador mostra só: 3 propostas recebidas, preços fechados. Depois do prazo, os envelopes abertos mostram o total nominal: Alfa R$ 10.625,76; Beta R$ 10.752,00; Gama R$ 10.324,32. Um quarto envelope, Delta Aços, chegou na quinta 03/12 às 08h10, com carimbo vermelho: fora do prazo, registrada, fora do mapa. Nenhum fornecedor vê o preço do outro; reabrir o prazo é para todos, com motivo.</desc><rect x="0" y="0" width="720" height="1454" fill="#f6f3ec"/><rect x="10" y="10" width="700" height="1434" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="450" y="24" width="246" height="46" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="573" y="56" font-size="22" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="118" font-size="32" text-anchor="start" font-weight="bold" fill="#1d1d1b">Envelopes lacrados</text><text x="30" y="158" font-size="32" text-anchor="start" font-weight="bold" fill="#1d1d1b">até o prazo</text><text x="30" y="202" font-size="24" text-anchor="start" fill="#5a5a55">Cotação COT-0088</text><line x1="70.0" y1="284.0" x2="650.0" y2="284.0" stroke="#1d1d1b" stroke-width="4"/><circle cx="90" cy="284" r="11" fill="#1d1d1b"/><text x="90" y="330" font-size="24" text-anchor="middle" font-weight="bold" fill="#1d1d1b">27/11</text><text x="90" y="362" font-size="24" text-anchor="middle" fill="#1d1d1b">convite</text><circle cx="360" cy="284" r="11" fill="#b3261e"/><text x="360" y="330" font-size="24" text-anchor="middle" font-weight="bold" fill="#b3261e">02/12 17h</text><text x="360" y="362" font-size="24" text-anchor="middle" fill="#b3261e">prazo</text><circle cx="630" cy="284" r="11" fill="#2e7d32"/><text x="630" y="330" font-size="24" text-anchor="middle" font-weight="bold" fill="#2e7d32">03/12</text><text x="630" y="362" font-size="24" text-anchor="middle" fill="#2e7d32">abertura</text><text x="30" y="414" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Antes do prazo</text><rect x="36" y="438" width="204" height="170" rx="6" fill="#ffffff" stroke="#1f4e79" stroke-width="3"/><path d="M36,438 L138.0,509.4 L240,438" fill="none" stroke="#1f4e79" stroke-width="3"/><rect x="122.0" y="505.4" width="32" height="26" rx="3" fill="#b3261e" stroke="#b3261e" stroke-width="2"/><path d="M128.0,505.4 L128.0,495.4 A10,10 0 0 1 148.0,495.4 L148.0,505.4" fill="none" stroke="#b3261e" stroke-width="4"/><text x="138.0" y="556" font-size="24" text-anchor="middle" font-weight="bold" fill="#1f4e79">Alfa</text><text x="138.0" y="588" font-size="24" text-anchor="middle" fill="#5a5a55">portal</text><rect x="258" y="438" width="204" height="170" rx="6" fill="#ffffff" stroke="#1f4e79" stroke-width="3"/><path d="M258,438 L360.0,509.4 L462,438" fill="none" stroke="#1f4e79" stroke-width="3"/><rect x="344.0" y="505.4" width="32" height="26" rx="3" fill="#b3261e" stroke="#b3261e" stroke-width="2"/><path d="M350.0,505.4 L350.0,495.4 A10,10 0 0 1 370.0,495.4 L370.0,505.4" fill="none" stroke="#b3261e" stroke-width="4"/><text x="360.0" y="556" font-size="24" text-anchor="middle" font-weight="bold" fill="#1f4e79">Beta</text><text x="360.0" y="588" font-size="24" text-anchor="middle" fill="#5a5a55">e-mail+PDF</text><rect x="480" y="438" width="204" height="170" rx="6" fill="#ffffff" stroke="#1f4e79" stroke-width="3"/><path d="M480,438 L582.0,509.4 L684,438" fill="none" stroke="#1f4e79" stroke-width="3"/><rect x="566.0" y="505.4" width="32" height="26" rx="3" fill="#b3261e" stroke="#b3261e" stroke-width="2"/><path d="M572.0,505.4 L572.0,495.4 A10,10 0 0 1 592.0,495.4 L592.0,505.4" fill="none" stroke="#b3261e" stroke-width="4"/><text x="582.0" y="556" font-size="24" text-anchor="middle" font-weight="bold" fill="#1f4e79">Gama</text><text x="582.0" y="588" font-size="24" text-anchor="middle" fill="#5a5a55">planilha</text><rect x="30" y="634" width="660" height="110" rx="4" fill="#eef3f8" stroke="#1f4e79" stroke-width="2"/><text x="50" y="676" font-size="24" text-anchor="start" font-weight="bold" fill="#1f4e79">Tela do comprador:</text><text x="50" y="714" font-size="24" text-anchor="start" fill="#1d1d1b">3 propostas recebidas · preços fechados</text><text x="30" y="804" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Depois do prazo (03/12)</text><rect x="36" y="894" width="204" height="110" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><path d="M36,894 L138.0,855.5 L240,894" fill="none" stroke="#2e7d32" stroke-width="3"/><rect x="48" y="864" width="180" height="130" rx="2" fill="#fffdf6" stroke="#5a5a55" stroke-width="1.5"/><text x="138.0" y="914" font-size="24" text-anchor="middle" font-weight="bold" fill="#2e7d32">Alfa</text><text x="138.0" y="956" font-size="24" text-anchor="middle" font-weight="bold" fill="#1d1d1b">R$ 10.625,76</text><rect x="258" y="894" width="204" height="110" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><path d="M258,894 L360.0,855.5 L462,894" fill="none" stroke="#2e7d32" stroke-width="3"/><rect x="270" y="864" width="180" height="130" rx="2" fill="#fffdf6" stroke="#5a5a55" stroke-width="1.5"/><text x="360.0" y="914" font-size="24" text-anchor="middle" font-weight="bold" fill="#2e7d32">Beta</text><text x="360.0" y="956" font-size="24" text-anchor="middle" font-weight="bold" fill="#1d1d1b">R$ 10.752,00</text><rect x="480" y="894" width="204" height="110" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><path d="M480,894 L582.0,855.5 L684,894" fill="none" stroke="#2e7d32" stroke-width="3"/><rect x="492" y="864" width="180" height="130" rx="2" fill="#fffdf6" stroke="#5a5a55" stroke-width="1.5"/><text x="582.0" y="914" font-size="24" text-anchor="middle" font-weight="bold" fill="#2e7d32">Gama</text><text x="582.0" y="956" font-size="24" text-anchor="middle" font-weight="bold" fill="#1d1d1b">R$ 10.324,32</text><rect x="30" y="1044" width="660" height="170" rx="4" fill="#fbe9e7" stroke="#b3261e" stroke-width="2"/><text x="50" y="1086" font-size="24" text-anchor="start" font-weight="bold" fill="#b3261e">Delta Aços · 03/12 às 08h10</text><text x="50" y="1122" font-size="24" text-anchor="start" fill="#b3261e">registrada, fora do mapa</text><g transform="rotate(-8 520 1169)"><rect x="390" y="1142" width="270" height="52" rx="4" fill="none" stroke="#b3261e" stroke-width="4"/><text x="525" y="1178" font-size="26" text-anchor="middle" font-weight="bold" fill="#b3261e">FORA DO PRAZO</text></g><rect x="30" y="1244" width="660" height="110" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="2"/><text x="50" y="1286" font-size="24" text-anchor="start" font-weight="bold" fill="#1d1d1b">Nenhum fornecedor vê o preço do outro.</text><text x="50" y="1324" font-size="24" text-anchor="start" fill="#1d1d1b">Reabrir o prazo: para todos, com motivo.</text><text x="30" y="1390" font-size="24" text-anchor="start" fill="#5a5a55">Exemplo fictício: dados inventados.</text><text x="690" y="1424" font-size="24" text-anchor="end" fill="#5a5a55">Ilustração · Torno 2026</text></svg>
