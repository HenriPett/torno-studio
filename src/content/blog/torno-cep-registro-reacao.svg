eight="bold" fill="#4a4f55">Ação</text><text x="210.0" y="462.0" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">troca do inserto · 12h25</text><rect x="31.0" y="478.0" width="658.0" height="40.0" rx="0" fill="#f3f5f7" stroke="none" stroke-width="0"/><text x="48.0" y="504.0" font-size="19" text-anchor="start" font-weight="bold" fill="#4a4f55">Confirmação</text><text x="210.0" y="504.0" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">subgrupo 32 · 12h40 · 20,0008 · ok</text><text x="48.0" y="546.0" font-size="19" text-anchor="start" font-weight="bold" fill="#4a4f55">Medição 100%</text><text x="210.0" y="546.0" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">40 peças: 20,004 a 20,036</text><rect x="31.0" y="562.0" width="658.0" height="40.0" rx="0" fill="#f3f5f7" stroke="none" stroke-width="0"/><text x="48.0" y="588.0" font-size="19" text-anchor="start" font-weight="bold" fill="#4a4f55">Decisão</text><text x="210.0" y="588.0" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">liberadas pela qualidade · 13h10</text><text x="48.0" y="630.0" font-size="19" text-anchor="start" font-weight="bold" fill="#4a4f55">RNC</text><text x="210.0" y="630.0" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">não: nenhuma peça fora</text><rect x="31.0" y="646.0" width="658.0" height="40.0" rx="0" fill="#f3f5f7" stroke="none" stroke-width="0"/><text x="48.0" y="672.0" font-size="19" text-anchor="start" font-weight="bold" fill="#4a4f55">Recálculo</text><text x="210.0" y="672.0" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">subgrupo 31 fica de fora</text><text x="48.0" y="724.0" font-size="19" text-anchor="start" font-weight="bold" fill="#4a4f55">Histórico</text><line x1="70.0" y1="750.0" x2="70.0" y2="886.0" stroke="#1f4e79" stroke-width="2"/><circle cx="70.0" cy="750.0" r="6" fill="#1f4e79"/><text x="88.0" y="757.0" font-size="19" text-anchor="start" font