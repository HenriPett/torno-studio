<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1250" viewBox="0 0 720 1250" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Maquete do registro de reação ao sinal do subgrupo 31</title><desc id="d1">Exemplo fictício. Maquete de uma tela de registro de reação, não é tela de produto. Sinal na carta do diâmetro do eixo EX-12, torno TC-04. Subgrupo 31, 12/11/2026 às 12h00; regra: ponto acima do LSC, 20,0198 maior que 20,0171; limites v1, aprovados em 11/11. Peças retidas: 40, produzidas entre 11h00 e 12h00. Causa: desgaste da aresta do inserto, registrada pelo líder às 12h20. Ação: troca do inserto às 12h25. Confirmação: subgrupo 32 às 12h40, média 20,0008, dentro. Medição 100% das 40 peças retidas: entre 20,004 e 20,036, liberadas pela qualidade às 13h10. RNC: não, nenhuma peça fora da tolerância. Próximo recálculo: subgrupo 31 excluído, causa atribuída. Histórico de 12h00 a 13h10. Abaixo, outro cartão: subgrupo 33, às 13h40, amplitude 0,054 maior que 0,0481; peça 3 com 20,052, acima do LSE; RNC-2026-0147 aberta, tratada no fluxo de não conformidade.</desc><rect x="0.0" y="0.0" width="720.0" height="1250.0" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14.0" y="14.0" width="692.0" height="1222.0" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30.0" y="58.0" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Registro de reação ao sinal</text><text x="30.0" y="92.0" font-size="22" text-anchor="start" font-weight="normal" fill="#1d1d1b">EX-12 · diâmetro · torno TC-04</text><text x="30.0" y="136.0" font-size="22" text-anchor="start" font-weight="normal" fill="#4a4f55">maquete, não é tela de produto</text><rect x="470.0" y="108.0" width="222.0" height="40.0" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581.0" y="136.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><rect x="30.0" y="166.0" width="660.