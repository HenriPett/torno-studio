<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1470" viewBox="0 0 720 1470" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Onde a nota parou: sistema, rede ou SEFAZ</title><desc id="d1">Exemplo fictício. Árvore de diagnóstico para a pergunta: a NF-e não foi autorizada, onde parou? Nível 1, no sistema: o sistema abriu o certificado e assinou? Não: falha local (senha errada, arquivo corrompido, vencido pelo relógio do servidor, CNPJ-base de outra empresa, serviço do HSM fora); nada foi enviado; não repetir; alerta a quem cuida do certificado. Nível 2, na rede: a conexão TLS com a SEFAZ completou? Não: falha de conexão sem código (certificado de transmissão recusado pelo próprio protocolo, cadeia não reconhecida, rede ou SEFAZ fora); repetir com intervalo, guardar o detalhe técnico, alertar se persistir. Nível 3, na SEFAZ: que código voltou? 280 a 286, certificado de transmissão, alerta crítico, não repetir; 290 a 296, certificado de assinatura, alerta crítico, não repetir; 297 e 298, assinatura, defeito do sistema, chamado à TI; 213, ou 593 na distribuição de DF-e, certificado de outra empresa, bloquear e conferir o cadastro; outros códigos, conteúdo da nota, vai para quem emitiu, fora deste artigo. Códigos do Anexo I do manual da NF-e modelo 77, versão de agosto de 2026; confirme no manual do modelo e da versão que o seu sistema implementa.</desc><defs><marker id="ab" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L16,7 L0,14 z" fill="#1f4e79"/></marker><marker id="ag" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L16,7 L0,14 z" fill="#2e7d32"/></marker><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L16,7 L0,14 z" fill="#b3261e"/></marker><marker id="ak" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L16,7 L0,14 z" fill="#1d1d1b"/></marker><marker id="ay" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto"><path d="M0,0 L16,7 L0,14 z" fill="#6b6b66"/></marker></defs><rect x="0" y="0" width="720" height="1470" fill="#f6f3ec"/><rect x="14" y="14" width="692" height="1442" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="530" y="30" width="160" height="34" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="610" y="53" font-size="15" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="58" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Onde a nota parou?</text><text x="30" y="90" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">Distribuidora Exemplo de Ferramentas Ltda. · NF-e não autorizada</text><rect x="160" y="118" width="400" height="52" rx="26" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1"/><text x="360" y="151" font-size="20" text-anchor="middle" font-weight="bold" fill="#ffffff">A NF-e não foi autorizada</text><rect x="30" y="200" width="24" height="250" rx="3" fill="#1f4e79" stroke="#1f4e79" stroke-width="1"/><text x="47" y="325" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" transform="rotate(-90 47 325)">NO SISTEMA</text><path d="M90,220 L340,220 L360,268.0 L340,316 L90,316 L70,268.0 Z" fill="#ffffff" stroke="#1d1d1b" stroke-width="2"/><text x="215.0" y="262" font-size="18" text-anchor="middle" font-weight="bold" fill="#1d1d1b">O sistema abriu o</text><text x="215.0" y="286" font-size="18" text-anchor="middle" font-weight="bold" fill="#1d1d1b">certificado e assinou?</text><line x1="360" y1="268" x2="398" y2="268" stroke="#b3261e" stroke-width="3" marker-end="url(#ar)"/><text x="381" y="256" font-size="15" text-anchor="middle" font-weight="bold" fill="#b3261e">NÃO</text><rect x="400" y="200" width="290" height="236" rx="6" fill="#f6dedc" stroke="#b3261e" stroke-width="2"/><text x="414" y="228" font-size="18" text-anchor="start" font-weight="bold" fill="#b3261e">FALHA LOCAL</text><text x="414" y="254" font-size="16" text-anchor="start" font-weight="normal" fill="#1d1d1b">senha errada · arquivo corrompido</text><text x="414" y="275" font-size="16" text-anchor="start" font-weight="normal" fill="#1d1d1b">vencido pelo relógio do servidor</text><text x="414" y="296" font-size="16" text-anchor="start" font-weight="normal" fill="#1d1d1b">CNPJ-base de outra empresa</text><text x="414" y="317" font-size="16" text-anchor="start" font-weight="normal" fill="#1d1d1b">serviço do HSM fora</text><text x="414" y="338" font-size="16" text-anchor="start" font-weight="normal" fill="#1d1d1b">nada foi enviado à SEFAZ</text><line x1="414" y1="355" x2="676" y2="355" stroke="#b3261e" stroke-width="1"/><text x="414" y="377" font-size="16" text-anchor="start" font-weight="bold" fill="#b3261e">não repetir; alerta a quem</text><text x="414" y="398" font-size="16" text-anchor="start" font-weight="bold" fill="#b3261e">cuida do certificado</text><line x1="360" y1="170" x2="215" y2="218" stroke="#1d1d1b" stroke-width="3" marker-end="url(#ak)"/><line x1="215" y1="318" x2="215" y2="490" stroke="#2e7d32" stroke-width="3" marker-end="url(#ag)"/><text x="226" y="370" font-size="15" text-anchor="start" font-weight="bold" fill="#2e7d32">SIM</text><rect x="30" y="490" width="24" height="250" rx="3" fill="#b26a00" stroke="#b26a00" stroke-width="1"/><text x="47" y="615" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" transform="rotate(-90 47 615)">NA REDE</text><path d="M90,510 L340,510 L360,558.0 L340,606 L90,606 L70,558.0 Z" fill="#ffffff" stroke="#1d1d1b" stroke-width="2"/><text x="215.0" y="552" font-size="18" text-anchor="middle" font-weight="bold" fill="#1d1d1b">A conexão TLS com</text><text x="215.0" y="576" font-size="18" text-anchor="middle" font-weight="bold" fill="#1d1d1b">a SEFAZ completou?</text><line x1="360" y1="558" x2="398" y2="558" stroke="#b26a00" stroke-width="3" marker-end="url(#ak)"/><text x="381" y="546" font-size="15" text-anchor="middle" font-weight="bold" fill="#b26a00">NÃO</text><rect x="400" y="490" width="290" height="236" rx="6" fill="#fbeccc" stroke="#b26a00" stroke-width="2"/><text x="414" y="518" font-size="18" text-anchor="start" font-weight="bold" fill="#b26a00">CONEXÃO, SEM CÓDIGO</text><text x="414" y="544" font-size="16" text-anchor="start" font-weight="normal" fill="#1d1d1b">certificado de transmissão</text><text x="414" y="565" font-size="16" text-anchor="start" font-weight="normal" fill="#1d1d1b">recusado pelo próprio protocolo</text><text x="414" y="586" font-size="16" text-anchor="start" font-weight="normal" fill="#1d1d1b">cadeia não reconhecida</text><text x="414" y="607" font-size="16" text-anchor="start" font-weight="normal" fill="#1d1d1b">rede instável ou SEFAZ fora</text><text x="414" y="628" font-size="16" text-anchor="start" font-weight="normal" fill="#1d1d1b">guardar o detalhe técnico</text><line x1="414" y1="645" x2="676" y2="645" stroke="#b26a00" stroke-width="1"/><text x="414" y="667" font-size="16" text-anchor="start" font-weight="bold" fill="#b26a00">repetir com intervalo;</text><text x="414" y="688" font-size="16" text-anchor="start" font-weight="bold" fill="#b26a00">alertar se persistir</text><line x1="215" y1="608" x2="215" y2="780" stroke="#2e7d32" stroke-width="3" marker-end="url(#ag)"/><text x="226" y="660" font-size="15" text-anchor="start" font-weight="bold" fill="#2e7d32">SIM</text><rect x="30" y="780" width="24" height="540" rx="3" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1"/><text x="47" y="1050" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" transform="rotate(-90 47 1050)">NA SEFAZ</text><path d="M90,800 L340,800 L360,848.0 L340,896 L90,896 L70,848.0 Z" fill="#ffffff" stroke="#1d1d1b" stroke-width="2"/><text x="215.0" y="842" font-size="18" text-anchor="middle" font-weight="bold" fill="#1d1d1b">Que código</text><text x="215.0" y="866" font-size="18" text-anchor="middle" font-weight="bold" fill="#1d1d1b">voltou?</text><line x1="215" y1="896" x2="215" y2="1290" stroke="#1d1d1b" stroke-width="3"/><line x1="215" y1="954" x2="256" y2="954" stroke="#1d1d1b" stroke-width="3" marker-end="url(#ak)"/><rect x="258" y="916" width="432" height="76" rx="6" fill="#f6dedc" stroke="#b3261e" stroke-width="2"/><rect x="258" y="916" width="118" height="76" rx="6" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="317" y="961" font-size="19" text-anchor="middle" font-weight="bold" fill="#ffffff">280 a 286</text><text x="390" y="947" font-size="16" text-anchor="start" font-weight="bold" fill="#1d1d1b">certificado de transmissão</text><text x="390" y="972" font-size="16" text-anchor="start" font-weight="normal" fill="#b3261e">alerta crítico; não repetir</text><line x1="215" y1="1038" x2="256" y2="1038" stroke="#1d1d1b" stroke-width="3" marker-end="url(#ak)"/><rect x="258" y="1000" width="432" height="76" rx="6" fill="#f6dedc" stroke="#b3261e" stroke-width="2"/><rect x="258" y="1000" width="118" height="76" rx="6" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="317" y="1045" font-size="19" text-anchor="middle" font-weight="bold" fill="#ffffff">290 a 296</text><text x="390" y="1031" font-size="16" text-anchor="start" font-weight="bold" fill="#1d1d1b">certificado de assinatura</text><text x="390" y="1056" font-size="16" text-anchor="start" font-weight="normal" fill="#b3261e">alerta crítico; não repetir</text><line x1="215" y1="1122" x2="256" y2="1122" stroke="#1d1d1b" stroke-width="3" marker-end="url(#ak)"/><rect x="258" y="1084" width="432" height="76" rx="6" fill="#dbe7f3" stroke="#1f4e79" stroke-width="2"/><rect x="258" y="1084" width="118" height="76" rx="6" fill="#1f4e79" stroke="#1f4e79" stroke-width="1"/><text x="317" y="1129" font-size="19" text-anchor="middle" font-weight="bold" fill="#ffffff">297 e 298</text><text x="390" y="1115" font-size="16" text-anchor="start" font-weight="bold" fill="#1d1d1b">assinatura fora do padrão ou alterada</text><text x="390" y="1140" font-size="16" text-anchor="start" font-weight="normal" fill="#1f4e79">defeito do sistema; chamado à TI</text><line x1="215" y1="1206" x2="256" y2="1206" stroke="#1d1d1b" stroke-width="3" marker-end="url(#ak)"/><rect x="258" y="1168" width="432" height="76" rx="6" fill="#f6dedc" stroke="#b3261e" stroke-width="2"/><rect x="258" y="1168" width="118" height="76" rx="6" fill="#b3261e" stroke="#b3261e" stroke-width="1"/><text x="317" y="1213" font-size="19" text-anchor="middle" font-weight="bold" fill="#ffffff">213 · 593</text><text x="390" y="1199" font-size="16" text-anchor="start" font-weight="bold" fill="#1d1d1b">CNPJ-base de outra empresa</text><text x="390" y="1224" font-size="16" text-anchor="start" font-weight="normal" fill="#b3261e">593: na distribuição de DF-e; bloquear</text><line x1="215" y1="1290" x2="256" y2="1290" stroke="#1d1d1b" stroke-width="3" marker-end="url(#ak)"/><rect x="258" y="1252" width="432" height="76" rx="6" fill="#ffffff" stroke="#6b6b66" stroke-width="2"/><rect x="258" y="1252" width="118" height="76" rx="6" fill="#6b6b66" stroke="#6b6b66" stroke-width="1"/><text x="317" y="1297" font-size="19" text-anchor="middle" font-weight="bold" fill="#ffffff">outros</text><text x="390" y="1283" font-size="16" text-anchor="start" font-weight="bold" fill="#1d1d1b">conteúdo da nota</text><text x="390" y="1308" font-size="16" text-anchor="start" font-weight="normal" fill="#1d1d1b">vai para quem emitiu; fora deste artigo</text><text x="30" y="1358" font-size="15" text-anchor="start" font-weight="normal" fill="#6b6b66">Códigos do Anexo I do manual da NF-e modelo 77 (agosto de 2026);</text><text x="30" y="1378" font-size="15" text-anchor="start" font-weight="normal" fill="#6b6b66">confirme no manual do modelo e da versão que o seu sistema implementa.</text><line x1="30" y1="1408" x2="690" y2="1408" stroke="#6b6b66" stroke-width="1"/><text x="30" y="1436" font-size="15" text-anchor="start" font-weight="normal" fill="#6b6b66">Exemplo fictício: árvore como recomendação de modelagem.</text><text x="690" y="1436" font-size="15" text-anchor="end" font-weight="normal" fill="#6b6b66">Ilustração · Torno 2026</text></svg>