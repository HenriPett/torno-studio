<svg xmlns="http://www.w3.org/2000/svg" width="720" height="995" viewBox="0 0 720 995" role="img" aria-labelledby="title desc"><title id="title">Antes de repetir, confira o resultado</title><desc id="desc">Diagrama conceitual original; equivalente textual no artigo.</desc><rect width="720" height="995" fill="#f7f6f2"/><text x="40" y="65" fill="#16181a" font-family="Arial" font-size="36" font-weight="600">Antes de repetir,</text><text x="40" y="111" fill="#16181a" font-family="Arial" font-size="36" font-weight="600">confira o resultado</text><rect x="40" y="153" width="640" height="123" rx="14" fill="#fff" stroke="#7c8187" stroke-width="2"/><text x="64" y="197" fill="#1c5a49" font-family="Arial" font-size="28" font-weight="600">Concluído</text><text x="64" y="240" fill="#16181a" font-family="Arial" font-size="27" font-weight="400">↓ Preservar resultado</text><rect x="40" y="302" width="640" height="142" rx="14" fill="#fff" stroke="#7c8187" stroke-width="2"/><text x="64" y="346" fill="#1c5a49" font-family="Arial" font-size="28" font-weight="600">Recusado</text><text x="64" y="389" fill="#16181a" font-family="Arial" font-size="27" font-weight="400">↓ Resolver impedimento</text><text x="64" y="424" fill="#16181a" font-family="Arial" font-size="27" font-weight="400">↓ Reavaliar tentativa</text><rect x="40" y="470" width="640" height="123" rx="14" fill="#fff" stroke="#7c8187" stroke-width="2"/><text x="64" y="514" fill="#1c5a49" font-family="Arial" font-size="28" font-weight="600">A confirmar</text><text x="64" y="557" fill="#16181a" font-family="Arial" font-size="27" font-weight="400">↓ Consultar execução</text><path d="M360 593V609" stroke="#7c8187" stroke-width="2"/><path d="M360 609L460 662L360 715L260 662Z" fill="#e2ede8" stroke="#1c5a49" stroke-width="2"/><text x="300" y="672" fill="#16181a" font-family="Arial" font-size="26" font-weight="600">Concluiu?</text><path d="M260 662H190V744M460 662H530V744" fill="none" stroke="#7c8187" stroke-width="2"/><rect x="40" y="744" width="304" height="147" rx="14" fill="#e2ede8" stroke="#1c5a49" stroke-width="2"/><text x="60" y="788" fill="#16181a" font-family="Arial" font-size="27" font-weight="600">Confirmado:</text><text x="60" y="833" fill="#16181a" font-family="Arial" font-size="27" font-weight="400">preservar</text><rect x="368" y="744" width="312" height="147" rx="14" fill="#eeece6" stroke="#7c8187" stroke-width="2"/><text x="387" y="788" fill="#16181a" font-family="Arial" font-size="27" font-weight="600">Não concluído:</text><text x="387" y="833" fill="#16181a" font-family="Arial" font-size="27" font-weight="400">avaliar retomada</text><text x="40" y="952" fill="#52575c" font-family="Arial" font-size="26" font-weight="400">Fluxo conceitual</text></svg>