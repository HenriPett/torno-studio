<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1190" viewBox="0 0 720 1190" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Do custo padrão ao custo real da OP 7001: cascata das variações</title><desc id="d1">Exemplo fictício. Cascata do custo padrão ao custo real da ordem de produção OP 7001, de 1.000 flanges FL-80 boas, da Metalúrgica Exemplo Ltda., em novembro de 2026. Padrão: 1.000 × R$ 48,00 = R$ 48.000. Seis degraus somam R$ 3.182: preço do material R$ 615, (13,00 − 12,50) × 1.230 kg, analisado por compras; quantidade de material R$ 375, 30 kg a mais vezes 12,50 por causa de 25 peças refugadas, produção e qualidade; taxa da mão de obra R$ 212, (46,00 − 45,00) × 212 h, RH e controladoria; eficiência da mão de obra R$ 540, 12 horas a mais vezes 45,00; eficiência do custo indireto variável R$ 360, 12 h vezes 30,00; eficiência do custo indireto fixo R$ 1.080, 12 h vezes 90,00, produção. As 12 horas a mais são 5 horas das peças refugadas e 7 horas de retrabalho de 20 peças. Real: R$ 51.182, ou R$ 51,18 por peça, 6,6% acima do padrão. Todas as variações são desfavoráveis.</desc><rect x="0.0" y="0.0" width="720.0" height="1190.0" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14.0" y="14.0" width="692.0" height="1162.0" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30.0" y="58.0" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Do padrão ao real · OP 7001</text><text x="30.0" y="92.0" font-size="22" text-anchor="start" font-weight="normal" fill="#1d1d1b">1.000 flanges FL-80 boas · nov/2026</text><text x="30.0" y="136.0" font-size="22" text-anchor="start" font-weight="normal" fill="#4a4f55">R$ · todas desfavoráveis</text><rect x="470.0" y="108.0" width="222.0" height="40.0" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581.0" y="136.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><rect x="30.0" y="170.0" width="660.0" height="70.0" rx="6" fill="#dde8f3" stroke="#1f4e79" stroke-width="1.5"/><text x="46.0" y="200.0" font-size="21" text-anchor="start" font-weight="bold" fill="#1f4e79">Padrão: 1.000 × R$ 48,00</text><text x="46.0" y="228.0" font-size="20" text-anchor="start" font-weight="normal" fill="#1f4e79">= R$ 48.000 (ponto de partida)</text><text x="46.0" y="282.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">Preço do material</text><text x="674.0" y="282.0" font-size="20" text-anchor="end" font-weight="bold" fill="#b42318">+R$ 615</text><text x="46.0" y="308.0" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55">(13,00 − 12,50) × 1.230 kg</text><text x="674.0" y="308.0" font-size="18" text-anchor="end" font-weight="normal" fill="#4a4f55">compras</text><rect x="60.0" y="320.0" width="116.0" height="22.0" rx="2" fill="#fbe4e1" stroke="#b42318" stroke-width="1.5"/><text x="46.0" y="400.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">Quantidade de material</text><text x="674.0" y="400.0" font-size="20" text-anchor="end" font-weight="bold" fill="#b42318">+R$ 375</text><text x="46.0" y="426.0" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55">30 kg a mais × 12,50 (25 refugadas)</text><text x="674.0" y="426.0" font-size="18" text-anchor="end" font-weight="normal" fill="#4a4f55">produção e qualidade</text><rect x="176.0" y="438.0" width="70.7" height="22.0" rx="2" fill="#fbe4e1" stroke="#b42318" stroke-width="1.5"/><text x="46.0" y="518.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">Taxa da mão de obra</text><text x="674.0" y="518.0" font-size="20" text-anchor="end" font-weight="bold" fill="#b42318">+R$ 212</text><text x="46.0" y="544.0" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55">(46,00 − 45,00) × 212 h</text><text x="674.0" y="544.0" font-size="18" text-anchor="end" font-weight="normal" fill="#4a4f55">RH e controladoria</text><rect x="246.7" y="556.0" width="40.0" height="22.0" rx="2" fill="#fbe4e1" stroke="#b42318" stroke-width="1.5"/><text x="46.0" y="636.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">Eficiência da mão de obra</text><text x="674.0" y="636.0" font-size="20" text-anchor="end" font-weight="bold" fill="#b42318">+R$ 540</text><text x="46.0" y="662.0" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55">12 h a mais × 45,00</text><text x="674.0" y="662.0" font-size="18" text-anchor="end" font-weight="normal" fill="#4a4f55">produção</text><rect x="286.6" y="674.0" width="101.8" height="22.0" rx="2" fill="#fbe4e1" stroke="#b42318" stroke-width="1.5"/><text x="46.0" y="754.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">Eficiência · CIF variável</text><text x="674.0" y="754.0" font-size="20" text-anchor="end" font-weight="bold" fill="#b42318">+R$ 360</text><text x="46.0" y="780.0" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55">12 h a mais × 30,00</text><text x="674.0" y="780.0" font-size="18" text-anchor="end" font-weight="normal" fill="#4a4f55">produção</text><rect x="388.5" y="792.0" width="67.9" height="22.0" rx="2" fill="#fbe4e1" stroke="#b42318" stroke-width="1.5"/><text x="46.0" y="872.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">Eficiência · CIF fixo</text><text x="674.0" y="872.0" font-size="20" text-anchor="end" font-weight="bold" fill="#b42318">+R$ 1.080</text><text x="46.0" y="898.0" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55">12 h a mais × 90,00</text><text x="674.0" y="898.0" font-size="18" text-anchor="end" font-weight="normal" fill="#4a4f55">produção</text><rect x="456.4" y="910.0" width="203.6" height="22.0" rx="2" fill="#fbe4e1" stroke="#b42318" stroke-width="1.5"/><line x1="60.0" y1="940.0" x2="60.0" y2="960.0" stroke="#1d1d1b" stroke-width="1.5"/><line x1="660.0" y1="920.0" x2="660.0" y2="960.0" stroke="#1d1d1b" stroke-width="1.5"/><line x1="60.0" y1="950.0" x2="660.0" y2="950.0" stroke="#1d1d1b" stroke-width="1.5"/><text x="360.0" y="978.0" font-size="19" text-anchor="middle" font-weight="bold" fill="#b42318">variação total R$ 3.182</text><rect x="30.0" y="998.0" width="660.0" height="100.0" rx="6" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.5"/><text x="46.0" y="1030.0" font-size="22" text-anchor="start" font-weight="bold" fill="#1d1d1b">Real: R$ 51.182 · R$ 51,18 por peça</text><text x="46.0" y="1060.0" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">6,6% acima do padrão</text><text x="46.0" y="1086.0" font-size="19" text-anchor="start" font-weight="normal" fill="#4a4f55">12 h a mais = 5 h de refugo + 7 h de retrabalho</text><text x="30.0" y="1156.0" font-size="22" text-anchor="start" font-weight="normal" fill="#4a4f55">Ilustração · Torno 2026</text><text x="690.0" y="1156.0" font-size="22" text-anchor="end" font-weight="normal" fill="#4a4f55">números inventados</text></svg>