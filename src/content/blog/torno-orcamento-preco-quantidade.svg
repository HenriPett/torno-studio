<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1300" viewBox="0 0 720 1300" role="img" aria-labelledby="t2 d2" font-family="Arial, Helvetica, sans-serif"><title id="t2">Preço unitário do eixo EB-45 rev. B por faixa de quantidade</title><desc id="d2">Exemplo fictício. Barras empilhadas, de baixo para cima: custo por peça, custo do lote dividido pela quantidade, tributos e margem. 50 peças: 35,56 + 14,10 + 21,29 = R$ 70,95. 200 peças: 38,76 + 2,03 + 17,48 = R$ 58,27. 1.000 peças: 38,76 + 0,41 + 16,78 = R$ 55,95. Em 50 peças a térmica fica no mínimo de R$ 300 por remessa e entra no custo do lote. De 200 para 1.000 peças o preço cai só R$ 2,32.</desc><rect x="0" y="0" width="720" height="1300" rx="0" fill="#fcfcfb" stroke="none" stroke-width="0"/><text x="30" y="56" font-size="28" text-anchor="start" font-weight="bold" fill="#0b0b0b">Preço unitário por faixa</text><text x="30" y="90" font-size="22" text-anchor="start" font-weight="normal" fill="#52514e">Eixo EB-45 rev. B · R$ por peça</text><rect x="470" y="112" width="222" height="40" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581" y="140" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><rect x="30" y="168" width="22" height="22" rx="4" fill="#1baf7a" stroke="none" stroke-width="0"/><text x="62" y="186" font-size="22" text-anchor="start" font-weight="normal" fill="#0b0b0b">Tributos (12%) + margem (18%)</text><rect x="30" y="206" width="22" height="22" rx="4" fill="#eb6834" stroke="none" stroke-width="0"/><text x="62" y="224" font-size="22" text-anchor="start" font-weight="normal" fill="#0b0b0b">Custo do lote ÷ quantidade</text><rect x="30" y="244" width="22" height="22" rx="4" fill="#2a78d6" stroke="none" stroke-width="0"/><text x="62" y="262" font-size="22" text-anchor="start" font-weight="normal" fill="#0b0b0b">Custo por peça</text><path d="M110 930.0 L690 930.0" stroke="#52514e" stroke-width="2" fill="none"/><text x="100" y="938.0" font-size="22" text-anchor="end" font-weight="normal" fill="#52514e">0</text><path d="M110 780.0 L690 780.0" stroke="#e2e0da" stroke-width="1.5" fill="none"/><text x="100" y="788.0" font-size="22" text-anchor="end" font-weight="normal" fill="#52514e">20</text><path d="M110 630.0 L690 630.0" stroke="#e2e0da" stroke-width="1.5" fill="none"/><text x="100" y="638.0" font-size="22" text-anchor="end" font-weight="normal" fill="#52514e">40</text><path d="M110 480.0 L690 480.0" stroke="#e2e0da" stroke-width="1.5" fill="none"/><text x="100" y="488.0" font-size="22" text-anchor="end" font-weight="normal" fill="#52514e">60</text><path d="M110 330.0 L690 330.0" stroke="#e2e0da" stroke-width="1.5" fill="none"/><text x="100" y="338.0" font-size="22" text-anchor="end" font-weight="normal" fill="#52514e">80</text><rect x="160" y="663.3" width="120" height="266.7" rx="0" fill="#2a78d6" stroke="none" stroke-width="0"/><rect x="160" y="557.5" width="120" height="103.8" rx="0" fill="#eb6834" stroke="none" stroke-width="0"/><path d="M160 555.5 L160 401.9 Q160 397.9 164 397.9 L276 397.9 Q280 397.9 280 401.9 L280 555.5 Z" fill="#1baf7a"/><text x="220.0" y="804.6" font-size="22" text-anchor="middle" font-weight="bold" fill="#ffffff">35,56</text><text x="220.0" y="618.4" font-size="22" text-anchor="middle" font-weight="bold" fill="#0b0b0b">14,10</text><text x="220.0" y="485.7" font-size="22" text-anchor="middle" font-weight="bold" fill="#0b0b0b">21,29</text><text x="220.0" y="383.9" font-size="24" text-anchor="middle" font-weight="bold" fill="#0b0b0b">R$ 70,95</text><text x="220.0" y="966" font-size="22" text-anchor="middle" font-weight="normal" fill="#0b0b0b">50 peças</text><rect x="345" y="639.3" width="120" height="290.7" rx="0" fill="#2a78d6" stroke="none" stroke-width="0"/><rect x="345" y="624.1" width="120" height="13.2" rx="0" fill="#eb6834" stroke="none" stroke-width="0"/><path d="M345 622.1 L345 497.0 Q345 493.0 349 493.0 L461 493.0 Q465 493.0 465 497.0 L465 622.1 Z" fill="#1baf7a"/><t