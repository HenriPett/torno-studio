<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1160" aria-labelledby="t d" role="img" viewBox="0 0 720 1160"><title id="t">Passaporte editorial do registro</title><desc id="d">Caderno aberto para registrar identidade, origem, persistência, confirmação no destino, conflito e limites. Não é tela de produto nem documento real.</desc><rect width="720" height="1160" fill="#f7f6f2"/><text x="36" y="55" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">TORNO · PASSAPORTE DO REGISTRO</text><text x="36" y="118" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start">Qual estado pode ser comprovado?</text><text x="36" y="164" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Uma ficha de evidências, sem dados de cliente.</text><path fill="#fff" stroke="#b7b2a8" stroke-width="2" d="M32 250Q188 214 360 250Q524 214 688 250V928Q526 900 360 936Q188 900 32 928Z"/><path stroke="#b7b2a8" stroke-width="2" d="M360 250V936"/><path stroke="#dcd9d1" stroke-width="2" d="M56 350H328 M392 350H664 M56 610H328 M392 610H664"/><text x="58" y="309" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">IDENTIDADE</text><text x="392" y="309" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">NO DESTINO</text><text x="58" y="400" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">Origem e referência</text><text x="58" y="444" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Qual registro?</text><text x="58" y="481" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Qual versão e</text><text x="58" y="518" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">última atualização?</text><text x="392" y="400" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">Confirmação</text><text x="392" y="444" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Qual evidência</text><text x="392" y="481" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">mostra o que foi</text><text x="392" y="518" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">salvo no servidor?</text><text x="58" y="666" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">PERSISTÊNCIA</text><text x="392" y="666" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">DIVERGÊNCIAS</text><text x="58" y="718" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">O que fica local?</text><text x="58" y="755" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Até quando e sob</text><text x="58" y="792" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">quais condições?</text><text x="392" y="718" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Há outra alteração?</text><text x="392" y="755" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Quem decide como</text><text x="392" y="792" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">tratar o conflito?</text><circle cx="590" cy="863" r="39" fill="none" stroke="#1c5a49" stroke-dasharray="4 4" stroke-width="2"/><text x="590" y="871" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" text-anchor="middle">?</text><text x="46" y="1011" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">Um estado desconhecido continua pendente.</text><text x="46" y="1054" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start">Registre o limite e a próxima conferência.</text><text x="46" y="1111" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start">Ilustração editorial · não representa uma interface.</text></svg>