<svg xmlns="http://www.w3.org/2000/svg" width="360" height="668" aria-labelledby="title desc" role="img" viewBox="0 0 360 668"><title id="title">Uma falha e três partes relacionadas</title><desc id="desc">Exemplo hipotético: cadastro e histórico podem ser preservados, regra de aprovação precisa ser investigada, e relatórios e avisos que usam o status devem ser verificados.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="5" refY="3"><path fill="none" stroke="#27443d" stroke-width="1.5" d="M0,0 L6,3 L0,6"/></marker></defs><rect width="360" height="668" fill="#f6f3eb"/><g fill="#18372f" font-family="DejaVu Sans, sans-serif"><text x="20" y="30" font-size="13" font-weight="700">EXEMPLO HIPOTÉTICO</text><text x="20" y="60" font-size="23" font-weight="700">Uma falha, três partes</text><text x="20" y="87" font-size="16">Sistema de solicitações internas</text><rect width="320" height="104" x="20" y="110" fill="#fff" stroke="#b7c9bd" rx="12"/><text x="36" y="138" font-size="18" font-weight="700">A Cadastro e histórico</text><text x="36" y="165" font-size="16">Funcionam no cenário avaliado.</text><text x="36" y="188" font-size="16">Candidato a preservar.</text><path fill="none" stroke="#27443d" stroke-width="2" marker-end="url(#arrow)" d="M180,218 V240"/><rect width="320" height="126" x="20" y="250" fill="#ffe5b8" stroke="#9a651e" rx="12"/><text x="36" y="279" font-size="18" font-weight="700">B Regra de aprovação</text><text x="36" y="307" font-size="16">Resultado incorreto observado.</text><text x="36" y="332" font-size="16">Investigar causa e alcance</text><text x="36" y="355" font-size="16">antes de propor a correção.</text><path fill="none" stroke="#27443d" stroke-width="2" marker-end="url(#arrow)" d="M180,380 V402"/><rect width="320" height="104" x="20" y="412" fill="#fff" stroke="#b7c9bd" rx="12"/><text x="36" y="440" font-size="18" font-weight="700">C Relatórios e avisos</text><text x="36" y="467" font-size="16">Consomem o status aprovado.</text><text x="36" y="490" font-size="16">Verificar efeitos da mudança.</text><text x="20" y="552" font-size="15" font-weight="700">Setas = dependência de informação</text><text x="20" y="583" font-size="16">Corrigir B exige conferir A e C.</text><text x="20" y="610" font-size="15">O exemplo não define uma solução.</text><text x="20" y="644" font-size="15">Torno Studio • Diagrama original</text></g></svg>