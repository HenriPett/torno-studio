<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc"><title id="title">Do saldo físico ao que pode ser publicado</title><desc id="desc">Barra vertical empilhada fictícia do SKU CAN-042, com saldo físico de 20 unidades, camadas proporcionais. De baixo para cima: reservado em pedidos confirmados, 3; bloqueado por avaria ou conferência, 2; margem de segurança, 2; disponível para publicar, 13. Abaixo, a fórmula: disponível = físico − reservado − bloqueado − margem = 20 − 3 − 2 − 2 = 13. Nota: a margem é decisão da empresa.</desc><rect width="720" height="1040" rx="24" fill="#f4f2eb"/><text x="32" y="54" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#1e2837">Do saldo físico ao publicável</text><rect x="32" y="74" width="232" height="42" rx="21" fill="#fffdf8" stroke="#536270" stroke-width="2.5"/><text x="148" y="103" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#536270" text-anchor="middle">Exemplo fictício</text><text x="32" y="152" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Físico 20 · CAN-042</text><path d="M32 184V174H232V184" fill="none" stroke="#536270" stroke-width="3"/><rect x="32" y="204" width="200" height="312" fill="#426d6b"/><path d="M32 228H232" stroke="#fff" stroke-width="1.5" opacity=".45"/><path d="M32 252H232" stroke="#fff" stroke-width="1.5" opacity=".45"/><path d="M32 276H232" stroke="#fff" stroke-width="1.5" opacity=".45"/><path d="M32 300H232" stroke="#fff" stroke-width="1.5" opacity=".45"/><path d="M32 324H232" stroke="#fff" stroke-width="1.5" opacity=".45"/><path d="M32 348H232" stroke="#fff" stroke-width="1.5" opacity=".45"/><path d="M32 372H232" stroke="#fff" stroke-width="1.5" opacity=".45"/><path d="M32 396H232" stroke="#fff" stroke-width="1.5" opacity=".45"/><path d="M32 420H232" stroke="#fff" stroke-width="1.5" opacity=".45"/><path d="M32 444H232" stroke="#fff" stroke-width="1.5" opacity=".45"/><path d="M32 468H232" stroke="#fff" stroke-width="1.5" opacity=".45"/><path d="M32 492H232" stroke="#fff" stroke-width="1.5" opacity=".45"/><text x="132.0" y="373.0" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" fill="#fff" text-anchor="middle">13</text><path d="M232 360.0H262" stroke="#536270" stroke-width="2.5"/><text x="272" y="368.0" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Disponível para publicar</text><rect x="32" y="516" width="200" height="48" fill="#e9c9a0"/><path d="M32 540H232" stroke="#fff" stroke-width="1.5" opacity=".45"/><text x="132.0" y="549.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1e2837" text-anchor="middle">2</text><path d="M232 540.0H262" stroke="#536270" stroke-width="2.5"/><text x="272" y="548.0" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Margem de segurança</text><rect x="32" y="564" width="200" height="48" fill="#c8782f"/><path d="M32 588H232" stroke="#fff" stroke-width="1.5" opacity=".45"/><text x="132.0" y="597.0" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1e2837" text-anchor="middle">2</text><path d="M232 588.0H262" stroke="#536270" stroke-width="2.5"/><text x="272" y="586.0" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Bloqueado</text><text x="272" y="614.0" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#1e2837">(avaria/conferência)</text><rect x="32" y="612" width="200" height="72" fill="#8a5a2b"/><path d="M32 636H232" stroke="#fff" stroke-width="1.5" opacity=".45"/><path d="M32 660H232" stroke="#fff" stroke-width="1.5" opacity=".45"/><text x="132.0" y="661.0" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" fill="#fff" text-anchor="middle">3</text><path d="M232 648.0H262" stroke="#536270" stroke-width="2.5"/><text x="272" y="646.0" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Reservado em pedidos</text><text x="272" y="674.0" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#1e2837">confirmados</text><rect x="32" y="204" width="200" height="480" fill="none" stroke="#1e2837" stroke-width="3.5"/><rect x="32" y="720" width="656" height="170" rx="16" fill="#fffdf8" stroke="#c8782f" stroke-width="3.5"/><text x="56" y="764" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1e2837">Disponível = físico − reservado</text><text x="56" y="800" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1e2837">− bloqueado − margem</text><text x="56" y="850" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#8a5a2b">= 20 − 3 − 2 − 2 = 13</text><text x="32" y="970" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">A margem é decisão da empresa.</text><text x="32" y="1016" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">Ilustração original Torno Studio, 2026</text></svg>