<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1190" viewBox="0 0 720 1190" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Tolerância da peça e limite de controle da média: duas réguas diferentes</title><desc id="d1">Exemplo fictício. Duas réguas na mesma escala, de 19,940 a 20,060 mm, para o diâmetro do eixo EX-12, desenho 20,000 mais ou menos 0,050. Régua 1, cada peça contra o desenho: faixa de tolerância de 19,950 a 20,050; as 5 peças do subgrupo 31, de 20,012 a 20,027, estão dentro; no subgrupo 33, a peça de 20,052 está fora. Régua 2, a média de 5 peças contra a carta: faixa de controle de 19,9908 a 20,0171, bem mais estreita, com a tolerância tracejada para comparação; a média do subgrupo 31, 20,0198, está fora; a do 33, 20,0118, dentro. Conclusão: subgrupo 31, peças conformes e sinal no processo, sem RNC; subgrupo 33, peça fora da tolerância vai para RNC e a amplitude 0,054 dá sinal na carta R. Capacidade do estudo: sigma dentro = 0,02272 ÷ 2,326 = 0,00977; Cp 1,71; Cpk 1,57; sigma global 0,01008; Pp 1,65; Ppk 1,52.</desc><rect x="0.0" y="0.0" width="720.0" height="1190.0" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14.0" y="14.0" width="692.0" height="1162.0" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30.0" y="58.0" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Tolerância × limite de controle</text><text x="30.0" y="92.0" font-size="22" text-anchor="start" font-weight="normal" fill="#1d1d1b">Eixo EX-12 · Ø 20,000 ± 0,050 mm</text><text x="30.0" y="136.0" font-size="22" text-anchor="start" font-weight="normal" fill="#4a4f55">mesma escala nas duas réguas</text><rect x="470.0" y="108.0" width="222.0" height="40.0" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581.0" y="136.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><rect x="30.0" y="166.0" width="660.0" height="330.0" rx=