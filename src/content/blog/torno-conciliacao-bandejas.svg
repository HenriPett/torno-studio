<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1130" viewBox="0 0 720 1130" role="img" aria-labelledby="title desc"><title id="title">Mesa de triagem: três bandejas</title><desc id="desc">Mesa de triagem vista de cima com três bandejas. Conciliado: P-0042 com Pix de R$ 1.250,00; NN-0007 pago R$ 1.000,00, tarifa R$ 21,50, crédito R$ 978,50. Exceção, decisão humana: R$ 215,90 sem identificação; P-0051 sugerido por valor e data; devolução Pix de R$ 100,00 do P-0042. Rejeitado: arquivo de retorno com trailer que não confere, arquivo inteiro recusado; registro 14 com data inválida, só o registro recusado. Exemplo fictício.</desc><rect width="720" height="1130" rx="24" fill="#f4f2eb"/><text x="32" y="54" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#1e2837">Mesa de triagem: três bandejas</text><rect x="32" y="74" width="232" height="42" rx="21" fill="#fffdf8" stroke="#536270" stroke-width="2.5"/><text x="148" y="103" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#536270" text-anchor="middle">Exemplo fictício</text><rect x="16" y="132" width="688" height="948" rx="18" fill="#e9e4d6"/><rect x="32" y="160" width="656" height="255" rx="16" fill="#426d6b" opacity=".45"/><rect x="32" y="150" width="656" height="255" rx="16" fill="#d3e6e6" stroke="#426d6b" stroke-width="5"/><rect x="32" y="150" width="656" height="52" rx="16" fill="#426d6b"/><rect x="32" y="180" width="656" height="22" fill="#426d6b"/><path d="M48 176L57 186L73 166" fill="none" stroke="#fffdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="186" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#fffdf8">Conciliado</text><g transform="rotate(-0.5 360 247.5)"><rect x="52" y="218" width="616" height="59" rx="8" fill="#fffdf8" stroke="#426d6b" stroke-width="2.5"/><text x="70" y="254" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#1e2837">P-0042 ↔ Pix R$ 1.2