roke="#8a5a2b" stroke-width="5"/><rect x="32" y="770" width="656" height="52" rx="16" fill="#8a5a2b"/><rect x="32" y="800" width="656" height="22" fill="#8a5a2b"/><path d="M49 785L71 807M71 785L49 807" stroke="#fffdf8" stroke-width="6" stroke-linecap="round"/><text x="90" y="806" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#fffdf8">Rejeitado</text><g transform="rotate(-0.5 360 883.0)"><rect x="52" y="838" width="616" height="90" rx="8" fill="#fffdf8" stroke="#8a5a2b" stroke-width="2.5"/><text x="70" y="874" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#1e2837">Arquivo de retorno: trailer não</text><text x="70" y="905" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#1e2837">confere → arquivo inteiro recusado</text></g><g transform="rotate(0.4 360 987.0)"><rect x="52" y="942" width="616" height="90" rx="8" fill="#fffdf8" stroke="#8a5a2b" stroke-width="2.5"/><text x="70" y="978" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#1e2837">Registro 14: data inválida →</text><text x="70" y="1009" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#1e2837">só o registro recusado</text></g><text x="32" y="1104" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">Ilustração original Torno Studio, 2026</text></svg>