<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" aria-labelledby="title desc" role="img" viewBox="0 0 720 960"><title id="title">Planejar a janela|de corte</title><desc id="desc">Combinar responsáveis e critérios antes. Antes de abrir: retorno conforme plano testado.|Depois de abrir: preservar novas gravações.</desc><rect width="720" height="960" fill="#f7f6f2" rx="24"/><g fill="#16181a" font-family="IBM Plex Sans,Arial,sans-serif"><text x="36" y="54" fill="#1c5a49" font-size="26" font-weight="700">TORNO · DIAGRAMA DE PROCESSO</text><text x="36" y="112" font-size="36" font-weight="700">Planejar a janela</text><text x="36" y="156" font-size="36" font-weight="700">de corte</text><text x="36" y="204" font-size="26">Combinar responsáveis e critérios antes.</text><rect width="656" height="126" x="32" y="236" fill="#fff" stroke="#b4c6bd" rx="14"/><text x="52" y="275" font-size="30" font-weight="700">Controle das gravações</text><text x="52" y="312" font-size="26">Interromper gravações na origem</text><text x="52" y="344" font-size="26">conforme o plano de corte.</text><path fill="none" stroke="#1c5a49" stroke-width="3" d="M360 366 v14 m-7 -7 7 7 7 -7"/><rect width="656" height="126" x="32" y="386" fill="#fff" stroke="#b4c6bd" rx="14"/><text x="52" y="425" font-size="30" font-weight="700">Carga final e conciliação</text><text x="52" y="462" font-size="26">Levar alterações finais e conferir.</text><path fill="none" stroke="#1c5a49" stroke-width="3" d="M360 516 v14 m-7 -7 7 7 7 -7"/><rect width="656" height="126" x="32" y="536" fill="#fff" stroke="#b4c6bd" rx="14"/><text x="52" y="575" font-size="30" font-weight="700">Decisão: liberar ou retornar</text><text x="52" y="612" font-size="26">Responsável decide com evidências.</text><path fill="none" stroke="#1c5a49" stroke-width="3" d="M360 666 v14 m-7 -7 7 7 7 -7"/><rect width="656" height="126" x="32" y="686" fill="#e2ede8" stroke="#b4c6bd" rx="14"/><text x="52" y="725" font-size="30" font-weight="700">Abertura do destino</text><text x="52" y="762" font-size="26">Liberar gravações após o aceite.</text><text x="36" y="892" fill="#1c5a49" font-size="26" font-weight="600">Antes de abrir: retorno conforme plano testado.</text><text x="36" y="926" fill="#1c5a49" font-size="26" font-weight="600">Depois de abrir: preservar novas gravações.</text></g></svg>