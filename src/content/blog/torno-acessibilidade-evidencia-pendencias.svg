<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1060" aria-labelledby="title desc" role="img" viewBox="0 0 720 1060"><title id="title">Guarde evidências e limites</title><desc id="desc">Relacione cada resultado ao cenário avaliado. Proposta editorial para adaptar ao produto.</desc><rect width="720" height="1060" fill="#f7f6f2"/><text x="36" y="56" fill="#1c5a49" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">TORNO · GUIA VISUAL</text><text x="36" y="120" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="700">Guarde evidências e limites</text><text x="36" y="166" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Relacione cada resultado ao cenário avaliado.</text><rect width="656" height="154" x="32" y="210" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="14"/><rect width="54" height="54" x="48" y="232" fill="#e2ede8" rx="12"/><text x="65" y="269" fill="#1c5a49" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">1</text><text x="120" y="254" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Identifique o ensaio</text><text x="120" y="296" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Registre versão, data e responsável,</text><text x="120" y="330" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">ambiente e condições do teste.</text><rect width="656" height="154" x="32" y="386" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="14"/><rect width="54" height="54" x="48" y="408" fill="#e2ede8" rx="12"/><text x="65" y="445" fill="#1c5a49" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">2</text><text x="120" y="430" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Compare os resultados</text><text x="120" y="472" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Guarde esperado, observado e evidência.</text><text x="120" y="506" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Localize a barreira e seu impacto.</text><rect width="656" height="154" x="32" y="562" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="14"/><rect width="54" height="54" x="48" y="584" fill="#e2ede8" rx="12"/><text x="65" y="621" fill="#1c5a49" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">3</text><text x="120" y="606" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Declare o alcance</text><text x="120" y="648" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Diferencie ferramentas e revisão humana.</text><text x="120" y="682" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Registre o que não foi avaliado.</text><rect width="656" height="154" x="32" y="738" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="14"/><rect width="54" height="54" x="48" y="760" fill="#e2ede8" rx="12"/><text x="65" y="797" fill="#1c5a49" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">4</text><text x="120" y="782" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Verifique a correção</text><text x="120" y="824" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Combine responsável e novo teste.</text><text x="120" y="858" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Confira a versão corrigida e o fluxo.</text><text x="36" y="966" fill="#1c5a49" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">Pendência aberta precisa de encaminhamento.</text><text x="36" y="1010" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Proposta editorial · adapte ao produto.</text></svg>