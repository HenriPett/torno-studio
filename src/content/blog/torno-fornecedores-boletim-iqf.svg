.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">3 de 8 entregas reprogramadas a pedido da Metalúrgica</text><text x="46.0" y="1050.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">data confirmada vigente: E = 6/8 = 75,00 → IQF 71,25</text><text x="46.0" y="1078.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">data original: E = 3/8 = 37,50 → 58,125 ≈ 58,13</text><text x="46.0" y="1104.0" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">a regra escrita diz qual data vale</text><text x="30.0" y="1156.0" font-size="22" text-anchor="start" font-weight="normal" fill="#4a4f55">Ilustração · Torno 2026</text><text x="690.0" y="1156.0" font-size="22" text-anchor="end" font-weight="normal" fill="#4a4f55">números inventados</text></svg>