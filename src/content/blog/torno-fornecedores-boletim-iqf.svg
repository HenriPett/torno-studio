<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1190" viewBox="0 0 720 1190" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Boletim de fornecedores: IQF de maio a julho de 2026 e a régua de faixas</title><desc id="d1">Exemplo fictício. Boletim trimestral da Metalúrgica Exemplo Ltda., maio a julho de 2026, calculado em 05/08/2026. IQF = 0,50 × Q (qualidade) + 0,35 × E (entrega) + 0,15 × R (resposta a RNC). Aços Exemplo: Q 100,00, E 91,67, R 100,00, IQF 97,08, aprovado. Tratamentos Térmicos Exemplo: Q 75,00, E 75,00, R 50,00, IQF 71,25, condicional. Fundição Exemplo: Q 60,00, E 50,00, R 25,00, IQF 51,25, proposta de bloqueio ao comitê. Embalagens Exemplo: 2 lotes, sem dado suficiente (mínimo 3), mantém aprovado. Régua de 0 a 100: vermelho abaixo de 70, proposta de bloqueio; amarelo de 70 a 84,99, condicional; verde de 85 em diante, aprovado. Um marcador tracejado em 58,13 mostra o IQF da Tratamentos Térmicos se a entrega fosse medida contra a data original do pedido: E cairia para 37,50 porque três entregas foram reprogramadas a pedido da própria Metalúrgica; 58,125 arredondado para 58,13 cairia na faixa vermelha. A data confirmada vigente decide.</desc><rect x="0.0" y="0.0" width="720.0" height="1190.0" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14.0" y="14.0" width="692.0" height="1162.0" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30.0" y="58.0" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Boletim de fornecedores · IQF</text><text x="30.0" y="92.0" font-size="21" text-anchor="start" font-weight="normal" fill="#1d1d1b">Metalúrgica Exemplo · mai–jul/2026 · em 05/08</text><rect x="470.0" y="108.0" width="222.0" height="40.0" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581.0" y="136.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><text x="30.0" y="136.0" font-size="20" text-anchor=