<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1560" viewBox="0 0 720 1560" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Horímetro e calendário: quando a preventiva vence e de onde conta a próxima</title><desc id="d1">Exemplo fictício. Injetora IJ-04 da Indústria Exemplo Ltda. Plano de 500 horas ou 90 dias, o que vier primeiro, janela de 50 horas. Horímetro na execução: 12.577 h; calendário: segunda-feira, 21 de setembro de 2026. 01/07: última execução, 12.000 h. 25/08: leitura parou em 12.385 h; o sistema estima 7 h por dia e marca como estimada. Cerca de 10/09: janela de 12.450 a 12.550 h; vence com 12.500 h. 21/09: executada com 12.577 h lidas no painel, 77 h depois do vencimento, fora da janela. 29/09: vencimento por 90 dias, rede de segurança enquanto o horímetro está parado. Próxima pela data planejada (fixa): 13.000 h ou 09/12, 90 dias após 10/09, só 423 h de uso até lá. Próxima pela execução (flutuante): 13.077 h ou 20/12; 20/12 é domingo, e a ordem vai para 18/12; 500 h de uso; o plano escorrega 77 h.</desc><rect x="0" y="0" width="720" height="1560" rx="0" fill="#f4efe6"/><text x="40" y="58" font-size="32" fill="#1d1d1b" font-weight="bold" text-anchor="start">Horímetro × calendário</text><rect x="450" y="30" width="230" height="38" rx="6" fill="#1d1d1b"/><text x="565" y="57" font-size="22" fill="#f4efe6" font-weight="bold" text-anchor="middle">EXEMPLO FICTÍCIO</text><text x="40" y="104" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Indústria Exemplo Ltda. · injetora IJ-04</text><text x="40" y="138" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Plano: 500 h ou 90 dias, o que vier primeiro</text><text x="40" y="170" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Janela: 50 h antes ou depois do vencimento</text><rect x="40" y="200" width="310" height="190" rx="8" fill="#fffdf7" stroke="#1d1d1b" stroke-width="3"/><text x="195" y=