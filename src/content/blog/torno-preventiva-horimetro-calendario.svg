nt-weight="normal" text-anchor="start">12.000 h</text><circle cx="180" cy="466" r="12" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="3"/><rect x="212" y="440" width="468" height="96" rx="8" fill="#dfc79c" stroke="#1d1d1b" stroke-width="3"/><text x="232" y="478" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Última execução: os dois</text><text x="232" y="512" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">contadores recomeçam</text><text x="40" y="602" font-size="24" fill="#8a6a3e" font-weight="bold" text-anchor="start">25/08</text><text x="40" y="634" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">12.385 h</text><circle cx="180" cy="594" r="12" fill="#8a6a3e" stroke="#1d1d1b" stroke-width="3"/><rect x="212" y="568" width="468" height="96" rx="8" fill="#e9d9b8" stroke="#1d1d1b" stroke-width="3"/><text x="232" y="606" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Leitura parou. Sistema estima</text><text x="232" y="640" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">7 h/dia e marca "estimada"</text><text x="40" y="730" font-size="24" fill="#1d1d1b" font-weight="bold" text-anchor="start">~10/09</text><text x="40" y="762" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">12.500 h</text><circle cx="180" cy="722" r="12" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="3"/><rect x="212" y="696" width="468" height="96" rx="8" fill="#d4b582" stroke="#1d1d1b" stroke-width="3"/><text x="232" y="734" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Vence pelo horímetro.</text><text x="232" y="768" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Janela: 12.450 a 12.550 h</text><text x="40" y="858" font-size="24" fill="#a33a2a" font-weight="bold" text-anchor="start">21/09</text><text x="40" y="890" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">12.577 h</text><circle cx="180" cy="850" r="12" fill="#a33a2a" stroke="#1d1d1b" stroke-width="3"/><rect x="212" y="824" width="468" height="96" rx="8" fill="#f0c9bf" stroke="#1d1d1b" stroke-width="3"/><text x="232" y="862" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Executada 77 h depois do</text><text x="232" y="896" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">vencimento: fora da janela</text><text x="40" y="986" font-size="24" fill="#5c564c" font-weight="bold" text-anchor="start">29/09</text><text x="40" y="1018" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">90 dias</text><circle cx="180" cy="978" r="12" fill="#5c564c" stroke="#1d1d1b" stroke-width="3"/><rect x="212" y="952" width="468" height="96" rx="8" fill="#e9d9b8" stroke="#1d1d1b" stroke-width="3"/><text x="232" y="990" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">Vencimento por calendário:</text><text x="232" y="1024" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">rede de segurança</text><text x="40" y="1090" font-size="24" fill="#1d1d1b" font-weight="bold" text-anchor="start">Depois da execução atrasada, a próxima:</text><rect x="40" y="1118" width="640" height="170" rx="8" fill="#fffdf7" stroke="#1d1d1b" stroke-width="3"/><rect x="40" y="1118" width="14" height="170" rx="4" fill="#3d5a80"/><text x="72" y="1156" font-size="22" fill="#5c564c" font-weight="bold" text-anchor="start">Pela data planejada (fixa)</text><text x="72" y="1198" font-size="30" fill="#3d5a80" font-weight="bold" text-anchor="start">13.000 h ou 09/12</text><text x="72" y="1234" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">09/12 = 90 dias após 10/09</text><text x="72" y="1268" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">só 423 h de uso até lá</text><rect x="40" y="1308" width="640" height="170" rx="8" fill="#fffdf7" stroke="#1d1d1b" stroke-width="3"/><rect x="40" y="1308" width="14" height="170" rx=