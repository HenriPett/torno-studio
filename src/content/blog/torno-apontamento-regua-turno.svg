/><text x="612.0" y="559.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">limpeza</text><rect x="30.0" y="578.0" width="24.0" height="24.0" rx="0" fill="#5b8c5a" stroke="#1d1d1b" stroke-width="1"/><rect x="30.0" y="578.0" width="24.0" height="24.0" rx="0" fill="url(#hz)" stroke="none" stroke-width="0"/><text x="62.0" y="597.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">atendimento simultâneo de TC-02 e TC-03 pelo operador 104</text><rect x="30.0" y="630.0" width="660.0" height="104.0" rx="6" fill="#ffffff" stroke="#7a5600" stroke-width="2"/><text x="48.0" y="662.0" font-size="21" text-anchor="start" font-weight="bold" fill="#7a5600">Simultâneo do 104: 85 + 190 = 275 min</text><text x="48.0" y="694.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">regra do exemplo: meio a meio → 137,5 min na OP 8301</text><text x="48.0" y="720.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">e 137,5 min na OP 8305</text><rect x="30.0" y="752.0" width="660.0" height="128.0" rx="6" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.5"/><text x="48.0" y="784.0" font-size="21" text-anchor="start" font-weight="bold" fill="#1d1d1b">Operador 104 no turno</text><text x="48.0" y="814.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">OP 8301: 40 + 90 + 25 + 137,5 = 292,5 min</text><text x="48.0" y="842.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">+ OP 8305: 137,5 + limpeza: 20  =  450 min</text><text x="48.0" y="868.0" font-size="19" text-anchor="start" font-weight="bold" fill="#2e6b2d">= presença (480 − 30 de refeição)  ✓</text><rect x="30.0" y="898.0" width="660.0" height="104.0" rx="6" fill="#fbe3e0" stroke="#c0392b" stroke-width="2"/><text x="48.0" y="930.0" font-size="21" text-anchor="start" font-weight="bold" fill="#9b2a1f">Armadilha: simultâneo inteiro nas duas OPs</text><text x="48.0" y="962.0" font-size="19" text-anchor="start" font-weight="normal" fill="#9b2a1f">40 + 90 + 25 + 275 + 275 + 20 = 725 min</text><text x="48.0" y="988.0" font-size="19" text-anchor="start" font-weight="normal" fill="#9b2a1f">em 450 min de presença: horas infladas nas duas ordens</text><text x="30.0" y="1048.0" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">Mão de obra da OP 8301 no turno A:</text><text x="30.0" y="1074.0" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">292,5 (op. 104) + 40 (op. 117) = 332,5 min</text><text x="30.0" y="1108.0" font-size="19" text-anchor="start" font-weight="normal" fill="#4a4f55">TC-02: setup 40 + produção 365 + parada 25 + pausas 50 = 480 min</text><text x="690.0" y="1160.0" font-size="18" text-anchor="end" font-weight="normal" fill="#4a4f55">Ilustração · Torno 2026</text></svg>