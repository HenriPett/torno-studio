" fill="#4a4f55">14h</text><text x="30.0" y="228.0" font-size="21" text-anchor="start" font-weight="bold" fill="#1d1d1b">TC-02</text><text x="30.0" y="252.0" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55">máquina</text><text x="30.0" y="310.0" font-size="21" text-anchor="start" font-weight="bold" fill="#1d1d1b">Op. 104</text><text x="30.0" y="392.0" font-size="21" text-anchor="start" font-weight="bold" fill="#1d1d1b">Op. 117</text><text x="30.0" y="474.0" font-size="21" text-anchor="start" font-weight="bold" fill="#1d1d1b">TC-03</text><text x="30.0" y="498.0" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55">máquina</text><rect x="150.0" y="202.0" width="43.8" height="58.0" rx="0" fill="#7aa6d6" stroke="#1d1d1b" stroke-width="1"/><text x="171.9" y="238.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#1d1d1b">set</text><rect x="193.8" y="202.0" width="98.6" height="58.0" rx="0" fill="#5b8c5a" stroke="#1d1d1b" stroke-width="1"/><text x="243.1" y="238.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#ffffff">prod.</text><rect x="292.5" y="202.0" width="27.4" height="58.0" rx="0" fill="#c0392b" stroke="#1d1d1b" stroke-width="1"/><rect x="319.9" y="202.0" width="93.1" height="58.0" rx="0" fill="#5b8c5a" stroke="#1d1d1b" stroke-width="1"/><text x="366.4" y="238.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#ffffff">prod.</text><rect x="413.0" y="202.0" width="32.9" height="58.0" rx="0" fill="#c9c9c9" stroke="#1d1d1b" stroke-width="1"/><rect x="445.9" y="202.0" width="208.2" height="58.0" rx="0" fill="#5b8c5a" stroke="#1d1d1b" stroke-width="1"/><text x="550.0" y="238.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#ffffff">produção</text><rect x="654.1" y="202.0" width="21.9" height="58.0" rx="0" fill="#d9c27a" stroke="#1d1d1b" stroke-width="1"/><rect x="150.0" y="284.0" width="43.8" height="58.0" rx="0" fill="#7aa6d6" stroke="#1d1d1b" stroke-width="1"/><text x="17