<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1190" viewBox="0 0 720 1190" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Régua do turno A: horas de máquina e de operador na OP 8301</title><desc id="d1">Exemplo fictício. Régua horária do turno A, 6h às 14h, terça-feira 03/11/2026, Metalúrgica Exemplo Ltda. Máquina TC-02, OP 8301 operação 20: setup 6h00–6h40; produção 6h40–8h10; parada por quebra de ferramenta 8h10–8h35; produção 8h35–10h00; refeição 10h00–10h30; produção 10h30–13h40; limpeza 13h40–14h00. Operador 104: setup no TC-02, produção sozinho, parada, atendimento simultâneo de TC-02 e TC-03 de 8h35 a 10h00 e de 10h30 a 13h40, dividido meio a meio entre as OPs 8301 e 8305, e limpeza. Operador 117: setup no TC-02 de 6h00 a 6h40 e setup do TC-03 de 6h40 a 8h35. Máquina TC-03, OP 8305: setup 6h40–8h35, produção 8h35–10h00, refeição, produção 10h30–13h40, limpeza. Tempo simultâneo: 275 minutos, 137,5 para cada ordem. Operador 104: 292,5 min na OP 8301 + 137,5 na OP 8305 + 20 de limpeza = 450, a presença. Armadilha: contando o simultâneo inteiro nas duas ordens, 725 min em 450 de presença. Mão de obra da OP 8301 no turno: 332,5 min (292,5 do 104 e 40 do 117).</desc><defs><pattern id="hz" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect x="0" y="0" width="4" height="10" fill="#ffffff" fill-opacity="0.45"/></pattern></defs><rect x="0.0" y="0.0" width="720.0" height="1190.0" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14.0" y="14.0" width="692.0" height="1162.0" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30.0" y="58.0" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Régua do turno · TC-02 e TC-03</text><text x="30.0" y="92.0" font-size="21" text-anchor="start" font-weight="normal" fill="#1d1d1b">Metalúrgica Exemplo · turno A · ter 03/11/2026</text><rect x="470.0" y="108.0" width="222.0" height="40.0" rx="6" fi