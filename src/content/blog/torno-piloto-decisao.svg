<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" aria-labelledby="title desc" role="img" viewBox="0 0 720 1280"><title id="title">Decisão sobre ampliar, manter ou pausar</title><desc id="desc">Modelo editorial de observação, evidência e decisão sobre o piloto, com responsável, limites e efeitos já produzidos. Sem percentuais ou garantias.</desc><rect width="720" height="1280" fill="#f7f6f2"/><text x="36" y="55" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">TORNO · DECISÃO SOBRE O PILOTO</text><text x="36" y="118" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="700">Qual evidência permite decidir?</text><text x="36" y="164" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Combine sinais, limites e responsáveis.</text><rect width="656" height="184" x="32" y="210" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="254" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Observe o fluxo combinado</text><text x="54" y="301" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Confira comportamento, problemas e alcance</text><text x="54" y="340" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">do que foi demonstrado no grupo definido.</text><text x="54" y="376" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Registre a referência e as pendências.</text><rect width="200" height="178" x="32" y="456" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="50" y="500" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700">Ampliar</text><text x="50" y="552" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Qual evidência</text><text x="50" y="588" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">sustenta isso?</text><rect width="200" height="178" x="260" y="456" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="278" y="500" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700">Manter</text><text x="278" y="552" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">O que falta</text><text x="278" y="588" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">observar?</text><rect width="200" height="178" x="488" y="456" fill="#eeece6" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="506" y="500" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700">Pausar</text><text x="506" y="552" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Qual condição</text><text x="506" y="588" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">exige agir?</text><rect width="656" height="160" x="32" y="696" fill="#e2ede8" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="739" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Quem decide e executa?</text><text x="54" y="785" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Registre autoridade, cobertura e ação</text><text x="54" y="824" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">correspondente a cada decisão.</text><rect width="656" height="188" x="32" y="910" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="954" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700">Pausar não desfaz efeitos anteriores</text><text x="54" y="999" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Confira dados, tarefas em curso e ações</text><text x="54" y="1038" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">já enviadas a outros serviços.</text><text x="54" y="1072" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Declare o que a interrupção alcança.</text><text x="36" y="1210" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Proposta editorial · sem caso ou teste real.</text></svg>