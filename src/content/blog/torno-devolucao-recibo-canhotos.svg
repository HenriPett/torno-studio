<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1590" viewBox="0 0 720 1590" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">O recibo e os canhotos de devolução</title><desc id="d1">Exemplo fictício. Recibo da venda V-2050 de 02/11/2026: panela de pressão 4,5 L, 2 unidades, tabela R$ 300,00, pago R$ 270,00; jogo de facas, 1 unidade, tabela R$ 120,00, pago R$ 108,00; garrafa térmica 1 L, 3 unidades, tabela R$ 180,00, pago R$ 162,00; subtotal R$ 600,00; desconto do pedido de 10 por cento, menos R$ 60,00, rateado pelo valor de cada linha em 30,00, 12,00 e 18,00; total R$ 540,00; cartão de crédito em 3 vezes de R$ 180,00. Canhoto D1, 08/11, arrependimento, CDC art. 49: 1 jogo de facas, R$ 108,00 e não 120,00; dinheiro: estorno no cartão de R$ 108,00; estoque: em conferência, depois apto. Canhoto D2, 15/11, troca por cortesia, política da loja: 1 garrafa térmica, R$ 54,00; dinheiro: vale-troca de R$ 54,00; estoque: em conferência, depois apto. Canhoto D3, 20/11, vício, CDC art. 18: 1 panela com válvula vazando, pago R$ 135,00; dinheiro: nenhum, troca por outra igual; estoque: entra 1 avariada, sai 1 nova. Venda líquida de R$ 540,00 para R$ 378,00; comissão de 2 por cento de R$ 10,80 para R$ 7,56. Torno Studio 2026.</desc><rect x="0" y="0" width="720" height="1590" rx="0" fill="#f4efe6"/><text x="40" y="58" font-size="32" fill="#1d1d1b" font-weight="bold" text-anchor="start">O recibo e os canhotos</text><text x="40" y="98" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Venda V-2050 · 02/11/2026</text><rect x="450" y="76" width="230" height="38" rx="6" fill="#1d1d1b"/><text x="565" y="103" font-size="22" fill="#f4efe6" font-weight="bold" text-anchor="middle">EXEMPLO FICTÍCIO</text><path d="M40 134 L680 134 L680 650 L680 650 L660 662 L640 650 L620 662 L600 650 L580 662 L560 650 L540 662 L520 650 L500 662 L480 650 L460 662 L440 650 L420 662 L400 650 L380 662 L360 650 L340 662 L320 650 L300 662 L280 650 L260 662 L240 650 L220 662 L200 650 L180 662 L160 650 L140 662 L120 650 L100 662 L80 650 L60 662 L40 650 L40 134 Z" fill="#fffdf7" stroke="#1d1d1b" stroke-width="3"/><text x="60" y="176" font-size="22" fill="#5c564c" font-weight="bold" text-anchor="start">Item</text><text x="372" y="176" font-size="22" fill="#5c564c" font-weight="bold" text-anchor="middle">Qtd</text><text x="520" y="176" font-size="22" fill="#5c564c" font-weight="bold" text-anchor="end">Tabela</text><text x="660" y="176" font-size="22" fill="#5c564c" font-weight="bold" text-anchor="end">Pago</text><path d="M60 192 L660 192" stroke="#d9cfbf" stroke-width="3"/><text x="60" y="232" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Panela de pressão 4,5 L</text><text x="372" y="232" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">2</text><text x="520" y="232" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="end">300,00</text><text x="660" y="232" font-size="22" fill="#2f7d4f" font-weight="bold" text-anchor="end">270,00</text><text x="60" y="276" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Jogo de facas</text><text x="372" y="276" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">1</text><text x="520" y="276" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="end">120,00</text><text x="660" y="276" font-size="22" fill="#2f7d4f" font-weight="bold" text-anchor="end">108,00</text><text x="60" y="320" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Garrafa térmica 1 L</text><text x="372" y="320" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="middle">3</text><text x="520" y="320" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="end">180,00</text><text x="660" y="320" font-size="22" fill="#2f7d4f" font-weight="bold" text-anchor="end">162,00</text><path d="M60 340 L660 340" stroke="#d9cfbf" stroke-width="3"/><text x="60" y="378" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Subtotal</text><text x="520" y="378" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="end">600,00</text><text x="60" y="420" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Desconto do pedido 10%</text><text x="520" y="420" font-size="22" fill="#a33a2a" font-weight="normal" text-anchor="end">−60,00</text><text x="60" y="458" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">rateado pela linha: 30,00 · 12,00 · 18,00</text><path d="M60 478 L660 478" stroke="#d9cfbf" stroke-width="3"/><text x="60" y="520" font-size="26" fill="#1d1d1b" font-weight="bold" text-anchor="start">Total</text><text x="660" y="520" font-size="26" fill="#1d1d1b" font-weight="bold" text-anchor="end">R$ 540,00</text><text x="60" y="560" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Cartão de crédito · 3 × R$ 180,00</text><text x="60" y="600" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">Pago por unidade: panela 135,00 · facas</text><text x="60" y="632" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="start">108,00 · garrafa 54,00</text><path d="M40 686 L680 686" stroke="#5c564c" stroke-width="2" stroke-dasharray="10 8"/><rect x="40" y="700" width="640" height="200" rx="8" fill="#ffffff" stroke="#1d1d1b" stroke-width="3"/><circle cx="40" cy="800" r="14" fill="#f4efe6" stroke="#1d1d1b" stroke-width="3"/><circle cx="680" cy="800" r="14" fill="#f4efe6" stroke="#1d1d1b" stroke-width="3"/><rect x="40" y="700" width="640" height="52" rx="8" fill="#ece4d6" stroke="#1d1d1b" stroke-width="3"/><text x="64" y="735" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">D1 · 08/11 · arrependimento</text><text x="656" y="735" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="end">CDC art. 49</text><text x="64" y="792" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">1 jogo de facas · R$ 108,00, não 120,00</text><text x="64" y="830" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Dinheiro: estorno no cartão R$ 108,00</text><text x="64" y="868" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Estoque: em conferência → apto</text><path d="M40 918 L680 918" stroke="#5c564c" stroke-width="2" stroke-dasharray="10 8"/><rect x="40" y="932" width="640" height="200" rx="8" fill="#ffffff" stroke="#1d1d1b" stroke-width="3"/><circle cx="40" cy="1032" r="14" fill="#f4efe6" stroke="#1d1d1b" stroke-width="3"/><circle cx="680" cy="1032" r="14" fill="#f4efe6" stroke="#1d1d1b" stroke-width="3"/><rect x="40" y="932" width="640" height="52" rx="8" fill="#ece4d6" stroke="#1d1d1b" stroke-width="3"/><text x="64" y="967" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">D2 · 15/11 · troca por cortesia</text><text x="656" y="967" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="end">política da loja</text><text x="64" y="1024" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">1 garrafa térmica · R$ 54,00</text><text x="64" y="1062" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Dinheiro: vale-troca de R$ 54,00</text><text x="64" y="1100" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Estoque: em conferência → apto</text><path d="M40 1150 L680 1150" stroke="#5c564c" stroke-width="2" stroke-dasharray="10 8"/><rect x="40" y="1164" width="640" height="200" rx="8" fill="#ffffff" stroke="#1d1d1b" stroke-width="3"/><circle cx="40" cy="1264" r="14" fill="#f4efe6" stroke="#1d1d1b" stroke-width="3"/><circle cx="680" cy="1264" r="14" fill="#f4efe6" stroke="#1d1d1b" stroke-width="3"/><rect x="40" y="1164" width="640" height="52" rx="8" fill="#ece4d6" stroke="#1d1d1b" stroke-width="3"/><text x="64" y="1199" font-size="22" fill="#1d1d1b" font-weight="bold" text-anchor="start">D3 · 20/11 · vício</text><text x="656" y="1199" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="end">CDC art. 18</text><text x="64" y="1256" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">1 panela, válvula vazando · pago R$ 135,00</text><text x="64" y="1294" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Dinheiro: nenhum, troca por outra igual</text><text x="64" y="1332" font-size="22" fill="#1d1d1b" font-weight="normal" text-anchor="start">Estoque: entra 1 avariada, sai 1 nova</text><rect x="40" y="1396" width="640" height="120" rx="10" fill="#1d1d1b"/><text x="64" y="1444" font-size="22" fill="#f4efe6" font-weight="bold" text-anchor="start">Venda líquida: R$ 540,00 → R$ 378,00</text><text x="64" y="1488" font-size="22" fill="#f4efe6" font-weight="bold" text-anchor="start">Comissão de 2%: R$ 10,80 → R$ 7,56</text><text x="680" y="1550" font-size="22" fill="#5c564c" font-weight="normal" text-anchor="end">Ilustração · Torno Studio 2026</text></svg>