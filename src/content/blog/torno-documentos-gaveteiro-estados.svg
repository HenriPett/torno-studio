<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1540" viewBox="0 0 720 1540" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Arquivo com uma gaveta por estado do documento</title><desc id="d1">Exemplo fictício. Arquivo de aço com seis gavetas, uma por estado do documento, na Exemplo Instrumentais Cirúrgicos Ltda., situação na segunda 07/12/2026. Gaveta 1, em elaboração, abre o autor: IT-MON-003 rev. 05, rascunho de Tiago S. Gaveta 2, em verificação, abre o verificador: FR-QUA-031 rev. 04, com Renata M. desde segunda 30/11. Gaveta 3, aprovado aguardando vigência: PR-QUA-005 rev. 03, vigência na terça 15/12/2026, treinamento de 2 de 4 pessoas. Gaveta 4, vigente, a única que o chão de fábrica abre: IT-USI-014 rev. 02, desde 01/12/2026; PR-QUA-002 rev. 01, análise crítica até sexta 15/01/2027. Gaveta 5, obsoleto, retido e bloqueado, com cadeado, só a qualidade abre, em leitura: IT-USI-014 rev. 01, até 04/12/2031; IT-USI-014 rev. 00, até 08/08/2030. Gaveta 6, eliminado, só o termo fica: registros preenchidos no formulário FR-QUA-031 de um produto descontinuado, prazo de guarda encerrado, termo de eliminação TE-2026-04, segunda 09/11/2026, aprovado pela qualidade e pelo jurídico. Rodapé: cada revisão está numa gaveta só; quem muda de gaveta é o fluxo, com autor e horário.</desc><rect x="0" y="0" width="720" height="1540" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="10" y="10" width="700" height="1520" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="450" y="24" width="246" height="46" rx="4" fill="#fff" stroke="#b3261e" stroke-width="2"/><text x="573" y="56" font-size="22" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="118" font-size="30" text-anchor="start" font-weight="bold" fill="#1d1d1b">Uma gaveta por estado</text><text x="30" y="154" font-size="20" text-anchor="start" fill="#5a5a55">situação em seg 07/12/2026</text><rect x="36" y="176" width="648" height="1258" rx="10" fill="#9a988f" stroke="#1d1d1b" stroke-width="2"/><rect x="50" y="190" width="620" height="189" rx="8" fill="#fff" stroke="#1d1d1b" stroke-width="3"/><rect x="300.0" y="202" width="120" height="16" rx="8" fill="#c9c6bd" stroke="#1d1d1b" stroke-width="1.5"/><text x="70" y="244" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">1 · Em elaboração</text><text x="70" y="272" font-size="17" text-anchor="start" fill="#5a5a55">abre: o autor</text><text x="70" y="306" font-size="18" text-anchor="start" fill="#1d1d1b">IT-MON-003 rev. 05</text><text x="70" y="332" font-size="18" text-anchor="start" fill="#1d1d1b">rascunho de Tiago S.</text><rect x="50" y="395" width="620" height="189" rx="8" fill="#fff" stroke="#1d1d1b" stroke-width="3"/><rect x="300.0" y="407" width="120" height="16" rx="8" fill="#c9c6bd" stroke="#1d1d1b" stroke-width="1.5"/><text x="70" y="449" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">2 · Em verificação</text><text x="70" y="477" font-size="17" text-anchor="start" fill="#5a5a55">abre: o verificador</text><text x="70" y="511" font-size="18" text-anchor="start" fill="#1d1d1b">FR-QUA-031 rev. 04</text><text x="70" y="537" font-size="18" text-anchor="start" fill="#1d1d1b">com Renata M. desde seg 30/11</text><rect x="50" y="600" width="620" height="189" rx="8" fill="#fff" stroke="#1d1d1b" stroke-width="3"/><rect x="300.0" y="612" width="120" height="16" rx="8" fill="#c9c6bd" stroke="#1d1d1b" stroke-width="1.5"/><text x="70" y="654" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">3 · Aprovado, aguarda vigência</text><text x="70" y="682" font-size="17" text-anchor="start" fill="#5a5a55">abre: qualidade e treinados</text><text x="70" y="716" font-size="18" text-anchor="start" fill="#1d1d1b">PR-QUA-005 rev. 03</text><text x="70" y="742" font-size="18" text-anchor="start" fill="#1d1d1b">vigência ter 15/12 · treinados: 2 de 4</text><rect x="50" y="805" width="620" height="189" rx="8" fill="#dcefdc" stroke="#2e7d32" stroke-width="3"/><rect x="300.0" y="817" width="120" height="16" rx="8" fill="#c9c6bd" stroke="#1d1d1b" stroke-width="1.5"/><text x="70" y="859" font-size="20" text-anchor="start" font-weight="bold" fill="#2e7d32">4 · Vigente</text><text x="70" y="887" font-size="17" text-anchor="start" fill="#5a5a55">abre: chão de fábrica (só esta)</text><text x="70" y="921" font-size="18" text-anchor="start" fill="#1d1d1b">IT-USI-014 rev. 02 · desde ter 01/12</text><text x="70" y="947" font-size="18" text-anchor="start" fill="#1d1d1b">PR-QUA-002 rev. 01 · análise crítica</text><text x="70" y="973" font-size="18" text-anchor="start" fill="#1d1d1b">até sex 15/01/2027</text><rect x="50" y="1010" width="620" height="189" rx="8" fill="#ecebe6" stroke="#b3261e" stroke-width="3"/><rect x="300.0" y="1022" width="120" height="16" rx="8" fill="#c9c6bd" stroke="#1d1d1b" stroke-width="1.5"/><text x="70" y="1064" font-size="20" text-anchor="start" font-weight="bold" fill="#b3261e">5 · Obsoleto, retido e bloqueado</text><text x="70" y="1092" font-size="17" text-anchor="start" fill="#5a5a55">abre: só a qualidade, em leitura</text><text x="70" y="1126" font-size="18" text-anchor="start" fill="#1d1d1b">IT-USI-014 rev. 01 · retida até 04/12/2031</text><text x="70" y="1152" font-size="18" text-anchor="start" fill="#1d1d1b">IT-USI-014 rev. 00 · retida até 08/08/2030</text><path d="M 632 1052 L 632 1046 Q 638 1036 644 1046 L 644 1052" fill="none" stroke="#b3261e" stroke-width="3"/><rect x="628" y="1052" width="20" height="16" rx="3" fill="#b3261e" stroke="#b3261e" stroke-width="0"/><rect x="50" y="1215" width="620" height="189" rx="8" fill="#fff" stroke="#8a8780" stroke-width="3"/><rect x="300.0" y="1227" width="120" height="16" rx="8" fill="#c9c6bd" stroke="#1d1d1b" stroke-width="1.5"/><text x="70" y="1269" font-size="20" text-anchor="start" font-weight="bold" fill="#8a8780">6 · Eliminado: só o termo fica</text><text x="70" y="1297" font-size="17" text-anchor="start" fill="#5a5a55">abre: qualidade e jurídico</text><text x="70" y="1331" font-size="18" text-anchor="start" fill="#1d1d1b">registros no FR-QUA-031, produto descontinuado</text><text x="70" y="1357" font-size="18" text-anchor="start" fill="#1d1d1b">termo TE-2026-04 · seg 09/11/2026</text><text x="30" y="1484" font-size="18" text-anchor="start" fill="#5a5a55">Cada revisão está numa gaveta só; quem muda de gaveta</text><text x="30" y="1510" font-size="18" text-anchor="start" fill="#5a5a55">é o fluxo, com autor e horário.</text><text x="690" y="1510" font-size="18" text-anchor="end" fill="#5a5a55">Ilustração · Torno 2026</text></svg>