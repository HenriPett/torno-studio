<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1110" viewBox="0 0 720 1110" role="img" aria-labelledby="title desc"><title id="title">A última unidade, dois pedidos e uma regra</title><desc id="desc">Ilustração fictícia. Uma prateleira de estoque tem quatro espaços vazios e uma única caixa etiquetada “CAN-042 · última unidade”. Abaixo, à esquerda, a Loja própria, um balcão com o pedido no balcão às 14:02:10; à direita, uma tela genérica de Marketplace, sem logotipo, com pedido confirmado às 14:02:11. Setas dos dois lados apontam para a mesma caixa. No pé, o quadro “Qual regra o sistema aplica?” com três opções: 1. reservar para o primeiro pedido confirmado; 2. publicar com margem de segurança; 3. cancelar um dos pedidos e avisar o comprador.</desc><rect width="720" height="1110" rx="24" fill="#f4f2eb"/><text x="32" y="54" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#1e2837">A última unidade, dois pedidos</text><rect x="32" y="74" width="232" height="42" rx="21" fill="#fffdf8" stroke="#536270" stroke-width="2.5"/><text x="148" y="103" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#536270" text-anchor="middle">Exemplo fictício</text><rect x="300" y="196" width="120" height="66" rx="6" fill="#e9c9a0" stroke="#8a5a2b" stroke-width="3"/><path d="M300 222H420" stroke="#8a5a2b" stroke-width="3"/><rect x="340" y="196" width="40" height="26" fill="#c8782f" opacity=".85"/><rect x="44" y="196" width="100" height="66" rx="6" fill="none" stroke="#536270" stroke-width="2.5" stroke-dasharray="8 6"/><rect x="164" y="196" width="100" height="66" rx="6" fill="none" stroke="#536270" stroke-width="2.5" stroke-dasharray="8 6"/><rect x="456" y="196" width="100" height="66" rx="6" fill="none" stroke="#536270" stroke-width="2.5" stroke-dasharray="8 6"/><rect x="576" y="196" width="100" height="66" rx="6" fill="none" stroke="#536270" stroke-width="2.5" stroke-dasharray="8 6"/><rect x="32" y="262" width="656" 