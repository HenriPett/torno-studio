<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Entrada e ação sensível são duas decisões</title><desc id="desc">Ilustração de duas portas diferentes: uma representa entrada na conta; outra, uma mudança sensível que exige definição própria.</desc><rect width="1200" height="680" fill="#edf3f0"/><text x="58" y="79" font-family="Arial" font-size="37" font-weight="700" fill="#173c42">O segundo fator pode proteger momentos diferentes</text><path d="M168 562V210q0-38 38-38h316q38 0 38 38v352" fill="#d5e8e2" stroke="#4c847e" stroke-width="5"/><path d="M654 562V210q0-38 38-38h316q38 0 38 38v352" fill="#f6e3c5" stroke="#be8650" stroke-width="5"/><path d="M204 560V247q0-32 30-32h257q30 0 30 32v313" fill="#fff"/><path d="M690 560V247q0-32 30-32h257q30 0 30 32v313" fill="#fff"/><circle cx="468" cy="402" r="15" fill="#4c847e"/><circle cx="954" cy="402" r="15" fill="#be8650"/><g font-family="Arial" fill="#173c42"><text x="220" y="300" font-size="30" font-weight="700">Entrar na conta</text><text x="219" y="350" font-size="22">Qual perfil precisa</text><text x="219" y="385" font-size="22">confirmar a entrada?</text><text x="706" y="300" font-size="30" font-weight="700">Ação sensível</text><text x="704" y="350" font-size="22">O que pede nova</text><text x="704" y="385" font-size="22">verificação?</text><text x="73" y="630" font-size="20">Exemplo conceitual para escopo. Nenhum sistema real está representado.</text></g></svg>
