<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" aria-labelledby="title desc" role="img" viewBox="0 0 720 1120"><title id="title">O acordo de um alerta</title><desc id="desc">Ficha editorial para ligar o fluxo crítico, o sinal e a condição à pessoa responsável e à ação combinada.</desc><rect width="720" height="1120" fill="#f7f6f2"/><text x="36" y="55" fill="#1c5a49" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">TORNO · ACORDO DO ALERTA</text><text x="36" y="118" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="700">Qual fluxo precisa de atenção?</text><text x="36" y="164" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Combine as respostas antes de depender do aviso.</text><rect width="656" height="160" x="32" y="210" fill="#eeece6" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="56" y="252" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Fluxo e impacto</text><text x="56" y="300" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Qual tarefa precisa continuar?</text><text x="56" y="337" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Como reconhecer o impacto na operação?</text><rect width="656" height="160" x="32" y="394" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="56" y="436" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Sinal, janela e condição</text><text x="56" y="484" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Qual sinal será observado, por quanto tempo</text><text x="56" y="521" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">e em qual condição ele exige agir?</text><rect width="656" height="160" x="32" y="578" fill="#eeece6" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="56" y="620" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Destinatário e cobertura</text><text x="56" y="668" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Quem recebe, em qual canal e horário?</text><text x="56" y="705" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Quem assume se não houver resposta?</text><rect width="656" height="160" x="32" y="762" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="56" y="804" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Ação e teste</text><text x="56" y="852" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">O que fazer ao receber o aviso?</text><text x="56" y="889" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Como verificar que a cadeia funciona?</text><text x="36" y="1000" fill="#1c5a49" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700">Defina condições próprias do sistema.</text><text x="36" y="1040" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Não há limiar universal para todo fluxo.</text><text x="36" y="1090" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Proposta editorial · adapte ao produto.</text></svg>