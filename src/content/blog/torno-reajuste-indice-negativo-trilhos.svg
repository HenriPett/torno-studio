<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Índice negativo: três trilhos possíveis, um escrito no contrato</title><desc id="d1">Bifurcação do índice negativo para o contrato B da Manutenção Exemplo Ltda., IGP-M, mensalidade R$ 1.150,00, aniversário em 01/01/2027. No topo, o acumulado de 12 meses inventado para o exemplo: −0,85%. O caminho se divide em três trilhos. Trilho 1, aplica a redução: 1.150,00 × 0,9915 = 1.140,225, arredondado para R$ 1.140,23. Trilho 2, destacado como a regra do contrato do exemplo, mantém o valor: R$ 1.150,00, com o registro de reajuste zero e do acumulado de −0,85%. Trilho 3, mantém agora e compensa no próximo reajuste: R$ 1.150,00 agora; no ano seguinte, com um acumulado inventado de +5,00%, 1.150,00 × 1,05 × 0,9915 = R$ 1.197,24, em vez de R$ 1.207,50. Um quadro com dado real: o IGP-M acumulado em 12 meses até novembro de 2025 foi de −0,11%, segundo a FGV IBRE, em 27/11/2025. No rodapé: qual trilho vale é o contrato que diz; o sistema não escolhe, e a dúvida vai para o advogado.</desc><rect x="0" y="0" width="720" height="1000" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14" y="14" width="692" height="972" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30" y="58" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Quando o índice vem negativo</text><text x="30" y="90" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">contrato B · IGP-M · R$ 1.150,00 · aniv. 01/01</text><rect x="470" y="104" width="222" height="40" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581" y="132" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><rect x="210" y="160" width="300" height="70" rx="8" fill="#ffffff" stroke="#1d1d1b" stroke-width="2.5"/><text x="360" y="190" font-size="19" text-anchor="middle" font-weight="normal" fill="#4a4f55">acumulado 12 meses</text><text x="360" y="218" font-size="22" text-anchor="middle" font-weight="bold" fill="#9b2a1f">−0,85% (inventado)</text><path d="M 360 230 L 360 280 C 360 320 130 320 130 360" fill="none" stroke="#1d1d1b" stroke-width="4"/><path d="M 360 280 L 360 360" fill="none" stroke="#2e6b3a" stroke-width="7"/><path d="M 360 280 C 360 320 590 320 590 360" fill="none" stroke="#1d1d1b" stroke-width="4"/><rect x="25" y="360" width="210" height="230" rx="8" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.8"/><text x="130.0" y="396" font-size="22" text-anchor="middle" font-weight="bold" fill="#1d1d1b">1</text><text x="130.0" y="424" font-size="19" text-anchor="middle" font-weight="bold" fill="#1d1d1b">aplica a redução</text><text x="130.0" y="470" font-size="18" text-anchor="middle" font-weight="normal" fill="#1d1d1b">1.150,00 × 0,9915</text><text x="130.0" y="498" font-size="18" text-anchor="middle" font-weight="normal" fill="#1d1d1b">= 1.140,225</text><text x="130.0" y="540" font-size="21" text-anchor="middle" font-weight="bold" fill="#1d1d1b">R$ 1.140,23</text><rect x="255" y="360" width="210" height="230" rx="8" fill="#eaf2ea" stroke="#2e6b3a" stroke-width="3"/><text x="360.0" y="396" font-size="22" text-anchor="middle" font-weight="bold" fill="#2e6b3a">2</text><text x="360.0" y="424" font-size="19" text-anchor="middle" font-weight="bold" fill="#2e6b3a">mantém o valor</text><text x="360.0" y="470" font-size="18" text-anchor="middle" font-weight="normal" fill="#1d1d1b">reajuste registrado 0%</text><text x="360.0" y="498" font-size="18" text-anchor="middle" font-weight="normal" fill="#1d1d1b">acumulado −0,85%</text><text x="360.0" y="540" font-size="21" text-anchor="middle" font-weight="bold" fill="#1d1d1b">R$ 1.150,00</text><rect x="485" y="360" width="210" height="230" rx="8" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.8"/><text x="590.0" y="396" font-size="22" text-anchor="middle" font-weight="bold" fill="#1d1d1b">3</text><text x="590.0" y="424" font-size="19" text-anchor="middle" font-weight="bold" fill="#1d1d1b">mantém e compensa</text><text x="590.0" y="470" font-size="18" text-anchor="middle" font-weight="normal" fill="#1d1d1b">agora R$ 1.150,00</text><text x="590.0" y="498" font-size="18" text-anchor="middle" font-weight="normal" fill="#1d1d1b">próximo ano leva</text><text x="590.0" y="540" font-size="18" text-anchor="middle" font-weight="normal" fill="#1d1d1b">o −0,85% junto</text><rect x="255" y="600" width="210" height="36" rx="6" fill="#2e6b3a" stroke="#2e6b3a" stroke-width="1"/><text x="360" y="625" font-size="19" text-anchor="middle" font-weight="bold" fill="#ffffff">regra do contrato B</text><text x="30" y="680" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">Trilho 3 no ano seguinte, com +5,00% inventado:</text><text x="30" y="708" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">1.150,00 × 1,05 × 0,9915 = R$ 1.197,24 (não R$ 1.207,50)</text><rect x="30" y="740" width="660" height="110" rx="6" fill="#ffffff" stroke="#2f5d8a" stroke-width="2.5"/><text x="50" y="774" font-size="20" text-anchor="start" font-weight="bold" fill="#2f5d8a">Dado real</text><text x="50" y="804" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">IGP-M acumulado em 12 meses até nov/2025: −0,11%</text><text x="50" y="832" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55">(FGV IBRE, divulgação de 27/11/2025)</text><text x="30" y="896" font-size="19" text-anchor="start" font-weight="bold" fill="#9b2a1f">Qual trilho vale é o contrato que diz. O sistema não</text><text x="30" y="922" font-size="19" text-anchor="start" font-weight="bold" fill="#9b2a1f">escolhe; a dúvida vai para o advogado.</text><text x="690" y="970" font-size="18" text-anchor="end" font-weight="normal" fill="#4a4f55">Ilustração · Torno 2026</text></svg>