<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1534" viewBox="0 0 720 1534" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Escada de alçadas</title><desc id="d1">Exemplo fictício. Escada de alçadas da Exemplo Caldeiraria Ltda., três degraus que sobem da esquerda para a direita: comprador, até R$ 5.000,00; gerente de suprimentos, até R$ 20.000,00; diretor, acima de R$ 20.000,00. O PC-1207 mais o PC-1208, R$ 10.512,00 mais R$ 240,00 de frete, valor da decisão R$ 10.752,00, cai no degrau do gerente, que aprova vendo o mapa. Sobe um degrau: escolha diferente da referência; menos propostas que o mínimo; aumento de preço depois de aprovado, que volta para aprovação. Porta lateral de exceção: compra emergencial até R$ 3.000,00, declarada pelo gestor da área, aprovação posterior em um dia útil; PC-1211, R$ 1.380,00 em 10/12, aprovado em 11/12. A alçada conta o valor da decisão, mercadoria mais frete; dividir a compra não muda o degrau.</desc><rect x="0" y="0" width="720" height="1534" fill="#f6f3ec"/><rect x="10" y="10" width="700" height="1514" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="450" y="24" width="246" height="46" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="573" y="56" font-size="22" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="118" font-size="32" text-anchor="start" font-weight="bold" fill="#1d1d1b">Escada de alçadas</text><text x="30" y="162" font-size="24" text-anchor="start" fill="#5a5a55">Quem aprova o pedido, pelo valor da decisão</text><rect x="30" y="204" width="660" height="170" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="3"/><text x="50" y="244" font-size="26" text-anchor="start" font-weight="bold" fill="#1f4e79">PC-1207 + PC-1208 (frete)</text><text x="50" y="280" font-size="24" text-anchor="start" fill="#1d1d1b">R$ 10.512,00 + R$ 240,00</text><text x="50" y="314" font-size="24" text-anchor="start" font-weight="bold" fill="#1d1d1b">Valor da decisão: R$ 10.752,00</text><text x="50" y="348" font-size="24" text-anchor="start" font-weight="bold" fill="#2e7d32">Aprova: gerente, vendo o mapa</text><rect x="40" y="784" width="213" height="180" rx="0" fill="#e8e4da" stroke="#5a5a55" stroke-width="3"/><text x="146" y="826" font-size="25" text-anchor="middle" font-weight="bold" fill="#5a5a55">Comprador</text><text x="146" y="860" font-size="24" text-anchor="middle" fill="#5a5a55">até</text><text x="146" y="892" font-size="24" text-anchor="middle" fill="#5a5a55">R$ 5.000</text><rect x="253" y="624" width="213" height="340" rx="0" fill="#e8e4da" stroke="#1f4e79" stroke-width="3"/><text x="359" y="666" font-size="25" text-anchor="middle" font-weight="bold" fill="#1f4e79">Gerente de</text><text x="359" y="700" font-size="24" text-anchor="middle" fill="#1f4e79">suprimentos</text><text x="359" y="732" font-size="24" text-anchor="middle" fill="#1f4e79">até R$ 20.000</text><rect x="466" y="464" width="213" height="500" rx="0" fill="#e8e4da" stroke="#1d1d1b" stroke-width="3"/><text x="572" y="506" font-size="25" text-anchor="middle" font-weight="bold" fill="#1d1d1b">Diretor</text><text x="572" y="540" font-size="24" text-anchor="middle" fill="#1d1d1b">acima de</text><text x="572" y="572" font-size="24" text-anchor="middle" fill="#1d1d1b">R$ 20.000</text><line x1="360.0" y1="374.0" x2="360.0" y2="604.0" stroke="#1f4e79" stroke-width="4" stroke-dasharray="10 8"/><path d="M348,598 L360,620 L372,598 Z" fill="#1f4e79" stroke="#1f4e79" stroke-width="2"/><rect x="30" y="994" width="660" height="190" rx="4" fill="#ffffff" stroke="#8a5a00" stroke-width="2"/><text x="50" y="1034" font-size="26" text-anchor="start" font-weight="bold" fill="#8a5a00">Sobe um degrau:</text><text x="50" y="1072" font-size="24" text-anchor="start" fill="#1d1d1b">• escolha diferente da referência</text><text x="50" y="1106" font-size="24" text-anchor="start" fill="#1d1d1b">• menos propostas que o mínimo</text><text x="50" y="1140" font-size="24" text-anchor="start" fill="#1d1d1b">• aumento de preço após aprovar</text><rect x="30" y="1204" width="660" height="190" rx="4" fill="#fbe9e7" stroke="#b3261e" stroke-width="2"/><text x="50" y="1244" font-size="26" text-anchor="start" font-weight="bold" fill="#b3261e">Porta lateral: emergência</text><text x="50" y="1282" font-size="24" text-anchor="start" fill="#1d1d1b">até R$ 3.000, declarada pelo gestor</text><text x="50" y="1316" font-size="24" text-anchor="start" fill="#1d1d1b">aprovação depois, em 1 dia útil</text><text x="50" y="1350" font-size="24" text-anchor="start" fill="#1d1d1b">PC-1211: R$ 1.380 · 10/12 → ok 11/12</text><text x="30" y="1434" font-size="24" text-anchor="start" font-weight="bold" fill="#1d1d1b">Dividir a compra não muda o degrau.</text><text x="30" y="1470" font-size="24" text-anchor="start" fill="#5a5a55">Exemplo fictício: dados inventados.</text><text x="690" y="1504" font-size="24" text-anchor="end" fill="#5a5a55">Ilustração · Torno 2026</text></svg>
