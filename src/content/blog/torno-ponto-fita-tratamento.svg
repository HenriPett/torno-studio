<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1470" viewBox="0 0 720 1470" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">A marcação original nunca some</title><desc id="d1">Exemplo fictício. Fita de comprovantes de ponto de Paula R., Exemplo Comercial Ltda., quarta 11/11 e quinta 12/11/2026, com uma folha de papel vegetal sobreposta representando o tratamento. Quarta: NSR 1041 08:02; NSR 1047 12:00; espaço vazio, 3 marcações, número ímpar; NSR 1063 17:01. No papel vegetal: incluída 13:00, fonte I, motivo esquecimento, pediu Paula, aprovou Renata. Quinta: NSR 1072 07:59; NSR 1080 12:00; NSR 1081 12:00 e 40 segundos; NSR 1090 13:01; NSR 1112 19:00. No papel vegetal: a 1081 riscada, desconsiderada, tipo D, fonte O, motivo duplicidade, tratada pelo RH, continua visível. No AEJ: quarta E 08:02 O, S 12:00 O, E 13:00 I esquecimento, S 17:01 O; quinta E 07:59 O, S 12:00 O, D 12:00 O duplicidade, E 13:01 O, S 19:00 O. A fita nunca é editada; o tratamento é outra camada.</desc><rect x="0" y="0" width="720" height="1470" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="10" y="10" width="700" height="1450" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="450" y="24" width="246" height="46" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="573" y="56" font-size="22" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="118" font-size="32" text-anchor="start" font-weight="bold" fill="#1d1d1b">A marcação original nunca some</text><text x="30" y="158" font-size="22" text-anchor="start" fill="#5a5a55">Comprovantes de Paula R. · REP-P · 11 e 12/11/2026</text><text x="30" y="188" font-size="22" text-anchor="start" fill="#5a5a55">Fita = marcações originais · papel vegetal = tratamento</text><rect x="40" y="238" width="280" height="784" rx="0" fill="#ffffff" stroke="#1d1d1b" stroke-width="2"/><circle cx="54" cy="250" r="4" fill="#f6f3ec" stroke