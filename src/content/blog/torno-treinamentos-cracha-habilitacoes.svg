idth="0"/><rect x="602" y="278" width="11" height="11" rx="0" fill="#1d1d1b" stroke="none" stroke-width="0"/><rect x="602" y="289" width="11" height="11" rx="0" fill="#1d1d1b" stroke="none" stroke-width="0"/><rect x="602" y="311" width="11" height="11" rx="0" fill="#1d1d1b" stroke="none" stroke-width="0"/><rect x="602" y="322" width="11" height="11" rx="0" fill="#1d1d1b" stroke="none" stroke-width="0"/><rect x="602" y="333" width="11" height="11" rx="0" fill="#1d1d1b" stroke="none" stroke-width="0"/><text x="574" y="382" font-size="15" text-anchor="middle" fill="#5a5a55">código de</text><text x="574" y="400" font-size="15" text-anchor="middle" fill="#5a5a55">consulta</text><text x="104" y="490" font-size="16" text-anchor="start" font-style="italic" fill="#5a5a55">Ilustrativo: não é um código real.</text><rect x="80" y="550" width="560" height="330" rx="18" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><text x="104" y="590" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">Habilitações (situação na impressão)</text><text x="620" y="590" font-size="16" text-anchor="end" fill="#5a5a55">VERSO</text><line x1="104" y1="608" x2="616" y2="608" stroke="#d9d4c7" stroke-width="1"/><text x="104" y="634" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">Integração e ordem de serviço</text><text x="104" y="662" font-size="18" text-anchor="start" fill="#5a5a55">em dia</text><line x1="104" y1="670" x2="616" y2="670" stroke="#d9d4c7" stroke-width="1"/><text x="104" y="696" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">NR-35 altura · periódico presencial</text><text x="104" y="724" font-size="18" text-anchor="start" fill="#5a5a55">10/12/2024 · válido até 09/12/2026</text><line x1="104" y1="732" x2="616" y2="732" stroke="#d9d4c7" stroke-width="1"/><text x="104" y="758" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">Autorização para altura</text><text x="104" y="786" font-size="18" text-anchor="start" f