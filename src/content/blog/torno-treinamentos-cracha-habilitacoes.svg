<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1500" viewBox="0 0 720 1500" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Crachá de habilitações e consulta do dia</title><desc id="d1">Exemplo fictício. Crachá de habilitações de Bruno A., montador, matrícula fictícia 0417, da Exemplo Estruturas Metálicas Ltda., frente e verso, impresso em 15/06/2026. Frente: silhueta no lugar da foto e código para consulta da situação do dia. Verso, como impresso: integração e ordem de serviço em dia; NR-35 trabalho em altura, periódico presencial de 10/12/2024, válido até 09/12/2026; autorização para altura vigente; ASO apto para altura. Consulta pelo código em 10/12/2026: NR-35 vencido desde 10/12/2026; autorização para altura suspensa; certificado EAD de 20/11/2026 recusado porque a NR-35 exige presencial desde 16/07/2026; próxima turma 14/12/2026. Consulta em 14/12/2026: NR-35 periódico presencial de 14/12/2026, válido até 13/12/2028; autorização vigente. Rodapé: o crachá mostra a situação do dia em que foi impresso; quem confere a habilitação lê a consulta do dia.</desc><rect x="0" y="0" width="720" height="1500" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="10" y="10" width="700" height="1480" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="450" y="24" width="246" height="46" rx="4" fill="#fff" stroke="#b3261e" stroke-width="2"/><text x="573" y="56" font-size="22" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="118" font-size="30" text-anchor="start" font-weight="bold" fill="#1d1d1b">Crachá de habilitações</text><text x="30" y="156" font-size="20" text-anchor="start" fill="#5a5a55">o que foi impresso e o que vale no dia</text><rect x="80" y="190" width="560" height="330" rx="18" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><rect x="80" y="190" width="560" height="60" rx="18" fill="#1f4e79" stroke="#1f4e79" stroke-width="2"/><rect x="80" y="