0" y="1460" font-size="18" text-anchor="start" fill="#5a5a55">quem confere a habilitação lê a consulta do dia.</text><text x="690" y="1460" font-size="18" text-anchor="end" fill="#5a5a55">Ilustração · Torno 2026</text></svg>