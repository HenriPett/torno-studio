<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1140" viewBox="0 0 720 1140" role="img" aria-labelledby="title desc"><title id="title">Três significados para datas e horários</title><desc id="desc">Distinção editorial entre data civil, instante e agendamento futuro. O modelo não impõe UTC como regra universal.</desc><rect width="720" height="1140" fill="#f7f6f2"/>
<text x="36" y="55" fill="#1c5a49" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">TORNO · SIGNIFICADO DO CAMPO</text>
<text x="36" y="118" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700">Nem toda data é um instante</text>
<text x="36" y="164" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Defina o significado antes de escolher a regra.</text>
<rect x="32" y="215" width="656" height="206" rx="12" fill="#fff" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="257" fill="#1c5a49" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">DATA CIVIL</text>
<text x="54" y="303" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Um dia do calendário</text>
<text x="54" y="349" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">É uma data de referência,</text>
<text x="54" y="389" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">sem um horário a converter.</text>
<rect x="32" y="457" width="656" height="206" rx="12" fill="#fff" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="499" fill="#1c5a49" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">INSTANTE</text>
<text x="54" y="545" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Um acontecimento no tempo</text>
<text x="54" y="591" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">O mesmo momento pode ser exibido</text>
<text x="54" y="631" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">em fusos diferentes.</text>
<rect x="32" y="699" width="656" height="206" rx="12" fill="#eeece6" stroke="#dcd9d1" stroke-width="2"/>
<text x="54" y="741" fill="#1c5a49" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">AGENDAMENTO FUTURO</text>
<text x="54" y="787" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700">Um compromisso a acontecer</text>
<text x="54" y="833" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Defina se deve fixar o instante</text>
<text x="54" y="873" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">ou preservar horário e zona local.</text>
<text x="36" y="1020" fill="#1c5a49" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700">A regra depende do significado e do uso.</text>
<text x="36" y="1087" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Proposta editorial · adapte ao sistema.</text>
</svg>
