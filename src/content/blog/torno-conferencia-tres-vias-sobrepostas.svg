<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1500" viewBox="0 0 720 1500" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Três vias sobrepostas: PC 7712, recebimento de 09/11 e NF-e 45.210</title><desc id="d1">Exemplo fictício. Metalúrgica Exemplo Ltda. Três documentos sobrepostos em transparência: pedido de compra PC 7712 de 02/11/2026 (frete por conta do fornecedor), recebimento de 09/11/2026 e NF-e 45.210 autorizada em 06/11/2026. Faixas alinham os campos que precisam bater. Barra SAE1045-1POL ligada a MP-1045-25: pedido 1.200 kg a R$ 9,80; recebido 610 kg; nota 615 kg a R$ 10,00 com 2% de desconto, R$ 9,80 líquido; 5 kg a mais, 0,82%, acima de 0,5%: R$ 49,00. Óleo OCS-BD20 ligado a OL-020, fator 20: pedido 200 L a R$ 18,50; recebido 10 baldes, 200 L; nota 10 BD a R$ 370,00 = R$ 18,50/L; confere. Pastilha CNMG-CX10 ligada a FE-CNMG, fator 10: pedido 100 UN a R$ 42,00; recebidas 6 caixas, 60 UN; nota 6 CX a R$ 430,00 = R$ 43,00/UN; 2,38% acima de 1%: R$ 60,00. Frete: pedido por conta do fornecedor; nota R$ 180,00 destacado: R$ 180,00. Pedido na nota: xPed 7712, itens 1 a 3: confere. Totais: nota R$ 12.487,00; valor que bate R$ 12.198,00; diferença R$ 289,00 = 49 + 60 + 180. Nota inteira bloqueada para pagamento, três motivos.</desc><rect x="0.0" y="0.0" width="720.0" height="1500.0" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14.0" y="14.0" width="692.0" height="1472.0" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30.0" y="58.0" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Três vias da mesma compra</text><text x="30.0" y="92.0" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">pedido, recebimento e nota, campo a campo</text><rect x="470.0" y="108.0" width="222.0" height="40.0" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581.0" y="136.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><text x="690.0" y="1470.0" font-size="18" text-anchor="end" font-weight="normal" fill="#4a4f55">Ilustração · Torno 2026</text><rect x="30.0" y="170.0" width="520.0" height="1000.0" rx="8" fill="#7aa6d6" stroke="#2f5d8a" stroke-width="2" fill-opacity="0.16"/><rect x="60.0" y="186.0" width="520.0" height="1000.0" rx="8" fill="#a9c47f" stroke="#5b7a2a" stroke-width="2" fill-opacity="0.16"/><rect x="90.0" y="202.0" width="600.0" height="1000.0" rx="8" fill="#e8b27a" stroke="#b5651d" stroke-width="2" fill-opacity="0.16"/><rect x="100.0" y="222.0" width="18.0" height="18.0" rx="3" fill="#2f5d8a" stroke="none" stroke-width="0"/><text x="128.0" y="236.0" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">pedido · 02/11 · frete do fornecedor</text><rect x="100.0" y="248.0" width="18.0" height="18.0" rx="3" fill="#5b7a2a" stroke="none" stroke-width="0"/><text x="128.0" y="262.0" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">recebimento · 09/11</text><rect x="100.0" y="274.0" width="18.0" height="18.0" rx="3" fill="#b5651d" stroke="none" stroke-width="0"/><text x="128.0" y="288.0" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">NF-e 45.210 · autorizada 06/11</text><rect x="100.0" y="330.0" width="580.0" height="162.0" rx="6" fill="#fbe3e0" stroke="#9b2a1f" stroke-width="2" fill-opacity="0.85"/><text x="114.0" y="358.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">1 Barra SAE 1045</text><text x="114.0" y="380.0" font-size="16" text-anchor="start" font-weight="normal" fill="#4a4f55">SAE1045-1POL → MP-1045-25 · kg (1)</text><rect x="114.0" y="393.0" width="12.0" height="14.0" rx="2" fill="#2f5d8a" stroke="none" stroke-width="0"/><text x="134.0" y="406.0" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">1.200 kg × R$ 9,80</text><rect x="114.0" y="415.0" width="12.0" height="14.0" rx="2" fill="#5b7a2a" stroke="none" stroke-width="0"/><text x="134.0" y="428.0" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">610 kg pesados</text><rect x="114.0" y="437.0" width="12.0" height="14.0" rx="2" fill="#b5651d" stroke="none" stroke-width="0"/><text x="134.0" y="450.0" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">615 kg × R$ 10,00 − 2% = R$ 9,80</text><circle cx="640.0" cy="364.0" r="18" fill="#9b2a1f" stroke="none" stroke-width="0"/><text x="640.0" y="371.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#ffffff">✕</text><text x="666.0" y="480.0" font-size="16" text-anchor="end" font-weight="bold" fill="#9b2a1f">5 kg a mais · 0,82% &gt; 0,5% · R$ 49,00</text><rect x="100.0" y="506.0" width="580.0" height="162.0" rx="6" fill="#dcebd5" stroke="#2e6b2d" stroke-width="2" fill-opacity="0.85"/><text x="114.0" y="534.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">2 Óleo de corte</text><text x="114.0" y="556.0" font-size="16" text-anchor="start" font-weight="normal" fill="#4a4f55">OCS-BD20 → OL-020 · BD (20 L)</text><rect x="114.0" y="569.0" width="12.0" height="14.0" rx="2" fill="#2f5d8a" stroke="none" stroke-width="0"/><text x="134.0" y="582.0" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">200 L × R$ 18,50</text><rect x="114.0" y="591.0" width="12.0" height="14.0" rx="2" fill="#5b7a2a" stroke="none" stroke-width="0"/><text x="134.0" y="604.0" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">10 BD = 200 L</text><rect x="114.0" y="613.0" width="12.0" height="14.0" rx="2" fill="#b5651d" stroke="none" stroke-width="0"/><text x="134.0" y="626.0" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">10 BD × R$ 370,00 = R$ 18,50/L</text><circle cx="640.0" cy="540.0" r="18" fill="#2e6b2d" stroke="none" stroke-width="0"/><text x="640.0" y="547.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#ffffff">✓</text><text x="666.0" y="656.0" font-size="16" text-anchor="end" font-weight="bold" fill="#2e6b2d">confere</text><rect x="100.0" y="682.0" width="580.0" height="162.0" rx="6" fill="#fbe3e0" stroke="#9b2a1f" stroke-width="2" fill-opacity="0.85"/><text x="114.0" y="710.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">3 Pastilha</text><text x="114.0" y="732.0" font-size="16" text-anchor="start" font-weight="normal" fill="#4a4f55">CNMG-CX10 → FE-CNMG · CX (10 UN)</text><rect x="114.0" y="745.0" width="12.0" height="14.0" rx="2" fill="#2f5d8a" stroke="none" stroke-width="0"/><text x="134.0" y="758.0" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">100 UN × R$ 42,00</text><rect x="114.0" y="767.0" width="12.0" height="14.0" rx="2" fill="#5b7a2a" stroke="none" stroke-width="0"/><text x="134.0" y="780.0" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">6 CX = 60 UN</text><rect x="114.0" y="789.0" width="12.0" height="14.0" rx="2" fill="#b5651d" stroke="none" stroke-width="0"/><text x="134.0" y="802.0" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">6 CX × R$ 430,00 = R$ 43,00/UN</text><circle cx="640.0" cy="716.0" r="18" fill="#9b2a1f" stroke="none" stroke-width="0"/><text x="640.0" y="723.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#ffffff">✕</text><text x="666.0" y="832.0" font-size="16" text-anchor="end" font-weight="bold" fill="#9b2a1f">preço 2,38% &gt; 1% (R$ 42,42) · R$ 60,00</text><rect x="100.0" y="858.0" width="580.0" height="162.0" rx="6" fill="#fbe3e0" stroke="#9b2a1f" stroke-width="2" fill-opacity="0.85"/><text x="114.0" y="886.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">Frete</text><text x="114.0" y="908.0" font-size="16" text-anchor="start" font-weight="normal" fill="#4a4f55">condição do pedido</text><rect x="114.0" y="921.0" width="12.0" height="14.0" rx="2" fill="#2f5d8a" stroke="none" stroke-width="0"/><text x="134.0" y="934.0" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">por conta do fornecedor</text><rect x="114.0" y="943.0" width="12.0" height="14.0" rx="2" fill="#5b7a2a" stroke="none" stroke-width="0"/><text x="134.0" y="956.0" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">—</text><rect x="114.0" y="965.0" width="12.0" height="14.0" rx="2" fill="#b5651d" stroke="none" stroke-width="0"/><text x="134.0" y="978.0" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">R$ 180,00 destacado</text><circle cx="640.0" cy="892.0" r="18" fill="#9b2a1f" stroke="none" stroke-width="0"/><text x="640.0" y="899.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#ffffff">✕</text><text x="666.0" y="1008.0" font-size="16" text-anchor="end" font-weight="bold" fill="#9b2a1f">frete em pedido com frete do fornecedor · R$ 180,00</text><rect x="100.0" y="1034.0" width="580.0" height="162.0" rx="6" fill="#dcebd5" stroke="#2e6b2d" stroke-width="2" fill-opacity="0.85"/><text x="114.0" y="1062.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">Pedido na nota</text><text x="114.0" y="1084.0" font-size="16" text-anchor="start" font-weight="normal" fill="#4a4f55">xPed / nItemPed</text><rect x="114.0" y="1097.0" width="12.0" height="14.0" rx="2" fill="#2f5d8a" stroke="none" stroke-width="0"/><text x="134.0" y="1110.0" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">PC 7712 · itens 1 a 3</text><rect x="114.0" y="1119.0" width="12.0" height="14.0" rx="2" fill="#5b7a2a" stroke="none" stroke-width="0"/><text x="134.0" y="1132.0" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">vinculado ao PC 7712</text><rect x="114.0" y="1141.0" width="12.0" height="14.0" rx="2" fill="#b5651d" stroke="none" stroke-width="0"/><text x="134.0" y="1154.0" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">xPed 7712 · itens 1, 2, 3</text><circle cx="640.0" cy="1068.0" r="18" fill="#2e6b2d" stroke="none" stroke-width="0"/><text x="640.0" y="1075.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#ffffff">✓</text><text x="666.0" y="1184.0" font-size="16" text-anchor="end" font-weight="bold" fill="#2e6b2d">vínculo automático</text><rect x="100.0" y="1210.0" width="580.0" height="150.0" rx="6" fill="#ffffff" stroke="#1d1d1b" stroke-width="2"/><text x="114.0" y="1240.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">Totais da NF-e 45.210</text><text x="114.0" y="1268.0" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">nota: 12.430,00 − 123,00 (desconto) + 180,00 (frete) = R$ 12.487,00</text><text x="114.0" y="1294.0" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">que bate: 610 × 9,80 + 3.700,00 + 60 × 42,00 = R$ 12.198,00</text><text x="114.0" y="1320.0" font-size="17" text-anchor="start" font-weight="bold" fill="#9b2a1f">diferença: R$ 289,00 = 49,00 + 60,00 + 180,00</text><text x="114.0" y="1346.0" font-size="16" text-anchor="start" font-weight="normal" fill="#4a4f55">tributos fora da conta do exemplo (conferência do fiscal)</text><rect x="100.0" y="1374.0" width="580.0" height="46.0" rx="6" fill="#fbe3e0" stroke="#9b2a1f" stroke-width="3"/><text x="390.0" y="1405.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#9b2a1f">NOTA INTEIRA BLOQUEADA PARA PAGAMENTO · 3 MOTIVOS</text></svg>
