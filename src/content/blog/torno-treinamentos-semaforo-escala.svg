<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1760" viewBox="0 0 720 1760" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Semáforo da escala de 10/12/2026</title><desc id="d1">Exemplo fictício. Semáforo da escala de quinta-feira 10/12/2026 da Exemplo Estruturas Metálicas Ltda., com quatro tarefas. Tarefa 1: montagem da cobertura do galpão 2, altura de 9 m, exige NR-35, autorização e ASO apto. Bruno A.: vermelho, bloqueado, NR-35 válido até 09/12/2026, turma de 08/12 remarcada para 14/12. Substituto sugerido Diego R.: verde, liberado, NR-35 válido até 04/05/2028, convalidado em 25/11/2026; escolhido pelo supervisor. Tarefa 2: entrada no tanque de decapagem T-3, espaço confinado, exige NR-33 trabalhador autorizado. Márcio T.: amarelo, liberado com aviso, NR-33 válido até 14/01/2027, faltam 35 dias. Tarefa 3: manutenção do quadro elétrico QD-4, exige NR-10. Lúcia F.: cinza, afastada de 21/09/2026 a 03/01/2027, não escalável; tarefa remarcada pelo supervisor. Tarefa 4: pintura de vigas no solo, exige integração. Bruno A.: verde. Rodapé: a escala é conferida na data da tarefa; quem escolhe o substituto é o supervisor; nestas atividades o SST não admite liberação de exceção.</desc><rect x="0" y="0" width="720" height="1760" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="10" y="10" width="700" height="1740" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="450" y="24" width="246" height="46" rx="4" fill="#fff" stroke="#b3261e" stroke-width="2"/><text x="573" y="56" font-size="22" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="118" font-size="30" text-anchor="start" font-weight="bold" fill="#1d1d1b">Escala do dia: o que o sistema confere</text><text x="30" y="156" font-size="20" text-anchor="start" fill="#5a5a55">qui 10/12/2026 · supervisor Rogério · galpão 2 e fabricação</text><rect x="30" y="190" width="660" height="350" rx="8" fill="#fff" stroke="#b3261e" stroke-width="3"/><text x="50" y="230" font-size="21" text-anchor="start" font-weight="bold" fill="#1d1d1b">Tarefa 1 · Montagem da cobertura, galpão 2</text><text x="50" y="260" font-size="17" text-anchor="start" fill="#5a5a55">altura de 9 m · exige NR-35, autorização, ASO apto</text><rect x="50" y="280" width="56" height="156" rx="14" fill="#2b2b2b" stroke="#1d1d1b" stroke-width="2"/><circle cx="78" cy="310" r="19" fill="#b3261e" stroke="#111" stroke-width="1"/><circle cx="78" cy="358" r="19" fill="#5a4a1f" stroke="#111" stroke-width="1"/><circle cx="78" cy="406" r="19" fill="#2f4a33" stroke="#111" stroke-width="1"/><text x="130" y="314" font-size="19" text-anchor="start" font-weight="bold" fill="#b3261e">Bruno A. · BLOQUEADO</text><text x="130" y="346" font-size="18" text-anchor="start" fill="#1d1d1b">NR-35 válido até 09/12/2026</text><text x="130" y="378" font-size="18" text-anchor="start" fill="#1d1d1b">turma de 08/12 remarcada para 14/12</text><line x1="130" y1="448" x2="130" y2="478" stroke="#2e7d32" stroke-width="3"/><line x1="130" y1="478" x2="160" y2="478" stroke="#2e7d32" stroke-width="3"/><polygon points="160,470 174,478 160,486" fill="#2e7d32"/><circle cx="196" cy="478" r="14" fill="#43c24a" stroke="#111" stroke-width="1"/><text x="222" y="472" font-size="18" text-anchor="start" font-weight="bold" fill="#2e7d32">Substituto sugerido: Diego R. · liberado</text><text x="222" y="500" font-size="17" text-anchor="start" fill="#1d1d1b">NR-35 válido até 04/05/2028</text><text x="222" y="524" font-size="17" text-anchor="start" fill="#5a5a55">convalidado em 25/11 · escolhido pelo supervisor</text><rect x="30" y="564" width="660" height="280" rx="8" fill="#fff" stroke="#9a5b00" stroke-width="3"/><text x="50" y="604" font-size="21" text-anchor="start" font-weight="bold" fill="#1d1d1b">Tarefa 2 · Entrada no tanque T-3</text><text x="50" y="634" font-size="17" text-anchor="start" fill="#5a5a55">espaço confinado · exige NR-33 trab. autorizado</text><rect x="50" y="654" width="56" height="156" rx="14" fill="#2b2b2b" stroke="#1d1d1b" stroke-width="2"/><circle cx="78" cy="684" r="19" fill="#5c2a27" stroke="#111" stroke-width="1"/><circle cx="78" cy="732" r="19" fill="#f2b705" stroke="#111" stroke-width="1"/><circle cx="78" cy="780" r="19" fill="#2f4a33" stroke="#111" stroke-width="1"/><text x="130" y="688" font-size="19" text-anchor="start" font-weight="bold" fill="#9a5b00">Márcio T. · liberado, com aviso</text><text x="130" y="720" font-size="18" text-anchor="start" fill="#1d1d1b">NR-33 válido até 14/01/2027</text><text x="130" y="752" font-size="18" text-anchor="start" fill="#1d1d1b">faltam 35 dias</text><rect x="30" y="868" width="660" height="280" rx="8" fill="#fff" stroke="#8a8a85" stroke-width="3"/><text x="50" y="908" font-size="21" text-anchor="start" font-weight="bold" fill="#1d1d1b">Tarefa 3 · Manutenção do quadro QD-4</text><text x="50" y="938" font-size="17" text-anchor="start" fill="#5a5a55">eletricidade · exige NR-10</text><rect x="50" y="958" width="56" height="156" rx="14" fill="#2b2b2b" stroke="#1d1d1b" stroke-width="2"/><circle cx="78" cy="988" r="19" fill="#555" stroke="#111" stroke-width="1"/><circle cx="78" cy="1036" r="19" fill="#555" stroke="#111" stroke-width="1"/><circle cx="78" cy="1084" r="19" fill="#555" stroke="#111" stroke-width="1"/><text x="130" y="992" font-size="19" text-anchor="start" font-weight="bold" fill="#8a8a85">Lúcia F. · não escalável</text><text x="130" y="1024" font-size="18" text-anchor="start" fill="#1d1d1b">afastada de 21/09/2026 a 03/01/2027</text><text x="130" y="1056" font-size="18" text-anchor="start" fill="#1d1d1b">tarefa remarcada pelo supervisor</text><rect x="30" y="1172" width="660" height="280" rx="8" fill="#fff" stroke="#2e7d32" stroke-width="3"/><text x="50" y="1212" font-size="21" text-anchor="start" font-weight="bold" fill="#1d1d1b">Tarefa 4 · Pintura de vigas no solo</text><text x="50" y="1242" font-size="17" text-anchor="start" fill="#5a5a55">exige integração e ordem de serviço</text><rect x="50" y="1262" width="56" height="156" rx="14" fill="#2b2b2b" stroke="#1d1d1b" stroke-width="2"/><circle cx="78" cy="1292" r="19" fill="#5c2a27" stroke="#111" stroke-width="1"/><circle cx="78" cy="1340" r="19" fill="#5a4a1f" stroke="#111" stroke-width="1"/><circle cx="78" cy="1388" r="19" fill="#43c24a" stroke="#111" stroke-width="1"/><text x="130" y="1296" font-size="19" text-anchor="start" font-weight="bold" fill="#2e7d32">Bruno A. · liberado</text><text x="130" y="1328" font-size="18" text-anchor="start" fill="#1d1d1b">integração em dia</text><rect x="30" y="1476" width="660" height="150" rx="6" fill="#fff" stroke="#1d1d1b" stroke-width="2"/><text x="48" y="1510" font-size="18" text-anchor="start" font-weight="bold" fill="#1d1d1b">Conferido na data da tarefa, não na de hoje.</text><text x="48" y="1540" font-size="18" text-anchor="start" fill="#1d1d1b">Quem escolhe o substituto é o supervisor.</text><text x="48" y="1570" font-size="18" text-anchor="start" fill="#1d1d1b">Altura, eletricidade, espaço confinado e dobradeira:</text><text x="48" y="1600" font-size="18" text-anchor="start" fill="#1d1d1b">o SST não admite liberação de exceção.</text><text x="30" y="1692" font-size="18" text-anchor="start" fill="#5a5a55">Regras de bloqueio da empresa fictícia,</text><text x="30" y="1720" font-size="18" text-anchor="start" fill="#5a5a55">escritas pelo SST.</text><text x="690" y="1720" font-size="18" text-anchor="end" fill="#5a5a55">Ilustração · Torno 2026</text></svg>