<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Ampulheta da defasagem: do mês de referência à fatura reajustada</title><desc id="d1">Ampulheta da defasagem do índice para o contrato A da Manutenção Exemplo Ltda., com aniversário em 01/12/2026. No bulbo de cima, outubro de 2026, o mês de referência, com os preços coletados ao longo do mês. No gargalo, dado real: o IPCA de outubro de 2026 foi divulgado em 12/11/2026, segundo a Agência Gov com informações do IBGE. No bulbo de baixo, exemplo fictício: em 16/11/2026, segunda-feira, a rotina confere que o índice está na base, calcula e envia o aviso; em 01/12/2026 sai a fatura reajustada, 15 dias depois do aviso. À direita, duas consequências: se o contrato pedisse o índice até novembro, o IPCA de novembro de 2026 só tem divulgação prevista para 11/12/2026, segundo a Agência Gov, e a fatura de 01/12 não teria o número; se a empresa quisesse avisar com 30 dias, em 01/11 ainda não existiria o IPCA de outubro, e a janela teria de terminar antes de outubro. Abaixo, dado real do IGP-M: o de novembro de 2025 teve coleta de 21/10 a 20/11/2025 e foi divulgado em 27/11/2025 pela FGV IBRE. Regra: sem índice na base, a rotina não calcula e avisa o financeiro; não usa o último número disponível.</desc><rect x="0" y="0" width="720" height="1000" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14" y="14" width="692" height="972" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30" y="58" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">A ampulheta do índice</text><text x="30" y="90" font-size="20" text-anchor="start" font-weight="normal" fill="#1d1d1b">contrato A · aniversário 01/12/2026</text><rect x="470" y="104" width="222" height="40" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581" y="132" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><text x="30" y="130" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55" font-style="italic">datas de divulgação reais; contrato fictício</text><path d="M 50 170 L 320 170 L 320 190 C 320 290 203 330 203 380 L 167 380 C 167 330 50 290 50 190 Z" fill="#e7dfcc" stroke="#1d1d1b" stroke-width="2.5"/><path d="M 167 380 C 167 430 50 470 50 570 L 50 590 L 320 590 L 320 570 C 320 470 203 430 203 380" fill="#e7dfcc" stroke="#1d1d1b" stroke-width="2.5"/><text x="185" y="215" font-size="22" text-anchor="middle" font-weight="bold" fill="#1d1d1b">outubro/2026</text><text x="185" y="243" font-size="18" text-anchor="middle" font-weight="normal" fill="#4a4f55">mês de referência</text><text x="185" y="268" font-size="18" text-anchor="middle" font-weight="normal" fill="#4a4f55">preços coletados</text><text x="185" y="290" font-size="18" text-anchor="middle" font-weight="normal" fill="#4a4f55">ao longo do mês</text><rect x="36" y="352" width="298" height="56" rx="6" fill="#ffffff" stroke="#2f5d8a" stroke-width="2.5"/><text x="185" y="376" font-size="20" text-anchor="middle" font-weight="bold" fill="#2f5d8a">12/11 · IBGE divulga</text><text x="185" y="399" font-size="18" text-anchor="middle" font-weight="normal" fill="#2f5d8a">IPCA de outubro (dado real)</text><rect x="46" y="466" width="278" height="50" rx="4" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="185" y="488" font-size="19" text-anchor="middle" font-weight="bold" fill="#7a5600">16/11 · rotina calcula</text><text x="185" y="509" font-size="18" text-anchor="middle" font-weight="normal" fill="#7a5600">e envia o aviso</text><rect x="46" y="528" width="278" height="50" rx="4" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="2"/><text x="185" y="559" font-size="19" text-anchor="middle" font-weight="bold" fill="#ffffff">01/12 · fatura reajustada</text><text x="356" y="196" font-size="20" text-anchor="start" font-weight="bold" fill="#9b2a1f">E se o contrato pedisse</text><text x="356" y="222" font-size="20" text-anchor="start" font-weight="bold" fill="#9b2a1f">o índice até novembro?</text><text x="356" y="252" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">O de novembro só sai em</text><text x="356" y="276" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">11/12 (Agência Gov): a fatura de</text><text x="356" y="300" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">01/12 não teria o número.</text><text x="356" y="346" font-size="20" text-anchor="start" font-weight="bold" fill="#9b2a1f">E aviso com 30 dias?</text><text x="356" y="376" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">Em 01/11 ainda não existe</text><text x="356" y="400" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">o IPCA de outubro: a janela</text><text x="356" y="424" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">teria de acabar antes de outubro.</text><text x="356" y="470" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">Regra do exemplo</text><text x="356" y="500" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">sem índice na base: não</text><text x="356" y="524" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">calcula, alerta o financeiro,</text><text x="356" y="548" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">não usa o último número.</text><line x1="30" y1="620" x2="690" y2="620" stroke="#d8d2c4" stroke-width="1.5"/><text x="30" y="656" font-size="22" text-anchor="start" font-weight="bold" fill="#1d1d1b">IGP-M: outra ampulheta (dado real)</text><text x="30" y="690" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">IGP-M de novembro/2025, segundo a FGV IBRE:</text><rect x="30" y="710" width="420" height="46" rx="4" fill="#e7dfcc" stroke="#1d1d1b" stroke-width="1.5"/><text x="240" y="740" font-size="19" text-anchor="middle" font-weight="bold" fill="#1d1d1b">coleta de 21/10 a 20/11/2025</text><rect x="462" y="710" width="228" height="46" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="2.5"/><text x="576" y="740" font-size="19" text-anchor="middle" font-weight="bold" fill="#2f5d8a">divulgado 27/11</text><text x="30" y="800" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">Cada índice tem período de coleta e data de</text><text x="30" y="826" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">divulgação próprios. Confira o calendário da fonte</text><text x="30" y="852" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">antes de escrever qual mês entra na conta.</text><text x="30" y="900" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55" font-style="italic">datas de divulgação: Agência Gov (12/11/2026) e FGV IBRE</text><text x="30" y="926" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55" font-style="italic">(27/11/2025); rotina, aviso e fatura são do exemplo</text><text x="690" y="970" font-size="18" text-anchor="end" font-weight="normal" fill="#4a4f55">Ilustração · Torno 2026</text></svg>