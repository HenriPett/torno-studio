<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc">
<title id="title">Confira os limites do retorno</title><desc id="desc">Voltar a versão exige outras conferências. Proposta editorial para adaptar ao sistema.</desc>
<rect width="720" height="1040" fill="#f7f6f2"/>
<text x="36" y="56" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">TORNO · GUIA VISUAL</text>
<text x="36" y="120" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="700">Confira os limites do retorno</text>
<text x="36" y="166" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Voltar a versão exige outras conferências.</text>
<rect x="32" y="210" width="656" height="154" rx="14" fill="#ffffff" stroke="#b4c6bd" stroke-width="2"/><rect x="48" y="232" width="54" height="54" rx="12" fill="#e2ede8"/>
<text x="65" y="269" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">1</text>
<text x="120" y="254" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Dados compatíveis</text>
<text x="120" y="296" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">A versão anterior consegue usar</text>
<text x="120" y="330" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">os registros criados após a mudança?</text>
<rect x="32" y="386" width="656" height="154" rx="14" fill="#ffffff" stroke="#b4c6bd" stroke-width="2"/><rect x="48" y="408" width="54" height="54" rx="12" fill="#e2ede8"/>
<text x="65" y="445" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">2</text>
<text x="120" y="430" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Efeitos externos</text>
<text x="120" y="472" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">O que já foi enviado a outro serviço?</text>
<text x="120" y="506" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">O que foi confirmado ou segue incerto?</text>
<rect x="32" y="562" width="656" height="154" rx="14" fill="#ffffff" stroke="#b4c6bd" stroke-width="2"/><rect x="48" y="584" width="54" height="54" rx="12" fill="#e2ede8"/>
<text x="65" y="621" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">3</text>
<text x="120" y="606" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Ensaio pertinente</text>
<text x="120" y="648" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Qual sequência foi verificada?</text>
<text x="120" y="682" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Que diferenças há para produção?</text>
<rect x="32" y="738" width="656" height="154" rx="14" fill="#ffffff" stroke="#b4c6bd" stroke-width="2"/><rect x="48" y="760" width="54" height="54" rx="12" fill="#e2ede8"/>
<text x="65" y="797" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">4</text>
<text x="120" y="782" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Verificação após o retorno</text>
<text x="120" y="824" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Confira versão, fluxo e pendências.</text>
<text x="120" y="858" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Combine sinais e tempo de observação.</text>
<text x="36" y="966" fill="#1c5a49" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">Guardar evidências da decisão e do resultado.</text>
<text x="36" y="1005" fill="#16181a" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Proposta editorial · adapte ao sistema.</text>
</svg>
