<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1300" aria-labelledby="title desc" role="img" viewBox="0 0 720 1300"><title id="title">O contrato do arquivo exportado</title><desc id="desc">Percurso editorial de uma exportação operacional: finalidade, perfil, filtros e campos, arquivo, aplicativo de destino e conferência. Não representa um produto real.</desc><rect width="720" height="1300" fill="#f7f6f2"/><text x="36" y="55" fill="#1c5a49" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">TORNO · CONTRATO DA EXPORTAÇÃO</text><text x="36" y="118" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700">Que arquivo precisa sair?</text><text x="36" y="164" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Defina a finalidade e como o conteúdo será usado.</text><rect width="656" height="162" x="32" y="210" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="252" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Finalidade e acesso</text><text x="54" y="298" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Quem pode exportar e para qual tarefa?</text><text x="54" y="337" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Quais registros esse perfil pode receber?</text><path fill="none" stroke="#1c5a49" stroke-width="3" d="M360 372 L360 398"/><rect width="656" height="162" x="32" y="398" fill="#eeece6" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="440" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Conjunto, corte e campos</text><text x="54" y="486" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Combine filtros, referência do período</text><text x="54" y="525" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">e significado dos campos exportados.</text><path fill="none" stroke="#1c5a49" stroke-width="3" d="M360 560 L360 586"/><rect width="656" height="162" x="32" y="586" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="628" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Arquivo gerado</text><text x="54" y="674" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Declare formato, tipos e limites.</text><text x="54" y="713" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">O download não comprova o conteúdo.</text><path fill="none" stroke="#1c5a49" stroke-width="3" d="M360 748 L360 774"/><rect width="656" height="162" x="32" y="774" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="816" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Aplicativo de destino</text><text x="54" y="862" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Confira a abertura e a interpretação</text><text x="54" y="901" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">no aplicativo em que o arquivo será usado.</text><path fill="none" stroke="#1c5a49" stroke-width="3" d="M360 936 L360 962"/><rect width="656" height="162" x="32" y="962" fill="#fff" stroke="#dcd9d1" stroke-width="2" rx="12"/><text x="54" y="1004" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">Conferência do resultado</text><text x="54" y="1050" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Compare o conjunto esperado com a saída.</text><text x="54" y="1089" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400">Registre diferenças e pendências.</text><text x="36" y="1234" fill="#16181a" font-family="IBM Plex Sans Variable,DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400">Proposta editorial · exportação operacional.</text></svg>