<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1110" aria-labelledby="title desc" role="img" viewBox="0 0 720 1110"><title id="title">Validar antes|de trocar o sistema</title><desc id="desc">A decisão depende de evidências. Divergência? Corrigir o mapa ou os dados|e repetir o ensaio e a conciliação.</desc><rect width="720" height="1110" fill="#f7f6f2" rx="24"/><g fill="#16181a" font-family="IBM Plex Sans,Arial,sans-serif"><text x="36" y="54" fill="#1c5a49" font-size="26" font-weight="700">TORNO · DIAGRAMA DE PROCESSO</text><text x="36" y="112" font-size="36" font-weight="700">Validar antes</text><text x="36" y="156" font-size="36" font-weight="700">de trocar o sistema</text><text x="36" y="204" font-size="26">A decisão depende de evidências.</text><rect width="656" height="126" x="32" y="236" fill="#fff" stroke="#b4c6bd" rx="14"/><text x="52" y="275" font-size="30" font-weight="700">Origem com recorte</text><text x="52" y="312" font-size="26">Identificar o conjunto de dados.</text><path fill="none" stroke="#1c5a49" stroke-width="3" d="M360 366 v14 m-7 -7 7 7 7 -7"/><rect width="656" height="126" x="32" y="386" fill="#fff" stroke="#b4c6bd" rx="14"/><text x="52" y="425" font-size="30" font-weight="700">Mapeamento aprovado</text><text x="52" y="462" font-size="26">Definir campos e regras.</text><path fill="none" stroke="#1c5a49" stroke-width="3" d="M360 516 v14 m-7 -7 7 7 7 -7"/><rect width="656" height="126" x="32" y="536" fill="#fff" stroke="#b4c6bd" rx="14"/><text x="52" y="575" font-size="30" font-weight="700">Ensaio de migração</text><text x="52" y="612" font-size="26">Executar em ambiente de teste.</text><path fill="none" stroke="#1c5a49" stroke-width="3" d="M360 666 v14 m-7 -7 7 7 7 -7"/><rect width="656" height="126" x="32" y="686" fill="#fff" stroke="#b4c6bd" rx="14"/><text x="52" y="725" font-size="30" font-weight="700">Conciliação</text><text x="52" y="762" font-size="26">Conferir registros, relações e totais.</text><path fill="none" stroke="#1c5a49" stroke-width="3" d="M360 816 v14 m-7 -7 7 7 7 -7"/><rect width="656" height="126" x="32" y="836" fill="#e2ede8" stroke="#b4c6bd" rx="14"/><text x="52" y="875" font-size="30" font-weight="700">Decisão de corte</text><text x="52" y="912" font-size="26">Aceitar com critérios e responsáveis.</text><text x="36" y="1042" fill="#1c5a49" font-size="26" font-weight="600">Divergência? Corrigir o mapa ou os dados</text><text x="36" y="1076" fill="#1c5a49" font-size="26" font-weight="600">e repetir o ensaio e a conciliação.</text></g></svg>