<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1020" viewBox="0 0 360 1020" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Orçamento após o lançamento — cenários hipotéticos</title>
  <desc id="diagram-desc">Para comparar o orçamento na mesma janela de tempo, identifique as faturas dos provedores, o trabalho contratado de manutenção e suporte e as mudanças de produto aprovadas separadamente. Uma parcela não contratada não oferece cobertura implícita. Valores ainda a cotar permanecem desconhecidos, não iguais a zero. Os cenários são hipotéticos e não representam preços de mercado ou uma proposta do Torno Studio.</desc>
  <rect width="360" height="1020" fill="#F7F5F0"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#17343D">
    <text x="20" y="36" fill="#215C62" font-size="16" font-weight="700" letter-spacing="1.3">CENÁRIOS HIPOTÉTICOS</text>
    <text x="20" y="78" font-size="26" font-weight="700">Orçamento após</text>
    <text x="20" y="109" font-size="26" font-weight="700">o lançamento</text>

    <g id="provedores">
      <rect x="20.75" y="139.75" width="318.5" height="198.5" rx="13" fill="#FFFFFF" stroke="#456F76" stroke-width="1.5"/>
      <rect x="20" y="140" width="6" height="198" rx="3" fill="#176A68"/>
      <text x="44" y="176" fill="#215C62" font-size="16" font-weight="700" letter-spacing="0.8">01</text>
      <text x="44" y="204" font-size="20" font-weight="700">Faturas de provedores</text>
      <text x="44" y="237" font-size="18">Base contratada +</text>
      <text x="44" y="261" font-size="18">consumo cobrado</text>
      <text x="44" y="296" fill="#34555D" font-size="16.5">Conforme arquitetura e contrato</text>
    </g>

    <g aria-label="Composição conforme contratação">
      <circle cx="180" cy="363" r="16" fill="#17343D"/>
      <text x="180" y="371" text-anchor="middle" fill="#FFFFFF" font-size="25" font-weight="700">+</text>
    </g>

    <g id="manutencao-suporte">
      <rect x="20.75" y="387.75" width="318.5" height="198.5" rx="13" fill="#FFFFFF" stroke="#456F76" stroke-width="1.5"/>
      <rect x="20" y="388" width="6" height="198" rx="3" fill="#176A68"/>
      <text x="44" y="424" fill="#215C62" font-size="16" font-weight="700" letter-spacing="0.8">02</text>
      <text x="44" y="452" font-size="20" font-weight="700">Manutenção e suporte</text>
      <text x="44" y="485" font-size="18">Trabalho e cobertura</text>
      <text x="44" y="509" font-size="18">contratados</text>
      <text x="44" y="537" fill="#34555D" font-size="16.5">Escopo, responsável e</text>
      <text x="44" y="559" fill="#34555D" font-size="16.5">horário definidos</text>
    </g>

    <g aria-label="Composição conforme contratação">
      <circle cx="180" cy="611" r="16" fill="#17343D"/>
      <text x="180" y="619" text-anchor="middle" fill="#FFFFFF" font-size="25" font-weight="700">+</text>
    </g>

    <g id="evolucao">
      <rect x="20.75" y="635.75" width="318.5" height="198.5" rx="13" fill="#FFFFFF" stroke="#456F76" stroke-width="1.5"/>
      <rect x="20" y="636" width="6" height="198" rx="3" fill="#176A68"/>
      <text x="44" y="672" fill="#215C62" font-size="16" font-weight="700" letter-spacing="0.8">03</text>
      <text x="44" y="700" font-size="20" font-weight="700">Evolução funcional</text>
      <text x="44" y="733" font-size="18">Mudanças no produto</text>
      <text x="44" y="784" fill="#34555D" font-size="16.5">Escopo e aprovação próprios</text>
    </g>

    <line x1="20" y1="861" x2="340" y2="861" stroke="#456F76" stroke-width="1.5"/>
    <text x="20" y="893" font-size="17" font-weight="700">Compare na mesma janela de tempo.</text>
    <text x="20" y="923" font-size="17" font-weight="700">‘A cotar’ não significa zero.</text>
    <text x="20" y="990" fill="#34555D" font-size="16.5">Torno Studio · Diagrama original</text>
  </g>
</svg>
