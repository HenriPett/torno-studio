<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1700" viewBox="0 0 720 1700" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Duas balanças: adiantamento contra despesas aprovadas na prestação de contas</title><desc id="d1">Exemplo fictício, Exemplo Climatização Ltda. Primeira balança, Renata M., viagem de 08 a 11/12/2026: no prato esquerdo, adiantamento de R$ 1.500,00 pago na segunda 07/12; no direito, despesas aprovadas de hospedagem 795,00, alimentação 367,30, estacionamento 30,00 e quilometragem 558,00, total 1.750,30, e a balança pende para as despesas. Glosa em 09/12: 135,50 menos o limite de 120,00, igual a 15,50. Saldo a receber: 1.750,30 menos 1.500,00, igual a R$ 250,30, pago no lote de terça 22/12/2026 e conciliado no extrato do mesmo dia. Segunda balança, Diego A., viagem de 15 a 17/12/2026: adiantamento de R$ 800,00 pago na segunda 14/12, contra hospedagem 396,00 e alimentação 116,40, total 512,40, e a balança pende para o adiantamento. Saldo a devolver: 800,00 menos 512,40, igual a R$ 287,60. Prazo de prestação no domingo 27/12/2026, alerta ao gestor em 28/12, prestação enviada em 04/01/2027 e Pix de devolução em 05/01, conciliado pelo identificador. Desconto em folha nunca é automático: é decisão do RH com o jurídico, registrada no sistema.</desc><rect x="0" y="0" width="720" height="1700" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="10" y="10" width="700" height="1680" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="450" y="24" width="246" height="46" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="573" y="56" font-size="22" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="118" font-size="32" text-anchor="start" font-weight="bold" fill="#1d1d1b">Adiantamento na balança</text><text x="30" y="158" font-size="22" text-anchor="start" fill="#5a5a55">Prestação de contas com saldo a receber</text><text x="30" y="188" font-size="22" text-anchor="start" fill="#5a5a55">e com saldo a devolver</text><text x="30" y="250" font-size="22" text-anchor="start" font-weight="bold" fill="#1d1d1b">Renata M. · viagem de 08 a 11/12/2026</text><rect x="290" y="720" width="140" height="18" rx="0" fill="#9a9a92" stroke="#1d1d1b" stroke-width="1"/><rect x="352" y="365" width="16" height="355" rx="0" fill="#9a9a92" stroke="#1d1d1b" stroke-width="1"/><line x1="140" y1="330" x2="580" y2="400" stroke="#1d1d1b" stroke-width="8"/><circle cx="360" cy="365.0" r="12" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="2"/><line x1="140" y1="330" x2="40" y2="560" stroke="#5a5a55" stroke-width="2"/><line x1="140" y1="330" x2="240" y2="560" stroke="#5a5a55" stroke-width="2"/><path d="M30,560 L250,560 Q140,600 30,560 Z" fill="#c9d8ea" stroke="#1d1d1b" stroke-width="2"/><circle cx="140" cy="330" r="6" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="2"/><rect x="50" y="504" width="180" height="52" rx="0" fill="#1f5fa8" stroke="#1d1d1b" stroke-width="1"/><text x="140" y="526" font-size="18" text-anchor="middle" fill="#ffffff">pago em</text><text x="140" y="550" font-size="20" text-anchor="middle" font-weight="bold" fill="#ffffff">seg 07/12</text><rect x="50" y="448" width="180" height="52" rx="0" fill="#1f5fa8" stroke="#1d1d1b" stroke-width="1"/><text x="140" y="470" font-size="18" text-anchor="middle" fill="#ffffff">Adiantamento</text><text x="140" y="494" font-size="20" text-anchor="middle" font-weight="bold" fill="#ffffff">R$ 1.500,00</text><line x1="580" y1="400" x2="480" y2="660" stroke="#5a5a55" stroke-width="2"/><line x1="580" y1="400" x2="680" y2="660" stroke="#5a5a55" stroke-width="2"/><path d="M470,660 L690,660 Q580,700 470,660 Z" fill="#c9d8ea" stroke="#1d1d1b" stroke-width="2"/><circle cx="580" cy="400" r="6" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="2"/><rect x="490" y="604" width="180" height="52" rx="0" fill="#2e6b34" stroke="#1d1d1b" stroke-width="1"/><text x="580" y="626" font-size="18" text-anchor="middle" fill="#ffffff">Quilometragem</text><text x="580" y="650" font-size="20" text-anchor="middle" font-weight="bold" fill="#ffffff">558,00</text><rect x="490" y="548" width="180" height="52" rx="0" fill="#2e6b34" stroke="#1d1d1b" stroke-width="1"/><text x="580" y="570" font-size="18" text-anchor="middle" fill="#ffffff">Estacionamento</text><text x="580" y="594" font-size="20" text-anchor="middle" font-weight="bold" fill="#ffffff">30,00</text><rect x="490" y="492" width="180" height="52" rx="0" fill="#2e6b34" stroke="#1d1d1b" stroke-width="1"/><text x="580" y="514" font-size="18" text-anchor="middle" fill="#ffffff">Alimentação</text><text x="580" y="538" font-size="20" text-anchor="middle" font-weight="bold" fill="#ffffff">367,30</text><rect x="490" y="436" width="180" height="52" rx="0" fill="#2e6b34" stroke="#1d1d1b" stroke-width="1"/><text x="580" y="458" font-size="18" text-anchor="middle" fill="#ffffff">Hospedagem</text><text x="580" y="482" font-size="20" text-anchor="middle" font-weight="bold" fill="#ffffff">795,00</text><text x="30" y="790" font-size="20" text-anchor="start" fill="#1d1d1b">Despesas aprovadas:</text><text x="30" y="820" font-size="20" text-anchor="start" fill="#1d1d1b">795,00 + 367,30 + 30,00 + 558,00 = 1.750,30</text><text x="30" y="850" font-size="20" text-anchor="start" fill="#c25e00">Glosa em 09/12: 135,50 − limite 120,00 = 15,50</text><text x="30" y="880" font-size="20" text-anchor="start" font-weight="bold" fill="#2e6b34">Saldo a receber: 1.750,30 − 1.500,00 = R$ 250,30</text><text x="30" y="910" font-size="20" text-anchor="start" fill="#1d1d1b">Pago no lote de terça 22/12/2026; conciliado</text><text x="30" y="940" font-size="20" text-anchor="start" fill="#1d1d1b">no extrato do mesmo dia.</text><line x1="30" y1="970" x2="690" y2="970" stroke="#d8d4ca" stroke-width="2"/><text x="30" y="1020" font-size="22" text-anchor="start" font-weight="bold" fill="#1d1d1b">Diego A. · viagem de 15 a 17/12/2026</text><rect x="290" y="1370" width="140" height="18" rx="0" fill="#9a9a92" stroke="#1d1d1b" stroke-width="1"/><rect x="352" y="1105" width="16" height="265" rx="0" fill="#9a9a92" stroke="#1d1d1b" stroke-width="1"/><line x1="140" y1="1130" x2="580" y2="1080" stroke="#1d1d1b" stroke-width="8"/><circle cx="360" cy="1105.0" r="12" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="2"/><line x1="140" y1="1130" x2="40" y2="1330" stroke="#5a5a55" stroke-width="2"/><line x1="140" y1="1130" x2="240" y2="1330" stroke="#5a5a55" stroke-width="2"/><path d="M30,1330 L250,1330 Q140,1370 30,1330 Z" fill="#c9d8ea" stroke="#1d1d1b" stroke-width="2"/><circle cx="140" cy="1130" r="6" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="2"/><rect x="50" y="1274" width="180" height="52" rx="0" fill="#1f5fa8" stroke="#1d1d1b" stroke-width="1"/><text x="140" y="1296" font-size="18" text-anchor="middle" fill="#ffffff">pago em</text><text x="140" y="1320" font-size="20" text-anchor="middle" font-weight="bold" fill="#ffffff">seg 14/12</text><rect x="50" y="1218" width="180" height="52" rx="0" fill="#1f5fa8" stroke="#1d1d1b" stroke-width="1"/><text x="140" y="1240" font-size="18" text-anchor="middle" fill="#ffffff">Adiantamento</text><text x="140" y="1264" font-size="20" text-anchor="middle" font-weight="bold" fill="#ffffff">R$ 800,00</text><line x1="580" y1="1080" x2="480" y2="1270" stroke="#5a5a55" stroke-width="2"/><line x1="580" y1="1080" x2="680" y2="1270" stroke="#5a5a55" stroke-width="2"/><path d="M470,1270 L690,1270 Q580,1310 470,1270 Z" fill="#c9d8ea" stroke="#1d1d1b" stroke-width="2"/><circle cx="580" cy="1080" r="6" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="2"/><rect x="490" y="1214" width="180" height="52" rx="0" fill="#2e6b34" stroke="#1d1d1b" stroke-width="1"/><text x="580" y="1236" font-size="18" text-anchor="middle" fill="#ffffff">Alimentação</text><text x="580" y="1260" font-size="20" text-anchor="middle" font-weight="bold" fill="#ffffff">116,40</text><rect x="490" y="1158" width="180" height="52" rx="0" fill="#2e6b34" stroke="#1d1d1b" stroke-width="1"/><text x="580" y="1180" font-size="18" text-anchor="middle" fill="#ffffff">Hospedagem</text><text x="580" y="1204" font-size="20" text-anchor="middle" font-weight="bold" fill="#ffffff">396,00</text><text x="30" y="1440" font-size="20" text-anchor="start" fill="#1d1d1b">Despesas aprovadas: 396,00 + 116,40 = 512,40</text><text x="30" y="1470" font-size="20" text-anchor="start" font-weight="bold" fill="#b3261e">Saldo a devolver: 800,00 − 512,40 = R$ 287,60</text><text x="30" y="1500" font-size="20" text-anchor="start" fill="#1d1d1b">Prazo de prestação: dom 27/12/2026. Alerta ao</text><text x="30" y="1530" font-size="20" text-anchor="start" fill="#1d1d1b">gestor em 28/12; enviada em 04/01/2027; Pix de</text><text x="30" y="1560" font-size="20" text-anchor="start" fill="#1d1d1b">devolução em 05/01, conciliado pelo identificador.</text><text x="30" y="1610" font-size="20" text-anchor="start" fill="#5a5a55">Desconto em folha nunca é automático: é decisão</text><text x="30" y="1638" font-size="20" text-anchor="start" fill="#5a5a55">do RH com o jurídico, registrada no sistema.</text><text x="690" y="1674" font-size="20" text-anchor="end" fill="#5a5a55">Ilustração · Torno 2026</text></svg>