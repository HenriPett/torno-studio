<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Bancada conceitual de leitura e confirmação operacional</title>
<desc id="desc">Um leitor aponta para uma etiqueta fictícia em uma peça; uma prancheta separada lembra que identificar o item não confirma automaticamente a retirada.</desc>
<rect width="1200" height="650" fill="#efe9dc"/>
<path d="M0 0h1200v94H0z" fill="#173b38"/>
<text x="57" y="62" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#fff9ed">Da etiqueta à tarefa: duas perguntas</text>
<path d="M0 510 1200 430v220H0z" fill="#d7c5a4"/>
<path d="M0 509 1200 429" stroke="#a88e6d" stroke-width="7"/>
<!-- physical scanner, viewed diagonally -->
<g transform="rotate(-13 266 319)">
<path d="M84 272Q84 239 116 234h222q39 0 39 37v81q0 30-36 30H116q-32 0-32-31z" fill="#203f43" stroke="#102e31" stroke-width="7"/>
<path d="M192 370h84v160q-42 27-84 0z" fill="#365e60" stroke="#102e31" stroke-width="7"/>
<path d="M103 255h108v98H103z" fill="#54787a"/>
<path d="M117 278h74v50h-74z" fill="#e59a76"/>
<path d="M207 415h53" stroke="#d5c4a4" stroke-width="10" stroke-linecap="round"/>
</g>
<!-- abstract light beam, no valid code -->
<path d="M380 280 580 196 624 366 381 352Z" fill="#e39777" opacity=".28"/>
<path d="M541 259 612 247" stroke="#db7856" stroke-width="7" stroke-linecap="round"/>
<!-- piece and illustrative label -->
<g transform="rotate(5 707 343)">
<path d="M583 198h296l40 268H558z" fill="#9fbbab" stroke="#547b6a" stroke-width="7"/>
<path d="M602 218h240l14 115H586z" fill="#fffdf2" stroke="#7d9b8b" stroke-width="4"/>
<text x="618" y="260" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1c4942">PEÇA FICTÍCIA</text>
<text x="618" y="296" font-family="Arial,sans-serif" font-size="27" fill="#1c4942">ID: EXEMPLO</text>
<path d="M621 318h20m15 0h12m20 0h24m13 0h12m17 0h24" stroke="#617f76" stroke-width="5" stroke-linecap="round"/>
</g>
<!-- separate paper, decision remains open -->
<g transform="rotate(-6 1008 340)">
<path d="M894 167h221v355H894z" fill="#fff9ea" stroke="#8c8778" stroke-width="5"/>
<path d="M952 159h105v26H952z" fill="#476760"/>
<text x="921" y="241" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#23443d">ITEM LIDO</text>
<path d="M918 259h172" stroke="#a4b6a7" stroke-width="4"/>
<text x="920" y="336" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#c36f4b">RETIRAR?</text>
<text x="920" y="382" font-family="Arial,sans-serif" font-size="23" fill="#23443d">Regra, pessoa e</text>
<text x="920" y="414" font-family="Arial,sans-serif" font-size="23" fill="#23443d">confirmação</text>
<path d="M922 460h156" stroke="#a4b6a7" stroke-width="4"/>
</g>
<text x="58" y="607" font-family="Arial,sans-serif" font-size="24" fill="#27463d">Exemplo editorial · Não representa leitor homologado, etiqueta GS1 nem tela real.</text>
</svg>
