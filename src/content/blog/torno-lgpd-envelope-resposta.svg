<svg xmlns="http://www.w3.org/2000/svg" width="720" height="930" viewBox="0 0 720 930" role="img" aria-labelledby="title desc"><title id="title">Resposta ao titular: cinco folhas saem do envelope</title><desc id="desc">Envelope aberto de onde saem cinco folhas sobrepostas da resposta ao Titular T-01, fictício, conforme o art. 19, II, da LGPD: Confirmação de tratamento, Origem dos dados, Inexistência de registro, se for o caso, Critérios utilizados e Finalidade do tratamento. Carimbo: pedido em 03/11; declaração completa até 15 dias (art. 19, II, LGPD). Exemplo fictício, sem reproduzir formulário oficial.</desc><rect width="720" height="930" rx="24" fill="#f4f2eb"/><text x="32" y="54" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#1e2837">Resposta ao titular, em folhas</text><rect x="32" y="74" width="232" height="42" rx="21" fill="#fffdf8" stroke="#536270" stroke-width="2.5"/><text x="148" y="103" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#536270" text-anchor="middle">Exemplo fictício</text><g transform="rotate(-2 360 200)"><rect x="120" y="134" width="480" height="152" rx="12" fill="#fffdf8" stroke="#c8782f" stroke-width="4"/><text x="360" y="172" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1e2837" text-anchor="middle">Pedido: 03/11</text><path d="M150 188H570" stroke="#c8782f" stroke-width="2.5"/><text x="360" y="222" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#1e2837" text-anchor="middle">Declaração completa:</text><text x="360" y="252" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837" text-anchor="middle">até 15 dias</text><text x="360" y="278" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#1e2837" text-anchor="middle">(art. 19, II, LGPD)</text></g><rect x="32" y="690" width="656" height="170" rx="14" fill="#a9c9c6" stroke="#426d6b" stroke-width="3"/><path d="M32 690L360 616L688 690Z" fill="#8fb6b3" stroke="#426d6b" stroke-width="3" stroke-linejoin="round"/><rect x="32" y="318" width="600" height="230" rx="10" fill="#fffdf8" stroke="#b6afa4" stroke-width="2.5"/><text x="50" y="358" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Confirmação de tratamento</text><rect x="50" y="390" width="300" height="10" rx="5" fill="#d3cec4"/><rect x="50" y="416" width="220" height="10" rx="5" fill="#d3cec4"/><rect x="44" y="382" width="600" height="230" rx="10" fill="#fffdf8" stroke="#b6afa4" stroke-width="2.5"/><text x="62" y="422" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Origem dos dados</text><rect x="62" y="454" width="310" height="10" rx="5" fill="#d3cec4"/><rect x="62" y="480" width="232" height="10" rx="5" fill="#d3cec4"/><rect x="56" y="446" width="600" height="230" rx="10" fill="#fffdf8" stroke="#b6afa4" stroke-width="2.5"/><text x="74" y="486" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Inexistência de registro, se for o caso</text><rect x="74" y="518" width="320" height="10" rx="5" fill="#d3cec4"/><rect x="74" y="544" width="244" height="10" rx="5" fill="#d3cec4"/><rect x="68" y="510" width="600" height="230" rx="10" fill="#fffdf8" stroke="#b6afa4" stroke-width="2.5"/><text x="86" y="550" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Critérios utilizados</text><rect x="86" y="582" width="330" height="10" rx="5" fill="#d3cec4"/><rect x="86" y="608" width="256" height="10" rx="5" fill="#d3cec4"/><rect x="80" y="574" width="600" height="230" rx="10" fill="#fffdf8" stroke="#b6afa4" stroke-width="2.5"/><text x="98" y="614" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Finalidade do tratamento</text><rect x="98" y="646" width="340" height="10" rx="5" fill="#d3cec4"/><rect x="98" y="672" width="268" height="10" rx="5" fill="#d3cec4"/><path d="M32 720L360 800L688 720V846a14 14 0 0 1-14 14H46a14 14 0 0 1-14-14Z" fill="#c6dedd" stroke="#426d6b" stroke-width="3" stroke-linejoin="round"/><text x="32" y="906" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">Ilustração original Torno Studio, 2026</text></svg>