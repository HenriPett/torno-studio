<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1180" viewBox="0 0 720 1180" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Consumo real × baixa automática da barra na OP 8301</title><desc id="d1">Exemplo fictício. Três pilhas de quilos de barra de aço da OP 8301, Metalúrgica Exemplo Ltda., sobre a mesma base, com o eixo vertical começando em 230 kg. Consumo real pesado no corte, lote C-5521: 258,00 kg. Baixa automática pelas 202 peças iniciadas, 202 × 1,250: 252,50 kg. Baixa automática pelas 191 peças boas no fim, 191 × 1,250: 238,75 kg. Real menos iniciadas: 5,50 kg de pontas de barra que a estrutura não previu, 2,2% acima, dentro do limite de 3%, para a engenharia rever a perda. Iniciadas menos boas: 13,75 kg = 11 refugadas × 1,250, material que a baixa pelas boas deixa no estoque do sistema e o inventário encontra faltando. Total entre real e boas: 19,25 kg. No exemplo a barra é baixada pelo consumo real porque é rastreada por lote; o estorno de 06/11 mudaria a terceira pilha para 237,50 kg, não a primeira.</desc><rect x="0.0" y="0.0" width="720.0" height="1180.0" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14.0" y="14.0" width="692.0" height="1152.0" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30.0" y="58.0" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Barra da OP 8301 · três baixas</text><text x="30.0" y="92.0" font-size="21" text-anchor="start" font-weight="normal" fill="#1d1d1b">estrutura: 1,250 kg por eixo · lote C-5521</text><rect x="470.0" y="108.0" width="222.0" height="40.0" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581.0" y="136.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><text x="30.0" y="136.0" font-size="20" text-anchor="start" font-weight="normal" fill="#4a4f55">kg baixados do estoque</text><line x1="80.0" y1="720.0" x2="690.0" y2="720.0" stroke="#d8d2c4" 