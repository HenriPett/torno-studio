<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1324" viewBox="0 0 720 1324" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Cartão SE40-P-07: versão 1 cancelada por perda, versão 2 emitida; total do circuito segue 18</title><desc id="d1">Exemplo fictício. Dois cartões kanban de produção do suporte SE-40 (origem PR-03, destino S-02, 60 peças, cartão 07 de 18). Versão 1 com carimbo de cancelado em 10/11/2026 às 10h40 por perda; lida em 13/11 às 14h05 no supermercado, recusada, alerta ao PCP, sem entrada. Versão 2 emitida em 10/11 às 10h40, entra na fila como vazio. Linha do tempo: lido vazio em 06/11 8h12; alerta em 10/11 8h12 após 2 dias úteis; auditoria às 10h00 com 17 de 18; cancelamento e emissão às 10h40. Auditoria: sistema 10 cheios, 5 vazios, 3 em produção, total 18; chão 10 caixas cheias, 4 cartões no quadro, 3 caixas na prensa, total 17. Códigos desenhados são ilustrativos.</desc><rect x="0" y="0" width="720" height="1324" fill="#f6f3ec"/><rect x="14" y="14" width="692" height="1296" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30" y="58" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Cartão SE40-P-07 · perdido e trocado</text><text x="30" y="92" font-size="22" text-anchor="start" font-weight="normal" fill="#1d1d1b">circuito de produção PR-03 ↔ S-02</text><text x="30" y="136" font-size="22" text-anchor="start" font-weight="normal" fill="#4a4f55">total do circuito: 18 cartões</text><rect x="470" y="108" width="222" height="40" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581" y="136" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><rect x="34" y="178" width="316" height="430" rx="10" fill="#d9d4c8" stroke="none" stroke-width="0"/><rect x="30" y="172" width="316" height="430" rx="10" fill="#ffffff" stroke="#1d1d1b" stroke-width="2"/><rect x="30" y="172" width="316" height="52" rx="10" fill="#1f4e79" stroke=