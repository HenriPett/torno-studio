<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Caderno de ensaios para MFA</title><desc id="desc">Uma página de caderno com quatro situações para testar autenticação multifator: ativar, perder, recuperar e revogar.</desc><rect width="1200" height="680" fill="#e4ebe8"/><rect x="114" y="72" width="972" height="556" rx="19" fill="#fffefa" stroke="#adbdb8" stroke-width="4"/><rect x="114" y="72" width="82" height="556" rx="18" fill="#214e53"/><g fill="#e4ebe8"><circle cx="155" cy="148" r="12"/><circle cx="155" cy="265" r="12"/><circle cx="155" cy="382" r="12"/><circle cx="155" cy="499" r="12"/></g><g font-family="Arial" fill="#173c42"><text x="231" y="139" font-size="37" font-weight="700">Caderno de aceite · MFA</text><text x="231" y="191" font-size="21">Registre condição, resultado e evidência de cada ensaio.</text><text x="260" y="281" font-size="28" font-weight="700">Ativar um fator</text><text x="260" y="365" font-size="28" font-weight="700">Perder o dispositivo</text><text x="260" y="449" font-size="28" font-weight="700">Recuperar com controle</text><text x="260" y="533" font-size="28" font-weight="700">Revogar o fator antigo</text></g><g stroke="#b4c6c0" stroke-width="2"><line x1="259" y1="300" x2="1019" y2="300"/><line x1="259" y1="384" x2="1019" y2="384"/><line x1="259" y1="468" x2="1019" y2="468"/><line x1="259" y1="552" x2="1019" y2="552"/></g><g fill="none" stroke="#c27751" stroke-width="4"><rect x="924" y="246" width="41" height="41" rx="6"/><rect x="924" y="330" width="41" height="41" rx="6"/><rect x="924" y="414" width="41" height="41" rx="6"/><rect x="924" y="498" width="41" height="41" rx="6"/></g></svg>
