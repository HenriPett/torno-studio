<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1290" viewBox="0 0 720 1290" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Semáforo das situações do fornecedor: o que cada uma impede no pedido e no recebimento</title><desc id="d1">Exemplo fictício. Painel em forma de semáforo com as cinco situações de fornecedor da Metalúrgica Exemplo Ltda. e três colunas: pedido de amostra, pedido novo e receber pedido já emitido. Em homologação (lâmpada cinza): amostra sim, até 50 peças, com a qualidade; pedido novo bloqueado; recebe só a amostra. Aprovado (verde): sim nas três. Condicional (amarela): amostra sim; pedido novo sim, com aviso e plano de ação em 5 dias úteis; recebe sim. Bloqueado (vermelha): amostra e pedido novo bloqueados; recebe só com liberação da qualidade, pedido a pedido. Inativo (apagada): bloqueado nas três. Pendência documental, em qualquer situação: pedido novo bloqueado; recebe pedido emitido antes do vencimento. Transições: homologação para aprovado com requisitos completos e aprovação de qualidade e compras; aprovado para condicional com IQF de 70,00 a 84,99; IQF abaixo de 70,00 gera proposta ao comitê, que decide o bloqueio; condicional para aprovado com IQF de 85,00 ou mais e plano encerrado, confirmado pela qualidade; bloqueado só sai por decisão do comitê e nova homologação.</desc><rect x="0.0" y="0.0" width="720.0" height="1290.0" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14.0" y="14.0" width="692.0" height="1262.0" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30.0" y="58.0" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Semáforo do fornecedor</text><text x="30.0" y="92.0" font-size="21" text-anchor="start" font-weight="normal" fill="#1d1d1b">situação × pedido e recebimento</text><rect x="470.0" y="108.0" width="222.0" height="40.0" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581.0" y="136.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><text x="30.0" y="136.0" font-size="20" text-anchor="start" font-weight="normal" fill="#4a4f55">efeito escrito para cada situação</text><rect x="30.0" y="184.0" width="660.0" height="66.0" rx="6" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.5"/><text x="46.0" y="224.0" font-size="20" text-anchor="start" font-weight="bold" fill="#4a4f55">Situação</text><text x="372.0" y="212.0" font-size="19" text-anchor="middle" font-weight="bold" fill="#4a4f55">amostra</text><text x="500.0" y="212.0" font-size="19" text-anchor="middle" font-weight="bold" fill="#4a4f55">pedido</text><text x="500.0" y="236.0" font-size="19" text-anchor="middle" font-weight="bold" fill="#4a4f55">novo</text><text x="618.0" y="212.0" font-size="19" text-anchor="middle" font-weight="bold" fill="#4a4f55">receber</text><text x="618.0" y="236.0" font-size="19" text-anchor="middle" font-weight="bold" fill="#4a4f55">já emitido</text><rect x="30.0" y="262.0" width="660.0" height="480.0" rx="6" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.5"/><rect x="46.0" y="270.0" width="64.0" height="464.0" rx="14" fill="#1d1d1b" stroke="none" stroke-width="0"/><circle cx="78.0" cy="310.0" r="26" fill="#9aa0a6" stroke="#ffffff" stroke-width="2"/><text x="124.0" y="317.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">Em homologação</text><text x="372.0" y="310.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#2e6b30">até 50 pç</text><text x="372.0" y="336.0" font-size="17" text-anchor="middle" font-weight="normal" fill="#4a4f55">c/ qualidade</text><path d="M493 304.0 v-6 a7 7 0 0 1 14 0 v6" fill="none" stroke="#b42318" stroke-width="2.5"/><rect x="490.0" y="304.0" width="20.0" height="16.0" rx="2" fill="#b42318" stroke="none" stroke-width="0"/><text x="618.0" y="317.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#7a5600">só amostra</text><line x1="110.0" y1="358.0" x2="690.0" y2="358.0" stroke="#4a4f55" stroke-width="0.8"/><circle cx="78.0" cy="406.0" r="26" fill="#2e6b30" stroke="#ffffff" stroke-width="2"/><text x="124.0" y="413.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">Aprovado</text><text x="372.0" y="413.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#2e6b30">sim</text><text x="500.0" y="413.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#2e6b30">sim</text><text x="618.0" y="413.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#2e6b30">sim</text><line x1="110.0" y1="454.0" x2="690.0" y2="454.0" stroke="#4a4f55" stroke-width="0.8"/><circle cx="78.0" cy="502.0" r="26" fill="#b8860b" stroke="#ffffff" stroke-width="2"/><text x="124.0" y="509.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">Condicional</text><text x="372.0" y="509.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#2e6b30">sim</text><text x="500.0" y="502.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#2e6b30">com aviso</text><text x="500.0" y="528.0" font-size="17" text-anchor="middle" font-weight="normal" fill="#4a4f55">plano 5 d.u.</text><text x="618.0" y="509.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#2e6b30">sim</text><line x1="110.0" y1="550.0" x2="690.0" y2="550.0" stroke="#4a4f55" stroke-width="0.8"/><circle cx="78.0" cy="598.0" r="26" fill="#b42318" stroke="#ffffff" stroke-width="2"/><text x="124.0" y="605.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">Bloqueado</text><path d="M365 592.0 v-6 a7 7 0 0 1 14 0 v6" fill="none" stroke="#b42318" stroke-width="2.5"/><rect x="362.0" y="592.0" width="20.0" height="16.0" rx="2" fill="#b42318" stroke="none" stroke-width="0"/><path d="M493 592.0 v-6 a7 7 0 0 1 14 0 v6" fill="none" stroke="#b42318" stroke-width="2.5"/><rect x="490.0" y="592.0" width="20.0" height="16.0" rx="2" fill="#b42318" stroke="none" stroke-width="0"/><text x="618.0" y="598.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#7a5600">liberação</text><text x="618.0" y="624.0" font-size="17" text-anchor="middle" font-weight="normal" fill="#4a4f55">por pedido</text><line x1="110.0" y1="646.0" x2="690.0" y2="646.0" stroke="#4a4f55" stroke-width="0.8"/><circle cx="78.0" cy="694.0" r="26" fill="#3a3a38" stroke="#9aa0a6" stroke-width="2"/><text x="124.0" y="701.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1d1d1b">Inativo</text><path d="M365 688.0 v-6 a7 7 0 0 1 14 0 v6" fill="none" stroke="#b42318" stroke-width="2.5"/><rect x="362.0" y="688.0" width="20.0" height="16.0" rx="2" fill="#b42318" stroke="none" stroke-width="0"/><path d="M493 688.0 v-6 a7 7 0 0 1 14 0 v6" fill="none" stroke="#b42318" stroke-width="2.5"/><rect x="490.0" y="688.0" width="20.0" height="16.0" rx="2" fill="#b42318" stroke="none" stroke-width="0"/><path d="M611 688.0 v-6 a7 7 0 0 1 14 0 v6" fill="none" stroke="#b42318" stroke-width="2.5"/><rect x="608.0" y="688.0" width="20.0" height="16.0" rx="2" fill="#b42318" stroke="none" stroke-width="0"/><rect x="30.0" y="760.0" width="660.0" height="96.0" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="46.0" y="790.0" font-size="20" text-anchor="start" font-weight="bold" fill="#7a5600">Pendência documental</text><text x="46.0" y="818.0" font-size="18" text-anchor="start" font-weight="normal" fill="#4a4f55">(qualquer situação)</text><path d="M493 802 v-6 a7 7 0 0 1 14 0 v6" fill="none" stroke="#b42318" stroke-width="2.5"/><rect x="490.0" y="802.0" width="20.0" height="16.0" rx="2" fill="#b42318" stroke="none" stroke-width="0"/><text x="618.0" y="804.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#2e6b30">sim, se emitido</text><text x="618.0" y="828.0" font-size="17" text-anchor="middle" font-weight="normal" fill="#4a4f55">antes de vencer</text><text x="372.0" y="812.0" font-size="20" text-anchor="middle" font-weight="normal" fill="#4a4f55">—</text><text x="30.0" y="890.0" font-size="22" text-anchor="start" font-weight="bold" fill="#1d1d1b">Transições e quem decide</text><rect x="30.0" y="906.0" width="8.0" height="46.0" rx="0" fill="#2e6b30" stroke="none" stroke-width="0"/><text x="50.0" y="928.0" font-size="19" text-anchor="start" font-weight="bold" fill="#2e6b30">homologação → aprovado</text><text x="50.0" y="952.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">requisitos completos; qualidade e compras</text><rect x="30.0" y="964.0" width="8.0" height="46.0" rx="0" fill="#7a5600" stroke="none" stroke-width="0"/><text x="50.0" y="986.0" font-size="19" text-anchor="start" font-weight="bold" fill="#7a5600">aprovado → condicional</text><text x="50.0" y="1010.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">IQF de 70,00 a 84,99</text><rect x="30.0" y="1022.0" width="8.0" height="46.0" rx="0" fill="#b42318" stroke="none" stroke-width="0"/><text x="50.0" y="1044.0" font-size="19" text-anchor="start" font-weight="bold" fill="#b42318">IQF abaixo de 70,00</text><text x="50.0" y="1068.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">proposta; o comitê decide o bloqueio</text><rect x="30.0" y="1080.0" width="8.0" height="46.0" rx="0" fill="#2e6b30" stroke="none" stroke-width="0"/><text x="50.0" y="1102.0" font-size="19" text-anchor="start" font-weight="bold" fill="#2e6b30">condicional → aprovado</text><text x="50.0" y="1126.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">IQF ≥ 85,00 e plano encerrado; qualidade</text><rect x="30.0" y="1138.0" width="8.0" height="46.0" rx="0" fill="#b42318" stroke="none" stroke-width="0"/><text x="50.0" y="1160.0" font-size="19" text-anchor="start" font-weight="bold" fill="#b42318">bloqueado → ?</text><text x="50.0" y="1184.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">só comitê e nova homologação, não o índice</text><text x="30.0" y="1256.0" font-size="22" text-anchor="start" font-weight="normal" fill="#4a4f55">Ilustração · Torno 2026</text><text x="690.0" y="1256.0" font-size="22" text-anchor="end" font-weight="normal" fill="#4a4f55">números inventados</text></svg>