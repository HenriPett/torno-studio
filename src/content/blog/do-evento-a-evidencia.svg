<svg xmlns="http://www.w3.org/2000/svg" width="720" height="822" aria-labelledby="title desc" role="img" viewBox="0 0 720 822"><title id="title">Do evento à evidência</title><desc id="desc">Registro sozinho não prova segurança.</desc><rect width="720" height="822" fill="#f7f6f2"/><text x="36" y="54" fill="#1c5a49" font-family="Arial,sans-serif" font-size="24" font-weight="700">TORNO · GUIA VISUAL</text><text x="36" y="113" fill="#16181a" font-family="Arial,sans-serif" font-size="32" font-weight="700">Do evento à evidência</text><text x="36" y="158" fill="#16181a" font-family="Arial,sans-serif" font-size="24" font-weight="400">Registro sozinho não prova segurança.</text><rect width="656" height="153" x="32" y="195" fill="#fff" stroke="#b4c6bd" stroke-width="2" rx="12"/><text x="52" y="234" fill="#1c5a49" font-family="Arial,sans-serif" font-size="27" font-weight="700">1 · Definir o que registrar</text><text x="52" y="273" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Escolha eventos, campos e responsáveis.</text><text x="52" y="304" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Defina acesso e retenção conforme</text><text x="52" y="335" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">o contexto do comprador.</text><rect width="656" height="153" x="32" y="369" fill="#fff" stroke="#b4c6bd" stroke-width="2" rx="12"/><text x="52" y="408" fill="#1c5a49" font-family="Arial,sans-serif" font-size="27" font-weight="700">2 · Excluir dados desnecessários</text><text x="52" y="447" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Evite senhas, tokens e conteúdo sensível.</text><text x="52" y="478" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Use referências quando forem suficientes.</text><text x="52" y="509" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Defina como tratar falhas de registro.</text><rect width="656" height="153" x="32" y="543" fill="#fff" stroke="#b4c6bd" stroke-width="2" rx="12"/><text x="52" y="582" fill="#1c5a49" font-family="Arial,sans-serif" font-size="27" font-weight="700">3 · Demonstrar em ambiente de teste</text><text x="52" y="621" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Execute ação aceita e ação negada.</text><text x="52" y="652" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Consulte e exporte os eventos esperados.</text><text x="52" y="683" fill="#16181a" font-family="Arial,sans-serif" font-size="25" font-weight="400">Documente resultado, lacunas e limites.</text><text x="36" y="757" fill="#1c5a49" font-family="Arial,sans-serif" font-size="24" font-weight="700">Exemplo fictício; não é garantia de integralidade.</text></svg>