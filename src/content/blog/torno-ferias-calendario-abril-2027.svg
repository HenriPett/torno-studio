<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1340" viewBox="0 0 720 1340" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Abril de 2027: dias em que as férias não podem começar</title><desc id="d1">Exemplo fictício sobre calendário real. Folha de abril de 2027, semana de segunda a domingo, de 29/03 a 02/05. Feriados: quarta 21/04 (Tiradentes) e sábado 01/05. Repouso semanal no domingo: 04, 11, 18, 25/04 e 02/05. Início vedado (art. 134, § 3º): sextas e sábados 02 e 03, 09 e 10, 16 e 17, 23 e 24/04 e 30/04 e 01/05, pelo domingo; segunda 19 e terça 20/04, por Tiradentes; quinta 29 e sexta 30/04, pelo feriado de 01/05. Pedido de Marina para 19/04 recusado; início escolhido quinta 22/04, 6 dias até terça 27/04. O bloqueio vale para o dia de início; feriado dentro das férias conta como dia corrido.</desc><defs><pattern id="hz" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#fbe9e7"/><line x1="0" y1="0" x2="0" y2="10" stroke="#b3261e" stroke-width="3"/></pattern></defs><rect x="0" y="0" width="720" height="1340" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="10" y="10" width="700" height="1320" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="450" y="24" width="246" height="46" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="2"/><text x="573" y="56" font-size="22" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="118" font-size="32" text-anchor="start" font-weight="bold" fill="#1d1d1b">Abril de 2027: onde as</text><text x="30" y="158" font-size="32" text-anchor="start" font-weight="bold" fill="#1d1d1b">férias não podem começar</text><text x="30" y="198" font-size="22" text-anchor="start" fill="#5a5a55">CLT art. 134, § 3º · repouso no domingo</text><text x="30" y="228" font-size="22" text-anchor="start" fill="#5a5a55">feriados nacionais: 21/04 e 01/05</text><text x="