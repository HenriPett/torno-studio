<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1400" viewBox="0 0 720 1400" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Ida e volta da remessa NF 4501 e balança de quantidades</title><desc id="d1">Exemplo fictício. Mapa com a Indústria Exemplo Ltda. e a Zincagem Modelo Ltda. ligadas por uma estrada de ida e volta. Ida em 03/11, NF 4501, 1.000 suportes SR-125 brutos, lote L2611-03. Volta: 10/11, NF 812, 600 zincados; 17/11, NF 845, 360 zincados e 15 brutos não aplicados. Caçamba de refugo no terceiro: 12 peças, 2 acima da tolerância de 10 (1%). Balança da remessa: de um lado saiu 1.000; do outro, 960 zincados, 15 não aplicados, 12 de refugo e 13 sem explicação; só nivela com os 13. Cobrança da NF 845: cobrado 372 × R$ 0,50 = R$ 186,00; devido 360 × R$ 0,50 = R$ 180,00; diferença de R$ 6,00, os 12 refugados.</desc><rect x="0" y="0" width="720" height="1400" rx="0" fill="#e9ecef" stroke="none" stroke-width="0"/><rect x="14" y="14" width="692" height="1372" rx="8" fill="#fdfdfb" stroke="#a7adb4" stroke-width="3"/><text x="36" y="66" font-size="28" text-anchor="start" font-weight="bold" fill="#1d1d1b">Ida e volta · remessa NF 4501</text><text x="36" y="100" font-size="22" text-anchor="start" font-weight="normal" fill="#1d1d1b">1.000 suportes SR-125 · lote L2611-03</text><rect x="470" y="118" width="222" height="40" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581" y="146" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><rect x="30" y="176" width="660" height="470" rx="10" fill="#eef3e6" stroke="#c8d2b8" stroke-width="2"/><path d="M30 176 L30 646" stroke="#dfe7d3" stroke-width="1" fill="none"/><path d="M90 176 L90 646" stroke="#dfe7d3" stroke-width="1" fill="none"/><path d="M150 176 L150 646" stroke="#dfe7d3" stroke-width="1" fill="none"/><path d="M210 176 L210 646" stroke="#dfe7d3" stroke-width="1" fill="none"/><path d="M270 176 L270 646" stroke