o. Responsável</text><text x="30" y="1404" font-size="18" text-anchor="start" fill="#5a5a55">desligado não pode deixar contrato sem dono.</text><text x="690" y="1404" font-size="18" text-anchor="end" fill="#5a5a55">Ilustração · Torno 2026</text></svg>