<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1430" viewBox="0 0 720 1430" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Dois despertadores: limite do aviso e renovação</title><desc id="d1">Exemplo fictício. Contrato CT-FOR-044 da Exemplo Armazéns Frios Ltda., assinatura de software de roteirização contratada por adesão online na segunda 10/02/2025, renovação anual automática, cancelamento até 30 dias antes da data de renovação. Dois despertadores. O da esquerda, vermelho, toca primeiro: limite do aviso, segunda 11/01/2027. O da direita, cinza, toca 30 dias depois: renovação, quarta 10/02/2027, novo período até quarta 09/02/2028. Abaixo, a fita de eventos: quinta 12/11/2026, alerta de 60 dias para Rodrigo T., responsável; quinta 19/11/2026, Rodrigo desligado, contrato fica sem responsável ativo e aparece na lista de pendências da TI; segunda 23/11/2026, contrato reatribuído a Tânia S.; segunda 07/12/2026, decisão registrada: renovar com 9 licenças em vez de 12, aprovada pela diretoria; sexta 11/12/2026, ordem de alteração nº 2 aceita pelo fornecedor, válida a partir de 10/02/2027, guardada como nova versão; alertas de 30, 15 e 7 dias, previstos para sexta 11/12, quinta 24/12 e segunda 04/01/2027, cancelados pela decisão. Rodapé: o despertador que importa é o do aviso; responsável desligado não pode deixar contrato sem dono.</desc><rect x="0" y="0" width="720" height="1430" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="10" y="10" width="700" height="1410" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><rect x="450" y="24" width="246" height="46" rx="4" fill="#fff" stroke="#b3261e" stroke-width="2"/><text x="573" y="56" font-size="22" text-anchor="middle" font-weight="bold" fill="#b3261e">EXEMPLO FICTÍCIO</text><text x="30" y="118" font-size="30" text-anchor="start" font-weight="bold" fill="#1d1d1b">Dois despertadores, um contrato</text><text x="30" y="154" font-size="20" text-anchor=