<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1450" viewBox="0 0 720 1450" role="img" aria-labelledby="title desc"><title id="title">Mapa de metrô: por onde o CNPJ alfanumérico passa no sistema</title><desc id="desc">Mapa em estilo de linha de metrô, com uma linha laranja chamada CNPJ que passa por oito estações em zigue-zague vertical: 1 Formulário, aceita letras maiúsculas e cola com pontuação; 2 Validação, dígito verificador calculado com letras; 3 Banco, texto de 14 posições, zeros à esquerda e índice único; 4 Busca, encontra por trecho; 5 Integrações e APIs, o outro lado aceita letras?; 6 NF-e e XML, CNPJ e chave de 44 posições; 7 Planilhas, sem notação científica; 8 Relatórios e exportação, coluna como texto e sem corte. Selo Ilustração.</desc><rect width="720" height="1450" rx="24" fill="#f4f2eb"/><text x="32" y="52" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1e2837">Por onde o CNPJ passa no sistema</text><rect x="32" y="68" width="150" height="40" rx="20" fill="#fffdf8" stroke="#536270" stroke-width="2.5"/><text x="107" y="96" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#536270">Ilustração</text><text x="32" y="146" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">Cada estação é um ponto de falha possível.</text><path d="M90 200 L90 220 L90 300 L170 340 L170 370 L170 450 L90 490 L90 520 L90 600 L170 640 L170 670 L170 750 L90 790 L90 820 L90 900 L170 940 L170 970 L170 1050 L90 1090 L90 1120 L90 1200 L170 1240 L170 1270 L170 1300" fill="none" stroke="#b5651d" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><text x="82" y="186" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#b5651d">Linha CNPJ</text><circle cx="90" cy="220" r="20" fill="#fffdf8" stroke="#1e2837" stroke-width="5"/><text x="90" y="228" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1e2837">1</text><text x="220" y="214" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Formulário</text><text x="220" y="242" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">Aceita letras maiúsculas</text><text x="220" y="270" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">e cola com pontuação</text><circle cx="170" cy="370" r="20" fill="#fffdf8" stroke="#1e2837" stroke-width="5"/><text x="170" y="378" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1e2837">2</text><text x="220" y="364" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Validação</text><text x="220" y="392" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">DV calculado com letras</text><circle cx="90" cy="520" r="20" fill="#fffdf8" stroke="#1e2837" stroke-width="5"/><text x="90" y="528" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1e2837">3</text><text x="220" y="514" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Banco</text><text x="220" y="542" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">Texto de 14, zeros à esquerda</text><text x="220" y="570" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">Índice único</text><circle cx="170" cy="670" r="20" fill="#fffdf8" stroke="#1e2837" stroke-width="5"/><text x="170" y="678" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1e2837">4</text><text x="220" y="664" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Busca</text><text x="220" y="692" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">Encontra por trecho</text><circle cx="90" cy="820" r="20" fill="#fffdf8" stroke="#1e2837" stroke-width="5"/><text x="90" y="828" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1e2837">5</text><text x="220" y="814" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Integrações / APIs</text><text x="220" y="842" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">O outro lado aceita letras?</text><circle cx="170" cy="970" r="20" fill="#fffdf8" stroke="#1e2837" stroke-width="5"/><text x="170" y="978" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1e2837">6</text><text x="220" y="964" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">NF-e / XML</text><text x="220" y="992" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">CNPJ e chave de 44 posições</text><circle cx="90" cy="1120" r="20" fill="#fffdf8" stroke="#1e2837" stroke-width="5"/><text x="90" y="1128" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1e2837">7</text><text x="220" y="1114" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Planilhas</text><text x="220" y="1142" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">Sem notação científica</text><circle cx="170" cy="1270" r="20" fill="#fffdf8" stroke="#1e2837" stroke-width="5"/><text x="170" y="1278" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1e2837">8</text><text x="220" y="1264" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e2837">Relatórios e exportação</text><text x="220" y="1292" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">Coluna como texto, sem corte</text><text x="32" y="1380" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#426d6b">Oito pontos para conferir antes de aceitar o campo.</text><text x="32" y="1424" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#536270">Ilustração original Torno Studio, 2026</text></svg>