.5"/><circle cx="270.9" cy="294.7" r="12.0" fill="#2f5d8a" stroke="#1d1d1b" stroke-width="2"/><text x="244.0" y="266.0" font-size="19" text-anchor="end" font-weight="bold" fill="#1d1d1b">30/10 · D−3</text><text x="244.0" y="289.0" font-size="17" text-anchor="end" font-weight="normal" fill="#1d1d1b">e-mail</text><circle cx="386.9" cy="286.6" r="12.0" fill="#2f5d8a" stroke="#1d1d1b" stroke-width="2"/><text x="405.0" y="272.0" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">04/11 · D+1</text><text x="405.0" y="295.0" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">e-mail + WhatsApp</text><circle cx="480.9" cy="354.9" r="12.0" fill="#2f5d8a" stroke="#1d1d1b" stroke-width="2"/><text x="505.0" y="342.0" font-size="19" text-anchor="start" font-weight="bold" fill="#1d1d1b">09/11 · D+5</text><text x="505.0" y="365.0" font-size="17" text-anchor="start" font-weight="normal" fill="#1d1d1b">08/11 = domingo</text><circle cx="509.9" cy="444.1" r="12.0" fill="#ffffff" stroke="#9b2a1f" stroke-width="3"/><line x1="502.9" y1="437.1" x2="516.9" y2="451.1" stroke="#9b2a1f" stroke-width="3"/><line x1="502.9" y1="451.1" x2="516.9" y2="437.1" stroke="#9b2a1f" stroke-width="3"/><text x="535.0" y="440.0" font-size="19" text-anchor="start" font-weight="bold" fill="#9b2a1f">13/11 · D+10</text><text x="535.0" y="463.0" font-size="17" text-anchor="start" font-weight="normal" fill="#9b2a1f">não sai</text><circle cx="474.0" cy="554.7" r="12.0" fill="#ffffff" stroke="#4a4f55" stroke-width="2" stroke-dasharray="4 3"/><text x="495.0" y="578.0" font-size="19" text-anchor="start" font-weight="bold" fill="#4a4f55">18/11 · D+15</text><text x="495.0" y="601.0" font-size="17" text-anchor="start" font-weight="normal" fill="#4a4f55">telefonema: cancelado</text><circle cx="182.4" cy="513.7" r="12.0" fill="#ffffff" stroke="#4a4f55" stroke-width="2" stroke-dasharray="4 3"/><text x="158.0" y="522.0" font-size="19" text-anchor="end" font-weight="bold" fill="#4a4f55">03/12 · D+30</text><text x="158.0" y="545.0" font-size="17" text-anchor="end" font-weight="normal" fill="#4a4f55">fila humana:</text><text x="158.0" y="567.0" font-size="17" text-anchor="end" font-weight="normal" fill="#4a4f55">cancelado</text><line x1="475.7" y1="440.5" x2="531.5" y2="436.6" stroke="#9b2a1f" stroke-width="5"/><circle cx="340.0" cy="450.0" r="122.0" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.5"/><text x="340.0" y="384.0" font-size="25" text-anchor="middle" font-weight="bold" fill="#1d1d1b">T-4512</text><text x="340.0" y="412.0" font-size="21" text-anchor="middle" font-weight="normal" fill="#1d1d1b">R$ 4.800,00</text><line x1="245.0" y1="426.0" x2="435.0" y2="426.0" stroke="#d8d2c4" stroke-width="1.5"/><text x="340.0" y="452.0" font-size="19" text-anchor="middle" font-weight="bold" fill="#9b2a1f">pago 13/11 7h50</text><text x="340.0" y="475.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#9b2a1f">Pix · baixa 8h30</text><text x="340.0" y="497.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#9b2a1f">pela conciliação</text><text x="340.0" y="528.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#1d1d1b">10 dias de atraso</text><text x="340.0" y="550.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#1d1d1b">R$ 4.912,00</text><text x="167.0" y="406.9" font-size="17" text-anchor="end" font-weight="normal" fill="#4a4f55" font-style="italic">fora da régua</text><circle cx="48.0" cy="704.0" r="11.0" fill="#2f5d8a" stroke="#1d1d1b" stroke-width="2"/><text x="70.0" y="710.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">toque enviado</text><circle cx="250.0" cy="704.0" r="11.0" fill="#ffffff" stroke="#9b2a1f" stroke-width="3"/><line x1="244.0" y1="698.0" x2="256.0" y2="710.0" stroke="#9b2a1f" stroke-width="3"/><line x1="244.0" y1="710.0" x2="256.0" y2="698.0" stroke="#9b2a1f" stroke-width="3"/><text x="272.0" y="710.0" font-size="19" text-anchor="start" font-weight="normal" fill="#9b2a1f">barrado pela baixa</text><circle cx="500.0" cy="704.0" r="11.0" fill="#ffffff" stroke="#4a4f55" stroke-width="2" stroke-dasharray="4 3"/><text x="522.0" y="710.0" font-size="19" text-anchor="start" font-weight="normal" fill="#4a4f55">cancelado</text><rect x="30.0" y="734.0" width="30.0" height="14.0" rx="0" fill="#b8860b" stroke="none" stroke-width="0"/><text x="70.0" y="747.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">feriado</text><rect x="160.0" y="734.0" width="30.0" height="14.0" rx="0" fill="#c98a7f" stroke="none" stroke-width="0"/><text x="200.0" y="747.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">em atraso</text><rect x="320.0" y="734.0" width="30.0" height="14.0" rx="0" fill="#c9c9c9" stroke="none" stroke-width="0"/><text x="360.0" y="747.0" font-size="18" text-anchor="start" font-weight="normal" fill="#1d1d1b">régua encerrada</text><rect x="30.0" y="780.0" width="660.0" height="250.0" rx="6" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.5"/><text x="48.0" y="812.0" font-size="21" text-anchor="start" font-weight="bold" fill="#1d1d1b">Regras do exemplo</text><text x="48.0" y="846.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">• dia não útil: o vencimento passa ao dia útil seguinte</text><text x="48.0" y="876.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">• toque depois do vencimento em dia não útil: dia útil seguinte</text><text x="48.0" y="906.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">• envio só em dia útil, das 9h às 18h</text><text x="48.0" y="936.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">• no máximo 1 toque por cliente por dia, títulos agrupados</text><text x="48.0" y="966.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">• a régua só roda depois da conciliação do dia</text><text x="48.0" y="996.0" font-size="19" text-anchor="start" font-weight="normal" fill="#1d1d1b">• D+30 nunca envia nada: abre decisão humana</text><text x="690.0" y="1050.0" font-size="18" text-anchor="end" font-weight="normal" fill="#4a4f55">Ilustração · Torno 2026</text></svg>