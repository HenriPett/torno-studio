<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="t1 d1" font-family="Arial, Helvetica, sans-serif"><title id="t1">Régua de cobrança do título T-4512 em volta do vencimento</title><desc id="d1">Exemplo fictício. Mostrador circular da régua de cobrança do título T-4512, R$ 4.800,00, do Restaurante Exemplo Ltda., cliente da Distribuidora Exemplo Ltda. Cada marca do anel é cerca de um dia; o vencimento original, 02/11/2026, segunda-feira, feriado de Finados, fica no topo, e o vencimento efetivo passa para 03/11, terça-feira. Toques no anel: 30/10, sexta, lembrete por e-mail três dias antes; 04/11, D+1, e-mail e WhatsApp; 08/11 cai no domingo e o D+5 sai em 09/11, segunda; 13/11, D+10; 18/11, D+15, telefonema da equipe; 03/12, D+30, fila de decisão humana sobre negativação ou protesto, sem envio automático. Interruptor vermelho em 13/11 às 7h50: pagamento por Pix, baixa pela conciliação às 8h30; o D+10 das 9h não sai, e o D+15 e o D+30 ficam cancelados. Regras no rodapé: só em dia útil, entre 9h e 18h; no máximo um toque por cliente por dia, com os títulos agrupados; a régua só roda depois da conciliação do dia.</desc><rect x="0.0" y="0.0" width="720.0" height="1080.0" rx="0" fill="#f6f3ec" stroke="none" stroke-width="0"/><rect x="14.0" y="14.0" width="692.0" height="1052.0" rx="0" fill="none" stroke="#1d1d1b" stroke-width="2"/><text x="30.0" y="58.0" font-size="27" text-anchor="start" font-weight="bold" fill="#1d1d1b">Régua do T-4512 em volta do vencimento</text><text x="30.0" y="92.0" font-size="21" text-anchor="start" font-weight="normal" fill="#1d1d1b">Restaurante Exemplo Ltda. · R$ 4.800,00</text><rect x="470.0" y="108.0" width="222.0" height="40.0" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="581.0" y="136.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#7a5600">EXEMPLO FICTÍCIO</text><text x="30.0" y="136.0" font-size="19" text-anchor="start" font-weight="norma